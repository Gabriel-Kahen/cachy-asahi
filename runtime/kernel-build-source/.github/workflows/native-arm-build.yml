name: native-arm-ksm2-kernel-build-only
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact implementation SHA equal to this workflow revision
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-arm-ksm2-kernel-build-only
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      SLICE: scripts/ci/ksm2-kernel-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Exact source and finite build-only preflight
        timeout-minutes: 2
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" == "$SOURCE_SHA" ]]
          printf '%s  %s\n' 'e92e75129f3117b65c90ff78a7770308affcab85281431c7081314bb89d96955' "$SLICE/lane.py" '86f8b4780b4da17d992151e09238088bbc2259715a0f1e1b8ce06a8b70246c6f' "$SLICE/source-manifest.json" | sha256sum --check
          python3 -B "$SLICE/lane.py" preflight --source "$GITHUB_WORKSPACE"
          python3 -B "$SLICE/test_lane.py"
      - name: Provision unchanged build-only kernel tools on disposable runner
        timeout-minutes: 9
        run: |
          set -euo pipefail
          timeout --kill-after=10s 180s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 update -qq
          timeout --kill-after=10s 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 install -y --no-install-recommends build-essential bc clang lld llvm flex bison libssl-dev libelf-dev python3 ca-certificates
      - name: Acquire exact archive and build only fresh KSM diagnostic Image
        timeout-minutes: 70
        run: |
          set -euo pipefail
          python3 -B "$SLICE/lane.py" build --source "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/ksm2-kernel-work" --output "$RUNNER_TEMP/ksm2-kernel-export"
      - name: Retain bounded original build-only artifact even on failure
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ksm2-kernel-build-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ksm2-kernel-export
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
