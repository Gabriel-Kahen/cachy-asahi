name: native-arm-current607-latest-tools
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact Root frozen604 source; refuses pending current Welcome4/Orphans2 inputs
        required: true
        type: string
      mode:
        description: Fresh native original-four builder and required FDK pair
        required: true
        default: build
        type: choice
        options: [build]
      inputs_sha256:
        description: Exact pinned Source input lock
        type: string
        default: beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
      recipes_sha256:
        description: Exact pinned four-package recipe lock
        type: string
        default: a5fb287b4dda2a90bf61d4fa8cbbc5d666dad8bb450a70544d00545b091f36e3
      integration_sha256:
        description: Leave empty; this FDK-only job does not run integration
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: native-arm-current607-latest-tools
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 220
    env:
      SOURCE_COMMIT: a79c4ca92486854f9edb639cd970d2c90fda4b12
      INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
      RECIPES_SHA256: ${{ inputs.recipes_sha256 }}
      RETRY_MODE: ${{ inputs.mode }}
      REQUESTED_INTEGRATION_SHA256: ${{ inputs.integration_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a79c4ca92486854f9edb639cd970d2c90fda4b12
          persist-credentials: false
      - name: Checkout exact separate604 implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          path: expanded604-code
          persist-credentials: false
      - name: Require Root current Welcome4/Orphans2 inputs and exact source before secrets or actors
        id: policy604
        shell: bash
        env:
          IMPLEMENTATION_SOURCE: ${{ inputs.source }}
          WORKFLOW_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' '2ddf093d1fc6485bb2126499c8bb2bdacd7a5d85843251be48abac22c57887b4' 'expanded604-code/latest/implementation/latest_run.py' '041fc7864787f2b3bd8e1f0a8c3dccfb8d2f53429ca48718a122dad919272314' 'expanded604-code/latest/source-manifest.json' | sha256sum --check
          printf '%s  %s\n' 'd66aff25fcdff7dfde5ad0c8de88c8484f5a975497465eb04c00cb4188b1caa9' 'expanded604-code/historical/boot391/boot607/run.py' '23a0c885db33ff458ee542ff2f84749d7e5b7744c5de60524fd6ed3df64cf756' 'expanded604-code/historical/boot391/boot607/source-manifest.json' | sha256sum --check
          python3 -I -B expanded604-code/latest/implementation/latest_run.py --source-preflight
          python3 -I -B expanded604-code/latest/implementation/latest_run.py --require-selection
          printf '%s  %s\n' 'ce1cbfdb602b3e67ea844eae7b9bc37768194f95009bdec642997a23801bf02a' 'expanded604-code/historical/boot391/held606/scripts/ci/current606-native/run.py' '09dae54c10f76d1a7b0bedd012f82aa513f5cc93102ad4ef5e6406dfee8bdd74' 'expanded604-code/historical/boot391/held606/scripts/ci/current606-native/source-manifest.json' | sha256sum --check
          test "$(sha256sum expanded604-code/historical/boot391/held606/held604/scripts/ci/expanded604-apps6-public-pairs/run.py | cut -d ' ' -f 1)" = de8d990a70218063bd0ba1f0ec782ab5e71420aa6912af430facc37d717b38f1
          test "$(sha256sum expanded604-code/historical/boot391/held606/held604/scripts/ci/expanded604-apps6-public-pairs/source-manifest.json | cut -d ' ' -f 1)" = e2b1f8ac11fa119493e22f44722d265293887de7edda80f4b61c00f8a80bf51c
          python3 -B expanded604-code/historical/boot391/held606/scripts/ci/current606-native/gate.py \
            --code "$GITHUB_WORKSPACE/expanded604-code/historical/boot391/held606/held604" --source "$IMPLEMENTATION_SOURCE" \
            --workflow-sha "$WORKFLOW_SOURCE" --preflight
      - name: Checkout exact accepted apps latest tool input DATA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02734c705565868b0b964c48399a4f659fc6f271
          path: latest607-apps-inputs
          persist-credentials: false
      - name: Checkout exact accepted doctor latest tool input DATA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 628b06a310df6058f154c1bf7a4c6a16cd69c53a
          path: latest607-doctor-inputs
          persist-credentials: false
      - name: Checkout exact accepted ksm latest tool input DATA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fe67aaaae7ef4ea94dfc8a42cd2c806cc5436fc7
          path: latest607-ksm-inputs
          persist-credentials: false
      - name: Checkout exact accepted welcome latest tool input DATA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1057f6b5494adc71c469e8867d14fb0db01ce02f
          path: latest607-welcome-inputs
          persist-credentials: false
      - name: Checkout exact next apps10 public input DATA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a2bbf5edd57a7a31951a1e9060c83698f29302c4
          path: latest607-next-apps10-inputs
          persist-credentials: false
      - name: Checkout exact next welcome8 public input DATA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e7ec3f2e7e78ec15d545fa53ec3d1089fa78129b
          path: latest607-next-welcome8-inputs
          persist-credentials: false
      - name: Checkout exact next setup6 public input DATA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 24f8d8ed9de7f4ea1aedcc9624110e553204b36c
          path: latest607-next-setup6-inputs
          persist-credentials: false
      - name: Checkout exact next onboarding public input DATA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2dfef3b189f8343b9a9e94e7833f261145faa337
          path: latest607-next-onboarding-inputs
          persist-credentials: false
      - name: Checkout exact next apps10qualification public input DATA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 180f3ad1440cd82b16b7b944e86b0ba11a1b238d
          path: latest607-next-apps10qualification-inputs
          persist-credentials: false
      - name: Checkout exact accepted Apps8 additional product DATA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6dbfdbad6d9ec75a230ce366096206de933b1c28
          path: latest607-apps8-inputs
          persist-credentials: false
      - name: Latest five source and refusal controls before secrets
        run: |
          python3 -I -B expanded604-code/latest/implementation/latest_run.py --source-preflight
          LATEST607_APPS8_TEST_PACKET="$GITHUB_WORKSPACE/latest607-apps8-inputs" python3 -I -B expanded604-code/next/test_source.py
      - name: Checkout exact accepted Boot79 unsigned native input DATA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4decb87f5b15f8828cea31e75cbf9e4381feaeaa
          path: boot79-native-inputs
          persist-credentials: false
      - name: Source and finite native Boot refusal controls before secrets
        env:
          BOOT607_INPUT_PACKET: ${{ github.workspace }}/boot79-native-inputs/payload
        run: |
          python3 -I -B expanded604-code/historical/boot391/boot607/test_source.py
          python3 -I -B expanded604-code/historical/boot391/boot607/test_transport.py
          python3 -I -B expanded604-code/historical/boot391/boot607/test_package_graph.py
          python3 -I -B expanded604-code/historical/boot391/boot607/test_accepted_inputs.py
          python3 -I -B expanded604-code/historical/boot391/boot607/test_prepare_inputs.py
          python3 -I -B expanded604-code/historical/boot391/held606/scripts/ci/current606-native/test_lane.py
          python3 -I -B expanded604-code/historical/boot391/boot607/accepted-boot79/packages/tools/cachy-asahi-boot-report/test_boot_report.py
      - name: Verify complete accepted Boot79 native DATA before secrets or producers
        run: python3 -I -B expanded604-code/latest/implementation/latest_run.py --native-inputs --apps-packet "$GITHUB_WORKSPACE/latest607-apps-inputs" --doctor-packet "$GITHUB_WORKSPACE/latest607-doctor-inputs" --ksm-packet "$GITHUB_WORKSPACE/latest607-ksm-inputs" --welcome-packet "$GITHUB_WORKSPACE/latest607-welcome-inputs" --boot-packet "$GITHUB_WORKSPACE/boot79-native-inputs" --apps8-packet "$GITHUB_WORKSPACE/latest607-apps8-inputs" --apps10-packet "$GITHUB_WORKSPACE/latest607-next-apps10-inputs" --welcome8-packet "$GITHUB_WORKSPACE/latest607-next-welcome8-inputs" --setup6-packet "$GITHUB_WORKSPACE/latest607-next-setup6-inputs" --onboarding-packet "$GITHUB_WORKSPACE/latest607-next-onboarding-inputs" --apps10qualification-packet "$GITHUB_WORKSPACE/latest607-next-apps10qualification-inputs"
      - name: Checkout fixed legacy public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.policy604.outputs.legacy_source }}
          path: expanded604-legacy
          persist-credentials: false
      - name: Checkout fixed eight public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.policy604.outputs.eight_source }}
          path: expanded604-eight
          persist-credentials: false
      - name: Checkout fixed seven public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.policy604.outputs.seven_source }}
          path: expanded604-seven
          persist-credentials: false
      - name: Checkout fixed management public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.policy604.outputs.management_source }}
          path: expanded604-management
          persist-credentials: false
      - name: Checkout fixed setup public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.policy604.outputs.setup_source }}
          path: expanded604-setup
          persist-credentials: false
      - name: Checkout fixed welcome public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.policy604.outputs.welcome_source }}
          path: expanded604-welcome
          persist-credentials: false
      - name: Checkout exact public659 native pairs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.policy604.outputs.apps6_source }}
          path: expanded604-apps6-inputs
          persist-credentials: false
      - name: Checkout accepted public native byte-case authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.policy604.outputs.apps6_authority_source }}
          path: expanded604-apps6-bytecase-authority
          persist-credentials: false
      - name: Retrieve only the six original pinned audio inputs
        id: audio_inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B expanded604-legacy/scripts/ci/full-development-composition/retrieve_audio.py --output "$RUNNER_TEMP/audio-archives"
      - name: Verify every actual accepted pair and source before secrets
        shell: bash
        env:
          IMPLEMENTATION_SOURCE: ${{ inputs.source }}
          WORKFLOW_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -B expanded604-code/historical/boot391/held606/scripts/ci/current606-native/gate.py \
            --code "$GITHUB_WORKSPACE/expanded604-code/historical/boot391/held606/held604" --source "$IMPLEMENTATION_SOURCE" --workflow-sha "$WORKFLOW_SOURCE" \
            --legacy-source "$GITHUB_WORKSPACE/expanded604-legacy" --eight-source "$GITHUB_WORKSPACE/expanded604-eight" \
            --seven-source "$GITHUB_WORKSPACE/expanded604-seven" --management-source "$GITHUB_WORKSPACE/expanded604-management/payload" \
            --setup-source "$GITHUB_WORKSPACE/expanded604-setup" --welcome-source "$GITHUB_WORKSPACE/expanded604-welcome/payload" \
            --apps6-source "$GITHUB_WORKSPACE/expanded604-apps6-inputs/payload" --apps6-authority-source "$GITHUB_WORKSPACE/expanded604-apps6-bytecase-authority" \
            --audio-inputs "$RUNNER_TEMP/audio-archives"
      - name: Current604 source controls without native actors
        shell: bash
        env:
          CURRENT604_PACKET_ROOT: ${{ github.workspace }}/expanded604-welcome/payload
          CURRENT604_MANAGEMENT_ROOT: ${{ github.workspace }}/expanded604-management/payload
          CURRENT604_NATIVE_SOURCE: ${{ github.workspace }}/expanded604-code/historical/boot391/held606
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s expanded604-code/historical/boot391/held606/scripts/ci/current606-native -p test_lane.py
      - name: Seed the six frozen private cache objects before native work
        if: inputs.mode == 'build'
        shell: bash
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$INPUTS_SHA256" = beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
          timeout --signal=TERM --kill-after=5s 75s python3 -B - <<'PYSEED'
          import hashlib
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts/ci')
          from old_four_seed import (OLD_FOUR_PRIVATE_ROWS, RETAINED_BUBBLEWRAP_PRIVATE_ROWS,
                                     seed_current_build_cache)
          pin = 'beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f'
          if hashlib.sha256(Path('scripts/ci/inputs.lock.json').read_bytes()).hexdigest() != pin:
              raise SystemExit('private-cache-input-binding-refused')
          names = {'CACHY_OLD_FOUR_' + f'{tag}_{i:02d}'
                   for _, _, _, tag, count in OLD_FOUR_PRIVATE_ROWS for i in range(1, count + 1)}
          retained = {'CACHY_RETAINED_BUBBLEWRAP_V1_' + f'{tag}_{i:02d}'
                      for _, _, _, tag, sizes in RETAINED_BUBBLEWRAP_PRIVATE_ROWS
                      for i in range(1, len(sizes) + 1)}
          names |= retained
          if len(names) != 22 or len(retained) != 3 or not all(os.environ.get(name) for name in names):
              raise SystemExit('private-cache-required-secrets-missing')
          cache = Path(os.environ['RUNNER_TEMP']) / 'alarm-cache'
          cache.mkdir(mode=0o700)
          keep = names | {'CACHY_OLD_FOUR_SCHEMA', 'CACHY_OLD_FOUR_SOURCE_EPOCH'}
          for name in tuple(os.environ):
              if name not in keep:
                  os.environ.pop(name)
          seed_current_build_cache(cache, pin)
          PYSEED
      - name: Checkout exact retained public input source
        if: inputs.mode == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing pinned checkout
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed fourteen exact public ARM input files
        if: inputs.mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/retained-public-inputs" rev-parse HEAD)" = 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          test "$(sha256sum retained-public-inputs/seed.py | cut -d ' ' -f 1)" = a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3
          test "$(sha256sum retained-public-inputs/index.json | cut -d ' ' -f 1)" = a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 TZ=UTC \
            TMPDIR="$RUNNER_TEMP" \
            python3 -I -B "$GITHUB_WORKSPACE/retained-public-inputs/seed.py" \
              --cache "$RUNNER_TEMP/alarm-cache"
      - name: Checkout exact original574 archive lock before native base
        if: ${{ success() && inputs.mode == 'build' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 9a2e520dbdfce7e4af417595ff3de9e6a284ef04
          path: archive32-original-lock
          persist-credentials: false
      - name: Checkout exact complete574 original public package bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ddc6ca5f3478f9c607f8fae52661c451ae0bf3ad
          path: native574-complete-public-inputs
          persist-credentials: false
      - name: Checkout exact retained updater compiler6 bytes before transports
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 8ee14069b7a74455a7bea1171ba319932c9df304
          path: compiler6-complete-public-inputs
          persist-credentials: false
      - name: Prefill exact original archive32_20_8 and compiler6 private cache namespaces
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/native574-complete-public-inputs" rev-parse HEAD)" = ddc6ca5f3478f9c607f8fae52661c451ae0bf3ad
          test "$(git -C "$GITHUB_WORKSPACE/compiler6-complete-public-inputs" rev-parse HEAD)" = 8ee14069b7a74455a7bea1171ba319932c9df304
          python3 -I -B - "$GITHUB_WORKSPACE/native574-complete-public-inputs" "$GITHUB_WORKSPACE/expanded604-code/historical/boot391/scripts/ci/current606-apps7-closed-owner" "$GITHUB_WORKSPACE/archive32-original-lock/scripts/ci/maintained-desktop574-inputs.json" "$RUNNER_TEMP" <<'PYEXACTLEGACYPREFILL'
          # SPDX-License-Identifier: MIT
          """Exact DATA preparation before unchanged frozen574 archive32/20/8 transports."""
          import hashlib,json,math,os,stat,time
          from pathlib import Path
          ROOT_PINS={'LICENSE':(1081,'51a352b3e94757560538ca5866bef929de5ec4864e5893fc635f291f7a5926c7'),'NOTICE.md':(1018,'6a3649fc4e0d0ee18a7399ada57d9fa8c1b8c97232ba46efd5da511c72a74141'),'native-inputs.lock.json':(328101,'beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f'),'desktop574-inputs.lock.json':(623664,'b2a234c76c3a820382238023203a8b699a503153f63b938376fd16433c4d90f9'),'seed.py':(6658,'76b787fa71b121ec1bf83b86e4d5db849913614bc90e03239b869d7061af1db4'),'index.json':(184344,'51a53c9e0d9eab1728f350f9ab8d3d7b8932891ab0ed68c7876a1440166ff486')}
          POLICIES={32:'4f6ce49214422579f1cc448ff95d9f311cbfaf47a0d0c4f32d828c9edf843585',20:'1f966afe0c24bb9a928154cb0638a8bb78292c799ffd544132633caddf6217ae',8:'2b21c05d30a9c5efd2f717cfa8475c9de3150d7729f710b348b70a84f5b16e20'}
          FIELDS=('st_dev','st_ino','st_mode','st_uid','st_gid','st_nlink','st_size','st_mtime_ns','st_ctime_ns')
          def need(ok,why):
           if not ok:raise ValueError(why)
          def identity(s):return tuple(getattr(s,k)for k in FIELDS)
