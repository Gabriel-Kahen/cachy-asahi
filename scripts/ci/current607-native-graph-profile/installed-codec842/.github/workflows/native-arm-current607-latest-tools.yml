      - name: Retain the separate bounded604 public closure and lifecycle
        id: native_public_retention
        if: always()
        env:
          CAA_EVIDENCE_SOURCE_SHA: ${{ inputs.source }}
          CAA_EVIDENCE_WORKFLOW_SHA: ${{ github.sha }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYRETAIN'
          import hashlib,json,os,pathlib,shutil,stat
          source=pathlib.Path('/tmp')/('cachy-asahi-expanded604-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])/'public'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'expanded604-public'
          target.mkdir(mode=0o700)
          rows={};total=0;part=0;packet_bytes=0;pieces=0
          def chunk(raw):
              global part,packet_bytes,pieces
              if part==0 or packet_bytes+len(raw)>4*1024**2:
                  part+=1;packet_bytes=0;assert part<=35
                  (target/('part-%04d'%part)).mkdir()
              root=target/('part-%04d'%part);pieces+=1;packet_bytes+=len(raw)
              name='chunk-%04d.bin'%pieces;(root/name).write_bytes(raw)
              return {'packet':root.name,'path':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          if source.exists():
              assert source.is_dir() and not source.is_symlink()
              for path in sorted(source.rglob('*')):
                  info=path.lstat();assert not path.is_symlink()
                  if stat.S_ISDIR(info.st_mode):continue
                  assert stat.S_ISREG(info.st_mode) and info.st_nlink==1 and info.st_size<=32*1024**2
                  total+=info.st_size;assert total<=65*1024**2 and len(rows)<1100
                  name=path.relative_to(source).as_posix();chunks=[];digest=hashlib.sha256()
                  with path.open('rb') as stream:
                      while raw:=stream.read(4*1024**2):digest.update(raw);chunks.append(chunk(raw))
                  rows[name]={'bytes':info.st_size,'sha256':digest.hexdigest(),'chunks':chunks}
          index=target/'part-0000';index.mkdir()
          (index/'retention.json').write_text(json.dumps(dict(files=rows,bytes=total,cap=65*1024**2,
              packet_raw_cap=4*1024**2,packet_count=part,
              reconstruction='concatenate each file chunks in listed order and verify full bytes and sha256',
              scope='accepted public pairs and native604 metadata lifecycle; hardware NOT_RUN'),sort_keys=True)+'\n')
          PYRETAIN
          python3 -I -B "$GITHUB_WORKSPACE/expanded604-code/latest/implementation/latest_transport.py" \
            --policy "$GITHUB_WORKSPACE/expanded604-code/latest/implementation/transport-policy.json" \
            --packets "$RUNNER_TEMP/expanded604-public" \
            --encoder "$GITHUB_WORKSPACE/scripts/ci/log_evidence.py" \
