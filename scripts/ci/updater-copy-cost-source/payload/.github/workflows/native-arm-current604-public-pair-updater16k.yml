name: native-arm-current604-public-pair-updater16k
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact Root-bound604 copied-root implementation/workflow revision
        required: true
        type: string
      case:
        description: One separate generic16K VM Apps5→6 current604 copied-root case
        required: true
        type: choice
        options: [normal, precommit-exit86, postcommit-exit87]
      mode:
        description: Fresh native original-four builder and required FDK pair
        required: true
        default: build
        type: choice
        options: [build]
      inputs_sha256:
        description: Exact pinned Source input lock
        type: string
        default: beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
      recipes_sha256:
        description: Exact pinned four-package recipe lock
        type: string
        default: a5fb287b4dda2a90bf61d4fa8cbbc5d666dad8bb450a70544d00545b091f36e3
      integration_sha256:
        description: Leave empty; this FDK-only job does not run integration
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: native-arm-current604-public-pair-updater16k-${{ inputs.case }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    env:
      SOURCE_COMMIT: a79c4ca92486854f9edb639cd970d2c90fda4b12
      INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
      RECIPES_SHA256: ${{ inputs.recipes_sha256 }}
      RETRY_MODE: ${{ inputs.mode }}
      REQUESTED_INTEGRATION_SHA256: ${{ inputs.integration_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a79c4ca92486854f9edb639cd970d2c90fda4b12
          persist-credentials: false
      - name: Checkout the separate604 copied-root implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          path: expanded604-upgrade
          persist-credentials: false
      - name: Require Root actual prerequisite bindings before secrets or actors
        id: root_policy
        shell: bash
        env:
          IMPLEMENTATION_SOURCE: ${{ inputs.source }}
          WORKFLOW_SOURCE: ${{ github.sha }}
          UPGRADE_CASE: ${{ inputs.case }}
        run: |
          set -euo pipefail
          test "$(sha256sum expanded604-upgrade/scripts/ci/expanded604-apps6-public-pair-updater/run.py | cut -d ' ' -f 1)" = ed05eaf1c6263ed5ce1dc2e97c863021c03d232cc5ad3554ab681aa4866993fe
          test "$(sha256sum expanded604-upgrade/scripts/ci/expanded604-apps6-public-pair-updater/source-manifest.json | cut -d ' ' -f 1)" = ec9a759bbb5be161a0a77c2983e731c3b09e71b33688a2ecdf54abce9d1ba41b
          test "$(sha256sum expanded604-upgrade/scripts/ci/current604-public-pair-updater16k/job.py | cut -d ' ' -f 1)" = 47c560fdc227a0b41e2cca9e1797b55adce2b35bb080d950d8ee1d1993c86c13
          test "$(sha256sum expanded604-upgrade/scripts/ci/current604-public-pair-updater16k/wiring-source-manifest.json | cut -d ' ' -f 1)" = 6b4c23c2b40c76cdc036fde19fd326b3b2acbb3482bb47915518cb906392d649
          python3 -I -B expanded604-upgrade/scripts/ci/current604-public-pair-updater16k/job.py preflight \
            --implementation "$GITHUB_WORKSPACE/expanded604-upgrade" --source "$IMPLEMENTATION_SOURCE" \
            --workflow-sha "$WORKFLOW_SOURCE" --case "$UPGRADE_CASE"
      - name: Checkout Root accepted signed604 producer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.installer_source }}
          path: expanded604-installer
          persist-credentials: false
      - name: Checkout Root actual prerequisite decisions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.decision_source }}
          path: expanded604-decisions
          persist-credentials: false
      - name: Checkout the exact accepted587 code for this case
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.upgrader_source }}
          path: expanded604-upgrader-source
          persist-credentials: false
      - name: Checkout the genuine accepted Setup5 pair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.setup_source }}
          path: expanded604-setup5
          persist-credentials: false
      - name: Checkout the fixed old helper and setup3 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.legacy_source }}
          path: expanded604-legacy
          persist-credentials: false
      - name: Checkout unchanged original seven-pair input root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.seven_source }}
          path: expanded604-seven
          persist-credentials: false
      - name: Checkout the Root-bound accepted eight-pair input root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.eight_source }}
          path: expanded604-eight
          persist-credentials: false
      - name: Checkout the accepted four management package carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.management_source }}
          path: expanded604-management-source
          persist-credentials: false
      - name: Checkout the accepted Welcome2 carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.welcome_source }}
          path: expanded604-welcome-source
          persist-credentials: false
      - name: Checkout the accepted fresh600 installer decision carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.fresh600_decisions }}
          path: expanded604-fresh600-decisions
          persist-credentials: false
      - name: Checkout the accepted native604 decision carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.native604_decisions }}
          path: expanded604-native604-decisions
          persist-credentials: false
      - name: Checkout all three exact accepted Apps6 updater decisions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.updater_decisions }}
          path: apps6-updater-decisions
          persist-credentials: false
      - name: Provision host ext4 test tools on disposable runner
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=10s 180s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 update -qq
          timeout --kill-after=10s 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 install -y --no-install-recommends e2fsprogs
          command -v mkfs.ext4
          command -v debugfs
          dpkg-query -W e2fsprogs
      - name: Source-only public-pair updater16K controls
        shell: bash
        run: |
          python3 -B -m unittest discover -s expanded604-upgrade/scripts/ci/current604-public-pair-updater16k -p 'test_*.py' -v
      - name: Require five actual decisions and frozen installer before input retrieval
        id: root_decisions
        shell: bash
        env:
          IMPLEMENTATION_SOURCE: ${{ inputs.source }}
          WORKFLOW_SOURCE: ${{ github.sha }}
          UPGRADE_CASE: ${{ inputs.case }}
        run: |
          set -euo pipefail
          python3 -I -B expanded604-upgrade/scripts/ci/current604-public-pair-updater16k/job.py decisions \
            --implementation "$GITHUB_WORKSPACE/expanded604-upgrade" --source "$IMPLEMENTATION_SOURCE" \
            --workflow-sha "$WORKFLOW_SOURCE" --updater-decisions "$GITHUB_WORKSPACE/apps6-updater-decisions" --case "$UPGRADE_CASE" \
            --installer-source "$GITHUB_WORKSPACE/expanded604-installer" \
            --decision-source "$GITHUB_WORKSPACE/expanded604-decisions"
      - name: Checkout exact apps6_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.apps6_source }}
          path: apps6-inputs
          persist-credentials: false
      - name: Checkout exact apps6_authority_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.apps6_authority_source }}
          path: apps6-authority
          persist-credentials: false
      - name: Checkout exact baseline_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.baseline_source }}
          path: apps5-baseline
          persist-credentials: false
      - name: Checkout exact baseline_decisions_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.root_policy.outputs.baseline_decisions_source }}
          path: apps5-baseline-decisions
          persist-credentials: false
      - name: Retrieve only the six original pinned audio inputs
        id: audio_inputs
        if: ${{ !cancelled() && steps.root_decisions.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B expanded604-legacy/scripts/ci/full-development-composition/retrieve_audio.py --output "$RUNNER_TEMP/audio-archives"
      - name: Verify all actual decisions and immutable inputs before secrets
        id: root_inputs
        if: ${{ !cancelled() && steps.audio_inputs.outcome == 'success' }}
        shell: bash
        env:
          IMPLEMENTATION_SOURCE: ${{ inputs.source }}
          WORKFLOW_SOURCE: ${{ github.sha }}
          UPGRADE_CASE: ${{ inputs.case }}
        run: |
          set -euo pipefail
          python3 -I -B expanded604-upgrade/scripts/ci/current604-public-pair-updater16k/job.py inputs \
            --implementation "$GITHUB_WORKSPACE/expanded604-upgrade" --source "$IMPLEMENTATION_SOURCE" \
            --workflow-sha "$WORKFLOW_SOURCE" --updater-decisions "$GITHUB_WORKSPACE/apps6-updater-decisions" --case "$UPGRADE_CASE" \
            --installer-source "$GITHUB_WORKSPACE/expanded604-installer" \
            --decision-source "$GITHUB_WORKSPACE/expanded604-decisions" \
            --upgrader-source "$GITHUB_WORKSPACE/expanded604-upgrader-source" \
            --legacy-source "$GITHUB_WORKSPACE/expanded604-legacy" \
            --seven-source "$GITHUB_WORKSPACE/expanded604-seven" --eight-source "$GITHUB_WORKSPACE/expanded604-eight" \
            --setup-source "$GITHUB_WORKSPACE/expanded604-setup5" \
            --management-source "$GITHUB_WORKSPACE/expanded604-management-source/payload" \
            --welcome-source "$GITHUB_WORKSPACE/expanded604-welcome-source/payload" \
            --fresh600-decisions "$GITHUB_WORKSPACE/expanded604-fresh600-decisions" \
            --native604-decisions "$GITHUB_WORKSPACE/expanded604-native604-decisions" \
            --apps6-source "$GITHUB_WORKSPACE/apps6-inputs/payload" --apps6-authority-source "$GITHUB_WORKSPACE/apps6-authority" --baseline-source "$GITHUB_WORKSPACE/apps5-baseline" --baseline-decisions-source "$GITHUB_WORKSPACE/apps5-baseline-decisions" \
            --audio-inputs "$RUNNER_TEMP/audio-archives"
      - name: Seed the six frozen private cache objects before native work
        if: inputs.mode == 'build' && steps.root_inputs.outcome == 'success'
        shell: bash
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$INPUTS_SHA256" = beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
          timeout --signal=TERM --kill-after=5s 75s python3 -B - <<'PYSEED'
          import hashlib
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts/ci')
          from old_four_seed import (OLD_FOUR_PRIVATE_ROWS, RETAINED_BUBBLEWRAP_PRIVATE_ROWS,
                                     seed_current_build_cache)
          pin = 'beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f'
          if hashlib.sha256(Path('scripts/ci/inputs.lock.json').read_bytes()).hexdigest() != pin:
              raise SystemExit('private-cache-input-binding-refused')
          names = {'CACHY_OLD_FOUR_' + f'{tag}_{i:02d}'
                   for _, _, _, tag, count in OLD_FOUR_PRIVATE_ROWS for i in range(1, count + 1)}
          retained = {'CACHY_RETAINED_BUBBLEWRAP_V1_' + f'{tag}_{i:02d}'
                      for _, _, _, tag, sizes in RETAINED_BUBBLEWRAP_PRIVATE_ROWS
                      for i in range(1, len(sizes) + 1)}
          names |= retained
          if len(names) != 22 or len(retained) != 3 or not all(os.environ.get(name) for name in names):
              raise SystemExit('private-cache-required-secrets-missing')
          cache = Path(os.environ['RUNNER_TEMP']) / 'alarm-cache'
          cache.mkdir(mode=0o700)
          keep = names | {'CACHY_OLD_FOUR_SCHEMA', 'CACHY_OLD_FOUR_SOURCE_EPOCH'}
          for name in tuple(os.environ):
              if name not in keep:
                  os.environ.pop(name)
          seed_current_build_cache(cache, pin)
          PYSEED
      - name: Checkout exact retained public input source
        if: inputs.mode == 'build' && steps.root_inputs.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing pinned checkout
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed fourteen exact public ARM input files
        if: inputs.mode == 'build' && steps.root_inputs.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/retained-public-inputs" rev-parse HEAD)" = 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          test "$(sha256sum retained-public-inputs/seed.py | cut -d ' ' -f 1)" = a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3
          test "$(sha256sum retained-public-inputs/index.json | cut -d ' ' -f 1)" = a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 TZ=UTC \
            TMPDIR="$RUNNER_TEMP" \
            python3 -I -B "$GITHUB_WORKSPACE/retained-public-inputs/seed.py" \
              --cache "$RUNNER_TEMP/alarm-cache"
      - name: Checkout exact original574 archive lock before native base
        if: ${{ success() && inputs.mode == 'build' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 9a2e520dbdfce7e4af417595ff3de9e6a284ef04
          path: archive32-original-lock
          persist-credentials: false
      - name: Checkout exact complete574 original public package bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ddc6ca5f3478f9c607f8fae52661c451ae0bf3ad
          path: native574-complete-public-inputs
          persist-credentials: false
      - name: Checkout exact retained updater compiler6 bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 8ee14069b7a74455a7bea1171ba319932c9df304
          path: native-updater-compiler6-public-inputs
          persist-credentials: false
      - name: Prefill exact original32 20 8 caches before unchanged legacy transports
        id: complete_legacy_prefill
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - "$GITHUB_WORKSPACE/native574-complete-public-inputs/seed.py" "$GITHUB_WORKSPACE/archive32-original-lock/scripts/ci/maintained-desktop574-inputs.json" "$RUNNER_TEMP" native248 <<'PYEXACTCOMPLETE574'
          import hashlib,json,os,re,stat,subprocess,sys,time,types
          from pathlib import Path
          helper,lock,cache=map(Path,sys.argv[1:4]);mode=sys.argv[4];carrier=helper.parent.absolute();deadline=time.monotonic()+230
          source='ddc6ca5f3478f9c607f8fae52661c451ae0bf3ad'
          metadata={'LICENSE': {'bytes': 1081, 'sha256': '51a352b3e94757560538ca5866bef929de5ec4864e5893fc635f291f7a5926c7'}, 'NOTICE.md': {'bytes': 1018, 'sha256': '6a3649fc4e0d0ee18a7399ada57d9fa8c1b8c97232ba46efd5da511c72a74141'}, 'desktop574-inputs.lock.json': {'bytes': 623664, 'sha256': 'b2a234c76c3a820382238023203a8b699a503153f63b938376fd16433c4d90f9'}, 'index.json': {'bytes': 184344, 'sha256': '51a53c9e0d9eab1728f350f9ab8d3d7b8932891ab0ed68c7876a1440166ff486'}, 'native-inputs.lock.json': {'bytes': 328101, 'sha256': 'beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f'}, 'seed.py': {'bytes': 6658, 'sha256': '76b787fa71b121ec1bf83b86e4d5db849913614bc90e03239b869d7061af1db4'}}
          pin=lambda raw:dict(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
          def need(ok,why):
           if not ok:raise ValueError(why)
          def read(path):
           a=path.lstat();identity=lambda s:(s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_gid,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
           need(stat.S_ISREG(a.st_mode)and a.st_nlink==1 and 0<=a.st_size<=128*1024**2 and not any(p.is_symlink()for p in(path,*path.parents)),'ordinary bounded pinned source')
           raw=path.read_bytes();need(identity(a)==identity(path.lstat())and len(raw)==a.st_size,'whole source stable excluding atime only');return raw
          def git(*args):
           need(time.monotonic()<deadline,'bounded230s complete retained-input proof')
           env=dict(PATH='/usr/bin:/bin',HOME='/tmp',LC_ALL='C',GIT_CONFIG_NOSYSTEM='1',GIT_CONFIG_GLOBAL='/dev/null',GIT_NO_REPLACE_OBJECTS='1',GIT_NO_LAZY_FETCH='1',GIT_TERMINAL_PROMPT='0')
           r=subprocess.run(['/usr/bin/git','-C',str(carrier),*args],stdin=subprocess.DEVNULL,capture_output=True,timeout=min(30,max(.01,deadline-time.monotonic())),env=env)
           need(r.returncode==0 and len(r.stdout)+len(r.stderr)<=128*1024**2,'bounded whole Git/source proof');return r.stdout
          need(mode in('native248','desktop574')and carrier==Path(os.environ['GITHUB_WORKSPACE']).absolute()/'native574-complete-public-inputs','two explicit modes and fixed separate carrier')
          need(not carrier.is_relative_to(Path(os.environ['GITHUB_WORKSPACE'])/'expanded604-upgrade'),'carrier outside closed updater implementation')
          for n,row in metadata.items():need(pin(read(carrier/n))==row,'whole six metadata/helper source pins')
          index=json.loads(read(carrier/'index.json'));expected=dict(metadata,**{'packages/'+n:row for n,row in index['files'].items()})
          need(len(index['files'])==1148 and len(expected)==1154,'complete1148 archive/signature carrier')
          physical={}
          for p in carrier.rglob('*'):
           if p.relative_to(carrier).parts[0]=='.git':continue
           need(not p.is_symlink()and(p.is_file()or p.is_dir()),'closed ordinary carrier membership')
           if p.is_file():physical[p.relative_to(carrier).as_posix()]=pin(read(p))
          need(physical==expected and git('rev-parse','HEAD').decode().strip()==source,'whole1154 physical source and immutable HEAD')
          table={}
          for line in git('ls-tree','-rz','--full-tree',source).split(b'\0'):
           if not line:continue
           fields,name=line.split(b'\t',1);m,k,oid=fields.split();n=name.decode();need(n in expected and n not in table and m in(b'100644',b'100755')and k==b'blob'and re.fullmatch(b'[a-f0-9]{40}',oid),'complete ordinary committed leaf');table[n]=oid
