name: Native ARM KSM ownership preflight

on:
  workflow_dispatch:
    inputs:
      packet_sha256:
        description: Reviewed SHA-256 of the committed separate KSM job packet
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-arm-build
  cancel-in-progress: false

jobs:
  ownership-preflight:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Accept committed source bytes and refuse the missing ownership interface
        env:
          PACKET_SHA256: ${{ inputs.packet_sha256 }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import hashlib, json, os, pathlib, platform, re, stat, time, types

          source_started = time.monotonic()
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          prefix = 'scripts/port/ksm-native-job/'
          pin = os.environ['PACKET_SHA256']
          if not re.fullmatch(r'[0-9a-f]{64}', pin):
              raise SystemExit('FAIL: reviewed packet digest required')

          def capture(path):
              if not path.is_absolute() or '..' in path.parts:
                  raise ValueError('unsafe source path')
              fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY)
              leaf = None
              try:
                  for part in path.parts[1:-1]:
                      next_fd = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                      os.close(fd)
                      fd = next_fd
                  leaf = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=fd)
                  before = os.fstat(leaf)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or not 0 <= before.st_size <= 2*1024**2:
                      raise ValueError('unsafe source file')
                  data = bytearray()
                  while block := os.read(leaf, min(65536, before.st_size-len(data)+1)):
                      data.extend(block)
                      if len(data) > before.st_size:
                          raise ValueError('source read bound')
                  after = os.fstat(leaf)
                  fields = ('st_dev','st_ino','st_mode','st_uid','st_gid','st_nlink','st_size','st_mtime_ns','st_ctime_ns')
                  if len(data) != before.st_size or any(getattr(before,k) != getattr(after,k) for k in fields):
                      raise ValueError('source capture drift')
                  return bytes(data), f'{stat.S_IMODE(before.st_mode):04o}'
              finally:
                  if leaf is not None:
                      os.close(leaf)
                  os.close(fd)

          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise ValueError('duplicate packet field')
                  result[key] = value
              return result

          try:
              packet_path = root / prefix / 'packet.lock.json'
              packet_bytes, mode = capture(packet_path)
              if mode != '0644' or hashlib.sha256(packet_bytes).hexdigest() != pin:
                  raise ValueError('packet digest or mode mismatch')
              packet = json.loads(packet_bytes, object_pairs_hook=pairs)
              def initial_module(name):
                  path = prefix + name + '.py'
                  data, mode = capture(root / path)
                  row = packet['files'][path]
                  if set(row) != {'sha256','size_bytes','mode'} or row['mode'] != mode or mode != '0644' or row['size_bytes'] != len(data) or row['sha256'] != hashlib.sha256(data).hexdigest():
                      raise ValueError('bootstrap source mismatch')
                  module = types.ModuleType('ksm_frozen_' + name)
                  module.__file__ = str(root / path)
                  exec(compile(data, module.__file__, 'exec'), module.__dict__)
                  return module
              acceptance = initial_module('acceptance')
              required = initial_module('required_paths')
              snapshot = acceptance.capture(root, packet_path, pin, required.EXPECTED_PATHS,
                                            required.WORKFLOW, os.environ['GITHUB_SHA'])
              job = snapshot.module(prefix + 'job.py', 'ksm_frozen_job', imports={
                  'hashlib':hashlib, 'json':json, 'os':os, 'pathlib':pathlib,
                  'platform':platform, 're':re, 'time':time})
              result = job.assess(snapshot, started_at=source_started)
              data = json.dumps(result, sort_keys=True)
              if len(data.encode()) > 65536:
                  raise ValueError('preflight evidence bound')
              print(data)
              # No accepted same-job ownership interface exists in the held CLI.
              # Never launch an unbounded producer or publish a partial PASS.
              raise SystemExit(78 if result['status'] == 'BLOCKED' else 1)
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit('FAIL: committed KSM source/ownership preflight refused')
          PY
