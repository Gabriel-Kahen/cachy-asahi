# Original private-prefix source candidate; not the historical package recipe.
profile = "dist"
change-id = 160100

[build]
build = "aarch64-unknown-linux-gnu"
host = ["aarch64-unknown-linux-gnu"]
target = ["aarch64-unknown-linux-gnu"]
rustc = "/stage0/bin/rustc"
cargo = "/stage0/bin/cargo"
rustdoc = "/stage0/bin/rustdoc"
submodules = false
build-stage = 2
extended = true
locked-deps = true
vendor = true
tools = ["cargo", "clippy", "rustdoc", "rustfmt", "rust-analyzer-proc-macro-srv", "analysis", "src"]
sanitizers = false
profiler = true
docs = false

[llvm]
download-ci-llvm = false
link-shared = true
enzyme = false

[gcc]
download-ci-gcc = false

[rust]
channel = "stable"
download-rustc = false
codegen-backends = ["llvm"]
codegen-units = 16
codegen-units-std = 1
debuginfo-level = 0
debuginfo-level-std = 0
rpath = true
# Pinned bootstrap supports rust.rustflags at every stage and target.
rustflags = ["-Clink-arg=-Wl,-rpath,/opt/cachy-asahi/llvm23-source-reference/lib"]
lld = false
bootstrap-override-lld = "external"
llvm-bitcode-linker = false
deny-warnings = false
backtrace-on-ice = true
parallel-frontend-threads = 0

[install]
prefix = "/opt/cachy-asahi/rust199-source-reference"
sysconfdir = "/opt/cachy-asahi/rust199-source-reference/etc"
bindir = "bin"
libdir = "lib"
datadir = "share"
mandir = "share/man"

[dist]
compression-formats = ["gz"]
compression-profile = "fast"

[target.aarch64-unknown-linux-gnu]
cc = "/usr/bin/gcc"
cxx = "/usr/bin/g++"
ar = "/usr/bin/gcc-ar"
ranlib = "/usr/bin/gcc-ranlib"
llvm-config = "/opt/cachy-asahi/llvm23-source-reference/bin/llvm-config"
