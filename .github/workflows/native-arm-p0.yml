                  result['journal_partial']=partial;result['journal_window_limit']=128
                  result['journal_window_full']=len(rows)==128
              try:result['barrier_log']=read_barrier(Path(os.environ['RUNNER_TEMP']),parts)
              except Exception:pass
              print(json.dumps(result,sort_keys=True))
          
          if __name__=='__main__':main()
      - name: Remove only job-owned DEV profile after container retirement
        if: ${{ always() && steps.dev_apparmor.outputs.directory != '' }}
        shell: /usr/bin/python3 -I -B -S {0}
        env:
          DEV_PROFILE_DIRECTORY: ${{ steps.dev_apparmor.outputs.directory }}
        run: |
          import hashlib,json,os,re,stat,subprocess
          from pathlib import Path
          parts=(os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'])
          if not all(re.fullmatch('[0-9]{1,20}',v) for v in parts):raise ValueError('job identity')
          name='cachy-asahi-p0-dev-'+'-'.join(parts)
          root=Path(os.environ['RUNNER_TEMP'])/name
          if str(root)!=os.environ['DEV_PROFILE_DIRECTORY']:raise ValueError('owned path mismatch')
          info=root.lstat()
          if not stat.S_ISDIR(info.st_mode) or info.st_uid!=os.getuid() or stat.S_IMODE(info.st_mode)!=0o700:raise ValueError('owned directory changed')
          profile=root/'profile'; info=profile.lstat()
          if not stat.S_ISREG(info.st_mode) or info.st_uid!=os.getuid() or stat.S_IMODE(info.st_mode)!=0o600 or info.st_nlink!=1:raise ValueError('profile changed')
          body=profile.read_bytes();intent=json.loads((root/'intent.json').read_bytes())
          if intent!={'name':name,'sha256':hashlib.sha256(body).hexdigest(),'run_id':parts[0],'attempt':parts[1]}:raise ValueError('owned profile identity changed')
          def command(args):
              p=subprocess.run(args,stdin=subprocess.DEVNULL,capture_output=True,timeout=10)
              if len(p.stdout)+len(p.stderr)>2*1024**2 or p.returncode:raise ValueError('DEV profile cleanup command refused')
              return p.stdout
          def present():return any(row.split(' (',1)[0]==name for row in command(['sudo','-n','/bin/cat','/sys/kernel/security/apparmor/profiles']).decode().splitlines())
          if not (root/'load-succeeded').exists():
              if present():raise ValueError('profile load outcome unknown; no removal authority')
          else:
              if (root/'load-succeeded').read_text()!=intent['sha256']:raise ValueError('load ownership marker changed')
              ids=command(['docker','container','ls','-a','-q','--no-trunc']).decode().splitlines()
              if len(ids)>32 or any(not re.fullmatch('[0-9a-f]{64}',v) for v in ids):raise ValueError('container inventory bound')
              rows=json.loads(command(['docker','container','inspect',*ids])) if ids else []
              if type(rows) is not list or len(rows)!=len(ids) or {r.get('Id') for r in rows}!=set(ids):raise ValueError('container retirement unknown')
              if any(r.get('AppArmorProfile')==name for r in rows):raise ValueError('owned-profile container remains; profile kept enforced')
              if not present():raise ValueError('owned profile unexpectedly absent')
              command(['sudo','-n','/usr/sbin/apparmor_parser','-R','-K',str(profile)])
              if present():raise ValueError('owned profile removal unverified')
          with (root/'cleanup-complete').open('x') as f:f.write('owned profile absent\n')
