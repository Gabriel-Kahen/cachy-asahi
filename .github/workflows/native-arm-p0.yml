                      except BaseException:
                          pass
          
          def public_failure(error):
              flags = {}; value = None; sink_cancelled = False; sink_uncertain = False
              try:
                  candidate = exception_state(error)
                  if type(candidate) is dict and all(type(key) is str for key in candidate):
                      flags = candidate
                      sink_cancelled = flags.get('native_preflight_cancelled') is True or flags.get('freeze_cancelled') is True
