ustody', 'prep-output-drift', 'prep-override-content', 'prep-owned-tag', 'prep-package-retirement', 'prep-packages', 'prep-packet-drift', 'prep-paths', 'prep-private-fresh', 'prep-private-template', 'prep-publication', 'prep-publication-closure', 'prep-publication-row', 'prep-quarantine', 'prep-registry-retirement', 'prep-runtime', 'prep-selection', 'prep-source-owner', 'prep-source-path', 'prep-source-total', 'prep-tag-custody', 'prep-tag-must-be-absent', 'prep-tag-retirement', 'prep-template', 'prep-template-job', 'prep-template-nonce', 'prep-template-pin', 'prep-view', 'prep-warm-cache', 'prep-warm-cache-required', 'private-close-custody', 'private-directory', 'private-readback', 'private-write-custody', 'private-write-drift', 'private-write-progress', 'private-write-shape', 'publication644-required', 'published-270-rows', 'published-job-Source', 'recipe-Source', 'recipe-input-drift', 'recipe-map-refused', 'regular-Source-leaf-required', 'runtime-row', 'runtime-selection', 'seed-environment-drift', 'selected-driver-body', 'selector-changed-during-freeze', 'source-path', 'template-decoded-cap', 'template-output-set', 'template-packed', 'template-packed-cap', 'unfilled-gpg', 'unfilled-runtime', 'unresolved-prior-Git-custody', 'unresolved-prior-read-custody', 'virtual-metadata-drift'])
          DIAGNOSTIC_STAGES['pipeline'] = set(DIAGNOSTIC_STAGES['pipeline']) | set(['load-preparation', 'verify-preparation-packet', 'load-preparation-sources', 'initialize-preparation', 'prepare-image', 'finish-preparation', 'materialize-P0', 'run-P0', 'pipeline-cleanup', 'download-input', 'download-http-error', 'download-url-error', 'download-timeout', 'supervise-child', 'supervise-child-timeout', 'check-child-outcome'])
          DIAGNOSTIC_TYPES = frozenset(['KeyboardInterrupt', 'OSError', 'RuntimeError', 'SystemExit', 'TypeError', 'UNKNOWN', 'ValueError'])
          # The selector and ordinal domain are fixed by the current reviewed input contract.
          DOWNLOAD_OPERATIONS = frozenset('download-current-vim-v1-input-' + str(i).zfill(3) for i in range(501))
          DOWNLOAD_CODE_TYPES = {'DL_HTTP_301': 'UNKNOWN', 'DL_HTTP_302': 'UNKNOWN', 'DL_HTTP_303': 'UNKNOWN', 'DL_HTTP_307': 'UNKNOWN', 'DL_HTTP_308': 'UNKNOWN', 'DL_HTTP_400': 'UNKNOWN', 'DL_HTTP_401': 'UNKNOWN', 'DL_HTTP_403': 'UNKNOWN', 'DL_HTTP_404': 'UNKNOWN', 'DL_HTTP_405': 'UNKNOWN', 'DL_HTTP_408': 'UNKNOWN', 'DL_HTTP_410': 'UNKNOWN', 'DL_HTTP_416': 'UNKNOWN', 'DL_HTTP_429': 'UNKNOWN', 'DL_HTTP_451': 'UNKNOWN', 'DL_HTTP_500': 'UNKNOWN', 'DL_HTTP_501': 'UNKNOWN', 'DL_HTTP_502': 'UNKNOWN', 'DL_HTTP_503': 'UNKNOWN', 'DL_HTTP_504': 'UNKNOWN', 'DL_HTTP_507': 'UNKNOWN', 'DL_HTTP_508': 'UNKNOWN', 'DL_HTTP_511': 'UNKNOWN', 'DL_HTTP_OTHER': 'UNKNOWN', 'DL_HTTP_UNKNOWN': 'UNKNOWN', 'DL_KBI_AFTER_PREP_ALRM': 'KeyboardInterrupt', 'DL_KBI_AFTER_UNATTRIBUTED': 'KeyboardInterrupt', 'DL_KBI_BEFORE_PREP_ALRM': 'KeyboardInterrupt', 'DL_KBI_BEFORE_UNATTRIBUTED': 'KeyboardInterrupt', 'DL_KBI_UNKNOWN_PREP_ALRM': 'KeyboardInterrupt', 'DL_KBI_UNKNOWN_UNATTRIBUTED': 'KeyboardInterrupt', 'DL_OSERROR': 'OSError', 'DL_OTHER': 'UNKNOWN', 'DL_RUNTIMEERROR': 'RuntimeError', 'DL_SYSTEMEXIT': 'SystemExit', 'DL_TIMEOUTERROR': 'OSError', 'DL_TYPEERROR': 'TypeError', 'DL_URLERROR': 'UNKNOWN', 'DL_VALUEERROR': 'ValueError', 'prep-download-cap': 'ValueError', 'prep-download-close-custody': 'ValueError', 'prep-download-domain': 'ValueError', 'prep-download-downgrade': 'ValueError', 'prep-download-fd': 'ValueError', 'prep-download-file': 'ValueError', 'prep-download-input': 'ValueError', 'prep-download-pin': 'ValueError', 'prep-download-progress': 'ValueError', 'prep-download-redirect': 'ValueError', 'prep-download-response-custody': 'ValueError', 'prep-download-target': 'ValueError', 'prep-fixed-four-no-HTTPS-fallback': 'ValueError'}
          DOWNLOAD_CODES = frozenset(code for code in DOWNLOAD_CODE_TYPES if code.startswith('DL_'))
          DOWNLOAD_GUARD_CODES = frozenset(DOWNLOAD_CODE_TYPES) - DOWNLOAD_CODES
          DIAGNOSTIC_STAGES['pipeline'] = set(DIAGNOSTIC_STAGES['pipeline']) | DOWNLOAD_OPERATIONS
          DIAGNOSTIC_CODES = DIAGNOSTIC_CODES | DOWNLOAD_CODES
          WORKFLOW_CODES = frozenset(['original Root endpoint refused', 'Root packed input cap', 'Root decoded input cap'])
          def consult_launcher_codes(module):
              # Root already authenticated this exact Source before compile/exec.
              global DIAGNOSTIC_CODES
              if type(module) is not types.ModuleType:
                  raise ValueError('Root diagnostic enum refused')
              state = types.ModuleType.__dict__['__dict__'].__get__(module)
              if type(state) is not dict or len(state) > 512 or any(type(key) is not str for key in state):
                  raise ValueError('Root diagnostic enum refused')
              table = state.get('DIAGNOSTIC_CODES')
              domains = {'launcher','freezer','materializer','pipeline','sdk','packet','transport'}
              if type(table) is not dict or len(table) != 7 or any(type(key) is not str for key in table) or set(table) != domains:
                  raise ValueError('Root diagnostic enum refused')
              selected = set(DIAGNOSTIC_CODES)
              for literals in table.values():
                  if type(literals) is not frozenset or len(literals) > 512:
                      raise ValueError('Root diagnostic enum refused')
                  for literal in literals:
                      if type(literal) is not str or not 0 < len(literal) <= 160 or any(not 32 <= ord(c) < 127 for c in literal):
                          raise ValueError('Root diagnostic enum refused')
                      selected.add(literal)
                      if len(selected) > 512:
                          raise ValueError('Root diagnostic enum refused')
              # Commit only a complete validated builtin table; no function/provider call.
              DIAGNOSTIC_CODES = frozenset(selected)
          def exception_state(error):
              """Read builtin exception storage without subclass descriptors or hooks."""
              state = BaseException.__dict__['__dict__'].__get__(error)
              if type(state) is dict and all(type(key) is str for key in state):
                  return state
              return None
          
          
          def exception_kind(error):
              kind = type(error)
              for builtin, label in ((ValueError,'ValueError'),(TypeError,'TypeError'),(RuntimeError,'RuntimeError'),(KeyboardInterrupt,'KeyboardInterrupt'),(SystemExit,'SystemExit')):
