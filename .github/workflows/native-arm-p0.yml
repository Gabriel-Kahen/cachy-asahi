          DIAGNOSTIC_STAGES = {'UNKNOWN': ['UNKNOWN'], 'cleanup': ['erase-seed'], 'driver': ['load-driver'], 'entry': ['validate-entry'], 'freeze': ['freeze-source', 'initialize-git'], 'materializer': ['materialize-templates', 'read-environment'], 'observation': ['observe-docker', 'observe-git', 'observe-gpg', 'observe-socket', 'validate-host'], 'packet': ['verify-committed-packet'], 'pipeline': ['run-pipeline', 'prepare-pipeline-arguments'], 'private': ['write-selection'], 'resource': ['load-freezer', 'load-materializer'], 'seed': ['capture-seed'], 'selection': ['validate-selection'], 'WORKFLOW_ARGUMENT_DECODE': ['bootstrap.unpack']}
          DIAGNOSTIC_STAGES['preparation-sdk-preflight'] = ['preflight', 'decode-duplicate', 'decode-number', 'decode-bytes', 'decode-object', 'grant-pin', 'grant-schema', 'contract-pin', 'job-identifier', 'original-view', 'policy-source-pin', 'policy-fields']
          DIAGNOSTIC_STAGES['P0-sdk-preflight'] = ['preflight', 'decode-duplicate', 'decode-number', 'decode-bytes', 'decode-object', 'grant-pin', 'grant-schema', 'contract-pin', 'job-identifier', 'original-view', 'policy-source-pin', 'policy-fields']
          DIAGNOSTIC_CODES = frozenset(['Git-blob-identity-refused', 'Git-blob-mode-refused', 'Git-exact270-refused', 'Git-output-limit', 'Git-read-failed', 'Git-tree-refused', 'P0-variant-drift', 'Root decoded input cap', 'Root packed input cap', 'Root-Git-body-refused', 'Root-Source-required', 'Root-callback-slot', 'Root-checkout-required', 'Root-close-custody', 'Root-file-cap', 'Root-file-drift', 'Root-file-replaced', 'Root-file-shape', 'Root-input-pin', 'Root-job-Source', 'Root-materializer-row', 'Root-owned-private-directory', 'Root-private-input-pin', 'Root-private-path', 'Root-proof-Source', 'Root-proof-pin', 'Root-proof-row-table', 'Root-publication-Source-refused', 'Root-publication-hash-refused', 'Root-publication-required', 'Root-publication-required-rows', 'Root-publication-row-drift', 'Root-publication-table-refused', 'Root-resource-body', 'Root-resource-provision', 'Root-selected-data', 'Root-selected-helper-code', 'Root-selection', 'Root-socket-identity', 'Root-socket-selection', 'Source-body-pin', 'Source-body-set', 'Source-file-limit', 'Source-literal-refused', 'Source-map-leaf-drift', 'Source-map-refused', 'Source-path-refused', 'Source-row', 'Source-row-refused', 'Source-selector-refused', 'Source-total', 'Source-total-limit', 'UNKNOWN', 'actual-adopted-Source-row', 'actual-packet269', 'actual-publication', 'checkout-HEAD-refused', 'close-Source-FD-drift', 'close-custody', 'closed-Git-read-required', 'committed269-lock-mismatch', 'committed269-lock-required', 'data-output-limit', 'data-write-incomplete', 'data-write-readback-drift', 'distinct-purpose0', 'docker-socket-drift', 'docker-socket-shape', 'duplicate-key', 'exact269-selector-refused', 'experiment-exporter-drift', 'experiment-map-drift', 'explicit-Root-review-decision', 'file-cap', 'file-drift', 'file-replaced', 'file-shape', 'final-HEAD-drift', 'final-held-Source-drift', 'final-physical-Source-drift', 'first-entry', 'fixed-preparation-selection', 'fresh-data-output-required', 'fresh-data-