              for builtin in (OSError,BlockingIOError,ChildProcessError,ConnectionError,BrokenPipeError,ConnectionAbortedError,ConnectionRefusedError,ConnectionResetError,FileExistsError,FileNotFoundError,InterruptedError,IsADirectoryError,NotADirectoryError,PermissionError,ProcessLookupError,TimeoutError):
                  if kind is builtin:
                      return 'OSError'
              return 'UNKNOWN'
          def validate_diagnostic(value):
              if type(value) is not dict or len(value) != 5 or any(type(key) is not str for key in value) or set(value) != {'schema_version','stage','operation','exception_type','refusal_code'}:
                  return None
              if type(value['schema_version']) is not int or value['schema_version'] != 1:
                  return None
              if any(type(value[key]) is not str for key in ('stage','operation','exception_type','refusal_code')):
                  return None
              if any(not 0 < len(value[key]) <= 160 for key in ('stage','operation','exception_type','refusal_code')):
                  return None
              if value['stage'] not in DIAGNOSTIC_STAGES or value['operation'] not in DIAGNOSTIC_STAGES[value['stage']] or value['exception_type'] not in DIAGNOSTIC_TYPES or value['refusal_code'] not in DIAGNOSTIC_CODES:
                  return None
              if value['operation'] in DOWNLOAD_OPERATIONS:
                  if value['stage'] != 'pipeline' or value['refusal_code'] not in DOWNLOAD_CODE_TYPES or value['exception_type'] != DOWNLOAD_CODE_TYPES[value['refusal_code']]:
                      return None
              elif value['refusal_code'] in DOWNLOAD_CODES:
                  return None
              if value['stage'] == 'WORKFLOW_ARGUMENT_DECODE' and value['refusal_code'] not in WORKFLOW_CODES | {'UNKNOWN'}:
                  return None
              return {key:value[key] for key in ('schema_version','stage','operation','exception_type','refusal_code')}
          def attach_workflow_decode(error):
              try:
                  flags = exception_state(error)
                  if type(flags) is not dict or not all(type(key) is str for key in flags) or validate_diagnostic(flags.get('nativeci_diagnostic')) is not None:
                      return
                  code = 'UNKNOWN'
                  args = BaseException.__dict__['args'].__get__(error)
                  if type(error) is ValueError and type(args) is tuple and len(args) == 1 and type(args[0]) is str and args[0] in WORKFLOW_CODES:
                      code = args[0]
                  flags['nativeci_diagnostic'] = {'schema_version':1,'stage':'WORKFLOW_ARGUMENT_DECODE','operation':'bootstrap.unpack','exception_type':exception_kind(error),'refusal_code':code}
