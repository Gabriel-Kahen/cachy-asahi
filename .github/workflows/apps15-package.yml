name: Apps15 source and disposable package checks
on:
  pull_request:
    paths:
      - 'packages/tools/cachy-asahi-apps15/**'
      - 'packages/tools/cachy-asahi-repository-runtime/**'
      - 'packages/tools/cachy-asahi-repository-client-v2/**'
      - 'scripts/client/client.py'
      - 'scripts/release/**'
      - 'scripts/checks/package_checks.py'
      - 'scripts/ci/apps15-package/**'
      - '.github/actions/apps-package-source/action.yml'
      - '.github/workflows/apps15-package.yml'
      - 'LICENSE'
  push:
    branches: [main, codex/virtual-integration]
    tags: ['**']
    paths:
      - 'packages/tools/cachy-asahi-apps15/**'
      - 'packages/tools/cachy-asahi-repository-runtime/**'
      - 'packages/tools/cachy-asahi-repository-client-v2/**'
      - 'scripts/client/client.py'
      - 'scripts/release/**'
      - 'scripts/checks/package_checks.py'
      - 'scripts/ci/apps15-package/**'
      - '.github/actions/apps-package-source/action.yml'
      - '.github/workflows/apps15-package.yml'
      - 'LICENSE'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check out the exact public Apps15 recipe42
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 308c63abacc2435aeebb74f988f7a1f362b5b942
          path: .ci-fixtures/apps15-recipe
          persist-credentials: false
      - uses: ./.github/actions/apps-package-source
        id: apps-source
        with:
          revision: '15'
          install-tools: 'true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Finite helper routing, ordered85 gate and source refusals
        env:
          APPS_PACKAGE_SOURCE: ${{ steps.apps-source.outputs.path }}
        run: python3 -I -B -Werror::ResourceWarning scripts/ci/apps15-package/test_check.py --repository-source "$APPS_PACKAGE_SOURCE" --expected-source "$GITHUB_WORKSPACE/.ci-fixtures/apps15-recipe"
      - name: Exact sources, canonical helpers, makepkg links and complete85 tests
        env:
          APPS_PACKAGE_SOURCE: ${{ steps.apps-source.outputs.path }}
        run: |
          python3 -I -B scripts/ci/apps15-package/check.py --help
          python3 -I -B -Werror::ResourceWarning scripts/ci/apps15-package/check.py --repository-source "$APPS_PACKAGE_SOURCE" --expected-source "$GITHUB_WORKSPACE/.ci-fixtures/apps15-recipe" --output "$RUNNER_TEMP/apps15-package-check"
