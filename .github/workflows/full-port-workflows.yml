name: Full port component workflows
on:
  pull_request:
    paths:
      - 'scripts/platform/**'
      - 'scripts/checks/package_checks.py'
      - 'scripts/release/**'
      - 'scripts/client/client.py'
      - 'scripts/build/**'
      - 'scripts/experiments/**'
      - 'packages/experiments/**'
      - 'scripts/ci/desktop574_guest.py'
      - 'scripts/ci/welcome-managed-gui/**'
      - 'scripts/integration/desktop.py'
      - 'scripts/virtual/**'
      - 'scripts/maintenance/source_cache.py'
      - 'packages/tools/cachy-asahi-maintenance/**'
      - 'packages/tools/cachy-asahi-session-diagnostics/**'
      - 'scripts/update/archive_stream.py'
      - 'scripts/virtual/owned_process.py'
      - 'scripts/workflows/**'
      - 'tests/workflows/**'
      - '.github/workflows/full-port-workflows.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/platform/**'
      - 'scripts/checks/package_checks.py'
      - 'scripts/release/**'
      - 'scripts/client/client.py'
      - 'scripts/build/**'
      - 'scripts/experiments/**'
      - 'packages/experiments/**'
      - 'scripts/ci/desktop574_guest.py'
      - 'scripts/ci/welcome-managed-gui/**'
      - 'scripts/integration/desktop.py'
      - 'scripts/virtual/**'
      - 'scripts/maintenance/source_cache.py'
      - 'packages/tools/cachy-asahi-maintenance/**'
      - 'packages/tools/cachy-asahi-session-diagnostics/**'
      - 'scripts/update/archive_stream.py'
      - 'scripts/virtual/owned_process.py'
      - 'scripts/workflows/**'
      - 'tests/workflows/**'
      - '.github/workflows/full-port-workflows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
        component: [image, signed-intake, signed-image, sbom, source-mirror, source-mirror-update, desktop, app-runtime, app-inputs, python, python-extension, build-systems, pgo-source, app-window, mirror-builder]
    steps:
      - name: Checkout complete canonical component closure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/platform/
            /scripts/checks/package_checks.py
            /scripts/release/
            /scripts/client/client.py
            /scripts/build/
            /scripts/experiments/
            /packages/experiments/
            /scripts/ci/desktop574_guest.py
            /scripts/ci/welcome-managed-gui/
            /scripts/integration/desktop.py
            /scripts/virtual/
            /scripts/maintenance/source_cache.py
            /packages/tools/cachy-asahi-maintenance/
            /packages/tools/cachy-asahi-session-diagnostics/
            /scripts/update/archive_stream.py
            /scripts/virtual/owned_process.py
            /scripts/workflows/
            /tests/workflows/
            /LICENSE
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install Lua for window protocol model controls
        if: matrix.component == 'app-window'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.4
          lua -v
      - name: Run exact focused component suite
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          case "$COMPONENT" in
            image) suite=scripts/platform/test_release_image.py ;;
            signed-intake) suite=scripts/platform/test_signed_archive_intake.py ;;
            signed-image) suite=scripts/platform/test_release_image_signed.py ;;
            sbom) suite=scripts/release/test_release_sbom.py ;;
            source-mirror) suite=scripts/release/test_release_source_mirror.py ;;
            source-mirror-update) suite=scripts/release/test_release_source_mirror_incremental.py ;;
            app-inputs) suite=scripts/workflows/test_desktop_application_inputs.py ;;
            python-extension) suite=tests/workflows/test_python_extension.py ;;
            app-runtime) suite=scripts/workflows/test_desktop_application_runtime.py ;;
            pgo-source) suite=scripts/experiments/test_zlib_pgo102.py ;;
            app-window) suite=scripts/workflows/test_desktop_application_window_lifecycle.py ;;
            mirror-builder) suite=scripts/build/test_mirror_consumer.py ;;
            python) suite=tests/workflows/test_python_development.py ;;
            desktop) suite=scripts/workflows/test_desktop_applications.py ;;
            build-systems) suite=tests/workflows/test_developer_build_systems.py ;;
            *) exit 2 ;;
          esac
          python -B -S -Werror::ResourceWarning "$suite"
      - name: Install hosted build-system prerequisites
        if: matrix.component == 'build-systems' || matrix.component == 'python-extension'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake meson ninja-build build-essential
      - name: Run both standalone real build-system journeys
        if: matrix.component == 'build-systems'
        env:
          RESULT: ${{ runner.temp }}/full-port-build-systems
        run: |
          python -I -B -Werror::ResourceWarning scripts/workflows/developer_build_systems.py \
            --output "$RESULT" --tool-path /usr/bin:/bin --command-timeout 45 --total-timeout 300
          python -I -B - "$RESULT" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          report = json.loads((root / 'result.json').read_bytes())
          assert report['status'] == 'PASS_AVAILABLE_LOCAL_WORKFLOWS'
          assert set(report['project_workflows']) == {'cmake', 'meson'}
          assert set(report['tools']) == {'cmake', 'ctest', 'meson', 'ninja', 'cc', 'c++'}
          assert all(row['status'] == 'PRESENT' for row in report['tools'].values())
          for backend, row in report['project_workflows'].items():
              assert row['status'] == 'PASS_REAL_PROJECT_WORKFLOW', (backend, row)
              assert row['unchanged'] == 'NO_OBJECT_LIBRARY_BINARY_WRITES'
              assert row['compile_failure'] == 'REAL_NONZERO_STALE_EXECUTION_REFUSED'
              assert row['test_failure'] == 'REAL_NONZERO_EXECUTION_REVOKED'
              assert row['installed'] == 'PASS_PRIVATE_PREFIX_RUNTIME'
          assert len(report['commands']) == 48
          for row in report['commands']:
              supervision = row['supervision']
              assert row['success'] is True, row
              assert supervision['reaped'] is True and supervision['ownership'] == 'REAPED'
              assert supervision['group_census'] == 'EMPTY_TWICE' and supervision['output_complete'] is True
              assert supervision['timeout'] is False and supervision['signals'] == []
              assert supervision['error'] is None
              expected, actual = row['expected'], supervision['exit']
              assert (type(actual) is int and actual > 0) if expected == 'nonzero' else actual == expected
              raw = (root / row['log']).read_bytes()
              assert len(raw) == row['log_pin']['bytes']
              assert hashlib.sha256(raw).hexdigest() == row['log_pin']['sha256']
          print('PASS: both real component journeys and all 48 expected command/retirement/log joins')
          PY
      - name: Run real compiled Python project and private installs
        if: matrix.component == 'python-extension'
        run: |
          python -I -B -Werror::ResourceWarning scripts/workflows/python_extension.py \
            --python "$(command -v python)" --cmake /usr/bin/cmake --ctest /usr/bin/ctest \
            --ninja /usr/bin/ninja --cc /usr/bin/cc --output "$RUNNER_TEMP/python-extension" \
            --command-timeout 45 --total-timeout 300
          python -I -B - "$RUNNER_TEMP/python-extension/result.json" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_bytes())
          assert result['status'] == 'PASS_LOCAL_COMPILED_PYTHON_WORKFLOW'
          assert len(result['commands']) == 31
          for command in result['commands']:
              state = command['supervision']
              assert command['success'] is True
              assert state['reaped'] is True and state['ownership'] == 'REAPED'
              assert state['group_census'] == 'EMPTY_TWICE' and state['output_complete'] is True
              assert state['timeout'] is False and state['signals'] == [] and state['error'] is None
          print('PASS real compiled Python journey and all 31 command retirements')
          PY
