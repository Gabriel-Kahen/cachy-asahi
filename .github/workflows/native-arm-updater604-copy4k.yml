{
  "name": "native-arm-updater604-copy4k",
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "updater604-copy4k-${{ inputs.source }}-${{ inputs.case }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "native": {
      "if": "github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false",
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 350,
      "env": {
        "SOURCE_COMMIT": "a79c4ca92486854f9edb639cd970d2c90fda4b12",
        "INPUTS_SHA256": "${{ inputs.inputs_sha256 }}",
        "RECIPES_SHA256": "${{ inputs.recipes_sha256 }}",
        "RETRY_MODE": "${{ inputs.mode }}",
        "REQUESTED_INTEGRATION_SHA256": "${{ inputs.integration_sha256 }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "a79c4ca92486854f9edb639cd970d2c90fda4b12",
            "persist-credentials": false
          },
          "name": "Checkout exact original native ARM builder"
        },
        {
          "name": "Checkout whole fixed updater implementation489",
