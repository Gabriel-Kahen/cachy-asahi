          "shell": "bash",
          "env": {
            "IMPLEMENTATION_SOURCE": "${{ inputs.source }}",
            "WORKFLOW_SOURCE": "${{ github.sha }}",
            "UPGRADE_CASE": "${{ inputs.case }}"
          },
          "run": "set -euo pipefail\nprintf '%s  %s\\n' '953a16e65e07b350be02ea8c0c1ed89567c5e614e0ff98162682e91cc0443bb7' 'native4k-source/entry.py' | sha256sum --check\ntest \"$(sha256sum expanded604-upgrade/scripts/ci/expanded604-apps6-public-pair-updater/run.py | cut -d ' ' -f 1)\" = ed05eaf1c6263ed5ce1dc2e97c863021c03d232cc5ad3554ab681aa4866993fe\ntest \"$(sha256sum expanded604-upgrade/scripts/ci/expanded604-apps6-public-pair-updater/source-manifest.json | cut -d ' ' -f 1)\" = ec9a759bbb5be161a0a77c2983e731c3b09e71b33688a2ecdf54abce9d1ba41b\ntest \"$(sha256sum expanded604-upgrade/scripts/ci/current604-public-pair-updater16k/job.py | cut -d ' ' -f 1)\" = 47c560fdc227a0b41e2cca9e1797b55adce2b35bb080d950d8ee1d1993c86c13\ntest \"$(sha256sum expanded604-upgrade/scripts/ci/current604-public-pair-updater16k/wiring-source-manifest.json | cut -d ' ' -f 1)\" = b1519c84860d72883acb39649d61598ca94f68c11f0d8612f8f8665bfcae984f\npython3 -I -B native4k-source/entry.py preflight \\\n  --implementation \"$GITHUB_WORKSPACE/expanded604-upgrade\" --source \"$IMPLEMENTATION_SOURCE\" \\\n  --workflow-sha \"$WORKFLOW_SOURCE\" --case \"$UPGRADE_CASE\"\n"
        },
        {
          "name": "Checkout Root accepted signed604 producer source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.installer_source }}",
            "path": "expanded604-installer",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout Root actual prerequisite decisions",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.decision_source }}",
            "path": "expanded604-decisions",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout the exact accepted587 code for this case",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.upgrader_source }}",
            "path": "expanded604-upgrader-source",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout the genuine accepted Setup5 pair",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.setup_source }}",
            "path": "expanded604-setup5",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout the fixed old helper and setup3 baseline",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.legacy_source }}",
            "path": "expanded604-legacy",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout unchanged original seven-pair input root",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.seven_source }}",
            "path": "expanded604-seven",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout the Root-bound accepted eight-pair input root",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.eight_source }}",
            "path": "expanded604-eight",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout the accepted four management package carrier",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.management_source }}",
            "path": "expanded604-management-source",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout the accepted Welcome2 carrier",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.welcome_source }}",
            "path": "expanded604-welcome-source",
            "persist-credentials": false
          }
        },
