          "with": {
            "ref": "${{ steps.root_policy.outputs.fresh600_decisions }}",
            "path": "expanded604-fresh600-decisions",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout the accepted native604 decision carrier",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.native604_decisions }}",
            "path": "expanded604-native604-decisions",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout all three exact accepted Apps6 updater decisions",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.updater_decisions }}",
            "path": "apps6-updater-decisions",
            "persist-credentials": false
          }
        },
        {
          "name": "Provision host ext4 test tools on disposable runner",
          "timeout-minutes": 9,
          "shell": "bash",
          "run": "set -euo pipefail\ntimeout --kill-after=10s 180s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 update -qq\ntimeout --kill-after=10s 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 install -y --no-install-recommends e2fsprogs\ncommand -v mkfs.ext4\ncommand -v debugfs\ndpkg-query -W e2fsprogs\n"
        },
