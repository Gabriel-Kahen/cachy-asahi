          "with": {
            "ref": "${{ steps.root_policy.outputs.apps6_source }}",
            "path": "apps6-inputs",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout exact apps6_authority_source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.apps6_authority_source }}",
            "path": "apps6-authority",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout exact baseline_source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.baseline_source }}",
            "path": "apps5-baseline",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout exact baseline_decisions_source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ steps.root_policy.outputs.baseline_decisions_source }}",
            "path": "apps5-baseline-decisions",
            "persist-credentials": false
          }
        },
        {
          "name": "Retrieve only the six original pinned audio inputs",
          "id": "audio_inputs",
          "if": "${{ !cancelled() && steps.root_decisions.outcome == 'success' }}",
          "shell": "bash",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\npython3 -B expanded604-legacy/scripts/ci/full-development-composition/retrieve_audio.py --output \"$RUNNER_TEMP/audio-archives\"\n"
        },
        {
          "name": "Verify all actual decisions and immutable inputs before secrets",
          "id": "root_inputs",
          "if": "${{ !cancelled() && steps.audio_inputs.outcome == 'success' }}",
          "shell": "bash",
          "env": {
            "IMPLEMENTATION_SOURCE": "${{ inputs.source }}",
            "WORKFLOW_SOURCE": "${{ github.sha }}",
            "UPGRADE_CASE": "${{ inputs.case }}"
          },
          "run": "set -euo pipefail\npython3 -I -B native4k-source/entry.py inputs \\\n  --implementation \"$GITHUB_WORKSPACE/expanded604-upgrade\" --source \"$IMPLEMENTATION_SOURCE\" \\\n  --workflow-sha \"$WORKFLOW_SOURCE\" --updater-decisions \"$GITHUB_WORKSPACE/apps6-updater-decisions\" --case \"$UPGRADE_CASE\" \\\n  --installer-source \"$GITHUB_WORKSPACE/expanded604-installer\" \\\n  --decision-source \"$GITHUB_WORKSPACE/expanded604-decisions\" \\\n  --upgrader-source \"$GITHUB_WORKSPACE/expanded604-upgrader-source\" \\\n  --legacy-source \"$GITHUB_WORKSPACE/expanded604-legacy\" \\\n  --seven-source \"$GITHUB_WORKSPACE/expanded604-seven\" --eight-source \"$GITHUB_WORKSPACE/expanded604-eight\" \\\n  --setup-source \"$GITHUB_WORKSPACE/expanded604-setup5\" \\\n  --management-source \"$GITHUB_WORKSPACE/expanded604-management-source/payload\" \\\n  --welcome-source \"$GITHUB_WORKSPACE/expanded604-welcome-source/payload\" \\\n  --fresh600-decisions \"$GITHUB_WORKSPACE/expanded604-fresh600-decisions\" \\\n  --native604-decisions \"$GITHUB_WORKSPACE/expanded604-native604-decisions\" \\\n  --apps6-source \"$GITHUB_WORKSPACE/apps6-inputs/payload\" --apps6-authority-source \"$GITHUB_WORKSPACE/apps6-authority\" --baseline-source \"$GITHUB_WORKSPACE/apps5-baseline\" --baseline-decisions-source \"$GITHUB_WORKSPACE/apps5-baseline-decisions\" \\\n  --audio-inputs \"$RUNNER_TEMP/audio-archives\"\n"
        },
        {
          "name": "Seed the six frozen private cache objects before native work",
          "if": "inputs.mode == 'build' && steps.root_inputs.outcome == 'success'",
          "shell": "bash",
          "env": {
            "CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01": "${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}",
            "CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02": "${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}",
            "CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01": "${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}",
            "CACHY_OLD_FOUR_SCHEMA": "1",
            "CACHY_OLD_FOUR_SOURCE_EPOCH": "1791748800",
            "CACHY_OLD_FOUR_JBIGKIT_01": "${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}",
            "CACHY_OLD_FOUR_JBIGKIT_02": "${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}",
            "CACHY_OLD_FOUR_JBIGKIT_SIG_01": "${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}",
            "CACHY_OLD_FOUR_LIBTIFF_01": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}",
            "CACHY_OLD_FOUR_LIBTIFF_02": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}",
            "CACHY_OLD_FOUR_LIBTIFF_03": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}",
            "CACHY_OLD_FOUR_LIBTIFF_04": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}",
            "CACHY_OLD_FOUR_LIBTIFF_05": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}",
            "CACHY_OLD_FOUR_LIBTIFF_06": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}",
            "CACHY_OLD_FOUR_LIBTIFF_07": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}",
            "CACHY_OLD_FOUR_LIBTIFF_08": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}",
            "CACHY_OLD_FOUR_LIBTIFF_09": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}",
            "CACHY_OLD_FOUR_LIBTIFF_10": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}",
            "CACHY_OLD_FOUR_LIBTIFF_11": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}",
            "CACHY_OLD_FOUR_LIBTIFF_12": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}",
            "CACHY_OLD_FOUR_LIBTIFF_13": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}",
            "CACHY_OLD_FOUR_LIBTIFF_14": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}",
            "CACHY_OLD_FOUR_LIBTIFF_15": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}",
            "CACHY_OLD_FOUR_LIBTIFF_SIG_01": "${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}"
          },
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$SOURCE_COMMIT\"\ntest \"$INPUTS_SHA256\" = beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f\ntimeout --signal=TERM --kill-after=5s 75s python3 -B - <<'PYSEED'\nimport hashlib\nimport os\nfrom pathlib import Path\nimport sys\nsys.path.insert(0, 'scripts/ci')\nfrom old_four_seed import (OLD_FOUR_PRIVATE_ROWS, RETAINED_BUBBLEWRAP_PRIVATE_ROWS,\n                           seed_current_build_cache)\npin = 'beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f'\nif hashlib.sha256(Path('scripts/ci/inputs.lock.json').read_bytes()).hexdigest() != pin:\n    raise SystemExit('private-cache-input-binding-refused')\nnames = {'CACHY_OLD_FOUR_' + f'{tag}_{i:02d}'\n         for _, _, _, tag, count in OLD_FOUR_PRIVATE_ROWS for i in range(1, count + 1)}\nretained = {'CACHY_RETAINED_BUBBLEWRAP_V1_' + f'{tag}_{i:02d}'\n            for _, _, _, tag, sizes in RETAINED_BUBBLEWRAP_PRIVATE_ROWS\n            for i in range(1, len(sizes) + 1)}\nnames |= retained\nif len(names) != 22 or len(retained) != 3 or not all(os.environ.get(name) for name in names):\n    raise SystemExit('private-cache-required-secrets-missing')\ncache = Path(os.environ['RUNNER_TEMP']) / 'alarm-cache'\ncache.mkdir(mode=0o700)\nkeep = names | {'CACHY_OLD_FOUR_SCHEMA', 'CACHY_OLD_FOUR_SOURCE_EPOCH'}\nfor name in tuple(os.environ):\n    if name not in keep:\n        os.environ.pop(name)\nseed_current_build_cache(cache, pin)\nPYSEED\n"
        },
        {
          "name": "Checkout exact retained public input source",
          "if": "inputs.mode == 'build' && steps.root_inputs.outcome == 'success'",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd",
            "path": "retained-public-inputs",
            "persist-credentials": false
          }
        },
        {
          "name": "Seed fourteen exact public ARM input files",
          "if": "inputs.mode == 'build' && steps.root_inputs.outcome == 'success'",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git -C \"$GITHUB_WORKSPACE/retained-public-inputs\" rev-parse HEAD)\" = 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd\ntest \"$(sha256sum retained-public-inputs/seed.py | cut -d ' ' -f 1)\" = a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3\ntest \"$(sha256sum retained-public-inputs/index.json | cut -d ' ' -f 1)\" = a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300\nenv -i PATH=/usr/local/bin:/usr/bin:/bin HOME=\"$HOME\" LANG=C.UTF-8 TZ=UTC \\\n  TMPDIR=\"$RUNNER_TEMP\" \\\n  python3 -I -B \"$GITHUB_WORKSPACE/retained-public-inputs/seed.py\" \\\n    --cache \"$RUNNER_TEMP/alarm-cache\"\n"
        },
        {
          "name": "Checkout exact original574 archive lock before native base",
