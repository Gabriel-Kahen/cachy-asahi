name: Fish zero-APT XZ source DATA
on:
  pull_request:
    paths:
      - '.github/workflows/fish-no-host-apt-source.yml'
      - 'scripts/ci/fish-config02-native-source/successor_v4/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fish-no-host-apt-source.yml'
      - 'scripts/ci/fish-config02-native-source/successor_v4/**'
permissions:
  contents: read
jobs:
  source-data:
    name: Fish zero-APT XZ DATA (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Read immutable public Source48 for inverse and archive controls
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        timeout-minutes: 2
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 463377ba9c0b48c58dc112386c9b0203efd39b6e
          path: frozen-source48-checkout
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Export exact Source48 public files without Git metadata
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          ulimit -f 32768
          test "$(git -C frozen-source48-checkout rev-parse HEAD)" = 463377ba9c0b48c58dc112386c9b0203efd39b6e
          mkdir -m 700 "$RUNNER_TEMP/fish48-frozen-files"
          git -C frozen-source48-checkout -c tar.umask=0022 archive --format=tar \
            --output="$RUNNER_TEMP/fish48-frozen.tar" 463377ba9c0b48c58dc112386c9b0203efd39b6e
          tar --extract --file="$RUNNER_TEMP/fish48-frozen.tar" \
            --directory="$RUNNER_TEMP/fish48-frozen-files" --no-same-owner --no-same-permissions
      - name: Check all 21 XZ, inverse and existing-host controls without native actors
        shell: bash
        run: |
          set -euo pipefail
          export FISH48_SOURCE_ROOT="$RUNNER_TEMP/fish48-frozen-files"
          python3 -I -B -Werror::ResourceWarning scripts/ci/fish-config02-native-source/successor_v4/test_xz_data.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/fish-config02-native-source/successor_v4/test_prepare.py --base "$FISH48_SOURCE_ROOT"
          python3 -I -B -Werror::ResourceWarning scripts/ci/fish-config02-native-source/successor_v4/test_host_policy.py
