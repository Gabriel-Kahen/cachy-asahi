name: fresh607-producer-diagnostic-source
on:
  push:
    paths:
      - scripts/ci/fresh607-producer-diagnostic-source/**
      - .github/workflows/fresh607-producer-diagnostic-source.yml
  pull_request:
    paths:
      - scripts/ci/fresh607-producer-diagnostic-source/**
      - .github/workflows/fresh607-producer-diagnostic-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONWARNINGS: error
    steps:
      - name: Check out the maintained dedicated factory
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check out exact public1182 source input
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 9a67f3e507c57f68ece48c253cdade47648f970c
          path: .ci-fixtures/producer-parent1182
          persist-credentials: false
      - name: Check out exact public1185 expected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 2235c1d3c3b3de6d8a2ff30f66c5fd0df56c2ef6
          path: .ci-fixtures/producer-expected1185
          persist-credentials: false
      - name: Select the explicit Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Reproduce whole1185 source and refuse altered inputs
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/producer-diagnostic.XXXXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          mkdir -m700 "$stage/input" "$stage/expected"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/producer-parent1182" archive --format=tar 9a67f3e507c57f68ece48c253cdade47648f970c | tar -x -C "$stage/input"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/producer-expected1185" archive --format=tar 2235c1d3c3b3de6d8a2ff30f66c5fd0df56c2ef6 | tar -x -C "$stage/expected"
          export FRESH607_DIAGNOSTIC_INPUT="$stage/input"
          export FRESH607_DIAGNOSTIC_EXPECTED="$stage/expected"
          python3 -I -B -Werror scripts/ci/fresh607-producer-diagnostic-source/test_source.py
          python3 -I -B -Werror scripts/ci/fresh607-producer-diagnostic-source/test_runtime.py
          python3 -I -B -Werror scripts/ci/fresh607-producer-diagnostic-source/prepare.py --help
