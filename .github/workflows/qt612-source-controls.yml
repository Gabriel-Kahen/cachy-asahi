name: Qt612 source controls

on:
  pull_request:
    paths:
      - 'scripts/ci/qt612-source-controls/**'
      - 'packages/port/qt612-source-reference/**'
      - 'packages/port/qt612-gui-source-reference/**'
      - 'scripts/ci/qt612-reference-artifact-transport/**'
      - '.github/workflows/qt612-source-controls.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/qt612-source-controls/**'
      - 'packages/port/qt612-source-reference/**'
      - 'packages/port/qt612-gui-source-reference/**'
      - 'scripts/ci/qt612-reference-artifact-transport/**'
      - '.github/workflows/qt612-source-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  TZ: UTC

jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.13', '3.14.6']
    steps:
      - name: Check out source controls and frozen families
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Run bounded source controls
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          ulimit -v 524288
          timeout --signal=TERM --kill-after=5s 180s \
            python -I -B -Werror::ResourceWarning scripts/ci/qt612-source-controls/ci.py \
              --workspace "$GITHUB_WORKSPACE" \
              --report "$RUNNER_TEMP/qt612-source-controls.json"
# ci.py prints its bounded source-only summary. The JSON report stays local to
# this job: no upload, package build, Qt configure, native actor or dispatch.
