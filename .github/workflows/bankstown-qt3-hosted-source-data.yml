name: Bankstown Qt3 hosted Source DATA
on:
  pull_request:
    paths:
      - '.github/workflows/bankstown-qt3-hosted-source-data.yml'
      - '.github/workflows/native-arm-bankstown-qt3-hosted-v1.yml'
      - 'scripts/ci/bankstown-qt3-hosted-v1/**'
      - 'scripts/ci/bankstown-qt3-hosted-reader-v1/**'
      - 'scripts/ci/bankstown-qt3-native-source/**'
      - 'scripts/ci/bankstown-qt3-native-profile-v1/**'
      - 'scripts/port/bankstown-qt3-native-v1/**'
      - 'scripts/ci/first-login-enrollment-native-source/payload/native/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bankstown-qt3-hosted-source-data.yml'
      - '.github/workflows/native-arm-bankstown-qt3-hosted-v1.yml'
      - 'scripts/ci/bankstown-qt3-hosted-v1/**'
      - 'scripts/ci/bankstown-qt3-hosted-reader-v1/**'
      - 'scripts/ci/bankstown-qt3-native-source/**'
      - 'scripts/ci/bankstown-qt3-native-profile-v1/**'
      - 'scripts/port/bankstown-qt3-native-v1/**'
      - 'scripts/ci/first-login-enrollment-native-source/payload/native/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    name: Hosted audio DATA (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.12'
          - '3.14'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TMPDIR: ${{ runner.temp }}/bankstown-qt3-hosted-data-${{ matrix.python }}
    steps:
      - name: Create private DATA scratch
        run: mkdir -m 700 "$TMPDIR"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check bounded hosted producer controls
        run: |
          ulimit -v 524288
          python3 -I -B -Werror scripts/ci/bankstown-qt3-hosted-v1/test_hosted.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-hosted-v1/test_inputs.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-hosted-v1/test_prepare.py
      - name: Check portable thin Reader composition controls
        run: |
          ulimit -v 524288
          python3 -I -B -Werror scripts/ci/bankstown-qt3-hosted-reader-v1/test_inputs.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-hosted-reader-v1/test_result.py
      # Root-selected immutable Source78 CID: NULL. No placeholder checkout/ref.
      # After actual publication/selection, a separately reviewed files-only
      # export must enable producer Genuine(1) and Reader GenuineSource78(10).
      # Fixed Source78 itself lacks the native dispatch workflow; DATA controls
      # do not register a workflow ID, grant authority or enable native actors.
      - name: Report configured coverage and pending immutable Source selection
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Configured per Python: producer 18 hosted +13 inputs +13 prepare controls
          (12 portable prepare +1 explicit optional genuine-Source72 skip),
          plus 11 Reader input +12 Reader result controls.

          Expected successful default run: 66 PASS, 1 SKIP per Python.
          Root-selected immutable Source78 CID is NULL: 10 genuine Source78 Reader
          controls and the genuine producer check remain pending publication and
          explicit immutable checkout registration. No synthetic fixture/CID is used.
          Source78 native dispatch remains HELD because its fixed tree omits the
          workflow leaf; complete773 custody and all native acceptance remain unbound.
          SUMMARY
