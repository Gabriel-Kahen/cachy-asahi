name: Bankstown Qt3 hosted Source DATA
on:
  pull_request:
    paths:
      - '.github/workflows/bankstown-qt3-hosted-source-data.yml'
      - '.github/workflows/native-arm-bankstown-qt3-hosted-v1.yml'
      - 'scripts/ci/bankstown-qt3-hosted-v1/**'
      - 'scripts/ci/bankstown-qt3-hosted-reader-v1/**'
      - 'scripts/ci/bankstown-qt3-native-source/**'
      - 'scripts/ci/bankstown-qt3-native-profile-v1/**'
      - 'scripts/port/bankstown-qt3-native-v1/**'
      - 'scripts/ci/first-login-enrollment-native-source/payload/native/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bankstown-qt3-hosted-source-data.yml'
      - '.github/workflows/native-arm-bankstown-qt3-hosted-v1.yml'
      - 'scripts/ci/bankstown-qt3-hosted-v1/**'
      - 'scripts/ci/bankstown-qt3-hosted-reader-v1/**'
      - 'scripts/ci/bankstown-qt3-native-source/**'
      - 'scripts/ci/bankstown-qt3-native-profile-v1/**'
      - 'scripts/port/bankstown-qt3-native-v1/**'
      - 'scripts/ci/first-login-enrollment-native-source/payload/native/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    name: Hosted audio DATA (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.12'
          - '3.14'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TMPDIR: ${{ runner.temp }}/bankstown-qt3-hosted-data-${{ matrix.python }}
    steps:
      - name: Create private DATA scratch
        run: mkdir -m 700 "$TMPDIR"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check bounded hosted producer controls
        run: |
          ulimit -v 524288
          python3 -I -B -Werror scripts/ci/bankstown-qt3-hosted-v1/test_hosted.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-hosted-v1/test_inputs.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-hosted-v1/test_prepare.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-hosted-v1/test_prepare_dispatch.py
      - name: Check portable thin Reader composition controls
        run: |
          ulimit -v 524288
          python3 -I -B -Werror scripts/ci/bankstown-qt3-hosted-reader-v1/test_inputs.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-hosted-reader-v1/test_result.py
      # Root-selected immutable dispatch Source CID: NULL. No placeholder ref.
      # Manual bankstown-qt3-source79-genuine-data.yml requires an actual CID.
      # After publication/selection, its files-only export and exact inverse
      # exercise genuine Source79 and preserved Source78 Reader controls.
      # Source79 includes the exact workflow; Source78 remains immutable/held.
      # Neither DATA generation registers an ID, grants authority or runs actors.
      - name: Report configured coverage and pending immutable Source selection
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Configured per Python: producer 18 hosted +13 inputs +13 prepare controls,
          plus 10 dispatch-constructor controls and 11+12 portable Reader controls.

          Expected successful default run: 75 PASS, 2 SKIP per Python.
          Genuine fixtures remain pending an actual immutable Source CID.
          The separate manual Source79 genuine DATA workflow requires that CID
          before its Source79 wrapper, Source78 inverse and constructor checks.
          It has no default Source identity; no synthetic fixture/CID is used.
          Source79 contains the exact dispatch workflow and preserves Source78 via
          full inverse. Source78 itself remains held; Source79 qualification,
          complete773 custody and all native authority/acceptance remain separate.
          SUMMARY
