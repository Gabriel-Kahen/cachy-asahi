name: Platform namespace policy hosted DATA controls
on:
  pull_request:
    paths:
      - 'scripts/ci/platform-namespace-policy-matrix-source/**'
      - '.github/workflows/platform-namespace-policy-host-data.yml'
      - '.github/workflows/platform-namespace-policy-source-proposal.yml'
  push:
    paths:
      - 'scripts/ci/platform-namespace-policy-matrix-source/**'
      - '.github/workflows/platform-namespace-policy-host-data.yml'
      - '.github/workflows/platform-namespace-policy-source-proposal.yml'
permissions:
  contents: read
jobs:
  owner-protocol-and-source-join:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HISTORICAL_PARENT: 05df8c71ea2bcb525bb1cfbc59983452062a1e97
      EXPECTED_PARENT: 639e3f9b5176bf8ebe497fc0b247182af90904e7
      EXPECTED_PARENT_TREE: 7e66e27a352cee19a3d022d8c167c43b9ab72804
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Checkout current commit with held historical Source199 bodies
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 639e3f9b5176bf8ebe497fc0b247182af90904e7
          path: .ci-fixtures/platform-policy-parent05df
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Exact twelve portable owner protocol DATA controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          factory="$GITHUB_WORKSPACE/scripts/ci/platform-namespace-policy-matrix-source"
          basis="$GITHUB_WORKSPACE/.ci-fixtures/platform-policy-parent05df"
          test "$(git -C "$basis" rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(git -C "$basis" rev-parse HEAD^{tree})" = "$EXPECTED_PARENT_TREE"
          work=$(mktemp -d "$RUNNER_TEMP/platform-policy-host-data.XXXXXXXX")
          chmod 0700 "$work"
          printf 'PLATFORM_POLICY_HOST_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          python3 -I -B "$factory/tests/test_owner_data.py" \
            --basis "$basis" --result "$work/owner-data-results.json"
      - name: Source output directory permissions under portable umasks
        shell: bash
        run: |
          set -euo pipefail
          factory="$GITHUB_WORKSPACE/scripts/ci/platform-namespace-policy-matrix-source"
          python3 -I -B "$factory/tests/test_source_directories.py"
      - name: Verify historical and physical parent DATA bridge
        shell: bash
        run: |
          set -euo pipefail
          factory="$GITHUB_WORKSPACE/scripts/ci/platform-namespace-policy-matrix-source"
          python3 -I -B "$factory/tests/test_parent_bridge_data.py"
      - name: Original base5 fetch and package512 cache-only DATA controls
        shell: bash
        run: |
          set -euo pipefail
          factory="$GITHUB_WORKSPACE/scripts/ci/platform-namespace-policy-matrix-source"
          basis="$GITHUB_WORKSPACE/.ci-fixtures/platform-policy-parent05df"
          python3 -I -B "$factory/tests/test_bootstrap_base5_data.py" --basis "$basis"
      - name: Isolated source-owned guest startup DATA controls
        shell: bash
        run: |
          set -euo pipefail
          factory="$GITHUB_WORKSPACE/scripts/ci/platform-namespace-policy-matrix-source"
          python3 -I -B "$factory/tests/test_guest_startup_data.py"
      - name: Versioned Docker OOM default and matching-reader DATA controls
        shell: bash
        run: |
          set -euo pipefail
          factory="$GITHUB_WORKSPACE/scripts/ci/platform-namespace-policy-matrix-source"
          basis="$GITHUB_WORKSPACE/.ci-fixtures/platform-policy-parent05df"
          python3 -I -B "$factory/tests/test_host_config_default_data.py" --basis "$basis"
      - name: Phase-specific AppArmor and guest identity DATA controls
        shell: bash
        run: |
          set -euo pipefail
          factory="$GITHUB_WORKSPACE/scripts/ci/platform-namespace-policy-matrix-source"
          basis="$GITHUB_WORKSPACE/.ci-fixtures/platform-policy-parent05df"
          python3 -I -B "$factory/tests/test_apparmor_phase_data.py" --basis "$basis"
          python3 -I -B "$factory/tests/test_guest_identity_data.py"
      - name: Versioned supplementary group membership and raw-context DATA controls
        shell: bash
        run: |
          set -euo pipefail
          factory="$GITHUB_WORKSPACE/scripts/ci/platform-namespace-policy-matrix-source"
          basis="$GITHUB_WORKSPACE/.ci-fixtures/platform-policy-parent05df"
          python3 -I -B "$factory/tests/test_guest_group_membership_data.py" --basis "$basis"
      - name: Construct and independently join Source201 DATA only
        shell: bash
        run: |
          set -euo pipefail
          factory="$GITHUB_WORKSPACE/scripts/ci/platform-namespace-policy-matrix-source"
          basis="$GITHUB_WORKSPACE/.ci-fixtures/platform-policy-parent05df"
          python3 -I -B "$factory/prepare.py" \
            --basis "$basis" --overlay-root "$factory/payload" \
            --overlay-manifest "$factory/overlay-manifest.json" \
            --overlay-manifest-sha256 6b8e689777d222edd221f800b8e5f042d669cbf2e68a5f8e167b3233e96cdf66 \
            --output "$PLATFORM_POLICY_HOST_WORK/Source201"
          python3 -I -B "$factory/tests/check_constructed_source.py" "$PLATFORM_POLICY_HOST_WORK/Source201"
