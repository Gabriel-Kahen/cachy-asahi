name: client-state-binding-source-data
on:
  pull_request:
    paths:
      - '.github/workflows/client-state-binding-source.yml'
      - 'scripts/client/client_v3.py'
      - 'scripts/client/test_state_binding_v3.py'
      - 'scripts/client/fixtures/state-binding-before-v2.py.txt'
      - 'packages/tools/cachy-asahi-repository-client-v3/**'
      - 'packages/tools/cachy-asahi-repository-runtime/**'
      - 'docs/release/client.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-state-binding-source.yml'
      - 'scripts/client/client_v3.py'
      - 'scripts/client/test_state_binding_v3.py'
      - 'scripts/client/fixtures/state-binding-before-v2.py.txt'
      - 'packages/tools/cachy-asahi-repository-client-v3/**'
      - 'packages/tools/cachy-asahi-repository-runtime/**'
      - 'docs/release/client.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLIENT_V3_FROZEN_SHA: fe468313d92066fc97bbc6cad3fed029517d92d3
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check live v3 state and publication controls
        run: >-
          timeout --signal=TERM --kill-after=5s 60s
          python3 -I -B -Werror scripts/client/test_state_binding_v3.py
      - name: Check out the v3 source matching the frozen package bytes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: ${{ env.CLIENT_V3_FROZEN_SHA }}
          path: client-v3-frozen-source
          sparse-checkout: scripts/client
          persist-credentials: false
      - name: Check historical source, runtime dependency and seven-file DATA payload
        run: |
          set -euo pipefail
          ulimit -t 60 -v 1048576 -f 4096 -n 128
          frozen="$GITHUB_WORKSPACE/client-v3-frozen-source"
          test "$(git -C "$frozen" rev-parse HEAD)" = "$CLIENT_V3_FROZEN_SHA"
          recipe="$GITHUB_WORKSPACE/packages/tools/cachy-asahi-repository-client-v3"
          runtime="$GITHUB_WORKSPACE/packages/tools/cachy-asahi-repository-runtime"
          timeout --signal=TERM --kill-after=5s 60s python3 -I -B -Werror "$recipe/check_source.py" --canonical-root "$frozen" --runtime-recipe-root "$runtime"
          timeout --signal=TERM --kill-after=5s 60s python3 -I -B -Werror "$recipe/test_package.py" --canonical-root "$frozen" --runtime-recipe-root "$runtime"
