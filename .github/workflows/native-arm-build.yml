name: native-arm-offline-build-batch-v2
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA equal to both registered workflow aliases
        type: string
        required: true
      feature_code_sha:
        description: Exact reviewed canonical feature-code commit; no floating source or default
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-arm-offline-build-batch-v2
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      FEATURE_CODE_SHA: ${{ inputs.feature_code_sha }}
      SLICE: scripts/ci/offline-source-builder-native
      INPUTS_SHA256: beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
    steps:
      - name: Checkout the exact closed native trial source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Prove exact offline batch source and workflow aliases before secrets
        id: proof
        timeout-minutes: 2
        run: |
          set -euo pipefail
          set -o noclobber
          PHASE_LOGS="$RUNNER_TEMP/offline-build-batch-v2-phase-logs"
          mkdir -m700 "$PHASE_LOGS"
          set +e
          (
            set -euo pipefail
            printf '%s  %s\n' 'a01261cf46cd4a5b87ad5e6f93210932787a15793b5bbfba43e01d2d4cb8a637' "$SLICE/owner.py" 'f7dbae991686537ff5caebf10259988a7c2d210c0122ba3c440282a16b5d739e' "$SLICE/source-map.json" | sha256sum --check
            test "$INPUTS_SHA256" = beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
            printf '%s  %s\n' "$INPUTS_SHA256" scripts/ci/inputs.lock.json | sha256sum --check
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$FEATURE_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$FEATURE_CODE_SHA" = "53a76b00df09ce8072c65d967e3346e799a679b0"
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            test "$GITHUB_SHA" = "$SOURCE_SHA"
            test "$GITHUB_WORKFLOW_SHA" = "$SOURCE_SHA"
            cmp --silent .github/workflows/native-arm-build.yml .github/workflows/native-arm-offline-build-batch-v2.yml
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP/offline-source-home" LANG=C.UTF-8 TZ=UTC \
              RUNNER_TEMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 \
              SOURCE_SHA="$SOURCE_SHA" FEATURE_CODE_SHA="$FEATURE_CODE_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
              GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_OS="$RUNNER_OS" \
              ImageVersion="${ImageVersion:-}" ImageOS="${ImageOS:-}" \
              python3 -I -B "$SLICE/owner.py" proof \
              --source-root "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA" --feature-code-sha "$FEATURE_CODE_SHA" \
              --manifest-sha256 f7dbae991686537ff5caebf10259988a7c2d210c0122ba3c440282a16b5d739e --proof "$RUNNER_TEMP/offline-source-proof.json" \
              --work "$RUNNER_TEMP/offline-source-work" --cache "$RUNNER_TEMP/alarm-cache" \
              --public "$RUNNER_TEMP/offline-source-public"
          ) > "$PHASE_LOGS/proof.stdout" 2> "$PHASE_LOGS/proof.stderr"
          phase_status=$?
          set -e
          printf '%s\n' "$phase_status" > "$PHASE_LOGS/proof.exit-code"
          cat -- "$PHASE_LOGS/proof.stdout"
          cat -- "$PHASE_LOGS/proof.stderr" >&2
          exit "$phase_status"
      - name: Checkout the exact canonical feature-code commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ inputs.feature_code_sha }}
          path: source-feature-code
          persist-credentials: false
      - name: Bind the exact feature checkout and thirteen reviewed execution files before secrets
        id: feature-proof
        timeout-minutes: 2
        run: |
          set -euo pipefail
          set -o noclobber
          PHASE_LOGS="$RUNNER_TEMP/offline-build-batch-v2-phase-logs"
          test -d "$PHASE_LOGS"
          set +e
          (
            set -euo pipefail
            [[ "$FEATURE_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$FEATURE_CODE_SHA" = "53a76b00df09ce8072c65d967e3346e799a679b0"
            test -d "$GITHUB_WORKSPACE/source-feature-code/.git"
            test "$(git -C "$GITHUB_WORKSPACE/source-feature-code" rev-parse HEAD)" = "$FEATURE_CODE_SHA"
            test ! -e "$RUNNER_TEMP/offline-source-feature-code"
            test ! -L "$RUNNER_TEMP/offline-source-feature-code"
            mv -- "$GITHUB_WORKSPACE/source-feature-code" "$RUNNER_TEMP/offline-source-feature-code"
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP/offline-source-home" LANG=C.UTF-8 TZ=UTC \
              RUNNER_TEMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 \
              SOURCE_SHA="$SOURCE_SHA" FEATURE_CODE_SHA="$FEATURE_CODE_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
              GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_OS="$RUNNER_OS" \
              ImageVersion="${ImageVersion:-}" ImageOS="${ImageOS:-}" \
              python3 -I -B "$SLICE/owner.py" feature-proof \
              --source-root "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA" --feature-code-sha "$FEATURE_CODE_SHA" \
              --manifest-sha256 f7dbae991686537ff5caebf10259988a7c2d210c0122ba3c440282a16b5d739e --proof "$RUNNER_TEMP/offline-source-proof.json" \
              --work "$RUNNER_TEMP/offline-source-work" --cache "$RUNNER_TEMP/alarm-cache" \
              --public "$RUNNER_TEMP/offline-source-public"
          ) > "$PHASE_LOGS/feature-proof.stdout" 2> "$PHASE_LOGS/feature-proof.stderr"
          phase_status=$?
          set -e
          printf '%s\n' "$phase_status" > "$PHASE_LOGS/feature-proof.exit-code"
          cat -- "$PHASE_LOGS/feature-proof.stdout"
          cat -- "$PHASE_LOGS/feature-proof.stderr" >&2
          exit "$phase_status"
      - name: Run focused offline batch source and owner controls before secrets
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s "$SLICE" -p 'test_*.py'
      - name: Seed the six exact retained inputs using existing secrets only
        timeout-minutes: 2
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: |
          set -euo pipefail
          test "$INPUTS_SHA256" = beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
          printf '%s  %s\n' "$INPUTS_SHA256" scripts/ci/inputs.lock.json | sha256sum --check
          timeout --signal=TERM --kill-after=5s 75s python3 -B - <<'PYSEED'
          import hashlib
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts/ci')
          from old_four_seed import (OLD_FOUR_PRIVATE_ROWS, RETAINED_BUBBLEWRAP_PRIVATE_ROWS,
                                     seed_current_build_cache)
          pin = 'beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f'
          if hashlib.sha256(Path('scripts/ci/inputs.lock.json').read_bytes()).hexdigest() != pin:
              raise SystemExit('private-cache-input-binding-refused')
          names = {'CACHY_OLD_FOUR_' + f'{tag}_{i:02d}'
                   for _, _, _, tag, count in OLD_FOUR_PRIVATE_ROWS for i in range(1, count + 1)}
          retained = {'CACHY_RETAINED_BUBBLEWRAP_V1_' + f'{tag}_{i:02d}'
                      for _, _, _, tag, sizes in RETAINED_BUBBLEWRAP_PRIVATE_ROWS
                      for i in range(1, len(sizes) + 1)}
          names |= retained
          if len(names) != 22 or len(retained) != 3 or not all(os.environ.get(name) for name in names):
              raise SystemExit('private-cache-required-secrets-missing')
          cache = Path(os.environ['RUNNER_TEMP']) / 'alarm-cache'
          cache.mkdir(mode=0o700)
          keep = names | {'CACHY_OLD_FOUR_SCHEMA', 'CACHY_OLD_FOUR_SOURCE_EPOCH'}
          for name in tuple(os.environ):
              if name not in keep:
                  os.environ.pop(name)
          seed_current_build_cache(cache, pin)
          PYSEED
      - name: Checkout the exact fourteen public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: source-public14
          persist-credentials: false
      - name: Seed all fourteen exact public input files into the existing cache
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3' source-public14/seed.py 'a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300' source-public14/index.json | sha256sum --check
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP/offline-source-home" LANG=C.UTF-8 TZ=UTC TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 \
            python3 -I -B "$GITHUB_WORKSPACE/source-public14/seed.py" --cache "$RUNNER_TEMP/alarm-cache"
      - name: Checkout complete original retained package inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ddc6ca5f3478f9c607f8fae52661c451ae0bf3ad
          path: source-retained
          persist-credentials: false
      - name: Move the exact retained checkout to its separate runtime input path
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE/source-retained/.git"
          test ! -e "$RUNNER_TEMP/offline-source-retained"
          test ! -L "$RUNNER_TEMP/offline-source-retained"
          mv -- "$GITHUB_WORKSPACE/source-retained" "$RUNNER_TEMP/offline-source-retained"
      - name: Build fresh signed original341 environment for offline builds
        timeout-minutes: 40
        run: |
          set -euo pipefail
          set -o noclobber
          PHASE_LOGS="$RUNNER_TEMP/offline-build-batch-v2-phase-logs"
          test -d "$PHASE_LOGS"
          set +e
          (
            set -euo pipefail
            timeout --signal=TERM --kill-after=30s 2300s \
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP/offline-source-home" LANG=C.UTF-8 TZ=UTC \
              RUNNER_TEMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 \
              SOURCE_SHA="$SOURCE_SHA" FEATURE_CODE_SHA="$FEATURE_CODE_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
              GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_OS="$RUNNER_OS" \
              ImageVersion="${ImageVersion:-}" ImageOS="${ImageOS:-}" \
              python3 -I -B "$SLICE/owner.py" bootstrap \
              --source-root "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA" --feature-code-sha "$FEATURE_CODE_SHA" \
              --manifest-sha256 f7dbae991686537ff5caebf10259988a7c2d210c0122ba3c440282a16b5d739e --proof "$RUNNER_TEMP/offline-source-proof.json" \
              --work "$RUNNER_TEMP/offline-source-work" --cache "$RUNNER_TEMP/alarm-cache" \
              --public "$RUNNER_TEMP/offline-source-public" \
              --carrier "$RUNNER_TEMP/offline-source-retained" --execute
          ) > "$PHASE_LOGS/bootstrap.stdout" 2> "$PHASE_LOGS/bootstrap.stderr"
          phase_status=$?
          set -e
          printf '%s\n' "$phase_status" > "$PHASE_LOGS/bootstrap.exit-code"
          cat -- "$PHASE_LOGS/bootstrap.stdout"
          cat -- "$PHASE_LOGS/bootstrap.stderr" >&2
          exit "$phase_status"
      - name: Run two finite offline batches and one controlled failure retry
        timeout-minutes: 48
        run: |
          set -euo pipefail
          set -o noclobber
          PHASE_LOGS="$RUNNER_TEMP/offline-build-batch-v2-phase-logs"
          test -d "$PHASE_LOGS"
          set +e
          (
            set -euo pipefail
            # Two whole batches: four clean successes plus one controlled failure maximum.
            timeout --signal=TERM --kill-after=30s 2760s \
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP/offline-source-home" LANG=C.UTF-8 TZ=UTC \
              RUNNER_TEMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 \
              SOURCE_SHA="$SOURCE_SHA" FEATURE_CODE_SHA="$FEATURE_CODE_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
              GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_OS="$RUNNER_OS" \
              ImageVersion="${ImageVersion:-}" ImageOS="${ImageOS:-}" \
              python3 -I -B "$SLICE/owner.py" batches \
              --source-root "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA" --feature-code-sha "$FEATURE_CODE_SHA" \
              --manifest-sha256 f7dbae991686537ff5caebf10259988a7c2d210c0122ba3c440282a16b5d739e --proof "$RUNNER_TEMP/offline-source-proof.json" \
              --work "$RUNNER_TEMP/offline-source-work" --cache "$RUNNER_TEMP/alarm-cache" \
              --public "$RUNNER_TEMP/offline-source-public" \
              --execute
          ) > "$PHASE_LOGS/batches.stdout" 2> "$PHASE_LOGS/batches.stderr"
          phase_status=$?
          set -e
          printf '%s\n' "$phase_status" > "$PHASE_LOGS/batches.exit-code"
          cat -- "$PHASE_LOGS/batches.stdout"
          cat -- "$PHASE_LOGS/batches.stderr" >&2
          exit "$phase_status"
      - name: Retire finite batch and planner consumers before original341 producer
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          set -o noclobber
          PHASE_LOGS="$RUNNER_TEMP/offline-build-batch-v2-phase-logs"
          test -d "$PHASE_LOGS"
          set +e
          (
            set -euo pipefail
            timeout --signal=TERM --kill-after=30s 330s \
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP/offline-source-home" LANG=C.UTF-8 TZ=UTC \
              RUNNER_TEMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 \
              SOURCE_SHA="$SOURCE_SHA" FEATURE_CODE_SHA="$FEATURE_CODE_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
              GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_OS="$RUNNER_OS" \
              ImageVersion="${ImageVersion:-}" ImageOS="${ImageOS:-}" \
              python3 -I -B "$SLICE/owner.py" cleanup \
              --source-root "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA" --feature-code-sha "$FEATURE_CODE_SHA" \
              --manifest-sha256 f7dbae991686537ff5caebf10259988a7c2d210c0122ba3c440282a16b5d739e --proof "$RUNNER_TEMP/offline-source-proof.json" \
              --work "$RUNNER_TEMP/offline-source-work" --cache "$RUNNER_TEMP/alarm-cache" \
              --public "$RUNNER_TEMP/offline-source-public" \
              --execute
          ) > "$PHASE_LOGS/cleanup.stdout" 2> "$PHASE_LOGS/cleanup.stderr"
          phase_status=$?
          set -e
          printf '%s\n' "$phase_status" > "$PHASE_LOGS/cleanup.exit-code"
          cat -- "$PHASE_LOGS/cleanup.stdout"
          cat -- "$PHASE_LOGS/cleanup.stderr" >&2
          exit "$phase_status"
      - name: Retain bounded public offline batch evidence
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 4
        run: |
          set -euo pipefail
          set -o noclobber
          PHASE_LOGS="$RUNNER_TEMP/offline-build-batch-v2-phase-logs"
          test -d "$PHASE_LOGS"
          set +e
          (
            set -euo pipefail
            timeout --signal=TERM --kill-after=30s 180s \
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP/offline-source-home" LANG=C.UTF-8 TZ=UTC \
              RUNNER_TEMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 \
              SOURCE_SHA="$SOURCE_SHA" FEATURE_CODE_SHA="$FEATURE_CODE_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
              GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_OS="$RUNNER_OS" \
              ImageVersion="${ImageVersion:-}" ImageOS="${ImageOS:-}" \
              python3 -I -B "$SLICE/owner.py" retain \
              --source-root "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA" --feature-code-sha "$FEATURE_CODE_SHA" \
              --manifest-sha256 f7dbae991686537ff5caebf10259988a7c2d210c0122ba3c440282a16b5d739e --proof "$RUNNER_TEMP/offline-source-proof.json" \
              --work "$RUNNER_TEMP/offline-source-work" --cache "$RUNNER_TEMP/alarm-cache" \
              --public "$RUNNER_TEMP/offline-source-public"
          ) > "$PHASE_LOGS/retain.stdout" 2> "$PHASE_LOGS/retain.stderr"
          phase_status=$?
          set -e
          printf '%s\n' "$phase_status" > "$PHASE_LOGS/retain.exit-code"
          cat -- "$PHASE_LOGS/retain.stdout"
          cat -- "$PHASE_LOGS/retain.stderr" >&2
          exit "$phase_status"
      - name: Seal separate phase streams into the public receipt
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYLOG'
          import hashlib,json,os,stat
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          source=temp/'offline-build-batch-v2-phase-logs';public=temp/'offline-source-public'
          phases=('proof','feature-proof','bootstrap','batches','cleanup','retain')
          for path in (temp,source,public):
              if path.is_symlink() or any(p.is_symlink() for p in path.parents):raise ValueError('ordinary phase/public ancestry required')
          if not public.exists():public.mkdir(mode=0o700)
          def read(path,cap=16*1024**2):
              if path.is_symlink():raise ValueError('phase/public alias refused')
              with path.open('rb') as stream:
                  before=os.fstat(stream.fileno());raw=stream.read(cap+1);after=os.fstat(stream.fileno())
              key=lambda s:(s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_gid,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
              if not stat.S_ISREG(before.st_mode) or before.st_nlink!=1 or len(raw)>cap or key(before)!=key(after) or key(after)!=key(path.lstat()):raise ValueError('bounded stable ordinary file required')
              return raw
          def pin(raw):return dict(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
          def encode(value):return (json.dumps(value,indent=2,sort_keys=True,allow_nan=False)+'\n').encode()
          def pairs(rows):
              result={}
              for key,value in rows:
                  if key in result:raise ValueError('duplicate receipt JSON key')
                  result[key]=value
              return result
          receipt_path=public/'receipt.json';original=read(receipt_path) if receipt_path.exists() else encode(dict(status='FAIL_NO_OWNER_RECEIPT',files={}))
          receipt=json.loads(original,object_pairs_hook=pairs)
          files=receipt.get('files',{})
          if type(files)is not dict or 'receipt.json'in files:raise ValueError('nonrecursive receipt file map required')
          for name,row in files.items():
              path=Path(name)
              if path.is_absolute() or '..'in path.parts or path.as_posix()!=name or path==Path('.'):raise ValueError('receipt path escape')
              if type(row)is not dict or set(row)!={'bytes','sha256'} or type(row['bytes'])is not int or pin(read(public/path))!=row:raise ValueError('original public receipt pin differs')
          actual={p.relative_to(public).as_posix() for p in public.rglob('*') if p.is_file()}
          if actual!=set(files)|({'receipt.json'} if receipt_path.exists() else set()):raise ValueError('unlisted pre-seal public file')
          with (public/'receipt-before-phase-log-seal.json').open('xb') as stream:stream.write(original)
          files['receipt-before-phase-log-seal.json']=pin(original)
          destination=public/'phase-logs';destination.mkdir(mode=0o700)
          expected={phase+suffix for phase in phases for suffix in ('.stdout','.stderr','.exit-code')}
          if source.exists() and {p.name for p in source.iterdir()}-expected:raise ValueError('unexpected phase stream namespace')
          missing=[];exits={};phase_files={}
          for name in sorted(expected):
              path=source/name
              if not path.exists():missing.append(name);continue
              raw=read(path,64 if name.endswith('.exit-code') else 4*1024**2)
              if name.endswith('.exit-code'):
                  text=raw.decode();value=int(text)
                  if text!=str(value)+'\n' or not 0<=value<=255:raise ValueError('exact phase exit code required')
                  exits[name[:-10]]=value
              with (destination/name).open('xb') as stream:stream.write(raw)
              phase_files['phase-logs/'+name]=pin(raw)
          complete=not missing and set(exits)==set(phases) and all(type(v)is int and v==0 for v in exits.values())
          marker=dict(schema_version=1,status='COMPLETE_PHASE_STREAMS' if complete else 'PARTIAL_OR_FAILED_PHASE_STREAMS',files=phase_files,missing=missing,phase_exits=exits,actual_acceptance=False)
          raw=encode(marker)
          with (public/'phase-logs.json').open('xb') as stream:stream.write(raw)
          files.update(phase_files);files['phase-logs.json']=pin(raw)
          promote=complete and receipt.get('status')=='PASS_NATIVE_OFFLINE_BATCH_COMPONENT_PENDING_PHASE_LOG_SEAL'
          receipt.update(status='PASS_NATIVE_OFFLINE_BUILD_BATCH_V2_COMPONENT_ONLY' if promote else 'FAIL_NATIVE_OFFLINE_BATCH_PHASE_LOG_SEAL',files=files,phase_log_seal=marker)
          raw=encode(receipt)
          if sum(row['bytes'] for row in files.values())+len(raw)>128*1024**2:raise ValueError('aggregate public evidence cap')
          temporary=public/'receipt.json.phase-seal-tmp'
          with temporary.open('xb') as stream:stream.write(raw);stream.flush();os.fsync(stream.fileno())
          os.replace(temporary,receipt_path)
          if not promote:raise SystemExit('phase logs retained but native qualification not established')
          PYLOG
      - name: Upload only the closed public evidence directory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 2
        with:
          name: offline-build-batch-v2-native-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/offline-source-public/
