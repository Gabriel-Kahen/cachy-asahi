name: native-arm-glibc-debian-maintained-system16k
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source and workflow commit
        required: true
        type: string
      manifest_sha256:
        description: Exact reviewed source-manifest.json SHA256
        required: true
        type: string
      provider_input_ref:
        description: Root-bound immutable accepted maintained caa3 pair and normal probes packet
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-arm-glibc-debian-maintained-system16k
  cancel-in-progress: false
jobs:
  glibc16k:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 170
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      SLICE: scripts/ci/glibc-debian-maintained-system16k
      PROVIDER_INPUT_REF: ${{ inputs.provider_input_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Checkout exact Root-bound maintained caa3 provider and normal-probe packet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: 132aec86c0946f6c7b7a79c46e1a9ccaf91021e3
          path: provider-packet-inputs
          persist-credentials: false
      - name: Prove exact reviewed source pair and shared cache helper before secrets
        id: proof
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = ARM64
          test "$RUNNER_OS" = Linux
          test "$PROVIDER_INPUT_REF" = 132aec86c0946f6c7b7a79c46e1a9ccaf91021e3
          python3 -B "$SLICE/gate.py" --source-root "$GITHUB_WORKSPACE" --pair-root "$GITHUB_WORKSPACE/provider-packet-inputs/payload" --source "$SOURCE_SHA" --manifest "$MANIFEST_SHA256"
      - name: Inert direct slice controls only
        timeout-minutes: 3
        env:
          DEBIAN_MAINTAINED_SYSTEM16K_PACKET_ROOT: ${{ github.workspace }}/provider-packet-inputs/payload
          DEBIAN_MAINTAINED_SYSTEM16K_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          python3 -I -B -Werror::ResourceWarning "$SLICE/test_adapter.py"
          python3 -I -B -Werror::ResourceWarning "$SLICE/test_protocol.py"
      - name: Provision accepted kernel and QEMU tools on disposable runner
        timeout-minutes: 8
        run: |
          set -euo pipefail
          docker version >/dev/null
          timeout --kill-after=10s 180s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 update -qq
          timeout --kill-after=10s 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 install -y --no-install-recommends build-essential bc clang lld llvm flex bison libssl-dev libelf-dev python3 qemu-system-arm zstd ca-certificates
      - name: Seed the six exact retained inputs using existing secrets only
        timeout-minutes: 2
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: >-
          python3 -I -B scripts/ci/maintained_desktop574.py seed
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$RUNNER_TEMP/desktop574"
      - name: Checkout exact fourteen-file public input seed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed fourteen existing public files
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3' 'retained-public-inputs/seed.py' 'a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300' 'retained-public-inputs/index.json' | sha256sum --check
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 TZ=UTC TMPDIR="$RUNNER_TEMP" python3 -I -B retained-public-inputs/seed.py --cache "$RUNNER_TEMP/desktop574/context/deps"
      - name: Build the same owned offline574 base
        timeout-minutes: 40
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: >-
          timeout --signal=TERM --kill-after=10s 2300s python3 -I -B scripts/ci/maintained_desktop574.py build
          --inputs scripts/ci/maintained-desktop574-inputs.json --output "$RUNNER_TEMP/desktop574" --job-token "$JOB_TOKEN"
      - name: Prepare dedicated archive-only kernel cache directory
        timeout-minutes: 1
        run: install -d -m 700 "$RUNNER_TEMP/kernel-source-cache/874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad"
      - name: Restore only the exact content-addressed kernel archive
        id: kernel_cache_restore
        timeout-minutes: 2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kernel-source-cache/874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad/kernel.tar.gz
          key: asahi-kernel-source-v1-874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad-262965559
          enableCrossOsArchive: false
          fail-on-cache-miss: false
          lookup-only: false
      - name: Seed a true miss from the exact retained public source asset
        id: kernel_seed
        if: steps.kernel_cache_restore.outputs.cache-hit != 'true'
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_CACHE_HIT: ${{ steps.kernel_cache_restore.outputs.cache-hit }}
          KERNEL_CACHE_MATCHED_KEY: ${{ steps.kernel_cache_restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          python3 -I -B - "$GITHUB_WORKSPACE" "$SLICE" <<'PYSEED'
          import os,pathlib,sys
          root=pathlib.Path(sys.argv[1]);sys.path.insert(0,str(root/sys.argv[2]));import common as c
          c.check_source(root)
          acquire=c.load(root,'scripts/ci/tools-generic16k/acquire_kernel.py')
          seed=c.load(root,'scripts/ci/tools-generic16k/retained_kernel.py')
          fetch=c.load(root,'scripts/virtual/generic16k/fetch_inputs.py')
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'kernel-source-cache'/'874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad'/'kernel.tar.gz'
          assert acquire.cache_state(archive,os.environ['KERNEL_CACHE_HIT'],os.environ['KERNEL_CACHE_MATCHED_KEY'])=='MISS'
          result=seed.download(archive,acquire,fetch.deadline_alarm,pathlib.Path(os.environ['RUNNER_TEMP'])/'tools16k-kernel-source-seed.json')
          if result['status']=='RETAINED_ASSET_DOWNLOADED_HASH_VERIFIED':
              with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('retained_archive='+str(archive)+'\n')
          else:assert result['status']=='RETAINED_ASSET_UNAVAILABLE'
          PYSEED
      - name: Acquire pinned Asahi kernel and copy separate derived PTY helper
        id: kernel_acquire
        timeout-minutes: 6
        env:
          KERNEL_CACHE_HIT: ${{ steps.kernel_cache_restore.outputs.cache-hit }}
          KERNEL_CACHE_MATCHED_KEY: ${{ steps.kernel_cache_restore.outputs.cache-matched-key }}
          KERNEL_RETAINED_ARCHIVE: ${{ steps.kernel_seed.outputs.retained_archive }}
        run: |
          set -euo pipefail
          python3 -I -B - "$GITHUB_WORKSPACE" "$SLICE" "$RUNNER_TEMP/tools16k-kernel" <<'PYCODE'
          import json,os,pathlib,shutil,sys,time
          root=pathlib.Path(sys.argv[1]);sys.path.insert(0,str(root/sys.argv[2]));import common as c
          c.check_source(root);work=pathlib.Path(sys.argv[3]);work.mkdir(mode=0o700);(work/'inputs').mkdir(mode=0o700)
          fetch=c.load(root,'scripts/virtual/generic16k/fetch_inputs.py')
          manifest,manifest_sha=fetch.load_manifest(root/'scripts/virtual/generic16k/inputs.json')
          acquire=c.load(root,'scripts/ci/tools-generic16k/acquire_kernel.py')
          cache=pathlib.Path(os.environ['RUNNER_TEMP'])/'kernel-source-cache'/'874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad'/'kernel.tar.gz'
          acquire.acquire(fetch,manifest['inputs'][0],work/'inputs',manifest_sha,work/'kernel-input.json',
              cache_archive=cache,cache_hit=os.environ['KERNEL_CACHE_HIT'],cache_matched_key=os.environ['KERNEL_CACHE_MATCHED_KEY'],
              retained_archive=os.environ['KERNEL_RETAINED_ARCHIVE'] or None)
          helper=work/'helper';helper.mkdir(mode=0o700)
          for name in ('build_kernel.py','kernel.fragment'):shutil.copyfile(root/'scripts/ci/tools-generic16k'/name,helper/name)
          PYCODE
      - name: Save verified archive immediately before kernel build or cleanup
        if: steps.kernel_acquire.outcome == 'success' && steps.kernel_cache_restore.outputs.cache-hit != 'true'
        timeout-minutes: 2
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kernel-source-cache/874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad/kernel.tar.gz
          key: asahi-kernel-source-v1-874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad-262965559
          enableCrossOsArchive: false
      - name: Build separate derived diagnostic16K PTY kernel
        timeout-minutes: 63
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 3700s python3 -I -B "$RUNNER_TEMP/tools16k-kernel/helper/build_kernel.py" --archive "$RUNNER_TEMP/tools16k-kernel/inputs/kernel.tar.gz" --output "$RUNNER_TEMP/tools16k-kernel/helper/build" --build --boot-diagnostics > "$RUNNER_TEMP/tools16k-kernel/controller.log" 2>&1
      - name: Reuse accepted normal clients; run standard system paths on actual16K
        timeout-minutes: 25
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: >-
          timeout --signal=TERM --kill-after=120s 1400s python3 -B "$SLICE/run.py" trial
          --source-root "$GITHUB_WORKSPACE" --source-commit "$SOURCE_SHA"
          --pair-root "$GITHUB_WORKSPACE/provider-packet-inputs/payload" --base-dir "$RUNNER_TEMP/desktop574"
          --kernel-receipt "$RUNNER_TEMP/tools16k-kernel/helper/build/build-receipt.json"
          --private "$RUNNER_TEMP/glibc-debian-maintained-system16k-private" --output "$RUNNER_TEMP/glibc-debian-maintained-system16k-public" --job-token "$JOB_TOKEN" --execute
      - name: Retire owned574 only after verified consumer absence
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 3
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: |
          set -euo pipefail
          python3 -B "$SLICE/run.py" cleanup-safe --source-root "$GITHUB_WORKSPACE" --base-dir "$RUNNER_TEMP/desktop574" --output "$RUNNER_TEMP/glibc-debian-maintained-system16k-public" --private "$RUNNER_TEMP/glibc-debian-maintained-system16k-private" --job-token "$JOB_TOKEN"
          if test -f "$RUNNER_TEMP/desktop574/report.json"; then
            timeout --signal=TERM --kill-after=10s 120s python3 -I -B scripts/ci/maintained_desktop574.py cleanup --inputs scripts/ci/maintained-desktop574-inputs.json --output "$RUNNER_TEMP/desktop574" --job-token "$JOB_TOKEN"
          fi
      - name: Require natural VM and ordered consumer producer kernel cleanup
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 2
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/glibc-debian-maintained-system16k-public/runtime.json"
          python3 -B "$SLICE/run.py" finalize --source-root "$GITHUB_WORKSPACE" --base-dir "$RUNNER_TEMP/desktop574" --output "$RUNNER_TEMP/glibc-debian-maintained-system16k-public" --private "$RUNNER_TEMP/glibc-debian-maintained-system16k-private" --job-token "$JOB_TOKEN" --kernel-work "$RUNNER_TEMP/tools16k-kernel"
      - name: Retain only bounded standard-system-path metadata
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -I -B - "$RUNNER_TEMP" "$SOURCE_SHA" <<'PYCODE'
          import base64,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);out=root/'glibc-debian-maintained-system16k-public';out.mkdir(mode=0o700,exist_ok=True)
          path=out/'runtime.json';value=json.loads(path.read_text()) if path.exists() else dict(status='FAIL',reason='trial not completed',source_commit=sys.argv[2])
          tails={}
          for name in ('tools16k-kernel/controller.log','tools16k-kernel/helper/build/build.log'):
              log=root/name
              if log.is_file():
                  with log.open('rb') as stream:stream.seek(max(0,log.stat().st_size-8192));raw=stream.read(8192)
                  tails[name]=dict(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),base64=base64.b64encode(raw).decode())
          acquisition=root/'tools16k-kernel/kernel-input.json'
          if acquisition.is_file():
              raw=acquisition.read_bytes();assert len(raw)<=16384;value['kernel_acquisition']=json.loads(raw)
          seed=root/'tools16k-kernel-source-seed.json'
          if seed.is_file():
              data=seed.read_bytes();assert len(data)<=16384;value['kernel_retained_seed']=json.loads(data)
          value['kernel_log_tails']=tails;raw=(json.dumps(value,sort_keys=True,indent=2)+'\n').encode();assert len(raw)<=2*1024**2
          path.write_bytes(raw);assert set(p.name for p in out.iterdir())=={'runtime.json'}
          PYCODE
      - name: Upload one metadata file only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 2
        with:
          name: glibc-debian-maintained-system16k-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/glibc-debian-maintained-system16k-public/runtime.json
          retention-days: 3
          if-no-files-found: ignore
