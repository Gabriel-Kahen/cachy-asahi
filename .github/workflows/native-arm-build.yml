name: native-arm-isolation-observation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Read host and local Docker isolation policy without creating a container
        shell: bash
        run: |
          python3 -B - <<'PYOBS'
          import json, pathlib, platform, shutil, subprocess
          fields={}
          for name in ('/sys/module/apparmor/parameters/enabled','/proc/sys/kernel/unprivileged_userns_clone','/proc/sys/kernel/apparmor_restrict_unprivileged_userns','/proc/sys/user/max_user_namespaces'):
              path=pathlib.Path(name)
              try: fields[name]=path.read_text()[:256].strip()
              except OSError as error: fields[name]=type(error).__name__
          def command(argv):
              row=subprocess.run(argv,capture_output=True,text=True,timeout=30,check=True)
              if len(row.stdout)>65536: raise ValueError('bounded policy observation')
              return row.stdout.strip()
          print(json.dumps({'kernel':platform.release(),'arch':platform.machine(),'docker_security_options':json.loads(command(['docker','--host=unix:///var/run/docker.sock','info','--format','{{json .SecurityOptions}}'])),'docker_version':command(['docker','--host=unix:///var/run/docker.sock','version','--format','{{.Server.Version}}']),'apparmor_parser':shutil.which('apparmor_parser'),'fields':fields,'container_created':False,'prior_run_cause':'UNKNOWN'},sort_keys=True))
          PYOBS
