      - name: Upload completed prerequisite metadata checkpoint
        id: pre_installer_upload
        if: ${{ !cancelled() && steps.pre_installer_checkpoint.outcome == 'success' && steps.pre_installer_checkpoint.outputs.ready == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core622-prerequisite-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/core622-pre-installer-public/checkpoint.json
            ${{ runner.temp }}/core622-pre-installer-public/export.json
          retention-days: 3
          compression-level: 0
          include-hidden-files: false
          if-no-files-found: error
      - name: Required fresh latest607 installation in the separately owned VM
        id: composition
        if: ${{ always() && !cancelled() && steps.pre_installer_upload.outcome == 'success' }}
        timeout-minutes: 270
        shell: bash
        env:
          FDK_PAIR_OUTCOME: ${{ steps.fdk_pair.outcome }}
          AUDIO_INPUTS_OUTCOME: ${{ steps.audio_inputs.outcome }}
          FRESH_SOURCE: b9976eea34eaed4b6e56af3be21d4d652fa971d6
          IMPLEMENTATION_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          test "$FDK_PAIR_OUTCOME" = success
          test "$AUDIO_INPUTS_OUTCOME" = success
          install -d -m 700 "$RUNNER_TEMP/expanded604-installer-home"
          diagnostic_ready=false
          if python3 -I -B "$GITHUB_WORKSPACE/core622-code/export622.py" --outer-caller-begin && { exec 3> >(python3 -I -B "$GITHUB_WORKSPACE/core622-code/export622.py" --outer-caller-pump phase.stdout); stdout_pump=$!; exec 4> >(python3 -I -B "$GITHUB_WORKSPACE/core622-code/export622.py" --outer-caller-pump phase.stderr); stderr_pump=$!; }; then
            diagnostic_ready=true
          fi
          phase_seconds=$(python3 -I -B "$GITHUB_WORKSPACE/core622-code/ownership622.py" --begin-core-phase)
          run_original_current_core() {
          timeout --signal=TERM --kill-after=60s "${phase_seconds}s" \
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP/expanded604-installer-home" LANG=C.UTF-8 TZ=UTC \
            PYTHONDONTWRITEBYTECODE=1 RUNNER_TEMP="$RUNNER_TEMP" SOURCE_SHA="${{ github.sha }}" WORKFLOW_SHA="${{ github.sha }}" \
            GITHUB_SHA="${{ github.sha }}" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_REPOSITORY="${{ github.repository }}" GITHUB_EVENT_NAME="${{ github.event_name }}" \
            GITHUB_REF_NAME="${{ github.ref_name }}" GITHUB_ACTIONS=true RUNNER_ARCH=ARM64 GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            python3 -I -B "$GITHUB_WORKSPACE/core622-code/run622.py" --fresh607-source "$GITHUB_WORKSPACE/fresh607-code" \
              --six-record "$GITHUB_WORKSPACE/fresh607-record" --six-public "$RUNNER_TEMP/fresh607-input-data" \
              --installer604-source "$GITHUB_WORKSPACE/expanded604-installer" --fresh-source-revision "$FRESH_SOURCE" \
              --tooling-inputs "$GITHUB_WORKSPACE/fresh607-tooling-inputs" \
              --implementation "$GITHUB_WORKSPACE/expanded604-installer" --implementation-revision "$IMPLEMENTATION_SOURCE" \
              --legacy-source "$GITHUB_WORKSPACE/expanded604-legacy" \
              --preparation-source "$GITHUB_WORKSPACE/composition-preparation" \
              --updater-v2-source "$GITHUB_WORKSPACE/composition-updater-v2" --setup4-pair "$RUNNER_TEMP/setup4-retained" \
              --product "$GITHUB_WORKSPACE/composition-product" --updater "$GITHUB_WORKSPACE/composition-updater" \
              --desktop "$GITHUB_WORKSPACE/composition-desktop" \
              --native "$RUNNER_TEMP/native-evidence" --fdk "$RUNNER_TEMP/fdk-evidence" --cache "$RUNNER_TEMP/alarm-cache" \
              --seven-source "$GITHUB_WORKSPACE/expanded604-seven" --eight-source "$GITHUB_WORKSPACE/expanded604-eight" \
              --management-source "$GITHUB_WORKSPACE/expanded604-management-source/payload" \
              --setup-source "$GITHUB_WORKSPACE/expanded604-setup-source" \
              --welcome-source "$GITHUB_WORKSPACE/expanded604-welcome-source/payload" \
              --fresh600-decisions "$GITHUB_WORKSPACE/expanded604-fresh600-decisions" \
              --native604-decisions "$GITHUB_WORKSPACE/expanded604-native604-decisions" \
              --apps6-source "$GITHUB_WORKSPACE/apps6-inputs/payload" --apps6-authority-source "$GITHUB_WORKSPACE/apps6-authority" \
            --audio-inputs "$RUNNER_TEMP/audio-archives" \
              --output "/tmp/cachy-asahi-expanded604-installer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          }
          set +e
          if "$diagnostic_ready"; then run_original_current_core >&3 2>&4; else run_original_current_core; fi
          phase_exit=$?
          set -e
          if "$diagnostic_ready"; then printf '%s\n' "$phase_exit" >"$RUNNER_TEMP/core622-outer-fresh-caller/phase.exit-code" || true; fi
          exec 3>&- 4>&- || true
          if "$diagnostic_ready"; then wait "$stdout_pump" || true; wait "$stderr_pump" || true; fi
          if [ "$phase_exit" -ne 0 ]; then python3 -I -B "$GITHUB_WORKSPACE/core622-code/export622.py" --outer-caller-frame || true; fi
          exit "$phase_exit"
      - name: Retain only bounded declared expanded604 installer reports
