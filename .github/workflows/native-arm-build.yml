name: native-arm-orphans-live
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA equal to this workflow revision; Root supplies after publication
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-arm-orphans-live
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      SLICE: scripts/ci/orphans-live-native
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
        timeout-minutes: 2
      - name: Prove closed source and exact source workflow revision before actors
        id: proof
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'dbe5d4c4dee1a14c1f0b67948b7e58817ebd24174fda079e80b9bd61415fe302' "$SLICE/job.py" '2e7bc11ac8c23cc897e6288ec81ed0fc12dbbc10e211b9791c6b61bccfa7ea35' "$SLICE/source-manifest.json" | sha256sum --check
          python3 -I -B "$SLICE/job.py" proof --source "$GITHUB_WORKSPACE" --proof "$RUNNER_TEMP/orphans03-proof.json"
      - name: Focused source and hosted input transport controls
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s "$SLICE" -p 'test_*.py'
      - name: Original owned574 producer with one-fetch DATA retained1148 and original five inputs
        timeout-minutes: 40
        run: >-
          timeout --signal=TERM --kill-after=10s 2300s
          python3 -I -B "$SLICE/hosted_producer.py"
          --source "$GITHUB_WORKSPACE" --carrier "$RUNNER_TEMP/retained574-data"
          --proof "$RUNNER_TEMP/orphans03-proof.json" --output "$RUNNER_TEMP/desktop574"
      - name: Two clean candidate builds and installed0.3 explicit-target removal
        timeout-minutes: 31
        env:
          CONSUMER_TOKEN: ${{ steps.proof.outputs.consumer_token }}
        run: >-
          timeout --signal=TERM --kill-after=10s 1800s
          python3 -I -B "$SLICE/run.py" --source "$GITHUB_WORKSPACE"
          --base-dir "$RUNNER_TEMP/desktop574" --output "$RUNNER_TEMP/orphans03-runtime"
          --consumer-token "$CONSUMER_TOKEN"
      - name: Retire exact consumers then producer then TEST authority
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 6
        run: >-
          timeout --signal=TERM --kill-after=10s 330s
          python3 -I -B "$SLICE/job.py" cleanup --source "$GITHUB_WORKSPACE"
          --proof "$RUNNER_TEMP/orphans03-proof.json" --base "$RUNNER_TEMP/desktop574"
          --runtime "$RUNNER_TEMP/orphans03-runtime" --output "$RUNNER_TEMP/orphans03-cleanup.json"
      - name: Retain complete bounded success or failure evidence
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 3
        run: >-
          python3 -I -B "$SLICE/job.py" retain --source "$GITHUB_WORKSPACE"
          --proof "$RUNNER_TEMP/orphans03-proof.json" --base "$RUNNER_TEMP/desktop574"
          --runtime "$RUNNER_TEMP/orphans03-runtime" --cleanup "$RUNNER_TEMP/orphans03-cleanup.json"
          --output "$RUNNER_TEMP/orphans03-public"
      - name: Upload only bounded public evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orphans03-explicit-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orphans03-public/
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
        timeout-minutes: 3
