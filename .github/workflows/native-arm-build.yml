name: native-arm-zsh-highlighting
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed highlighting recipe/caller Source (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-arm-zsh-highlighting
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Require exact reviewed Source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Seed the six exact retained inputs using existing secrets only
        timeout-minutes: 2
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          echo '6ca8813aa7a704251d842e1d7e05404aa56e4029067ccacb57b0a7a3c8af80e5  scripts/ci/maintained_desktop574.py' | sha256sum -c -
          echo 'b2a234c76c3a820382238023203a8b699a503153f63b938376fd16433c4d90f9  scripts/ci/maintained-desktop574-inputs.json' | sha256sum -c -
          python3 -I -B scripts/ci/maintained_desktop574.py seed \
            --inputs scripts/ci/maintained-desktop574-inputs.json --output "$RUNNER_TEMP/desktop574"
      - name: Native574 builder, single current pair and signed installed Zsh lifecycle
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          install -d -m700 "$RUNNER_TEMP/highlighting-home"
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP/highlighting-home" \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC RUNNER_TEMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" \
            PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/ci/zsh-highlighting-native/run.py \
            --source-commit "$SOURCE_COMMIT" --base "$RUNNER_TEMP/desktop574" \
            --output "$RUNNER_TEMP/highlighting-native"
      - name: Retain ordinary public package pair and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zsh-highlighting-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/highlighting-native/summary/
            ${{ runner.temp }}/highlighting-native/build-1/build.log
            ${{ runner.temp }}/highlighting-native/build-1/provenance.json
            ${{ runner.temp }}/highlighting-native/build-1/validation.json
            ${{ runner.temp }}/highlighting-native/build-1/artifacts/
            ${{ runner.temp }}/highlighting-native/build-2/build.log
            ${{ runner.temp }}/highlighting-native/build-2/provenance.json
            ${{ runner.temp }}/highlighting-native/build-2/validation.json
            ${{ runner.temp }}/highlighting-native/build-2/artifacts/
            ${{ runner.temp }}/desktop574/report.json
            ${{ runner.temp }}/desktop574/seed-report.json
            ${{ runner.temp }}/desktop574/installed-packages.lock
