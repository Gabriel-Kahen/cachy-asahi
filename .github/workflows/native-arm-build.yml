name: native-arm-build
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed component successor Source (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-arm-build
  cancel-in-progress: false
  queue: max
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, existing native runner pin
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify exact component sources
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          sha256sum --check <<'PINS'
          74cc4f8fe62c27c284caf0a6581e595f8bc1dbcb22e89803e9be234cae17dc83  scripts/ci/maintained574_component.py
          ebf62455e25b5471427224c4df9d75c0c1fd3a0f09a1864596171498740d4527  scripts/ci/maintained_desktop574.py
          a8b6ed8971a38089a4499dcec605477c4e48d7a47c3de485d205f6a44678b898  scripts/ci/native_arm.py
          29c854180f55fe14475329601580e0345b50bc5ab365850c04003fa0b051c1a9  scripts/ci/asahi-lsp-build/job.py
          a25f0089759c12afae3eea23bab8b22fa05cf5bbaa9eddc1611ce78b0405f8f5  scripts/ci/log_evidence.py
          PINS
      - name: Five fixed metadata-only cleanup cases
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/component-scratch" "$RUNNER_TEMP/component-scratch/home" "$RUNNER_TEMP/component-scratch/tmp"
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP/component-scratch/home" \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC PYTHONDONTWRITEBYTECODE=1 \
            TMPDIR="$RUNNER_TEMP/component-scratch/tmp" RUNNER_TEMP="$RUNNER_TEMP" \
            RUNNER_ARCH="$RUNNER_ARCH" RUNNER_OS="$RUNNER_OS" \
            ImageVersion="${ImageVersion:-}" ImageOS="${ImageOS:-}" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            COMPONENT_SOURCE_COMMIT="$SOURCE_COMMIT" \
            timeout --signal=TERM --kill-after=15s 630s \
            python3 -B scripts/ci/maintained574_component.py --output "$RUNNER_TEMP/component-scratch/component"
      - name: Retain only small component and native guard evidence
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/component-scratch/component/public"
          if [ -d "$public" ]; then
            timeout --signal=TERM --kill-after=5s 30s python3 -B scripts/ci/log_evidence.py "$public"
          fi
