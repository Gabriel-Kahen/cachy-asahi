name: native-arm-build
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Probe, audit, original builds, or frozen development-only integration
        required: true
        default: probe
        type: choice
        options: [probe, audit, build, integration]
      inputs_sha256:
        description: Reviewed SHA-256 of selected input lock (build uses maintained successor)
        type: string
        default: ''
      recipes_sha256:
        description: Reviewed SHA-256 of selected four-package recipe lock (build)
        type: string
        default: ''
      integration_sha256:
        description: Reviewed SHA-256 of scripts/ci/integration.lock.json (integration)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: native-arm-build
  cancel-in-progress: false
  queue: max
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BUILD_MODE: ${{ inputs.mode }}
      INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
      RECIPES_SHA256: ${{ inputs.recipes_sha256 }}
      INTEGRATION_SHA256: ${{ inputs.integration_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified upstream ref
        with:
          persist-credentials: false
      - name: Validate bootstrap boundaries
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Record native runner evidence
        run: >-
          python3 scripts/ci/native_arm.py probe
          --cache "$RUNNER_TEMP/alarm-cache"
          --output "$RUNNER_TEMP/native-probe"
      - name: Authenticate inputs or build in isolated native containers
        if: inputs.mode != 'probe'
        env:
          NATIVE_RECIPES_PATH: ${{ inputs.mode == 'build' && 'scripts/ci/setup-0.1.0-3-recipes.lock.json' || 'scripts/ci/recipes.lock.json' }}
          NATIVE_INPUTS_PATH: ${{ inputs.mode == 'build' && 'scripts/ci/maintained-native/locks/inputs-successor.lock.json' || 'scripts/ci/inputs.lock.json' }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ inputs.mode == 'build' && secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 || '' }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ inputs.mode == 'build' && secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 || '' }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ inputs.mode == 'build' && secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 || '' }}
          CACHY_OLD_FOUR_SCHEMA: ${{ inputs.mode == 'build' && '1' || '' }}
          CACHY_OLD_FOUR_SOURCE_EPOCH: ${{ inputs.mode == 'build' && '1791748800' || '' }}
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_JBIGKIT_01 || '' }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_JBIGKIT_02 || '' }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_01 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_02 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_03 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_04 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_05 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_06 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_07 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_08 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_09 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_10 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_11 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_12 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_13 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_14 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_15 || '' }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ inputs.mode == 'build' && secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 || '' }}
        run: >-
          python3 scripts/ci/native_arm.py "$BUILD_MODE"
          --inputs "$NATIVE_INPUTS_PATH"
          --inputs-sha256 "$INPUTS_SHA256"
          --recipes "$NATIVE_RECIPES_PATH"
          --recipes-sha256 "$RECIPES_SHA256"
          --integration-sha256 "$INTEGRATION_SHA256"
          --integration-output "$RUNNER_TEMP/integration-evidence"
          --cache "$RUNNER_TEMP/alarm-cache"
          --output "$RUNNER_TEMP/native-evidence"
      - name: Retain bounded evidence and package artifacts in free workflow logs
        if: always()
        run: |
          evidence_status=0
          python3 scripts/ci/log_evidence.py "$RUNNER_TEMP/native-probe" || evidence_status=1
          if [ -d "$RUNNER_TEMP/native-evidence" ]; then
            python3 scripts/ci/log_evidence.py "$RUNNER_TEMP/native-evidence" || evidence_status=1
          fi
          if [ -d "$RUNNER_TEMP/integration-evidence/public" ]; then
            for stage in "$RUNNER_TEMP/integration-evidence/public"/*; do
              if [ -d "$stage" ]; then
                python3 scripts/ci/log_evidence.py "$stage" || evidence_status=1
              fi
            done
            if [ -f "$RUNNER_TEMP/integration-evidence/public/summary/result.json" ]; then
              cat "$RUNNER_TEMP/integration-evidence/public/summary/result.json"
            fi
          fi
          exit "$evidence_status"
