name: native-arm-maintained574-active-cancellation
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed full Source containing owner and trial adapter
        required: true
        type: string
      candidate_sha256:
        description: Reviewed SHA256 of scripts/ci/maintained574-active-trial/candidate-files.json
        required: true
        type: string
      trial_mode:
        description: Normal optional owner first, then genuinely running transaction cancellation
        required: true
        type: choice
        default: both
        options: [both, normal, cancel]
permissions:
  contents: read
concurrency:
  group: native-arm-maintained574-active-cancellation
  cancel-in-progress: false
jobs:
  active574:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 195
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ACTIVE574_SOURCE_COMMIT: ${{ inputs.source_commit }}
      ACTIVE574_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      ACTIVE574_TRIAL_MODE: ${{ inputs.trial_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5
        with:
          ref: ${{ inputs.source_commit }}
          path: active-source
          persist-credentials: false
      - name: Authenticate complete candidate and held dependencies; run inert controls
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C active-source rev-parse HEAD)" = "$ACTIVE574_SOURCE_COMMIT"
          python3 -I -B - <<'PY'
          import hashlib,json,os,pathlib,re,sys
          root=pathlib.Path('active-source').resolve()
          assert re.fullmatch('[0-9a-f]{40}',os.environ['ACTIVE574_SOURCE_COMMIT'])
          raw=(root/'scripts/ci/maintained574-active-trial/candidate-files.json').read_bytes()
          pin=os.environ['ACTIVE574_CANDIDATE_SHA256']
          assert re.fullmatch('[0-9a-f]{64}',pin) and hashlib.sha256(raw).hexdigest()==pin
          manifest=json.loads(raw);assert manifest['schema']==1 and 1<=len(manifest['files'])<=24
          for name,row in manifest['files'].items():
              assert not name.startswith('/') and all(p not in ('','.','..') for p in name.split('/'))
              path=root/name;assert not path.is_symlink() and path.resolve().is_relative_to(root)
              data=path.read_bytes();assert len(data)==row['bytes']<=262144 and hashlib.sha256(data).hexdigest()==row['sha256']
          sys.path.insert(0,str(root/'scripts/ci/maintained574-active-trial'))
          import support
          for name,pin in support.PINS.items():support.pinned(root/'scripts/ci'/name,pin)
          PY
          python3 -B -Werror::ResourceWarning -m unittest discover \
            -s active-source/scripts/ci -p 'test_maintained574_active_owner.py' -v
          python3 -B -Werror::ResourceWarning -m unittest discover \
            -s active-source/scripts/ci/maintained574-active-trial -p 'test_*.py' -v
          test "$RUNNER_ARCH" = ARM64
          docker version >/dev/null
      - name: Check out exact fourteen-file public seed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Prepare exact context; normal optional owner and running transaction cancellation
        timeout-minutes: 179
        shell: bash
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/active-source/scripts/ci/maintained574-active-trial/ci_sequence.sh" \
            "$GITHUB_WORKSPACE/active-source" "$GITHUB_WORKSPACE/retained-public-inputs" \
            "$RUNNER_TEMP/active574-trial" "$ACTIVE574_TRIAL_MODE"
      - name: Retain only bounded sanitized public metadata
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib,pathlib
          path=pathlib.Path('active-source/scripts/ci/log_evidence.py')
          assert path.is_file() and not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest()=='a25f0089759c12afae3eea23bab8b22fa05cf5bbaa9eddc1611ce78b0405f8f5'
          public=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'active574-trial/public'
          if public.is_dir():
              files=list(public.iterdir())
              assert 1<=len(files)<=4 and all(p.is_file() and not p.is_symlink() and p.name in ('sequence.json','public-seed.json','preparation.json','trial.json') and p.stat().st_size<=131072 for p in files)
          PY
          if [ -d "$RUNNER_TEMP/active574-trial/public" ]; then
            python3 -I -B "$GITHUB_WORKSPACE/active-source/scripts/ci/log_evidence.py" "$RUNNER_TEMP/active574-trial/public"
          fi
