name: native-arm-managed-gui-generic16k
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source SHA, equal to this workflow revision
        type: string
        required: true
      manifest_sha256:
        description: Exact SHA256 of this source revision source-manifest.json
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-arm-managed-gui-generic16k
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      SLICE: scripts/ci/managed-gui-generic16k
      MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
      WELCOME_GUI_ASSETS: ${{ github.workspace }}/native-product-inputs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Prove the explicit source and workflow revision before secrets
        id: proof
        timeout-minutes: 2
        run: |
          set -euo pipefail
          [[ "$MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' 'f93cd3b7ed13a995c379eb525479cb349db0573ec90831ca8039895740949c1e' "$SLICE/ci/caller.py" "$MANIFEST_SHA" "$SLICE/ci/source-manifest.json" | sha256sum --check
          python3 -I -B "$SLICE/ci/caller.py" proof --workspace "$GITHUB_WORKSPACE" --manifest "$SLICE/ci/source-manifest.json" --proof "$RUNNER_TEMP/managed-gui16k-source-proof.json"
      - name: Checkout only the exact native product input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 8a38b3fd5963e61fc94707dd87e5dcd626a518a3
          path: native-product-inputs
          persist-credentials: false
      - name: Source-only diagnostic16K controls
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -B "$SLICE/test_lane.py" --source "$GITHUB_WORKSPACE" --assets "$WELCOME_GUI_ASSETS"
          python3 -B "$SLICE/test_scan.py"
          python3 -B -m unittest discover -s scripts/ci/tools-generic16k -p test_acquire.py
          python3 -B -m unittest discover -s scripts/ci/tools-generic16k -p test_cache.py
          python3 -B -m unittest discover -s scripts/ci/tools-generic16k -p test_retained.py
      - name: Provision existing accepted kernel tools on the disposable runner
        timeout-minutes: 9
        run: |
          set -euo pipefail
          timeout --kill-after=10s 180s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 update -qq
          timeout --kill-after=10s 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 install -y --no-install-recommends build-essential bc clang lld llvm flex bison libssl-dev libelf-dev python3 qemu-system-arm zstd ca-certificates
      - name: Prepare and prove the exact separate runner without native actors
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -B "$SLICE/prepare.py" --source "$GITHUB_WORKSPACE" --assets "$WELCOME_GUI_ASSETS" --output "$RUNNER_TEMP/managed-gui16k-runner"
          python3 -I -B "$SLICE/ci/caller.py" stage --workspace "$RUNNER_TEMP/managed-gui16k-runner" --manifest "$SLICE/ci/source-manifest.json" --proof "$RUNNER_TEMP/managed-gui16k-source-proof.json"
          python3 -B "$RUNNER_TEMP/managed-gui16k-runner/test_desktop574_runtime.py"
          bash -n "$RUNNER_TEMP/managed-gui16k-runner/desktop574_fixture.sh"
      - name: Seed the six exact retained inputs using existing secrets only
        timeout-minutes: 2
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: >-
          python3 -I -B scripts/ci/maintained_desktop574.py seed
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$RUNNER_TEMP/desktop574"
      - name: Checkout exact retained public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed fourteen exact public ARM input files
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3' 'retained-public-inputs/seed.py' 'a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300' 'retained-public-inputs/index.json' | sha256sum --check
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 TZ=UTC TMPDIR="$RUNNER_TEMP" python3 -I -B "$GITHUB_WORKSPACE/retained-public-inputs/seed.py" --cache "$RUNNER_TEMP/desktop574/context/deps"
      - name: Reconstruct pinned inputs and run offline owned native574 transaction
        timeout-minutes: 40
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: >-
          timeout --signal=TERM --kill-after=10s 2300s
          python3 -I -B scripts/ci/maintained_desktop574.py build
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$RUNNER_TEMP/desktop574" --job-token "$JOB_TOKEN"
      - name: Prepare dedicated archive-only kernel cache directory
        timeout-minutes: 1
        run: install -d -m 700 "$RUNNER_TEMP/kernel-source-cache/874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad"
      - name: Restore only the exact content-addressed kernel archive
        id: kernel_cache_restore
        timeout-minutes: 2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kernel-source-cache/874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad/kernel.tar.gz
          key: asahi-kernel-source-v1-874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad-262965559
          enableCrossOsArchive: false
          fail-on-cache-miss: false
          lookup-only: false
      - name: Seed a true miss from the exact retained public source asset
        id: kernel_seed
        if: steps.kernel_cache_restore.outputs.cache-hit != 'true'
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_CACHE_HIT: ${{ steps.kernel_cache_restore.outputs.cache-hit }}
          KERNEL_CACHE_MATCHED_KEY: ${{ steps.kernel_cache_restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          python3 -I -B - "$GITHUB_WORKSPACE" "$SLICE" <<'PYSEED'
          import os,pathlib,sys
          root=pathlib.Path(sys.argv[1]);sys.path.insert(0,str(root/sys.argv[2]));import support as s
          s.check_source(root)
          acquire=s.load(root,'scripts/ci/tools-generic16k/acquire_kernel.py')
          seed=s.load(root,'scripts/ci/tools-generic16k/retained_kernel.py')
          fetch=s.load(root,'scripts/virtual/generic16k/fetch_inputs.py')
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'kernel-source-cache'/'874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad'/'kernel.tar.gz'
          assert acquire.cache_state(archive,os.environ['KERNEL_CACHE_HIT'],os.environ['KERNEL_CACHE_MATCHED_KEY'])=='MISS'
          result=seed.download(archive,acquire,fetch.deadline_alarm,pathlib.Path(os.environ['RUNNER_TEMP'])/'managed-gui16k-kernel-source-seed.json')
          if result['status']=='RETAINED_ASSET_DOWNLOADED_HASH_VERIFIED':
              with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('retained_archive='+str(archive)+'\n')
          else:assert result['status']=='RETAINED_ASSET_UNAVAILABLE'
          PYSEED
      - name: Acquire exact Asahi archive and stage the separate GUI helper
        id: kernel_acquire
        timeout-minutes: 6
        env:
          KERNEL_CACHE_HIT: ${{ steps.kernel_cache_restore.outputs.cache-hit }}
          KERNEL_CACHE_MATCHED_KEY: ${{ steps.kernel_cache_restore.outputs.cache-matched-key }}
          KERNEL_RETAINED_ARCHIVE: ${{ steps.kernel_seed.outputs.retained_archive }}
        run: |
          set -euo pipefail
          python3 -I -B - "$GITHUB_WORKSPACE" "$SLICE" "$RUNNER_TEMP/managed-gui16k-kernel" <<'PYCODE'
          import json,os,pathlib,shutil,sys,time
          root=pathlib.Path(sys.argv[1]);sys.path.insert(0,str(root/sys.argv[2]));import support as s
          s.check_source(root);work=pathlib.Path(sys.argv[3]);work.mkdir(mode=0o700);(work/'inputs').mkdir(mode=0o700)
          fetch=s.load(root,'scripts/virtual/generic16k/fetch_inputs.py')
          manifest,manifest_sha=fetch.load_manifest(root/'scripts/virtual/generic16k/inputs.json')
          acquire=s.load(root,'scripts/ci/tools-generic16k/acquire_kernel.py')
          cache=pathlib.Path(os.environ['RUNNER_TEMP'])/'kernel-source-cache'/'874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad'/'kernel.tar.gz'
          acquire.acquire(fetch,manifest['inputs'][0],work/'inputs',manifest_sha,pathlib.Path(os.environ['RUNNER_TEMP'])/'managed-gui16k-acquisition.json',
              cache_archive=cache,cache_hit=os.environ['KERNEL_CACHE_HIT'],cache_matched_key=os.environ['KERNEL_CACHE_MATCHED_KEY'],
              retained_archive=os.environ['KERNEL_RETAINED_ARCHIVE'] or None)
          helper=work/'helper';helper.mkdir(mode=0o700)
          for name in ('build_kernel.py','kernel.fragment'):shutil.copyfile(s.HERE/name,helper/name)
          PYCODE
      - name: Save verified archive immediately before kernel build or cleanup
        if: steps.kernel_acquire.outcome == 'success' && steps.kernel_cache_restore.outputs.cache-hit != 'true'
        timeout-minutes: 2
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kernel-source-cache/874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad/kernel.tar.gz
          key: asahi-kernel-source-v1-874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad-262965559
          enableCrossOsArchive: false
      - name: Build only the separately derived managed GUI diagnostic16K kernel
        timeout-minutes: 63
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 3700s python3 -I -B "$RUNNER_TEMP/managed-gui16k-kernel/helper/build_kernel.py" --archive "$RUNNER_TEMP/managed-gui16k-kernel/inputs/kernel.tar.gz" --output "$RUNNER_TEMP/managed-gui16k-kernel/helper/built" --build --boot-diagnostics > "$RUNNER_TEMP/managed-gui16k-kernel/controller.log" 2>&1
      - name: Full installed Welcome GUI and Doctor trial in the owned generic16K disk VM
        timeout-minutes: 35
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: >-
          timeout --signal=TERM --kill-after=30s 2050s
          python3 -B "$SLICE/run.py" trial --execute --source "$GITHUB_WORKSPACE"
          --source-commit "$SOURCE_SHA" --job-token "$JOB_TOKEN"
          --runner "$RUNNER_TEMP/managed-gui16k-runner" --base-dir "$RUNNER_TEMP/desktop574"
          --output "$RUNNER_TEMP/managed-gui16k-runtime" --kernel-work "$RUNNER_TEMP/managed-gui16k-kernel"
          --kernel-receipt "$RUNNER_TEMP/managed-gui16k-kernel/helper/built/build-receipt.json"
          --proof "$RUNNER_TEMP/managed-gui16k-source-proof.json" --manifest "$SLICE/ci/source-manifest.json"
      - name: Retire the original owned builder after every consumer
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 3
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/desktop574/report.json" ]; then
            timeout --signal=TERM --kill-after=10s 120s python3 -I -B scripts/ci/maintained_desktop574.py cleanup --inputs scripts/ci/maintained-desktop574-inputs.json --output "$RUNNER_TEMP/desktop574" --job-token "$JOB_TOKEN"
          fi
      - name: Finalize only after original producer retirement
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 3
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/managed-gui16k-runtime/runtime.json" ]; then
            timeout --signal=TERM --kill-after=10s 120s python3 -B "$SLICE/run.py" finalize --source "$GITHUB_WORKSPACE" --runner "$RUNNER_TEMP/managed-gui16k-runner" --base-dir "$RUNNER_TEMP/desktop574" --output "$RUNNER_TEMP/managed-gui16k-runtime" --kernel-work "$RUNNER_TEMP/managed-gui16k-kernel" --job-token "$JOB_TOKEN"
          fi
      - name: Retain bounded GUI evidence and fourteen QMP captures
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'f93cd3b7ed13a995c379eb525479cb349db0573ec90831ca8039895740949c1e' "$SLICE/ci/caller.py" | sha256sum --check
          python3 -I -B "$SLICE/ci/caller.py" retain --proof "$RUNNER_TEMP/managed-gui16k-source-proof.json" --base "$RUNNER_TEMP/desktop574" --runtime "$RUNNER_TEMP/managed-gui16k-runtime" --output "$RUNNER_TEMP/managed-gui16k-public" --runner "$RUNNER_TEMP/managed-gui16k-runner" --manifest "$SLICE/ci/source-manifest.json" --kernel-work "$RUNNER_TEMP/managed-gui16k-kernel" --acquisition "$RUNNER_TEMP/managed-gui16k-acquisition.json" --seed "$RUNNER_TEMP/managed-gui16k-kernel-source-seed.json"
      - name: Upload only the bounded public evidence directory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 2
        with:
          name: managed-gui-generic16k-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/managed-gui16k-public/
