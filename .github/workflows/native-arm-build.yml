name: maintained574-owned-normal
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed full574 owned-trial Source (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: maintained574-owned-normal
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify exact trial and held helper sources
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          sha256sum --check <<'PINS'
          7305cffaf040db3dd16958671376ac4108b5808ceff6baca3e882fe6ede7e672  scripts/ci/maintained574_owned_trial.py
          27ba4be42cf2bd41675073e07cccc917ae033f9d68b07a33cfd7f074ac27b760  scripts/ci/maintained_desktop574.py
          b2a234c76c3a820382238023203a8b699a503153f63b938376fd16433c4d90f9  scripts/ci/maintained-desktop574-inputs.json
          a8b6ed8971a38089a4499dcec605477c4e48d7a47c3de485d205f6a44678b898  scripts/ci/native_arm.py
          29c854180f55fe14475329601580e0345b50bc5ab365850c04003fa0b051c1a9  scripts/ci/asahi-lsp-build/job.py
          a14e0318549d24a9bc91ceeb03ec2c1fa2d12f2b3a4f9b0a4cccfb64be34b2b7  scripts/ci/old_four_seed.py
          a25f0089759c12afae3eea23bab8b22fa05cf5bbaa9eddc1611ce78b0405f8f5  scripts/ci/log_evidence.py
          PINS
          mkdir -m 700 "$RUNNER_TEMP/owned574"
      - name: Seed six exact existing private objects into full574 deps
        timeout-minutes: 2
        shell: bash
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s \
            python3 -I -B scripts/ci/maintained_desktop574.py seed \
              --inputs scripts/ci/maintained-desktop574-inputs.json \
              --output "$RUNNER_TEMP/owned574/base"
      - name: Checkout exact retained public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 88a88bc5f3be3998e992881bf090137df16f1aae
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed twelve exact public objects into the same full574 deps
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/retained-public-inputs" rev-parse HEAD)" = 88a88bc5f3be3998e992881bf090137df16f1aae
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            timeout --signal=TERM --kill-after=5s 90s \
            python3 -I -B "$GITHUB_WORKSPACE/retained-public-inputs/seed.py" \
              --cache "$RUNNER_TEMP/owned574/base/context/deps"
      - name: One normal owned full574 build probe and guarded cleanup
        timeout-minutes: 52
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/owned574/base/home" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            RUNNER_ARCH="$RUNNER_ARCH" RUNNER_OS="$RUNNER_OS" ImageVersion="${ImageVersion:-}" ImageOS="${ImageOS:-}" \
            GITHUB_SHA="$SOURCE_COMMIT" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            TRIAL_SOURCE_COMMIT="$SOURCE_COMMIT" PYTHONDONTWRITEBYTECODE=1 \
            timeout --signal=TERM --kill-after=15s 3000s \
            python3 -I -B scripts/ci/maintained574_owned_trial.py \
              --source-commit "$SOURCE_COMMIT" --base "$RUNNER_TEMP/owned574/base" \
              --asset "$GITHUB_WORKSPACE/retained-public-inputs" --output "$RUNNER_TEMP/owned574/trial"
      - name: Retain small closed trial and native guard metadata
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          if test -d "$RUNNER_TEMP/owned574/trial/public"; then
            python3 -B scripts/ci/log_evidence.py "$RUNNER_TEMP/owned574/trial/public"
          fi
