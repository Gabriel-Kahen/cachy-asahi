name: native-arm-direct-virtual-desktop
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Same-job original-four lifecycle and generic ARM virtual desktop trial
        required: true
        default: integration
        type: choice
        options: [probe, audit, build, integration]
      inputs_sha256:
        description: Exact pinned Source input lock
        type: string
        default: beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
      recipes_sha256:
        description: Exact pinned four-package recipe lock
        type: string
        default: a5fb287b4dda2a90bf61d4fa8cbbc5d666dad8bb450a70544d00545b091f36e3
      integration_sha256:
        description: Leave empty; this retry freezes the exact checkout once
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: native-arm-direct-virtual-desktop
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      SOURCE_COMMIT: 13d2ba9f6b0e09ac106bbdee7a36b080ddda084d
      INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
      RECIPES_SHA256: ${{ inputs.recipes_sha256 }}
      RETRY_MODE: ${{ inputs.mode }}
      REQUESTED_INTEGRATION_SHA256: ${{ inputs.integration_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 13d2ba9f6b0e09ac106bbdee7a36b080ddda084d
          persist-credentials: false
      - name: Seed the six frozen private cache objects before native work
        if: inputs.mode == 'integration'
        shell: bash
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$INPUTS_SHA256" = beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
          timeout --signal=TERM --kill-after=5s 75s python3 -B - <<'PYSEED'
          import hashlib
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts/ci')
          from old_four_seed import (OLD_FOUR_PRIVATE_ROWS, RETAINED_BUBBLEWRAP_PRIVATE_ROWS,
                                     seed_current_build_cache)
          pin = 'beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f'
          if hashlib.sha256(Path('scripts/ci/inputs.lock.json').read_bytes()).hexdigest() != pin:
              raise SystemExit('private-cache-input-binding-refused')
          names = {'CACHY_OLD_FOUR_' + f'{tag}_{i:02d}'
                   for _, _, _, tag, count in OLD_FOUR_PRIVATE_ROWS for i in range(1, count + 1)}
          retained = {'CACHY_RETAINED_BUBBLEWRAP_V1_' + f'{tag}_{i:02d}'
                      for _, _, _, tag, sizes in RETAINED_BUBBLEWRAP_PRIVATE_ROWS
                      for i in range(1, len(sizes) + 1)}
          names |= retained
          if len(names) != 22 or len(retained) != 3 or not all(os.environ.get(name) for name in names):
              raise SystemExit('private-cache-required-secrets-missing')
          cache = Path(os.environ['RUNNER_TEMP']) / 'alarm-cache'
          cache.mkdir(mode=0o700)
          keep = names | {'CACHY_OLD_FOUR_SCHEMA', 'CACHY_OLD_FOUR_SOURCE_EPOCH'}
          for name in tuple(os.environ):
              if name not in keep:
                  os.environ.pop(name)
          seed_current_build_cache(cache, pin)
          PYSEED
      - name: Acquire exact VM tooling, build once, and run lifecycle plus virtual desktop
        shell: bash
        run: |
          set -euo pipefail
          test "$RETRY_MODE" = integration
          test "$INPUTS_SHA256" = beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
          test "$RECIPES_SHA256" = a5fb287b4dda2a90bf61d4fa8cbbc5d666dad8bb450a70544d00545b091f36e3
          test -z "$REQUESTED_INTEGRATION_SHA256"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -m 700 "$RUNNER_TEMP/desktop-home"
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP/desktop-home" LANG=C.UTF-8 TZ=UTC \
            RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_SHA="$SOURCE_COMMIT" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            PYTHONDONTWRITEBYTECODE=1 INPUTS_SHA256="$INPUTS_SHA256" RECIPES_SHA256="$RECIPES_SHA256" \
            /bin/bash --noprofile --norc -euo pipefail <<'RUN_PACKAGE_INTEGRATION'
          export TMPDIR="$RUNNER_TEMP"
          mkdir -m 700 "$RUNNER_TEMP/virtual-tooling-cache" "$RUNNER_TEMP/virtual-tooling-public"
          python3 -B - "$RUNNER_TEMP/virtual-tooling-cache" <<'PYTOOLING'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts/virtual').resolve()))
          import audit_tooling as audit
          lock_path = Path('scripts/virtual/tooling.lock.json')
          audit.require(audit.digest(lock_path) == 'c18afc5bde9868594d41bd576a956960a7b01b190d148ba03ca4c41d4394e1b0', 'tooling lock changed')
          lock = audit.json_load(lock_path)
          row = next(row for row in lock['packages'] if row['name'] == 'snappy')
          cache = Path(sys.argv[1]).resolve()
          for blob in (row, audit.signature(row)):
              mirror = 'https://pkgmirror.sametimetomorrow.net/aarch64/packages/s/snappy/' + blob['filename']
              audit.fetch(blob | {'url': mirror}, cache, True)
          PYTOOLING
          python3 -B scripts/virtual/audit_tooling.py \
            --lock scripts/virtual/tooling.lock.json \
            --lock-sha256 c18afc5bde9868594d41bd576a956960a7b01b190d148ba03ca4c41d4394e1b0 \
            --cache "$RUNNER_TEMP/virtual-tooling-cache" \
            --output "$RUNNER_TEMP/virtual-tooling-public/tooling-audit.json" --download
          python3 -B scripts/ci/native_arm.py build \
            --inputs-sha256 "$INPUTS_SHA256" --recipes-sha256 "$RECIPES_SHA256" \
            --cache "$RUNNER_TEMP/alarm-cache" --output "$RUNNER_TEMP/native-evidence"
          python3 -B scripts/ci/integration.py --freeze \
            --output "$RUNNER_TEMP/package-integration.lock.json" \
            --recipes-sha256 "$RECIPES_SHA256" \
            --recipe-source-commit 465bf53545e1d83053bf3c412e210493961b74ae \
            --source-date-epoch 1791748800
          task_integration_sha=$(sha256sum "$RUNNER_TEMP/package-integration.lock.json" | cut -d ' ' -f 1)
          python3 -B scripts/ci/integration_resume.py \
            --native-output "$RUNNER_TEMP/native-evidence" \
            --integration-lock "$RUNNER_TEMP/package-integration.lock.json" \
            --integration-sha256 "$task_integration_sha" --recipes-sha256 "$RECIPES_SHA256" \
            --source-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/integration-evidence" \
            --virtual-tooling-cache "$RUNNER_TEMP/virtual-tooling-cache" \
            --virtual-output "$RUNNER_TEMP/virtual-evidence"
          RUN_PACKAGE_INTEGRATION
      - name: Retain bounded native and sanitized integration evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          evidence_status=0
          if [ -d "$RUNNER_TEMP/native-evidence" ]; then
            python3 -B scripts/ci/log_evidence.py "$RUNNER_TEMP/native-evidence" || evidence_status=1
          fi
          if [ -d "$RUNNER_TEMP/integration-evidence/public" ]; then
            for stage in "$RUNNER_TEMP/integration-evidence/public"/*; do
              if [ -d "$stage" ]; then
                python3 -B scripts/ci/log_evidence.py "$stage" || evidence_status=1
              fi
            done
            if [ -f "$RUNNER_TEMP/integration-evidence/public/summary/result.json" ]; then
              cat "$RUNNER_TEMP/integration-evidence/public/summary/result.json"
            fi
          fi
          if [ -f "$RUNNER_TEMP/virtual-tooling-public/tooling-audit.json" ]; then
            python3 -B scripts/ci/log_evidence.py "$RUNNER_TEMP/virtual-tooling-public" || evidence_status=1
          fi
          if [ -d "$RUNNER_TEMP/virtual-evidence/owner-public" ]; then
            mkdir -p "$RUNNER_TEMP/virtual-retained"
            for task_file in result.json guest-events.json minimal.ppm overlay.ppm qemu.log \
                tooling-container.log verify-container.log prepare-container.log runtime-container.log; do
              if [ -f "$RUNNER_TEMP/virtual-evidence/owner-public/$task_file" ]; then
                task_piece="$RUNNER_TEMP/virtual-retained/virtual-$task_file"
                mkdir "$task_piece"
                cp -- "$RUNNER_TEMP/virtual-evidence/owner-public/$task_file" "$task_piece/$task_file"
                python3 -B scripts/ci/log_evidence.py "$task_piece" || evidence_status=1
              fi
            done
          fi
          exit "$evidence_status"
