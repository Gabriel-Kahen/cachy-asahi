name: Source Tools CLI input regressions
on:
  pull_request:
    paths:
      - packages/tools/cachy-asahi-source-tools/**
      - .github/workflows/source-tools-cli-inputs.yml
  push:
    branches: [main]
    paths:
      - packages/tools/cachy-asahi-source-tools/**
      - .github/workflows/source-tools-cli-inputs.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Existing nine CLI regression tests and 120 duplicate-form cases
        run: python -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-source-tools/test_cli_input_refusal.py
