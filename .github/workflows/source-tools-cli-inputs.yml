name: Source Tools CLI input regressions
on:
  pull_request:
    paths:
      - packages/tools/cachy-asahi-source-tools/**
      - .github/workflows/source-tools-cli-inputs.yml
  push:
    branches: [main]
    paths:
      - packages/tools/cachy-asahi-source-tools/**
      - .github/workflows/source-tools-cli-inputs.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Nine CLI regression tests and 132 duplicate-form cases
        run: python -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-source-tools/test_cli_input_refusal.py
      - name: Verify offline catalog and exact context pins against retained fixture history
        run: |
          python -I -B -Werror::ResourceWarning - <<'PYTHON'
          from pathlib import Path
          import subprocess, sys, tarfile, tempfile
          recipe = Path('packages/tools/cachy-asahi-source-tools').resolve()
          with tempfile.TemporaryDirectory(prefix='source-tools-catalog-') as temporary:
              root = Path(temporary)
              for name in ('private-source.tar.gz', 'fixtures.tar.gz'):
                  with tarfile.open(recipe / name, 'r:gz') as archive:
                      archive.extractall(root, filter='data')
              subprocess.run([sys.executable, '-I', '-B', '-Werror::ResourceWarning',
                  str(recipe / 'test_source_mirror_catalog.py'),
                  '--runtime-root', str(root / 'private/scripts'),
                  '--fixture-root', str(root / 'fixtures')], check=True)
          PYTHON
