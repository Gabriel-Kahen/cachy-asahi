name: native-arm-welcome5-dns-gui
on:
  workflow_dispatch:
    inputs:
      profile:
        description: One independent thirteen-view profile (matching pair required for full GUI)
        type: choice
        options: [minimal, overlay]
        required: true
      source_sha:
        description: Exact source/workflow SHA
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-arm-welcome5-dns-gui-${{ inputs.profile }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 155
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      SLICE: scripts/ci/welcome5-native-gui
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Prove source and selected public native inputs before actors or secrets
        id: proof
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' '8288e0a11223dae4782b4d076e8ed4f8e5e139f42db06552feadfaa690af4f85' "$SLICE/job.py" '6c34d473e535da7dd79379acdb2c935a1ca54c1a6435688708b3ed4456963034' "$SLICE/source-manifest.json" | sha256sum --check
          python3 -I -B "$SLICE/job.py" proof --source "$GITHUB_WORKSPACE" --profile "$PROFILE" --proof "$RUNNER_TEMP/welcome5-proof.json"
      - name: Checkout the already public original native helper inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 77bd2c6ecf2e5c28a04116c3da85c45f70d1cc90
          path: held-public
          persist-credentials: false
      - name: Checkout exact selected new public project-only native pairs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.proof.outputs.carrier_source }}
          path: project-public
          persist-credentials: false
      - name: Check complete actual public archive and accepted-native source roles
        timeout-minutes: 3
        run: >-
          python3 -I -B "$SLICE/job.py" inputs --source "$GITHUB_WORKSPACE" --profile "$PROFILE"
          --proof "$RUNNER_TEMP/welcome5-proof.json" --public "$GITHUB_WORKSPACE/held-public"
          --carrier "$GITHUB_WORKSPACE/project-public" --output "$RUNNER_TEMP/welcome5-assets"
      - name: Inert exact-source and refusal controls before secrets
        timeout-minutes: 3
        env:
          WELCOME5_GUI_ASSETS: ${{ runner.temp }}/welcome5-assets
          WELCOME5_GUI_SOURCE: ${{ github.workspace }}
        run: |
          python3 -I -B "$SLICE/test_lane.py"
          python3 -I -B scripts/ci/test_maintained_desktop574.py
      - name: Seed the six exact retained inputs using existing secrets only
        timeout-minutes: 2
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: >-
          python3 -I -B scripts/ci/maintained_desktop574.py seed
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$RUNNER_TEMP/desktop574-${PROFILE}"
      - name: Checkout exact retained public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed fourteen exact public ARM input files
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3' 'retained-public-inputs/seed.py' 'a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300' 'retained-public-inputs/index.json' | sha256sum --check
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 TZ=UTC TMPDIR="$RUNNER_TEMP" python3 -I -B "$GITHUB_WORKSPACE/retained-public-inputs/seed.py" --cache "$RUNNER_TEMP/desktop574-${PROFILE}/context/deps"
      - name: Reconstruct pinned inputs and run offline owned native574 transaction
        timeout-minutes: 40
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: >-
          timeout --signal=TERM --kill-after=10s 2300s
          python3 -I -B scripts/ci/maintained_desktop574.py build
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$RUNNER_TEMP/desktop574-${PROFILE}" --job-token "$JOB_TOKEN"
      - name: One original VM profile with installed Welcome5 and read-only stored DNS
        timeout-minutes: 45
        run: >-
          timeout --signal=TERM --kill-after=480s 2200s
          python3 -I -B "$SLICE/job.py" run --source "$GITHUB_WORKSPACE" --profile "$PROFILE"
          --proof "$RUNNER_TEMP/welcome5-proof.json" --base "$RUNNER_TEMP/desktop574-${PROFILE}"
          --runtime "$RUNNER_TEMP/welcome5-runtime" --assets "$RUNNER_TEMP/welcome5-assets"
      - name: Reap runtime and preserve original cleanup before retiring producer
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 6
        run: >-
          timeout --signal=TERM --kill-after=10s 330s
          python3 -I -B "$SLICE/job.py" cleanup --source "$GITHUB_WORKSPACE" --profile "$PROFILE"
          --proof "$RUNNER_TEMP/welcome5-proof.json" --base "$RUNNER_TEMP/desktop574-${PROFILE}"
          --runtime "$RUNNER_TEMP/welcome5-runtime" --output "$RUNNER_TEMP/welcome5-cleanup.json"
      - name: Preserve bounded original frames and failure logs without recapture
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 2
        run: >-
          python3 -I -B "$SLICE/job.py" retain --source "$GITHUB_WORKSPACE" --profile "$PROFILE"
          --proof "$RUNNER_TEMP/welcome5-proof.json" --base "$RUNNER_TEMP/desktop574-${PROFILE}"
          --runtime "$RUNNER_TEMP/welcome5-runtime" --cleanup "$RUNNER_TEMP/welcome5-cleanup.json"
          --output "$RUNNER_TEMP/welcome5-public"
      - name: Upload only closed bounded originals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 2
        with:
          name: welcome5-dns-gui-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/welcome5-public/
          include-hidden-files: true
