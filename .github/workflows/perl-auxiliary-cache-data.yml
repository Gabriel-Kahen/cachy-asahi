# SPDX-License-Identifier: MIT
name: Perl auxiliary cache host and guest DATA
on:
  pull_request:
    paths:
      - '.github/workflows/perl-auxiliary-cache-data.yml'
      - 'scripts/ci/perl-auxiliary-cache-data/**'
      - 'scripts/integration/arm16k_perl_auxcache_semantics/**'
      - 'scripts/integration/arm16k_perl_auxcache_guest_guard/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/perl-auxiliary-cache-data.yml'
      - 'scripts/ci/perl-auxiliary-cache-data/**'
      - 'scripts/integration/arm16k_perl_auxcache_semantics/**'
      - 'scripts/integration/arm16k_perl_auxcache_guest_guard/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    name: 10 auxiliary host/guest DATA controls (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install the actual GNU awk and baseline command dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gawk coreutils bash
          /usr/bin/gawk --version
      - name: Compare exact binary canonical output on public and adversarial DATA
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          python -I -B -Werror::ResourceWarning scripts/ci/perl-auxiliary-cache-data/test_equivalence.py
