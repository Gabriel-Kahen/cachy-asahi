name: Source tools focused host package proposal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-host:
    # Proposal only; GitHub Actions execution NOT RUN.
    # Provision a disposable ordinary-user Arch runner with base-devel, Python
    # and bubblewrap already installed. User, mount and network namespaces must
    # work for bubblewrap; restricted OCI containers may not meet this contract.
    # This workflow installs no dependencies and mutates no host configuration.
    runs-on: [self-hosted, Linux, source-tools-host]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing repository pin
      - name: Check ordinary-user runner and namespace contract
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          command -v python makepkg bwrap
          bwrap --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev /usr/bin/true
      - name: Verify finite source delivery adapter
        run: python -I -B scripts/release/test_source_tools_source_delivery_v1.py
      - name: Build package as an ordinary user
        working-directory: packages/tools/cachy-asahi-source-tools
        env:
          SOURCE_TOOLS_HIDE_ROOT: ${{ github.workspace }}
        run: |
          makepkg --noconfirm --cleanbuild
      - name: Retain host archive evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # existing repository pin
        with:
          name: source-tools-host-archive
          path: packages/tools/cachy-asahi-source-tools/*.pkg.tar.*
