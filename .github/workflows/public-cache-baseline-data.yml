# SPDX-License-Identifier: MIT
name: Public cache baseline DATA
on:
  pull_request:
    paths:
      - '.github/workflows/public-cache-baseline-data.yml'
      - 'scripts/ci/public-cache-baseline-data/**'
      - 'scripts/integration/arm16k_perl_ldcache_semantic_transition/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-cache-baseline-data.yml'
      - 'scripts/ci/public-cache-baseline-data/**'
      - 'scripts/integration/arm16k_perl_ldcache_semantic_transition/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    name: 10 public baseline DATA controls (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Decode and derive from the genuine committed public baseline with actors denied
        run: |
          set -euo pipefail
          python -I -B -Werror::ResourceWarning scripts/ci/public-cache-baseline-data/test_baseline.py
