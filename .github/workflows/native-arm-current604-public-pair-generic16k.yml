name: native-arm-current604-public-pair-generic16k
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact Root frozen604 management16K source; actual native604 and Welcome4 GUI must be bound
        required: true
        type: string
      profile:
        description: Exactly one original full604 management profile; two separate accepted runs required
        required: true
        type: choice
        options: [minimal, overlay]
      mode:
        description: Fresh native original-four builder and required FDK pair
        required: true
        default: build
        type: choice
        options: [build]
      inputs_sha256:
        description: Exact pinned Source input lock
        type: string
        default: beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
      recipes_sha256:
        description: Exact pinned four-package recipe lock
        type: string
        default: a5fb287b4dda2a90bf61d4fa8cbbc5d666dad8bb450a70544d00545b091f36e3
      integration_sha256:
        description: Leave empty; this FDK-only job does not run integration
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: native-arm-current604-public-pair-generic16k-${{ inputs.profile }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    env:
      GUI_PROFILE: ${{ inputs.profile }}
      SOURCE_COMMIT: a79c4ca92486854f9edb639cd970d2c90fda4b12
      INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
      RECIPES_SHA256: ${{ inputs.recipes_sha256 }}
      RETRY_MODE: ${{ inputs.mode }}
      REQUESTED_INTEGRATION_SHA256: ${{ inputs.integration_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a79c4ca92486854f9edb639cd970d2c90fda4b12
          persist-credentials: false
      - name: Checkout the separate expanded604 installer implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          path: current604-public-pair-generic16k
          persist-credentials: false
      - name: Require Root native604 and current Welcome4 GUI acceptance before any secret or actor
        id: managed_policy
        shell: bash
        env:
          IMPLEMENTATION_SOURCE: ${{ inputs.source }}
          WORKFLOW_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(sha256sum current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/ci.py | cut -d ' ' -f 1)" = 6d3a3f6dd3819f3686076c94e4a41b555c02ecad269821fa72becea34ab6739b
          test "$(sha256sum current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/source-manifest.json | cut -d ' ' -f 1)" = b7a4bf0b856bae375f517c97f4d6c1b63e589d1f909a101c8025c1d13b001f72
          python3 -B current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/gate.py \
            --profile "$GUI_PROFILE" \
            --implementation "$GITHUB_WORKSPACE/current604-public-pair-generic16k" --implementation-revision "$IMPLEMENTATION_SOURCE" \
            --workflow-sha "$WORKFLOW_SOURCE" --preflight
      - name: Checkout the fixed old helper and setup3 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b6b17e5f6b322f160f7eeb22c8a01380a3c854cd
          path: expanded604-legacy
          persist-credentials: false
      - name: Checkout unchanged original seven-pair input root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7fee76d68e5fd75437d8b49aaaced8376d2215cd
          path: expanded604-seven
          persist-credentials: false
      - name: Checkout the Root-bound accepted eight-pair input root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.managed_policy.outputs.eight_source }}
          path: expanded604-eight
          persist-credentials: false
      - name: Checkout fixed public management source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.managed_policy.outputs.management_source }}
          path: expanded604-management-source
          persist-credentials: false
      - name: Checkout fixed public setup source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.managed_policy.outputs.setup_source }}
          path: expanded604-setup-source
          persist-credentials: false
      - name: Checkout fixed public welcome source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.managed_policy.outputs.welcome_source }}
          path: expanded604-welcome-source
          persist-credentials: false
      - name: Checkout fixed public fresh600 decisions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.managed_policy.outputs.fresh600_decisions }}
          path: expanded604-fresh600-decisions
          persist-credentials: false
      - name: Checkout fixed public native604 decisions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.managed_policy.outputs.native604_decisions }}
          path: expanded604-native604-decisions
          persist-credentials: false
      - name: Checkout the new Apps6 fresh604 Root decision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.managed_policy.outputs.fresh604_decisions }}
          path: expanded604-apps6-fresh604-decisions
          persist-credentials: false
      - name: Checkout the exact Apps6 accepted public carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.managed_policy.outputs.apps6_source }}
          path: expanded604-apps6-inputs
          persist-credentials: false
      - name: Checkout the exact Apps6 native source guards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.managed_policy.outputs.apps6_authority_source }}
          path: expanded604-apps6-authority
          persist-credentials: false
      - name: Checkout the exact current Welcome4 GUI decision and public inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.managed_policy.outputs.gui_decisions }}
          path: expanded604-gui-decisions
          persist-credentials: false
      - name: Verify actual Root decision bytes and closed GUI inputs before network actors or secrets
        env:
          IMPLEMENTATION_SOURCE: ${{ inputs.source }}
          WORKFLOW_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -B current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/gate.py \
            --profile "$GUI_PROFILE" \
            --implementation "$GITHUB_WORKSPACE/current604-public-pair-generic16k" --implementation-revision "$IMPLEMENTATION_SOURCE" \
            --workflow-sha "$WORKFLOW_SOURCE" --decisions-only \
            --fresh600-decisions "$GITHUB_WORKSPACE/expanded604-fresh600-decisions" \
            --native604-decisions "$GITHUB_WORKSPACE/expanded604-native604-decisions" \
            --fresh604-decisions "$GITHUB_WORKSPACE/expanded604-apps6-fresh604-decisions" \
            --gui-decisions "$GITHUB_WORKSPACE/expanded604-gui-decisions" \
            --welcome-source "$GITHUB_WORKSPACE/expanded604-welcome-source/payload"
      - name: Retrieve only the six original pinned audio inputs
        id: audio_inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B expanded604-legacy/scripts/ci/full-development-composition/retrieve_audio.py --output "$RUNNER_TEMP/audio-archives"
      - name: Verify actual Root decisions and accepted archive bytes before secrets
        shell: bash
        env:
          IMPLEMENTATION_SOURCE: ${{ inputs.source }}
          WORKFLOW_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -B current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/gate.py \
            --profile "$GUI_PROFILE" \
            --implementation "$GITHUB_WORKSPACE/current604-public-pair-generic16k" --implementation-revision "$IMPLEMENTATION_SOURCE" \
            --workflow-sha "$WORKFLOW_SOURCE" --legacy-source "$GITHUB_WORKSPACE/expanded604-legacy" \
            --seven-source "$GITHUB_WORKSPACE/expanded604-seven" --eight-source "$GITHUB_WORKSPACE/expanded604-eight" \
            --management-source "$GITHUB_WORKSPACE/expanded604-management-source/payload" \
            --setup-source "$GITHUB_WORKSPACE/expanded604-setup-source" \
            --welcome-source "$GITHUB_WORKSPACE/expanded604-welcome-source/payload" \
            --apps6-source "$GITHUB_WORKSPACE/expanded604-apps6-inputs/payload" --apps6-authority-source "$GITHUB_WORKSPACE/expanded604-apps6-authority" \
            --fresh600-decisions "$GITHUB_WORKSPACE/expanded604-fresh600-decisions" \
            --native604-decisions "$GITHUB_WORKSPACE/expanded604-native604-decisions" \
            --fresh604-decisions "$GITHUB_WORKSPACE/expanded604-apps6-fresh604-decisions" \
            --gui-decisions "$GITHUB_WORKSPACE/expanded604-gui-decisions" \
            --audio-inputs "$RUNNER_TEMP/audio-archives"
      - name: Run source and bounded private metadata controls
        run: |
          set -euo pipefail
          EXPANDED604_MANAGED_SOURCE="$GITHUB_WORKSPACE/current604-public-pair-generic16k" python3 -B -m unittest discover -s current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k -p test_lane.py -v
      - name: Seed the six frozen private cache objects before native work
        if: inputs.mode == 'build'
        shell: bash
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$INPUTS_SHA256" = beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
          timeout --signal=TERM --kill-after=5s 75s python3 -B - <<'PYSEED'
          import hashlib
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts/ci')
          from old_four_seed import (OLD_FOUR_PRIVATE_ROWS, RETAINED_BUBBLEWRAP_PRIVATE_ROWS,
                                     seed_current_build_cache)
          pin = 'beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f'
          if hashlib.sha256(Path('scripts/ci/inputs.lock.json').read_bytes()).hexdigest() != pin:
              raise SystemExit('private-cache-input-binding-refused')
          names = {'CACHY_OLD_FOUR_' + f'{tag}_{i:02d}'
                   for _, _, _, tag, count in OLD_FOUR_PRIVATE_ROWS for i in range(1, count + 1)}
          retained = {'CACHY_RETAINED_BUBBLEWRAP_V1_' + f'{tag}_{i:02d}'
                      for _, _, _, tag, sizes in RETAINED_BUBBLEWRAP_PRIVATE_ROWS
                      for i in range(1, len(sizes) + 1)}
          names |= retained
          if len(names) != 22 or len(retained) != 3 or not all(os.environ.get(name) for name in names):
              raise SystemExit('private-cache-required-secrets-missing')
          cache = Path(os.environ['RUNNER_TEMP']) / 'alarm-cache'
          cache.mkdir(mode=0o700)
          keep = names | {'CACHY_OLD_FOUR_SCHEMA', 'CACHY_OLD_FOUR_SOURCE_EPOCH'}
          for name in tuple(os.environ):
              if name not in keep:
                  os.environ.pop(name)
          seed_current_build_cache(cache, pin)
          PYSEED
      - name: Checkout exact retained public input source
        if: inputs.mode == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing pinned checkout
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed fourteen exact public ARM input files
        if: inputs.mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/retained-public-inputs" rev-parse HEAD)" = 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          test "$(sha256sum retained-public-inputs/seed.py | cut -d ' ' -f 1)" = a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3
          test "$(sha256sum retained-public-inputs/index.json | cut -d ' ' -f 1)" = a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 TZ=UTC \
            TMPDIR="$RUNNER_TEMP" \
            python3 -I -B "$GITHUB_WORKSPACE/retained-public-inputs/seed.py" \
              --cache "$RUNNER_TEMP/alarm-cache"
      - name: Checkout exact original574 archive lock before native base
        if: ${{ success() && inputs.mode == 'build' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 9a2e520dbdfce7e4af417595ff3de9e6a284ef04
          path: archive32-original-lock
          persist-credentials: false
      - name: Prefetch exact original26 native-base plus six extra574 bytes before original build
        id: frozen574_archive32_early
        if: ${{ success() && inputs.mode == 'build' }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          archive32_helper="$GITHUB_WORKSPACE/current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/archive32.py"
          archive32_policy="$GITHUB_WORKSPACE/current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/archive32-policy.json"
          archive32_inputs="$GITHUB_WORKSPACE/archive32-original-lock/scripts/ci/maintained-desktop574-inputs.json"
          printf '%s  %s\n' 'b1e2fc13644510a613ce09e53b39d4f4471cf47fc03fa62f312258379666c418' "$archive32_helper" '4f6ce49214422579f1cc448ff95d9f311cbfaf47a0d0c4f32d828c9edf843585' "$archive32_policy" | sha256sum --check
          python3 -I -B - "$archive32_helper" "$archive32_policy" "$archive32_inputs" "$GITHUB_WORKSPACE/scripts/ci/inputs.lock.json" <<'PYARCHIVE32NATIVE'
          import importlib.util,json,sys
          from pathlib import Path
          helper,policy,inputs,native_inputs=map(Path,sys.argv[1:])
          spec=importlib.util.spec_from_file_location('held_archive32_native_join',helper)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          selected=module.policy(policy,inputs)
          raw=module.read(native_inputs,1024**2)
          expected=dict(bytes=328101,sha256='beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f')
          module.need(module.pin(raw)==expected,'whole original native-base lock required')
          native={}
          for row in json.loads(raw)['packages']:
              native[row['filename']]=dict(bytes=row['size'],sha256=row['sha256'])
              native[row['filename']+'.sig']=dict(bytes=row['signature_size'],sha256=row['signature_sha256'])
          files={name:{key:row[key]for key in('bytes','sha256')}for name,row in selected['files'].items()}
          common={name:row for name,row in files.items()if name in native}
          extra={name:row for name,row in files.items()if name not in native}
          expected_extra={'firefox-157.0.1-1-aarch64.pkg.tar.xz','firefox-157.0.1-1-aarch64.pkg.tar.xz.sig','libnotify-0.8.8-1-aarch64.pkg.tar.xz','libnotify-0.8.8-1-aarch64.pkg.tar.xz.sig','pcsclite-2.5.2-1-aarch64.pkg.tar.xz','pcsclite-2.5.2-1-aarch64.pkg.tar.xz.sig'}
          module.need(len(common)==26 and all(native[name]==row for name,row in common.items())and set(extra)==expected_extra,'exact original26 native-base and six extra574 operands')
          print(module.encoded(dict(status='EXACT_ORIGINAL_NATIVE26_AND_SIX_EXTRA574_DATA_ONLY',native_inputs=expected,original574_inputs=selected['original_inputs'],common26=common,extra6=extra,versions='UNCHANGED',trust='UNCHANGED_ORIGINAL_CHECKS_REQUIRED')).decode(),end='')
          PYARCHIVE32NATIVE
          python3 -I -B "$archive32_helper" --policy "$archive32_policy" --inputs "$archive32_inputs" --cache "$RUNNER_TEMP/frozen574-archive32"
          python3 -I -B - "$archive32_helper" "$archive32_policy" "$archive32_inputs" "$RUNNER_TEMP/frozen574-archive32" "$RUNNER_TEMP/alarm-cache" <<'PYARCHIVE32'
          import importlib.util,sys
          from pathlib import Path
          helper,policy,inputs,cache,destination=map(Path,sys.argv[1:])
          spec=importlib.util.spec_from_file_location('held_archive32_cache_seed',helper)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          selected=module.policy(policy,inputs)
          result=module.seed_exact(cache,destination,selected)
          result.update(helper=module.pin(helper.read_bytes()),policy=module.pin(policy.read_bytes()),destination='EXISTING_OWNED_ALARM_CACHE',original_versions='UNCHANGED',original_signature_and_trust_checks='UNCHANGED')
          print(module.encoded(result).decode(),end='')
          PYARCHIVE32
      - name: Prefetch full20 and seed exact native4 before unchanged native base
        id: frozen574_archive20_native
        if: ${{ success() && inputs.mode == 'build' }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          archive20_helper="$GITHUB_WORKSPACE/current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/archive20.py"
          archive20_policy="$GITHUB_WORKSPACE/current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/archive20-policy.json"
          archive20_inputs="$GITHUB_WORKSPACE/archive32-original-lock/scripts/ci/maintained-desktop574-inputs.json"
          printf '%s  %s\n' 'e8ef66fc0431a04deb331f75258457bf4bdeb13a18bcd863fd5bece3b9a54968' "$archive20_helper" '1f966afe0c24bb9a928154cb0638a8bb78292c799ffd544132633caddf6217ae' "$archive20_policy" | sha256sum --check
          python3 -I -B "$archive20_helper" --policy "$archive20_policy" --inputs "$archive20_inputs" --cache "$RUNNER_TEMP/frozen574-archive20"
          python3 -I -B "$GITHUB_WORKSPACE/current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/prepare.py" --seed-native-archive20 "$archive20_helper" "$archive20_policy" "$archive20_inputs" "$GITHUB_WORKSPACE/scripts/ci/inputs.lock.json" "$RUNNER_TEMP/frozen574-archive20" "$RUNNER_TEMP/alarm-cache"
      - name: Prefetch and seed exact8 original native lock bytes before unchanged base
        id: frozen574_archive8_native
        if: ${{ success() && inputs.mode == 'build' }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          archive8_helper="$GITHUB_WORKSPACE/current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/archive8.py"
          archive8_policy="$GITHUB_WORKSPACE/current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/archive8-policy.json"
          archive8_inputs="$GITHUB_WORKSPACE/archive32-original-lock/scripts/ci/maintained-desktop574-inputs.json"
          printf '%s  %s\n' '5e24808152c727f5dcd19252c66e1ab121bdb9dbd6b90becb943820634898565' "$archive8_helper" '2b21c05d30a9c5efd2f717cfa8475c9de3150d7729f710b348b70a84f5b16e20' "$archive8_policy" | sha256sum --check
          python3 -I -B "$archive8_helper" --policy "$archive8_policy" --inputs "$archive8_inputs" --cache "$RUNNER_TEMP/frozen574-archive8"
          python3 -I -B "$GITHUB_WORKSPACE/current604-public-pair-generic16k/scripts/ci/current604-public-pair-generic16k/prepare.py" --seed-native-archive8 "$archive8_helper" "$archive8_policy" "$archive8_inputs" "$GITHUB_WORKSPACE/scripts/ci/inputs.lock.json" "$RUNNER_TEMP/frozen574-archive8" "$RUNNER_TEMP/alarm-cache"
      - name: Build the fresh native base and original package pairs
        id: original_build
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          test "$RETRY_MODE" = build
          test "$INPUTS_SHA256" = beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f
          test "$RECIPES_SHA256" = a5fb287b4dda2a90bf61d4fa8cbbc5d666dad8bb450a70544d00545b091f36e3
          test -z "$REQUESTED_INTEGRATION_SHA256"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          install -d -m 700 "$RUNNER_TEMP/desktop-docker-config"
          test "$(sha256sum retained-public-inputs/seed.py | cut -d ' ' -f 1)" = a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3
