name: Package set verification source controls
on:
  pull_request:
    paths:
      - scripts/release/package_set_verify_v1/**
      - scripts/checks/package_checks.py
      - tests/test_package_*.py
      - .github/workflows/package-set-verification-source.yml
  push:
    branches: [main]
    paths:
      - scripts/release/package_set_verify_v1/**
      - scripts/checks/package_checks.py
      - tests/test_package_*.py
      - .github/workflows/package-set-verification-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-set-static-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Ensure the existing archive inspector's zstd dependency
        run: |
          if ! command -v zstd; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zstd
          fi
          zstd --version
      - name: Run focused integration and existing package validator controls without skips
        run: |
          python -B -Werror::ResourceWarning - <<'PYTHON'
          import unittest
          for directory, pattern, minimum in (
              ('scripts/release/package_set_verify_v1', 'test_*.py', 17),
              ('tests', 'test_package_*.py', 28),
          ):
              suite = unittest.TestLoader().discover(directory, pattern=pattern)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful() or result.skipped or result.testsRun < minimum:
                  raise SystemExit(f'{directory}: failures, skips, or missing controls')
          PYTHON
