name: desktop-managed-user-session
on:
  workflow_dispatch:
    inputs:
      source:
        description: Full Root-frozen source commit containing the exact managed lane
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-arm-managed-user-session
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_COMMIT: ${{ inputs.source }}
      LANE: scripts/ci/desktop-user-session
      MANIFEST_SHA256: 'f4f09df4b4cae444520566cd986bb01be8ed1c35a057e09520630ae58bb1aee6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Verify exact source and stage the opt-in managed runner
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          export BASE="$RUNNER_TEMP/desktop-managed-base" TRIAL="$RUNNER_TEMP/desktop-managed-trial"
          printf 'BASE=%s\nTRIAL=%s\n' "$BASE" "$TRIAL" >> "$GITHUB_ENV"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          printf '%s  %s\n' 'cf866f9890bf67f7edd4f9f08561986b9ecaed462c8c6574fc3a3091c9aa0271' "$LANE/ci/caller.py" "$MANIFEST_SHA256" "$LANE/ci/source-manifest.json" | sha256sum --check
          python3 -I -B "$LANE/ci/caller.py" prepare --source "$GITHUB_WORKSPACE" --manifest "$GITHUB_WORKSPACE/$LANE/ci/source-manifest.json" --manifest-sha256 "$MANIFEST_SHA256" --trial "$TRIAL" --base "$BASE" --source-commit "$SOURCE_COMMIT"
      - name: Seed the six exact retained inputs using existing secrets only
        timeout-minutes: 2
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: >-
          python3 -I -B scripts/ci/maintained_desktop574.py seed
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$BASE"
      - name: Checkout exact retained public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed the same fourteen exact public input files
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C retained-public-inputs rev-parse HEAD)" = 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 TZ=UTC TMPDIR="$RUNNER_TEMP" \
            python3 -I -B "$GITHUB_WORKSPACE/retained-public-inputs/seed.py" --cache "$BASE/context/deps"
      - name: Build the accepted exact574 with its existing owned-image API
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B "$LANE/ci/caller.py" verify --source "$GITHUB_WORKSPACE" --manifest "$GITHUB_WORKSPACE/$LANE/ci/source-manifest.json" --manifest-sha256 "$MANIFEST_SHA256" --trial "$TRIAL" --base "$BASE"
          timeout --signal=TERM --kill-after=10s 2300s \
            python3 -I -B scripts/ci/maintained_desktop574.py build \
              --inputs scripts/ci/maintained-desktop574-inputs.json --output "$BASE" \
              --job-token "$(cat "$TRIAL/job-token")" 2>&1 | tail -c 262144 > "$TRIAL/base-build.log"
      - name: Run focused source controls
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/test_maintained_desktop574.py
          python3 -I -B scripts/ci/test_desktop574_runtime.py
          python3 -I -B scripts/ci/test_desktop574_guest.py
          python3 -I -B -m unittest discover -s "$LANE" -p test_managed.py
          python3 -I -B -m unittest discover -s "$LANE/ci" -p test_caller.py
          bash -n "$TRIAL/runner/desktop574_fixture.sh"
      - name: One native managed591 VM trial with the accepted runtime budgets
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 2050s \
            python3 -I -B "$LANE/ci/caller.py" runtime --source "$GITHUB_WORKSPACE" --manifest "$GITHUB_WORKSPACE/$LANE/ci/source-manifest.json" --manifest-sha256 "$MANIFEST_SHA256" --trial "$TRIAL" --base "$BASE" 2>&1 | tail -c 262144 > "$TRIAL/managed-runtime.log"
      - name: Retire the owned574 base only after its consumers
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B "$LANE/ci/caller.py" verify --source "$GITHUB_WORKSPACE" --manifest "$GITHUB_WORKSPACE/$LANE/ci/source-manifest.json" --manifest-sha256 "$MANIFEST_SHA256" --trial "$TRIAL" --base "$BASE"
          if [[ -f "$BASE/report.json" && -f "$TRIAL/job-token" ]]; then
            python3 -I -B scripts/ci/maintained_desktop574.py cleanup \
              --inputs scripts/ci/maintained-desktop574-inputs.json --output "$BASE" \
              --job-token "$(cat "$TRIAL/job-token")" 2>&1 | tail -c 65536 > "$TRIAL/base-cleanup.log"
          else
            echo 'OWNED_BASE_CLEANUP=NOT_STARTED_OR_NO_REPORT'
          fi
      - name: Retain bounded diagnostics and exact frames and check recorded outcome
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B "$LANE/ci/caller.py" retain --source "$GITHUB_WORKSPACE" --manifest "$GITHUB_WORKSPACE/$LANE/ci/source-manifest.json" --manifest-sha256 "$MANIFEST_SHA256" --trial "$TRIAL" --base "$BASE"
      - name: Keep only selected public diagnostics and both actual PPM frames
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 3
        with:
          name: managed-user-session-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: ${{ runner.temp }}/desktop-managed-trial/public/
