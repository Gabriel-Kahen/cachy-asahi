name: current606-onboarding-source
on:
  push:
    paths:
      - scripts/ci/current606-onboarding-source/**
      - .github/workflows/current606-onboarding-source.yml
  pull_request:
    paths:
      - scripts/ci/current606-onboarding-source/**
      - .github/workflows/current606-onboarding-source.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Checkout exact corrected676 source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: f9471acd0414c2f6abc53ee81111011df735430c
          path: .ci-fixtures/onboarding-parent676
          persist-credentials: false
      - name: Checkout exact expected698 source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 3b60dfffcc3ceb8cddce86b29d245cab01c2a772
          path: .ci-fixtures/onboarding-expected698
          persist-credentials: false
      - name: Checkout exact loader-corrected698 source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: d0ed51fa626b9343321952277607718b900e90bc
          path: .ci-fixtures/onboarding-loader698
          persist-credentials: false
      - name: Check out exact published runtime correction
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 3b90012ed1e248f803d15f5f765667b6a249fb8c
          path: .ci-fixtures/current606-onboarding-source-correction
          persist-credentials: false
      - name: Checkout exact followup 698 source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: ed4fb355ff939bf269905592ba5d71517ffab373
          path: .ci-fixtures/current606-onboarding-source-followup
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Exact emission and bounded source-only controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B -Werror scripts/ci/current606-onboarding-source/test_prepare.py \
            --parent "$GITHUB_WORKSPACE/.ci-fixtures/onboarding-parent676" \
            --expected "$GITHUB_WORKSPACE/.ci-fixtures/onboarding-expected698"
          python3 -I -B -Werror scripts/ci/current606-onboarding-source/test_loader.py \
            --parent "$GITHUB_WORKSPACE/.ci-fixtures/onboarding-parent676" \
            --expected "$GITHUB_WORKSPACE/.ci-fixtures/onboarding-loader698"
          python3 -I -B -Werror scripts/ci/current606-onboarding-source/test_correction.py --parent "$GITHUB_WORKSPACE/.ci-fixtures/onboarding-parent676" --expected "$GITHUB_WORKSPACE/.ci-fixtures/current606-onboarding-source-correction"
          python3 -I -B -Werror scripts/ci/current606-onboarding-source/test_followup.py --parent "$GITHUB_WORKSPACE/.ci-fixtures/onboarding-parent676" --expected "$GITHUB_WORKSPACE/.ci-fixtures/current606-onboarding-source-followup"
