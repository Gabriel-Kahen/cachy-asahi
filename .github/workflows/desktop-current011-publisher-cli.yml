name: Desktop current011 isolated publisher CLI
on:
  pull_request:
    paths:
      - scripts/ci/desktop-current011-native-source/publish.py
      - scripts/ci/desktop-current011-native-source/prepare.py
      - scripts/ci/desktop-current011-native-source/test_publisher_isolated_cli.py
      - .github/workflows/desktop-current011-publisher-cli.yml
  push:
    branches: [main]
    paths:
      - scripts/ci/desktop-current011-native-source/publish.py
      - scripts/ci/desktop-current011-native-source/prepare.py
      - scripts/ci/desktop-current011-native-source/test_publisher_isolated_cli.py
      - .github/workflows/desktop-current011-publisher-cli.yml
permissions:
  contents: read
jobs:
  isolated-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Isolated import and help with actors denied
        run: python -I -B scripts/ci/desktop-current011-native-source/test_publisher_isolated_cli.py
