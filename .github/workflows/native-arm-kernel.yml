name: native-arm-kernel
on:
  workflow_dispatch:
    inputs:
      packet_sha256:
        description: Externally reviewed SHA-256 of the complete kernel native job packet.lock.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-arm-kernel
  cancel-in-progress: false
jobs:
  kernel:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      KERNEL_JOB_PACKET_SHA256: ${{ inputs.packet_sha256 }}
    steps:
      # 5 + 5 + 346 + 3 minutes, with one minute reserved for runner overhead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed native-arm-build pin
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate committed packet and refuse unavailable native prerequisites
        timeout-minutes: 5
        env:
          KERNEL_BOOTSTRAP_MODE: preflight
        shell: bash
        run: &trusted-bootstrap |
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib, json, os, platform, re, shutil, stat, subprocess, sys
          from pathlib import Path

          WORKFLOW = '.github/workflows/native-arm-kernel.yml'
          PACKET = 'scripts/port/kernel-native-job/packet.lock.json'
          JOB = 'scripts/port/kernel-native-job/job.py'
          PUBLIC = 'scripts/port/kernel-native-job/public.py'
          REQUIRED = {WORKFLOW, JOB, PUBLIC, 'scripts/ci/native_arm.py',
                      'scripts/port/kernel-native-job/packet.py',
                      'scripts/port/kernel-native-job/runtime.py',
                      'scripts/ci/inputs.lock.json', 'scripts/ci/recipes.lock.json',
                      'scripts/port/kernel-native-stage/stage.py',
                      'scripts/port/kernel-native-stage/stage.lock.json'}

          def need(ok):
              if not ok:
                  raise ValueError('boundary')

          def read(path, limit, mode=None):
              need(path.is_absolute() and '..' not in path.parts and
                   all(stat.S_ISDIR(p.lstat().st_mode) for p in path.parents))
              before = path.lstat()
              need(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size <= limit and
                   (mode is None or stat.S_IMODE(before.st_mode) == mode))
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  opened = os.fstat(fd)
                  need(stat.S_ISREG(opened.st_mode) and opened.st_nlink == 1 and
                       (opened.st_dev, opened.st_ino, opened.st_size, opened.st_mtime_ns, opened.st_ctime_ns) ==
                       (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns))
                  with os.fdopen(fd, 'rb', closefd=False) as stream:
                      data = stream.read(limit + 1)
                  after, live = os.fstat(fd), path.lstat()
                  identity = lambda s: (s.st_dev, s.st_ino, s.st_size, s.st_mtime_ns, s.st_ctime_ns, s.st_mode, s.st_nlink)
                  need(len(data) <= limit and identity(opened) == identity(after) == identity(live))
                  return data
              finally:
                  os.close(fd)

          def decode(data):
              def unique(rows):
                  value = {}
                  for key, item in rows:
                      need(key not in value)
                      value[key] = item
                  return value
              value = json.loads(data, object_pairs_hook=unique, parse_constant=lambda _: need(False))
              need(type(value) is dict)
              return value

          def git(root, *args):
              env = {'PATH': '/usr/bin:/bin', 'LANG': 'C.UTF-8', 'HOME': os.environ['RUNNER_TEMP'],
                     'GIT_CONFIG_NOSYSTEM': '1', 'GIT_CONFIG_GLOBAL': '/dev/null'}
              result = subprocess.run(['/usr/bin/git', '--literal-pathspecs', '-c', 'core.hooksPath=/dev/null',
                                       '-c', 'core.fsmonitor=false', '--no-optional-locks', '-C', str(root), *args],
                                      env=env, capture_output=True, timeout=10, check=True)
              need(len(result.stdout) <= 8 * 1024**2 and len(result.stderr) <= 4096)
              return result.stdout

          def committed(root, commit, name, mode, data):
              row = git(root, 'ls-tree', '-z', commit, '--', name)
              need(row.endswith(b'\0') and row.count(b'\0') == 1)
              header, actual = row[:-1].split(b'\t')
              bits = header.split()
              need(len(bits) == 3 and bits[:2] == [b'100755' if mode == 0o755 else b'100644', b'blob'] and
                   re.fullmatch(b'[0-9a-f]{40}', bits[2]) and actual == name.encode())
              need(git(root, 'cat-file', '-s', bits[2].decode()) == (str(len(data)) + '\n').encode())
              need(git(root, 'cat-file', 'blob', bits[2].decode()) == data)

          def source(root, commit, pin, modes=None):
              need(re.fullmatch('[0-9a-f]{40}', commit or '') and re.fullmatch('[0-9a-f]{64}', pin or ''))
              need(git(root, 'rev-parse', 'HEAD').decode().strip() == commit and
                   os.environ.get('GITHUB_WORKFLOW_SHA') == commit)
              data = read(root / PACKET, 1024**2, 0o644)
              need(hashlib.sha256(data).hexdigest() == pin)
              committed(root, commit, PACKET, 0o644, data)
              packet = decode(data)
              need(set(packet) == {'schema_version', 'files'} and type(packet['schema_version']) is int and
                   packet['schema_version'] == 1 and type(packet['files']) is dict and
                   1 <= len(packet['files']) <= 256 and REQUIRED <= set(packet['files']))
              total, captured = 0, {}
              for name, row in packet['files'].items():
                  need(type(name) is str and 0 < len(name) <= 512 and '\\' not in name and
                       all(32 <= ord(c) < 127 for c in name) and not name.startswith('/') and
                       all(p not in ('', '.', '..') for p in name.split('/')))
                  need(type(row) is dict and set(row) == {'sha256', 'bytes', 'mode'} and
                       type(row['mode']) is int and row['mode'] in (0o644, 0o755) and
                       type(row['bytes']) is int and 0 <= row['bytes'] <= 8 * 1024**2 and
                       type(row['sha256']) is str and re.fullmatch('[0-9a-f]{64}', row['sha256']))
                  data = read(root / name, 8 * 1024**2, row['mode'])
                  total += len(data)
                  need(total <= 32 * 1024**2 and len(data) == row['bytes'] and
                       hashlib.sha256(data).hexdigest() == row['sha256'])
                  committed(root, commit, name, row['mode'], data)
                  captured[name] = data
                  if modes is not None:
                      modes[name] = row['mode']
              return captured

          def clean_snapshot(root, run, attempt, captured, modes):
              need(set(captured) == set(modes) and root.lstat().st_uid == os.getuid())
              parent = root
              for component in ('artifacts', 'kernel-native-job'):
                  parent = parent / component
                  try:
                      parent.mkdir(mode=0o700)
                  except FileExistsError:
                      pass
                  info = parent.lstat()
                  need(stat.S_ISDIR(info.st_mode) and info.st_uid == os.getuid())
              bootstrap = parent / ('bootstrap-' + run + '-' + attempt)
              bootstrap.mkdir(mode=0o700)  # Atomic refusal of any prior directory or link.
              target = bootstrap / 'source'
              target.mkdir(mode=0o700)
              for name, data in captured.items():
                  destination = target / name
                  directory = target
                  for component in Path(name).parts[:-1]:
                      directory = directory / component
                      try:
                          directory.mkdir(mode=0o700)
                      except FileExistsError:
                          pass
                      info = directory.lstat()
                      need(stat.S_ISDIR(info.st_mode) and info.st_uid == os.getuid())
                  fd = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  with os.fdopen(fd, 'wb') as stream:
                      stream.write(data)
                      stream.flush()
                      os.fchmod(stream.fileno(), modes[name])
                      os.fsync(stream.fileno())
                  need(read(destination, 8 * 1024**2, modes[name]) == data)
              return target

          def main():
              need(sys.version_info >= (3, 11))
              mode = os.environ.get('KERNEL_BOOTSTRAP_MODE')
              need(mode in ('preflight', 'public'))
              root, temporary = Path(os.environ['GITHUB_WORKSPACE']), Path(os.environ['RUNNER_TEMP'])
              need(root.is_absolute() and root == root.resolve() and temporary.is_absolute() and temporary == temporary.resolve())
              need(all(stat.S_ISDIR(p.lstat().st_mode) for p in (temporary, *temporary.parents)))
              commit, pin = os.environ['GITHUB_SHA'], os.environ['KERNEL_JOB_PACKET_SHA256']
              modes = {}
              captured = source(root, commit, pin, modes)
              run, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
              need(re.fullmatch('[0-9]{1,20}', run) and re.fullmatch('[0-9]{1,10}', attempt))
              output = root / 'artifacts/kernel-native-job' / ('job-' + run + '-' + attempt)
              if mode == 'public':
                  sys.argv = [PUBLIC, '--status', str(output / 'public/status.json'),
                              '--source-commit', commit, '--packet-sha256', pin,
                              '--native-outcome', os.environ.get('KERNEL_NATIVE_OUTCOME', '')]
                  # Execute only the authenticated bytes already captured, never a second file read.
                  exec(compile(captured[PUBLIC], PUBLIC, 'exec'), {'__name__': '__main__', '__file__': str(root / PUBLIC)})
                  return
              need(platform.system() == 'Linux' and platform.machine().lower() in ('aarch64', 'arm64') and
                   os.environ.get('RUNNER_ARCH') == 'ARM64' and os.environ.get('RUNNER_OS') == 'Linux')
              need(os.getuid() == os.geteuid() != 0 and os.getgid() == os.getegid() != 0)
              caps = dict(line.split(':', 1) for line in Path('/proc/self/status').read_text().splitlines() if ':' in line)
              need(int(caps['CapEff'], 16) == int(caps['CapPrm'], 16) == 0)
              for name in ('git', 'gpg', 'lscpu', 'zstd', 'docker', 'python3'):
                  path = Path('/usr/bin') / name
                  need(path.is_file() and os.access(path, os.X_OK))
              docker = Path('/usr/bin/docker')
              need(docker == docker.resolve())
              docker_pin = hashlib.sha256(read(docker, 128 * 1024**2)).hexdigest()
              socket = Path('/run/docker.sock')
              need(socket == socket.resolve() and stat.S_ISSOCK(socket.lstat().st_mode) and socket.lstat().st_uid == 0)
              need(shutil.disk_usage(root).free >= 8 * 1024**3)
              need(not output.exists() and not output.is_symlink())
              snapshot = clean_snapshot(root, run, attempt, captured, modes)
              need('\n' not in str(snapshot) and '\r' not in str(snapshot))
              with open(os.environ['GITHUB_ENV'], 'a') as stream:
                  stream.write('KERNEL_DOCKER_SHA256=' + docker_pin + '\n')
                  stream.write('KERNEL_JOB_BOOTSTRAP_SOURCE=' + str(snapshot) + '\n')
              print('KERNEL_PREFLIGHT_PASS')

          if __name__ == '__main__':
              try:
                  main()
              except Exception:
                  print('KERNEL_BOOTSTRAP_REFUSED')
                  sys.exit(1)
          PY
      - name: Execute finite original producer, signed extension and kernel build pair
        id: native
        timeout-minutes: 346
        shell: bash
        run: |
          /usr/bin/python3 -I -B "$KERNEL_JOB_BOOTSTRAP_SOURCE/scripts/port/kernel-native-job/job.py" --execute-native \
            --source-root "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" \
            --packet "$GITHUB_WORKSPACE/scripts/port/kernel-native-job/packet.lock.json" \
            --packet-sha256 "$KERNEL_JOB_PACKET_SHA256" \
            --output "$GITHUB_WORKSPACE/artifacts/kernel-native-job/job-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --docker-binary /usr/bin/docker --docker-sha256 "$KERNEL_DOCKER_SHA256" \
            --docker-endpoint unix:///run/docker.sock --deadline 20760 >/dev/null 2>&1
      - name: Publish only authenticated bounded status, including execution failure
        if: always()
        timeout-minutes: 3
        env:
          KERNEL_BOOTSTRAP_MODE: public
          KERNEL_NATIVE_OUTCOME: ${{ steps.native.outcome }}
        shell: bash
        run: *trusted-bootstrap
