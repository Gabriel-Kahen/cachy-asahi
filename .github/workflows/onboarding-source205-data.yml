# SPDX-License-Identifier: MIT
name: Onboarding Source205 DATA controls
on:
  pull_request:
    paths:
      - 'scripts/ci/first-login-enrollment-native-source/**'
      - '.github/workflows/onboarding-source205-data.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/first-login-enrollment-native-source/**'
      - '.github/workflows/onboarding-source205-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source205-data:
    name: Source205 genuine DATA (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      # These are immutable input DATA checkouts, not a Source205 native selector.
      # No Source205 CID, Root request, secret or native dispatch is configured.
      - name: Acquire the existing published Source196 DATA basis
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 0a49872473251ad289fc8a49f51f3a27334c0b35
          path: .source205-basis-data
          persist-credentials: false
      - name: Acquire the fixed Source205 constructor operands
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 9e26ce819a258225cac866341e15d7099038ab9e
          path: .source205-author-data
          persist-credentials: false
      - name: Verify input commits and export closed basis DATA
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          test "$(git -C .source205-basis-data rev-parse HEAD)" = 0a49872473251ad289fc8a49f51f3a27334c0b35
          test "$(git -C .source205-basis-data rev-parse HEAD^{tree})" = e85302474308dbf579b79bd6d501f5ad86b66bbb
          test "$(git -C .source205-author-data rev-parse HEAD)" = 9e26ce819a258225cac866341e15d7099038ab9e
          test "$(git -C .source205-author-data rev-parse HEAD^{tree})" = 2e14459be57b26ac7657f302c3d614bea301a13a
          mkdir -m 700 "$RUNNER_TEMP/source205-basis" "$RUNNER_TEMP/source205-tmp"
          git -C .source205-basis-data -c tar.umask=0022 archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/source205-basis"
      - name: Reconstruct exact unissued Source205 with actors denied
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/source205-tmp"
          python -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v7_source/ci_reconstruct.py \
            --author-data "$GITHUB_WORKSPACE/.source205-author-data" \
            --basis "$RUNNER_TEMP/source205-basis" \
            --output "$RUNNER_TEMP/source205-candidate" \
            --profile "$RUNNER_TEMP/source205-profile.json"
      - name: Check finite diagnostics, genuine inverses and unissued requests
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/source205-tmp"
          python -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v7_source/test_transport.py
          python -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v7_source/test_data.py
          python -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v7_source/test_ci_reconstruct.py \
            --author-data "$GITHUB_WORKSPACE/.source205-author-data" --basis "$RUNNER_TEMP/source205-basis"
          python -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v7_source/test_reader.py \
            --genuine-source "$RUNNER_TEMP/source205-candidate"
          python -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v7_source/request_generation/test_prepare.py \
            --genuine-profile "$RUNNER_TEMP/source205-profile.json"
          python -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v6_source/test_capture.py
          python -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v6_source/test_data.py
          python -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_reader_current_v3_source196.py \
            --genuine-capture-source "$RUNNER_TEMP/source205-basis"
          python -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_reader_current_v3.py DiagnosticFailureData
      - name: Check canonical Main route and Root request contract with actors denied
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/source205-tmp"
          python -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v7_source/main_route/test_contract.py \
            --genuine-profile "$RUNNER_TEMP/source205-profile.json"
          python -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v7_source/main_route/test_route.py \
            --source-root "$RUNNER_TEMP/source205-candidate" --profile "$RUNNER_TEMP/source205-profile.json"
