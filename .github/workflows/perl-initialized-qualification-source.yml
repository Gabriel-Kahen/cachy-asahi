{
  "name": "Initialized Perl qualification Source and MODEL controls",
  "on": {
    "pull_request": {
      "paths": [
        ".github/workflows/perl-initialized-qualification-source.yml",
        "scripts/integration/arm16k_perl_initialized_vm/**",
        "scripts/integration/arm16k_warm_control/source/arm16k_perl5423_vm/**"
      ]
    },
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/perl-initialized-qualification-source.yml",
        "scripts/integration/arm16k_perl_initialized_vm/**",
        "scripts/integration/arm16k_warm_control/source/arm16k_perl5423_vm/**"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "initialized-source-model": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "python": [
            "3.12",
            "3.14"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Select explicit Python",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "${{ matrix.python }}"
          }
        },
        {
          "name": "Check thirteen initialized Source and preservation MODEL controls",
          "timeout-minutes": 2,
          "env": {
            "PYTHONDONTWRITEBYTECODE": "1"
          },
          "run": "set -euo pipefail\nulimit -t 60 -v 1048576 -f 4096 -n 128\ntimeout --signal=TERM --kill-after=5s 60s python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl_initialized_vm/test_policy.py\n"
        },
        {
          "name": "Check five SSH directory metadata MODEL controls",
          "timeout-minutes": 2,
          "env": {
            "PYTHONDONTWRITEBYTECODE": "1"
          },
          "run": "set -euo pipefail\nulimit -t 60 -v 1048576 -f 4096 -n 128\ntimeout --signal=TERM --kill-after=5s 60s python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl_initialized_vm/test_ssh_empty.py\n"
        }
      ]
    }
  }
}
