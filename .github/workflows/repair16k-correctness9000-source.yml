name: repair16k-correctness9000-source
on:
  push:
    paths:
      - scripts/ci/repair16k-inner-diagnostics-source/**
      - .github/workflows/repair16k-correctness9000-source.yml
  pull_request:
    paths:
      - scripts/ci/repair16k-inner-diagnostics-source/**
      - .github/workflows/repair16k-correctness9000-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONWARNINGS: error
    steps:
      - name: Check out the maintained explicit factory
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check out exact diagnostic source210
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 62c7a42c5288d83d23291a7f042ad8fa97a98bce
          path: .ci-fixtures/repair-cost
          persist-credentials: false
      - name: Check out exact correctness9000 source210
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 6402dd1cfbcc2eebb17ff511d0c1c4694bb53dda
          path: .ci-fixtures/repair-correctness9000
          persist-credentials: false
      - name: Select the explicit Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check source emission and unchanged security/resource composition
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/repair-correctness9000.XXXXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          mkdir -m700 "$stage/base" "$stage/expected"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/repair-cost" archive --format=tar 62c7a42c5288d83d23291a7f042ad8fa97a98bce | tar -x -C "$stage/base"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/repair-correctness9000" archive --format=tar 6402dd1cfbcc2eebb17ff511d0c1c4694bb53dda | tar -x -C "$stage/expected"
          export REPAIR_CORRECTNESS_BASE_SOURCE="$stage/base"
          export REPAIR_CORRECTNESS_EXPECTED_SOURCE="$stage/expected"
          python3 -B -W error scripts/ci/repair16k-inner-diagnostics-source/test_correctness9000.py
          python3 -B -W error scripts/ci/repair16k-inner-diagnostics-source/correctness9000.py --help
