# SPDX-License-Identifier: MIT
name: Minimal206 corrected native-source DATA
on:
  pull_request:
    paths:
      - '.github/workflows/llhttp-minimal-native-source-data.yml'
      - 'scripts/ci/llhttp-minimal-native-source-data/**'
      - 'scripts/ci/llhttp-minimal-builder-source/**'
      - 'scripts/ci/llhttp-minimal-builder-command512/**'
      - 'scripts/port/minimal-native-builder-inputs/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/llhttp-minimal-native-source-data.yml'
      - 'scripts/ci/llhttp-minimal-native-source-data/**'
      - 'scripts/ci/llhttp-minimal-builder-source/**'
      - 'scripts/ci/llhttp-minimal-builder-command512/**'
      - 'scripts/port/minimal-native-builder-inputs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    name: Corrected minimal206 source DATA (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check the closed source fixture and corrected authored DATA controls
        run: |
          set -euo pipefail
          python -I -B -Werror::ResourceWarning scripts/ci/llhttp-minimal-native-source-data/ci.py
