name: native-arm-build-batch-trial
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source SHA, equal to this workflow revision
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-arm-build-batch-trial
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 95
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      SLICE: scripts/ci/build-batch-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Prove new exact batch-trial source before secrets
        id: proof
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' '8fe7f5311f9290fe4e537c45fad3b1f24725e25e1478254056487ff8ebfe2d7f' "$SLICE/trial.py" '5cc3696b529cc742f574a0f79906c5c6df43e42c18fee65b1329ec8575f4b00f' "$SLICE/contract.py" '74ea2c4d04ef0ad863e07b8754c660feac8f5177863016ea9f1cd7d72a06ca49' "$SLICE/planner_transport.py" '2fe041410ad65090d05636a18b4b63ae185138373a2b338b16c42d4cce87e48c' "$SLICE/provider_bindings.py" '05fa88140f812877094a69ecc479b3e343fcd7f5f091af6f96e2c482f3493392' "$SLICE/capture_providers.py" '501ddc26f9200c840f4b2c72578bf1c18571a5e36c0e8e808e4c206b192cdb0e' "$SLICE/source-manifest.json" | sha256sum --check
          python3 -B "$SLICE/trial.py" proof --source "$GITHUB_WORKSPACE" --proof "$RUNNER_TEMP/batch-native-source-proof.json"
      - name: Focused source-only native trial controls
        timeout-minutes: 2
        run: python3 -B "$SLICE/test_trial.py"
      - name: Seed the six exact retained inputs using existing secrets only
        timeout-minutes: 2
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: >-
          python3 -I -B scripts/ci/maintained_desktop574.py seed
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$RUNNER_TEMP/desktop574"
      - name: Checkout exact retained public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed fourteen exact public ARM input files
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3' 'retained-public-inputs/seed.py' 'a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300' 'retained-public-inputs/index.json' | sha256sum --check
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 TZ=UTC TMPDIR="$RUNNER_TEMP" python3 -I -B "$GITHUB_WORKSPACE/retained-public-inputs/seed.py" --cache "$RUNNER_TEMP/desktop574/context/deps"
      - name: Checkout exact complete original574 retained inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ddc6ca5f3478f9c607f8fae52661c451ae0bf3ad
          path: retained574
          persist-credentials: false
      - name: Reconstruct pinned inputs and run offline owned native574 transaction
        timeout-minutes: 40
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: >-
          timeout --signal=TERM --kill-after=10s 2300s
          python3 -I -B scripts/ci/setup7-native/producer.py
          --source "$GITHUB_WORKSPACE" --carrier "$GITHUB_WORKSPACE/retained574"
          --output "$RUNNER_TEMP/desktop574" --job-token "$JOB_TOKEN"
      - name: Conditional real two-package failure and resume trial
        timeout-minutes: 20
        run: >-
          timeout --signal=TERM --kill-after=30s 1100s
          python3 -B "$SLICE/trial.py" run
          --source "$GITHUB_WORKSPACE" --base "$RUNNER_TEMP/desktop574"
          --output "$RUNNER_TEMP/batch-native-runtime"
          --proof "$RUNNER_TEMP/batch-native-source-proof.json"
      - name: Retire owned batch consumers before original native574 producer
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 240s python3 -B "$SLICE/trial.py" cleanup --source "$GITHUB_WORKSPACE" --base "$RUNNER_TEMP/desktop574" --output "$RUNNER_TEMP/batch-native-runtime" --cleanup "$RUNNER_TEMP/batch-native-consumer-cleanup.json"
          timeout --signal=TERM --kill-after=10s 90s python3 -I -B scripts/ci/maintained_desktop574.py cleanup --inputs scripts/ci/maintained-desktop574-inputs.json --output "$RUNNER_TEMP/desktop574" --job-token "${{ steps.proof.outputs.job_token }}"
      - name: Retain bounded public trial evidence
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 2
        run: >-
          python3 -B "$SLICE/trial.py" retain
          --source "$GITHUB_WORKSPACE" --base "$RUNNER_TEMP/desktop574"
          --output "$RUNNER_TEMP/batch-native-runtime" --proof "$RUNNER_TEMP/batch-native-source-proof.json"
          --cleanup "$RUNNER_TEMP/batch-native-consumer-cleanup.json" --public "$RUNNER_TEMP/batch-native-public"
      - name: Upload only the bounded public evidence directory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 2
        with:
          name: batch-native-trial-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/batch-native-public/
