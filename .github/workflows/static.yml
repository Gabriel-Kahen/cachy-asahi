name: static-validation
on:
  push:
    branches: [main, codex/virtual-integration]
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      measure-cache:
        description: Run one cold setup followed by the full static suite on a fresh warm runner
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      setup-phase:
        description: Explicit normal or warm setup; warm requires a cold predecessor
        type: string
        default: normal
      cold-receipt:
        description: Completed same-run cold predecessor; empty preserves normal validation
        type: string
        default: ''
permissions:
  contents: read
jobs:
  cache-seed:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.measure-cache }}
    runs-on: ubuntu-24.04
    outputs:
      receipt: ${{ steps.setup.outputs.receipt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Establish cold setup and seed this run's exact cache
        id: setup
        uses: ./.github/actions/static-prerequisites
        with:
          phase: cold
  checks:
    needs: cache-seed
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.measure-cache && needs.cache-seed.result == 'success') || (!(github.event_name == 'workflow_dispatch' && inputs.measure-cache) && needs.cache-seed.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install verified test prerequisites on disposable runner
        uses: ./.github/actions/static-prerequisites
        with:
          phase: ${{ github.event_name == 'workflow_dispatch' && inputs.measure-cache && 'warm' || inputs.setup-phase || 'normal' }}
          cold-receipt: ${{ github.event_name == 'workflow_dispatch' && inputs.measure-cache && needs.cache-seed.outputs.receipt || inputs.cold-receipt }}
      - name: Static prerequisite receipt controls without APT or cache service
        run: python3 -I -B -Werror scripts/ci/test_static_apt_trial.py -v
      - name: Copy preparation interruption and owned disposal controls
        env:
          APPS_COPY_RECOVERY_WORK: /tmp
        run: python3 -I -B -Werror scripts/apps/test_prepare_copy_recovery.py
      - name: Checkout pinned historical604 runtime source for derivative controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3e71f2de1810d3eb94ab1621d23a087b27ea2568
          path: .ci-inputs/historical604-runtime
          persist-credentials: false
      - name: Verify packaged setup source and sync boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 packages/settings/cachy-asahi-setup/check-sync.py
          python3 packages/settings/cachy-asahi-setup/test-sync.py -v
          python3 -B packages/tools/cachy-asahi-topmem/test_topmem.py -v
      - name: Check accepted Setup8 snapshot, canonical sync and package controls
        run: |
          python3 -I -B packages/tools/cachy-asahi-setup8/check-sync.py --snapshot
          python3 -I -B packages/tools/cachy-asahi-setup8/check-sync.py --root "$PWD"
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-setup8/test_config_migrate.py -v
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-setup8/test_package.py -v
          python3 -I -B - <<'PY'
          import importlib.util, json
          from pathlib import Path
          path = Path('scripts/checks/package_checks.py').resolve()
          spec = importlib.util.spec_from_file_location('setup8_checks', path)
          checks = importlib.util.module_from_spec(spec); spec.loader.exec_module(checks)
          report = checks.recipe(Path('packages/tools/cachy-asahi-setup8/PKGBUILD'))
          print(json.dumps(report, sort_keys=True, indent=2))
          assert not report['errors'], report['errors']
          metadata = report['metadata']
          assert metadata['pkgname'] == ['cachy-asahi-setup']
          assert metadata['pkgver'] == ['0.3.0'] and metadata['pkgrel'] == ['1']
          assert metadata['arch'] == ['any'] and metadata['license'] == ['MIT']
          assert set(metadata['depends']) == {'python>=3.11', 'gnupg', 'pacman'}
          assert len(report['input_sha256']) == 20
          PY
      - name: Validate tooling and safety boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          if os.getuid() == 0 or os.geteuid() == 0:
              raise SystemExit('software fixtures require an ordinary non-root runner')
          runner = """import sys, unittest
          suite = unittest.TestLoader().discover(sys.argv[1], pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun == 0:
              raise SystemExit(f'{sys.argv[1]}: failures, skips, or empty suite')
          """
          with tempfile.TemporaryDirectory(prefix='static-fixtures-') as temporary:
              home = Path(temporary) / 'home'
              home.mkdir(mode=0o700)
              env = dict(os.environ, HOME=str(home), ZDOTDIR=str(home),
                         XDG_CONFIG_HOME=str(home / '.config'), XDG_STATE_HOME=str(home / '.local/state'),
                         XDG_CACHE_HOME=str(home / '.cache'), XDG_DATA_HOME=str(home / '.local/share'))
              for directory in ('tests', 'scripts/setup', 'scripts/ci', 'scripts/integration',
                                'scripts/hardware', 'scripts/benchmarks', 'scripts/maintenance'):
                  subprocess.run([sys.executable, '-B', '-c', runner, directory], env=env, check=True)
          PY
          bash -n scripts/build/container-entry.sh
          bash -n scripts/build/container-entry-v2.sh
      - name: Check explicit Apps7 inventory parser candidate
        run: |
          python3 -I -B packages/tools/cachy-asahi-apps7/check_source.py --repository-source "$PWD" --recipe-root packages/tools/cachy-asahi-apps7
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-apps7/test_apps.py --repository-source "$PWD" --app-recipe-root packages/tools/cachy-asahi-apps7 --runtime-recipe-root packages/tools/cachy-asahi-repository-runtime -v
      - name: Check opt-in installed repository client v2
        run: |
          python3 -I -B packages/tools/cachy-asahi-repository-client-v2/check_source.py --recipe-root packages/tools/cachy-asahi-repository-client-v2
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-repository-client-v2/test_runtime.py --recipe-root packages/tools/cachy-asahi-repository-client-v2 --runtime-recipe-root packages/tools/cachy-asahi-repository-runtime
      - name: Check default Apps7 and client v2 native source without actors
        run: |
          python3 -I -B scripts/ci/apps7-client-native/preflight.py --source "$PWD"
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/apps7-client-native -p test_lane.py -v
      - name: Check default DNS and sysctl native lane without actors
        run: |
          python3 -I -B scripts/ci/dns-sysctl-native/preflight.py --source "$PWD"
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/dns-sysctl-native -p test_lane.py -v
      - name: Check default DNS and sysctl upgrade lanes without actors
        run: |
          python3 -I -B scripts/ci/sysctl2-upgrade-native/preflight.py --source "$PWD"
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/sysctl2-upgrade-native -p test_lane.py -v
          python3 -I -B scripts/ci/dns2-native-upgrade/preflight.py --source "$PWD"
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/dns2-native-upgrade -p test_lane.py -v
      - name: Check opt-in DNS and named sysctl controls without host changes
        run: |
          python3 -I -B packages/tools/cachy-asahi-dns/check_source.py --recipe-root packages/tools/cachy-asahi-dns
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-dns/test_dns.py
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-sysctl/test_sysctl.py
          bash -n packages/tools/cachy-asahi-dns/PKGBUILD packages/tools/cachy-asahi-sysctl/PKGBUILD
      - name: Check read-only DNS profile and sysctl experiment discovery
        run: |
          python3 -I -B packages/tools/cachy-asahi-dns2/check_source.py --recipe-root packages/tools/cachy-asahi-dns2
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-dns2/test_dns.py
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-sysctl2/test_sysctl.py
          bash -n packages/tools/cachy-asahi-dns2/PKGBUILD packages/tools/cachy-asahi-sysctl2/PKGBUILD
      - name: Check default KSM native upgrade source without actors
        run: |
          python3 -I -B scripts/ci/ksm2-upgrade-native/prepare.py --source "$PWD" --output "$RUNNER_TEMP/ksm2-upgrade-source" --baseline-recipe "$PWD/packages/tools/cachy-asahi-ksmctl" --candidate-recipe "$PWD/packages/tools/cachy-asahi-ksmctl2"
          python3 -I -B "$RUNNER_TEMP/ksm2-upgrade-source/scripts/ci/ksm2-upgrade-native/preflight.py" --source "$RUNNER_TEMP/ksm2-upgrade-source"
          python3 -B -Werror::ResourceWarning -m unittest discover -s "$RUNNER_TEMP/ksm2-upgrade-source/scripts/ci/ksm2-upgrade-native" -p test_lane.py -v
      - name: Emit exact KSM diagnostic kernel source without building
        run: |
          python3 -I -B scripts/ci/ksm2-kernel-native/prepare.py --source "$PWD" --output "$RUNNER_TEMP/ksm2-kernel-source"
          KSM2_FACTORY_SOURCE="$PWD" python3 -I -B scripts/ci/ksm2-kernel-native/test_prepare.py
          python3 -B "$RUNNER_TEMP/ksm2-kernel-source/scripts/ci/ksm2-kernel-native/lane.py" preflight --source "$RUNNER_TEMP/ksm2-kernel-source"
          python3 -B -Werror::ResourceWarning "$RUNNER_TEMP/ksm2-kernel-source/scripts/ci/ksm2-kernel-native/test_lane.py"
      - name: Check GNU verity diagnostic kernel source without build or boot
        run: |
          python3 -B scripts/ci/gnu-verity-kernel-native/prepare.py --own "$PWD" --inputs "$PWD" --output "$RUNNER_TEMP/gnu-verity-kernel-source"
          python3 -B "$RUNNER_TEMP/gnu-verity-kernel-source/scripts/ci/gnu-verity-kernel-native/lane.py" preflight --source "$RUNNER_TEMP/gnu-verity-kernel-source"
          python3 -B -Werror::ResourceWarning "$RUNNER_TEMP/gnu-verity-kernel-source/scripts/ci/gnu-verity-kernel-native/test_lane.py"
      - name: Emit standalone GNU boot and DM probe NULL default source without actors
        run: |
          python3 -I -B scripts/ci/gnu-verity-kernel-boot-probe-source/prepare.py --own "$PWD" --output "$RUNNER_TEMP/gnu-verity-boot-default-source"
          python3 -I -B "$RUNNER_TEMP/gnu-verity-boot-default-source/scripts/ci/gnu-verity-kernel-boot-probe/entry.py" check-source --source "$RUNNER_TEMP/gnu-verity-boot-default-source"
          python3 -I -B "$RUNNER_TEMP/gnu-verity-boot-default-source/scripts/ci/gnu-verity-kernel-boot-probe/test_entry.py"
          python3 -I -B -Werror::ResourceWarning scripts/ci/gnu-verity-kernel-boot-probe-source/test_prepare.py
      - name: Emit standalone GNU verity mapping smoke NULL default source without actors
        run: |
          python3 -I -B scripts/ci/gnu-verity-mapping-smoke-source/prepare.py --own "$PWD" --output "$RUNNER_TEMP/gnu-verity-mapping-default-source"
          python3 -I -B "$RUNNER_TEMP/gnu-verity-mapping-default-source/scripts/ci/gnu-verity-mapping-smoke/entry.py" check-source --source "$RUNNER_TEMP/gnu-verity-mapping-default-source"
          python3 -I -B "$RUNNER_TEMP/gnu-verity-mapping-default-source/scripts/ci/gnu-verity-mapping-smoke/test_entry.py"
          python3 -I -B -Werror::ResourceWarning scripts/ci/gnu-verity-mapping-smoke-source/test_prepare.py
      - name: Checkout whole copied606 code basis for optional KSM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9afbc5a373b1b027b89bb7ab32b4386269a21360
          path: ksm606-copy-basis
          persist-credentials: false
      - name: Checkout native KSM code and private controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 72ea5a1e81268f08da9b9cc04cdc7e23a1a9ff8a
          path: ksm606-native-source
          persist-credentials: false
      - name: Checkout renewed KSM TEST signature DATA without activation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fe67aaaae7ef4ea94dfc8a42cd2c806cc5436fc7
          path: ksm606-native-data
          persist-credentials: false
      - name: Emit complete606 optional KSM2 source without actors
        run: |
          python3 -I -B scripts/ci/current606-ksm2-copy/prepare.py --basis-source "$PWD/ksm606-copy-basis" --native-source "$PWD/ksm606-native-source" --owner-source "$PWD/scripts/ci/current606-ksm2-closed-owner" --output "$RUNNER_TEMP/ksm606-roles"
          python3 -I -B scripts/ci/current606-ksm2-closed-owner/prepare.py --held606-source "$RUNNER_TEMP/ksm606-roles/held606" --bridge-source "$RUNNER_TEMP/ksm606-roles/bridge" --copyworker-source "$RUNNER_TEMP/ksm606-roles/copyworker" --output "$RUNNER_TEMP/ksm606-source" --authorization "$RUNNER_TEMP/ksm606-authorization.json"
          python3 -I -B "$RUNNER_TEMP/ksm606-source/scripts/ci/current606-ksm2-closed-owner/test_owner.py"
          python3 -I -B "$RUNNER_TEMP/ksm606-source/copyworker/scripts/ci/current606-ksm2-copy/test_worker.py"
          python3 -I -B - <<'PYKSM360SOURCE'
          """Exact360 NULL source and complete32 native DATA provenance; no activation."""
          import hashlib,importlib.util,json,os,subprocess,sys
          from pathlib import Path
          from unittest.mock import patch
          root=Path(os.environ['RUNNER_TEMP'])/'ksm606-source';raw=(root.parent/'ksm606-authorization.json').read_bytes();assert len(raw)==62169 and hashlib.sha256(raw).hexdigest()=='f3353f6c43425237ee2a3b5bb0c07c8c4399fe7306f78f80469001bb2e25b7bd';rows=json.loads(raw);assert len(rows)==360
          assert {p.relative_to(root).as_posix()for p in root.rglob('*')if p.is_file()}==set(rows)
          assert all(not p.is_symlink()and(p.is_file()or p.is_dir())for p in root.rglob('*'))
          for n,row in rows.items():
           p=root/n;assert not any(q.is_symlink()for q in(p,*p.parents));value=p.read_bytes();assert dict(bytes=len(value),sha256=hashlib.sha256(value).hexdigest())==row
          lane=root/'scripts/ci/current606-ksm2-closed-owner';policy=json.loads((lane/'input-policy.json').read_bytes());assert policy==(json.loads((lane/'null-policy.json').read_bytes()));assert all(policy[k]is None for k in('actual_source','actual_ref','actual_run','nonce','measurement','output','retirement','capture_receipt','native_pair_source','native_pair_index'));assert all(v is None for v in policy['current606'].values())
          worker=root/'copyworker/scripts/ci/current606-ksm2-copy';sys.path.insert(0,str(worker))
          for name,file in(('contract','contract.py'),('_canonical_native_data_inputs','inputs.py')):
           spec=importlib.util.spec_from_file_location(name,worker/file);module=importlib.util.module_from_spec(spec);sys.modules[name]=module;spec.loader.exec_module(module)
          with patch.object(subprocess,'Popen',side_effect=AssertionError('SOURCE_ONLY_NO_ACTORS')),patch.object(subprocess,'run',side_effect=AssertionError('SOURCE_ONLY_NO_ACTORS')),patch.object(subprocess,'check_output',side_effect=AssertionError('SOURCE_ONLY_NO_ACTORS')):native=module.inspect(Path.cwd()/'ksm606-native-data/payload')
          assert native['signer']=='D0B033AD1C44F88A1B64A645D72B18C8C32E249A'and native['version']=='0.1.0-2'
          print(json.dumps(dict(status='PASS_CANONICAL_COMPLETE360_NULL_AND_NATIVE32_DATA_ONLY',files=360,native_data_source='fe67aaaae7ef4ea94dfc8a42cd2c806cc5436fc7',actual_source=None,actual_ref=None,actual_run=None,acceptance='NOT_GRANTED'),sort_keys=True))
          PYKSM360SOURCE
      - name: Checkout whole frozen KSM hosted runtime without activation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fe43a83e80aef1463202e348a8dd795ea48264a4
          path: .ci-inputs/ksm2-hosted-runtime
          persist-credentials: false
      - name: Emit and check default KSM hosted source without component activation
        run: |
          python3 -I -B scripts/ci/ksm2-generic16k-vm-hosted/prepare.py --runtime "$PWD/.ci-inputs/ksm2-hosted-runtime/runtime" --output "$RUNNER_TEMP/ksm2-hosted-source"
          python3 -I -B "$RUNNER_TEMP/ksm2-hosted-source/scripts/ci/ksm2-generic16k-vm-hosted/entry.py" source --source "$RUNNER_TEMP/ksm2-hosted-source"
          python3 -I -B -Werror::ResourceWarning "$RUNNER_TEMP/ksm2-hosted-source/scripts/ci/ksm2-generic16k-vm-hosted/test_lane.py" --source "$RUNNER_TEMP/ksm2-hosted-source" -v
          python3 -I -B -Werror::ResourceWarning "$RUNNER_TEMP/ksm2-hosted-source/scripts/ci/ksm2-generic16k-vm-hosted/test_archive32.py"
      - name: Check explicit KSM scanning experiments in private fixtures
        run: |
          python3 -I -B packages/tools/cachy-asahi-ksmctl2/check-source.py
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-ksmctl2/test_ksmctl.py
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-ksmctl2/test_experiment.py
          python3 -I -B packages/tools/cachy-asahi-ksmctl2/cachy-asahi-ksm-experiment --help >/dev/null
          bash -n packages/tools/cachy-asahi-ksmctl2/PKGBUILD
      - name: Exercise planned repository key rotation without skipped controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(id -u)" -ne 0
          for tool in gpg gpgconf pacman-key pacman-conf unshare; do command -v "$tool"; done
          userns_previous=
          restore_userns() {
            if [ -n "$userns_previous" ]; then
              sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$userns_previous"
            fi
          }
          trap restore_userns EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          if ! unshare --user --map-root-user -- true; then
            test "${GITHUB_ACTIONS:-}" = true
            test "${RUNNER_OS:-}" = Linux
            userns_previous=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
            test "$userns_previous" = 1
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user -- true
          TMPDIR=/tmp python3 -I -B -Werror::ResourceWarning - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import tempfile
          import unittest

          if os.getuid() == 0 or os.geteuid() == 0:
              raise SystemExit('repository fixtures require an ordinary non-root runner')
          spec = importlib.util.spec_from_file_location('rotation_controls', Path('scripts/repository/test_rotate.py'))
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory(prefix='repository-ci-') as temporary:
              home = Path(temporary) / 'home'
              home.mkdir(mode=0o700)
              os.environ['HOME'] = str(home)
              suite = unittest.defaultTestLoader.loadTestsFromModule(module)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful() or result.skipped or result.testsRun < 24:
                  raise SystemExit('repository rotation: failures, skips, or incomplete control suite')
          PY
      - name: Exercise release and client contracts without skipped tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B - <<'PY'
          import importlib.util, tempfile, unittest
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('measurement_components', 'scripts/ci/measurement-tools-components-v1.py')
          measurement = importlib.util.module_from_spec(spec); spec.loader.exec_module(measurement)
          for directory in ('scripts/release', 'scripts/client', 'scripts/benchmarks'):
              suite = unittest.TestLoader().discover(directory, pattern='test_*.py')
              with tempfile.TemporaryDirectory(prefix='static-measurement-source-') as temporary:
                  with measurement.discovered_source_fixture(suite, Path.cwd(), Path(temporary)):
                      result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful() or result.skipped or result.testsRun == 0:
                  raise SystemExit(f'{directory}: failures, skips, or empty suite')
          PY
      - name: Check offline exact platform and recovery preflight
        run: python3 -B -Werror::ResourceWarning scripts/platform/test_recovery_preflight.py
      - name: Check read-only exact-target snapshot collection
        run: python3 -B -Werror::ResourceWarning scripts/platform/test_target_snapshot.py
      - name: Check platform comparison and maintained ARM build planning
        run: |
          python3 -B -Werror::ResourceWarning scripts/platform/test_snapshot_compare.py
          python3 -B -Werror::ResourceWarning scripts/maintenance/test_rebuild_plan.py
          python3 -B -Werror::ResourceWarning scripts/maintenance/test_rebuild_provider_selections.py
          python3 -B -Werror::ResourceWarning scripts/maintenance/test_update_plan.py
          python3 -B -Werror::ResourceWarning scripts/maintenance/test_import_release_graph.py
          python3 -B -Werror::ResourceWarning scripts/platform/test_retained_bundle.py
          python3 -B -Werror::ResourceWarning scripts/maintenance/test_build_batch.py
          python3 -B -Werror::ResourceWarning scripts/maintenance/test_build_batch_e2e.py
          python3 -B -Werror::ResourceWarning scripts/maintenance/test_build_outputs.py
          python3 -B -Werror::ResourceWarning scripts/maintenance/test_health.py
          python3 -B -Werror::ResourceWarning scripts/maintenance/test_source_cache.py
          python3 -B -Werror::ResourceWarning scripts/setup/test_config_migrate.py
      - name: Check packaged offline maintenance health
        run: python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-maintenance/test_package.py --recipe-root packages/tools/cachy-asahi-maintenance
      - name: Check bounded session diagnostics and installed package
        run: |
          python3 -B -Werror::ResourceWarning scripts/hardware/test_session_probe.py
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-session-diagnostics/test_session_probe.py
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-session-diagnostics/test_package.py
      - name: Check isolated ARM experiment packages with pinned source on host ISA
        run: |
          c01_source_dir="$(mktemp -d "$RUNNER_TEMP/c01-package-source.XXXXXX")"
          trap 'rm -rf -- "$c01_source_dir"' EXIT
          curl --fail --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 60 --max-filesize 2000000 --retry 2 \
            --output "$c01_source_dir/zlib-1.3.2.tar.gz" 'https://zlib.net/zlib-1.3.2.tar.gz'
          printf '%s  %s\n' 'bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16' "$c01_source_dir/zlib-1.3.2.tar.gz" | sha256sum --check
          printf '%s  %s\n' 'fc853bd6890b76f05178eba69436da434dd6b99daf166301f692b725d7c39e25' 'scripts/experiments/fixtures/c01-packages.lock' | sha256sum --check
          CACHY_ASAHI_ZLIB_SOURCE="$c01_source_dir/zlib-1.3.2.tar.gz" \
            CACHY_ASAHI_ZLIB_PACKAGES="$GITHUB_WORKSPACE/scripts/experiments/fixtures/c01-packages.lock" \
