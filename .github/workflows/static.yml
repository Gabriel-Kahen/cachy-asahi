        run: python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/welcome-doctor-generic16k -p 'test_*.py'
      - name: Check historical Welcome1 installed managed GUI contracts without actors
        working-directory: ${{ runner.temp }}/welcome1-static
        env:
          WELCOME_GUI_ASSETS: ${{ github.workspace }}/.ci-inputs/welcome-native
        run: |
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/welcome-managed-gui -p test_gui.py
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/welcome-managed-gui -p test_phase.py
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/welcome-managed-gui -p test_doctor_worker.py
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/welcome-managed-gui -p test_compositor_log.py
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/welcome-managed-gui/ci -p 'test_*.py'
      - name: Check generic 16 KiB build and fixture controls without kernel or VM actors
        run: python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/virtual/generic16k -p 'test_*.py'
      - name: Check 16 KiB audio producer and userspace fixture without actors
        run: |
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/generic16k-audio-userspace -p 'test_*.py'
          bash -n scripts/ci/generic16k-audio-userspace/ci_sequence.sh
      - name: Check bounded root observations without package actors
        run: |
          python3 -B scripts/update/test_full_root.py
          python3 -B scripts/update/test_full_root_hardlinks.py
          python3 -B scripts/update/test_measure_copy.py
          python3 -B scripts/update/test_measure_copy_hardlinks.py
          python3 -B scripts/update/test_root_path.py
      - name: Check isolated offline LV2 caller boundaries without actors
        run: |
          python3 -B scripts/ci/asahi-lsp-offline/test_container.py
          python3 -B scripts/ci/asahi-lsp-offline/test_run.py
          python3 -B scripts/ci/asahi-lsp-offline/test_job.py
      - name: Check fixed Rust LV2 caller boundaries without plugin execution
        run: |
          python3 -B scripts/ci/asahi-rust-lv2-offline/test_container.py
          python3 -B scripts/ci/asahi-rust-lv2-offline/test_run.py
          python3 -B scripts/ci/asahi-rust-lv2-offline/test_job.py
      - name: Checkout exact immutable GNU runtime667 source without activation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: c8886e2ddb2c224750e5da4f3ac35d4c3a6c8d72
          path: .ci-inputs/gnu-immutable-runtime667
          persist-credentials: false
      - name: Check maintained GNU immutable deployment source and NULL gates without actors
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/gnu-immutable-source-native/prepare.py --runtime "$GITHUB_WORKSPACE/.ci-inputs/gnu-immutable-runtime667" --output "$RUNNER_TEMP/gnu-immutable-default"
          python3 -I -B "$RUNNER_TEMP/gnu-immutable-default/scripts/ci/gnu-immutable-source-native/entry.py" source --source "$RUNNER_TEMP/gnu-immutable-default"
          python3 -I -B "$RUNNER_TEMP/gnu-immutable-default/scripts/ci/gnu-immutable-source-native/test_deployment.py" --source "$RUNNER_TEMP/gnu-immutable-default"
      - name: Inspect recipes without sourcing them
        run: python3 scripts/checks/package_checks.py recipes --require-recipes
      - name: Check recipe syntax without executing it
        run: |
          find packages -name PKGBUILD -type f -print0 | xargs -0 -r -n1 bash -n
      - name: Check isolated native notification diagnostic without actors
        run: python3 -I -B -Werror::ResourceWarning scripts/diagnostics/fish-done-native-graphics/test_run.py
      - name: Historical ARM experiment generic16K owner controls without execution
        working-directory: ${{ github.workspace }}/.ci-inputs/historical604-runtime
        run: python3 -B -Werror::ResourceWarning scripts/ci/arm-experiments-generic16k-ci/test_owner.py
      - name: Report one matched hosted setup pair after the full static suite
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.measure-cache) || inputs.setup-phase == 'warm' }}
        run: python3 -I -B scripts/ci/static_apt_trial.py report

  developer-release-components:
    needs: component-selection
    if: ${{ !cancelled() && (needs.component-selection.result != 'success' || needs.component-selection.outputs.run != 'false') }}
    name: Developer/release ${{ matrix.component }} (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.component-selection.result == 'success' && needs.component-selection.outputs.matrix || '{"include":[{"component":"sbom-comparison","python":"3.12","tests":25},{"component":"sbom-comparison","python":"3.14","tests":25},{"component":"developer-package","python":"3.12","tests":13},{"component":"developer-package","python":"3.14","tests":13},{"component":"release-package","python":"3.14","tests":13},{"component":"release-package-v2","python":"3.14","tests":7}]}') }}
    steps:
      - name: Checkout exact component source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Select supported component Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Bind fixed launcher interpreter on this disposable component runner
        env:
          COMPONENT_PYTHON: ${{ matrix.python }}
        run: |
          selected=$(python -I -c 'import sys; print(sys.executable)')
          sudo ln -sfn "$selected" /usr/bin/python3
          /usr/bin/python3 -I -c 'import os,sys; assert ".".join(map(str,sys.version_info[:2])) == os.environ["COMPONENT_PYTHON"]; print(sys.executable,sys.version)'
          if [[ "$COMPONENT_PYTHON" == 3.14 ]]; then
            /usr/bin/python3 -I -c 'from compression import zstd; assert zstd.decompress(zstd.compress(b"decoder-control")) == b"decoder-control"'
          fi
      - name: Run only the selected integrated focused suite
        env:
          COMPONENT: ${{ matrix.component }}
          EXPECTED_TESTS: ${{ matrix.tests }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          case "$COMPONENT" in
            sbom-comparison) suite=scripts/release/test_compare_sboms.py ;;
            developer-package) suite=packages/tools/cachy-asahi-developer-tools/cachy-asahi-developer-tools-0.1.0/test_package.py ;;
            release-package) suite=packages/tools/cachy-asahi-release-tools/test_package.py ;;
            release-package-v2) suite=packages/tools/cachy-asahi-release-tools-v2/test_package.py ;;
            *) exit 2 ;;
          esac
          python -I -B -Werror::ResourceWarning - "$suite" "$EXPECTED_TESTS" <<'PY'
          import importlib.util, sys, unittest
          spec = importlib.util.spec_from_file_location('focused_component', sys.argv[1])
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          assert suite.countTestCases() == int(sys.argv[2]), 'focused suite count changed'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped, 'focused component failed or skipped'
          PY

  component-selection:
    name: Conservative component selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout bounded depth-two selector source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 2
          fetch-tags: false
      - name: Check selector failure and coverage controls
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/component_selection/test_select.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/component_selection/test_collect.py
      - name: Select reviewed components or the complete baseline
        id: select
        shell: bash
        env:
          SELECTION_EVENT: ${{ github.event_name }}
          SELECTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SELECTION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SELECTION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          component_diff() {
            timeout 30s git diff --no-ext-diff --no-renames --name-status -z "$1" "$2" -- | head -c 1048577 > "$3"
          }
          source scripts/ci/component_selection/collect.sh
          collect_components static
