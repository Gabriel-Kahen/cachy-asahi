name: static-validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install test prerequisites on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bash fish zsh vim build-essential clang lld gnupg libarchive-tools pacman-package-manager makepkg e2fsprogs network-manager pkg-config libgtk-3-dev
          for tool in bash fish zsh vim cc clang ld.lld gpg gpgconf repo-add bsdtar vercmp pacman mkfs.ext4 debugfs nmcli; do command -v "$tool"; done
          dpkg-query -W bash fish zsh vim build-essential clang lld gnupg libarchive-tools pacman-package-manager makepkg e2fsprogs network-manager pkg-config libgtk-3-dev
      - name: Verify packaged setup source and sync boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 packages/settings/cachy-asahi-setup/check-sync.py
          python3 packages/settings/cachy-asahi-setup/test-sync.py -v
          python3 -B packages/tools/cachy-asahi-topmem/test_topmem.py -v
      - name: Validate tooling and safety boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          if os.getuid() == 0 or os.geteuid() == 0:
              raise SystemExit('software fixtures require an ordinary non-root runner')
          runner = """import sys, unittest
          suite = unittest.TestLoader().discover(sys.argv[1], pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun == 0:
              raise SystemExit(f'{sys.argv[1]}: failures, skips, or empty suite')
          """
          with tempfile.TemporaryDirectory(prefix='static-fixtures-') as temporary:
              home = Path(temporary) / 'home'
              home.mkdir(mode=0o700)
              env = dict(os.environ, HOME=str(home), ZDOTDIR=str(home),
                         XDG_CONFIG_HOME=str(home / '.config'), XDG_STATE_HOME=str(home / '.local/state'),
                         XDG_CACHE_HOME=str(home / '.cache'), XDG_DATA_HOME=str(home / '.local/share'))
              for directory in ('tests', 'scripts/setup', 'scripts/ci', 'scripts/integration',
                                'scripts/hardware', 'scripts/benchmarks', 'scripts/maintenance'):
                  subprocess.run([sys.executable, '-B', '-c', runner, directory], env=env, check=True)
          PY
          bash -n scripts/build/container-entry.sh
      - name: Check explicit Apps7 inventory parser candidate
        run: |
          python3 -I -B packages/tools/cachy-asahi-apps7/check_source.py --repository-source "$PWD" --recipe-root packages/tools/cachy-asahi-apps7
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-apps7/test_apps.py --repository-source "$PWD" --app-recipe-root packages/tools/cachy-asahi-apps7 --runtime-recipe-root packages/tools/cachy-asahi-repository-runtime -v
      - name: Check opt-in installed repository client v2
        run: |
          python3 -I -B packages/tools/cachy-asahi-repository-client-v2/check_source.py --recipe-root packages/tools/cachy-asahi-repository-client-v2
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-repository-client-v2/test_runtime.py --recipe-root packages/tools/cachy-asahi-repository-client-v2 --runtime-recipe-root packages/tools/cachy-asahi-repository-runtime
      - name: Check default Apps7 and client v2 native source without actors
        run: |
          python3 -I -B scripts/ci/apps7-client-native/preflight.py --source "$PWD"
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/apps7-client-native -p test_lane.py -v
      - name: Check default DNS and sysctl native lane without actors
        run: |
          python3 -I -B scripts/ci/dns-sysctl-native/preflight.py --source "$PWD"
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/dns-sysctl-native -p test_lane.py -v
      - name: Check default DNS and sysctl upgrade lanes without actors
        run: |
          python3 -I -B scripts/ci/sysctl2-upgrade-native/preflight.py --source "$PWD"
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/sysctl2-upgrade-native -p test_lane.py -v
          python3 -I -B scripts/ci/dns2-native-upgrade/preflight.py --source "$PWD"
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/dns2-native-upgrade -p test_lane.py -v
      - name: Check opt-in DNS and named sysctl controls without host changes
        run: |
          python3 -I -B packages/tools/cachy-asahi-dns/check_source.py --recipe-root packages/tools/cachy-asahi-dns
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-dns/test_dns.py
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-sysctl/test_sysctl.py
          bash -n packages/tools/cachy-asahi-dns/PKGBUILD packages/tools/cachy-asahi-sysctl/PKGBUILD
      - name: Check read-only DNS profile and sysctl experiment discovery
        run: |
          python3 -I -B packages/tools/cachy-asahi-dns2/check_source.py --recipe-root packages/tools/cachy-asahi-dns2
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-dns2/test_dns.py
          python3 -I -B -Werror::ResourceWarning packages/tools/cachy-asahi-sysctl2/test_sysctl.py
          bash -n packages/tools/cachy-asahi-dns2/PKGBUILD packages/tools/cachy-asahi-sysctl2/PKGBUILD
      - name: Exercise release and client contracts without skipped tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B - <<'PY'
          import unittest
          for directory in ('scripts/release', 'scripts/client'):
              suite = unittest.TestLoader().discover(directory, pattern='test_*.py')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful() or result.skipped or result.testsRun == 0:
                  raise SystemExit(f'{directory}: failures, skips, or empty suite')
          PY
      - name: Check fixed build-only Asahi data candidate boundaries
        run: python3 -B scripts/ci/asahi-audio-data/test_run.py
      - name: Check fixed build-only audio Rust candidate boundaries
        run: python3 -B scripts/ci/asahi-audio-rust/test_scoped_build.py
      - name: Check fixed audio retrieval without network access
        run: python3 -B scripts/ci/full-development-composition/test_retrieve_audio.py
      - name: Check optional composition cache and keyring boundaries
        run: |
          python3 -B scripts/ci/full-development-composition/test_audio.py
          python3 -B scripts/ci/full-development-composition/test_audio_aux.py
          python3 -B scripts/ci/full-development-composition/test_setup4.py
      - name: Check separate generic installer fixture selection without actors
        run: |
          python3 -B -m unittest discover -s scripts/install -p test_local_transaction.py -k GenericFixtureModelTests -v
          python3 -B -m unittest discover -s scripts/install -p test_local_transaction.py -k NativeProfileTests -v
          python3 -B -m unittest discover -s scripts/install -p test_local_transaction.py -k SeccompProfileModelTests -v
      - name: Check private VM fixture and owned process controls
        run: |
          python3 -B scripts/virtual/test_barrier_mode.py
          python3 -B scripts/virtual/test_transaction_mode.py
      - name: Check fixed project source retrieval with inert transport
        run: python3 -B scripts/ci/asahi-audio-rust/test_sources.py
      - name: Check offline audio graph caller without plugin actors
        run: python3 -B -m unittest discover -s scripts/ci/asahi-audio-offline-graph -p 'test_*.py'
      - name: Check native desktop fixture and runtime controls without actors
        run: |
          python3 -B scripts/ci/test_desktop574_guest.py
          python3 -B scripts/ci/test_desktop574_runtime.py
          bash -n scripts/ci/desktop574_fixture.sh
      - name: Check optional bar and notification session controls without actors
        run: |
          python3 -B -m unittest discover -s scripts/ci/desktop-bar-notifications -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/ci/desktop-bar-notifications/ci -p test_caller.py
      - name: Check managed user session controls without services or VM actors
        run: |
          python3 -B -m unittest discover -s scripts/ci/desktop-user-session -p test_managed.py
          python3 -B -m unittest discover -s scripts/ci/desktop-user-session/ci -p test_caller.py
      - name: Check terminal editor build and clipboard controls without actors
        run: |
          python3 -B -m unittest discover -s scripts/ci/desktop-terminal-workflow -p test_workflow.py
          python3 -B -m unittest discover -s scripts/ci/desktop-terminal-workflow/ci -p test_caller.py
      - name: Check file-manager workflow controls without app or VM actors
        run: |
          python3 -B -m unittest discover -s scripts/ci/desktop-file-manager-workflow -p test_workflow.py
          python3 -B -m unittest discover -s scripts/ci/desktop-file-manager-workflow/ci -p test_caller.py
      - name: Check optional active native574 ownership without daemon actors
        run: python3 -B -Werror::ResourceWarning scripts/ci/test_maintained574_active_owner.py
      - name: Check actual-running native574 cancellation observer without daemon actors
        run: |
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/maintained574-active-trial -p 'test_*.py'
          bash -n scripts/ci/maintained574-active-trial/ci_sequence.sh
      - name: Check read-only diagnostic product fixtures
        run: python3 -B -Werror::ResourceWarning packages/tools/cachy-asahi-doctor/test_doctor.py
      - name: Check default native Apps parser experiment without actors
        run: |
          python3 -I -B scripts/ci/apps7-parser-native/job.py preflight --source "$PWD"
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/apps7-parser-native -p test_lane.py -v
      - name: Build and check Welcome stored DNS discovery
        run: |
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          cp -a packages/tools/cachy-asahi-welcome5 "$work/recipe"
          make -C "$work/recipe" RECIPE_ROOT="$PWD/packages/tools/cachy-asahi-welcome5" check
      - name: Check Welcome4 to Welcome5 signed native trial source without actors
        run: |
          python3 -I -B scripts/ci/welcome5-native-upgrade/preflight.py --source "$PWD"
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/welcome5-native-upgrade -p test_lane.py -v
      - name: Checkout whole-pinned public current606 source roles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f3a30f2049f57d9f3cb2433fbd59af51d4cc5720
          path: .ci-inputs/current606-source-roles
          persist-credentials: false
      - name: Check default current606 emission and original cache continuation without actors
        run: |
          python3 -B scripts/ci/current606-static/preflight.py --source "$PWD" --basis "$PWD/.ci-inputs/current606-source-roles" --output "$RUNNER_TEMP/current606-default"
          python3 -B -Werror::ResourceWarning -m unittest discover -s "$RUNNER_TEMP/current606-default/scripts/ci/current606-native" -p test_lane.py -v
      - name: Check current Welcome2 package source and payload contract
        run: python3 -B packages/tools/cachy-asahi-welcome/check_source.py --root packages/tools/cachy-asahi-welcome
      - name: Check combined managed desktop app workflow without actors
        run: |
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/desktop-managed-workflow -p 'test_*.py'
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/desktop-managed-workflow/ci -p 'test_*.py'
      - name: Check synthetic graph processing controls without plugins
        run: |
          python3 -I -B -m unittest discover -s scripts/ci/asahi-audio-graph-processing -p 'test_*.py'
          cc -std=c11 -Wall -Wextra -Werror -O2 -UNDEBUG scripts/ci/asahi-audio-graph-processing/test_processing.c -o "$RUNNER_TEMP/graph-processing-controls"
          "$RUNNER_TEMP/graph-processing-controls" "$RUNNER_TEMP/graph-processing-samples.f32"
          rm -f -- "$RUNNER_TEMP/graph-processing-controls"
      - name: Check disposable copied-root and auxiliary controls
        run: |
          controls_root=$(sudo -n mktemp -d /tmp/cachy-root-controls.XXXXXX)
          trap 'sudo -n rm -rf -- "$controls_root"' EXIT
          git archive HEAD | sudo -n tar -x -C "$controls_root"
          for suite in test_disposable_copy.py test_internal_runtime.py test_auxiliary.py test_aux_scan_links.py test_copy_links.py test_root_link_selection.py test_mtab_copy.py; do
            sudo -n unshare --user --map-root-user --mount --net --fork --wd="$controls_root" \
              env -i PATH=/usr/bin:/bin HOME=/tmp TMPDIR=/tmp LC_ALL=C PYTHONDONTWRITEBYTECODE=1 \
              python3 -B -m unittest discover -s scripts/update -p "$suite" -v
          done
      - name: Check complete persistent-root upgrade caller without actors
        run: |
          python3 -B -m unittest discover -s scripts/ci/full-root-upgrade-caller -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/ci/full-root-upgrade -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/update -p test_snapshot_selection.py
          python3 -B -m unittest discover -s scripts/update -p test_var_lock_protection.py
      - name: Check controlled complete-root failure and disposal without actors
        run: python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/full-root-failed-update -p 'test_*.py'
      - name: Check controlled postcommit interruption and disposal without actors
        run: python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/full-root-postcommit-failure -p 'test_*.py'
      - name: Check Debian-source provider authentication and source boundaries without actors
        run: python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-debian-provider/test_candidate.py
      - name: Validate maintained Debian glibc source preparation
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-debian-maintained-provider/test_materialize.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-debian-maintained-provider/test_candidate.py
      - name: Check Debian native pair source packet and cleanup boundaries without actors
        run: python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/glibc-debian-native-provider -p 'test_*.py'
      - name: Check maintained Debian first staged16K phase and candidate gates
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-debian-maintained-system16k/test_adapter.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-debian-maintained-system16k/test_protocol.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-debian-maintained-staged-packet/test_prepare.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-gnu-failure-log/test_summary.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-debian-maintained-installed16k/test_generator.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-debian-maintained-native-lifecycle-next/test_prepare.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-debian-maintained-installed16k-ci/test_wiring.py
      - name: Check maintained Debian lifecycle candidate gates and source adaptation
        run: python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-debian-maintained-lifecycle/test_adapter.py
      - name: Checkout exact public maintained glibc compile inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 132aec86c0946f6c7b7a79c46e1a9ccaf91021e3
          path: .ci-inputs/maintained-caa3-public
          persist-credentials: false
      - name: Check maintained glibc public compile-input route without actors
        run: CAA3_PUBLIC_ROUTE_SOURCE="$PWD" CAA3_PUBLIC_ROUTE_PACKET="$PWD/.ci-inputs/maintained-caa3-public/payload" python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/glibc-debian-maintained-public-lifecycle -p test_route.py -v
      - name: Checkout exact public maintained glibc native component
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9aef8b7429fb8dd9f9d8412f4e878c5e0324c58d
          path: .ci-inputs/maintained-caa3-public-native
          persist-credentials: false
      - name: Check maintained glibc public native-to16K source route without actors
        run: CAA3_PUBLIC_NATIVE_SOURCE="$PWD/.ci-inputs/maintained-caa3-public-native" python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/glibc-debian-maintained-public-installed16k -p test_route.py -v
      - name: Check maintained Debian native pair source and ownership
        run: python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/glibc-debian-maintained-native-provider -p 'test_*.py'
      - name: Check owned GNU trial AppArmor policy and retirement without actors
        run: python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-gnu-trial-apparmor/test_profile.py
      - name: Check provider configuration handoff and readonly proc controls without actors
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-gnu-provider-lifecycle/test_controls.py
          python3 -I -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/glibc-gnu-provider-interruption -p 'test_*.py'
          python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-gnu-provider-lifecycle/test_proc_mount.py
      - name: Check installed GNU provider16K source and disk serialization without actors
        run: |
          python3 -B -Werror::ResourceWarning scripts/ci/glibc-gnu-provider-installed16k/test_lane.py
          python3 -I -B scripts/ci/glibc-gnu-provider-installed16k/test_child_failure.py
          python3 -B -Werror::ResourceWarning scripts/ci/glibc-gnu-provider-installed16k/test_progress.py
          python3 -B -Werror::ResourceWarning scripts/ci/glibc-gnu-provider-installed16k/test_snapshot_progress.py
          python3 -B -Werror::ResourceWarning scripts/ci/glibc-gnu-provider-installed16k/test_first_observer_progress.py
      - name: Check separate interrupted provider16K source and recovery gates without actors
        run: python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-gnu-provider-installed16k-interruption/test_generator.py
      - name: Check interrupted provider16K workflow assembly and prerequisite bindings without actors
        run: python3 -I -B -Werror::ResourceWarning scripts/ci/glibc-gnu-provider-installed16k-interruption/ci/test_wiring.py
      - name: Check full-composition installer VM contracts without actors
        run: python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/full-composition-installer-vm -p 'test_*.py'
      - name: Check outer Zsh readiness facts with bounded real PTY controls
        run: python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci -p test_zsh_substring_readiness_wrapper.py -v
      - name: Check opt-in Zsh substring module without changing user bindings
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/substring.XXXXXX")
          substring_cleanup() {
            code=$?
            trap - EXIT
            if (( code != 0 )); then
              python3 -I -B scripts/ci/zsh-substring-failure-report.py --work "$work" --checker "$GITHUB_WORKSPACE/packages/tools/cachy-asahi-zsh-history-substring-search/check-module.py" || true
            fi
            cleanup=0
            rm -rf -- "$work" || cleanup=$?
            if (( cleanup != 0 )); then printf 'ZSH_SUBSTRING_FIXTURE_CLEANUP_EXIT=%s\n' "$cleanup" >&2; fi
            if (( code == 0 )); then code=$cleanup; fi
            exit "$code"
          }
          trap substring_cleanup EXIT
          python3 -B -Werror::ResourceWarning scripts/ci/zsh-substring-zle-reset-adapter.py packages/tools/cachy-asahi-zsh-history-substring-search/check-module.py --module-dir "$GITHUB_WORKSPACE/packages/tools/cachy-asahi-zsh-history-substring-search" --work "$work"
          zsh -fn packages/tools/cachy-asahi-zsh-history-substring-search/opt-in.zsh
          bash -n packages/tools/cachy-asahi-zsh-history-substring-search/PKGBUILD
      - name: Check Fish autopair native lifecycle contracts without container actors
        run: python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/fish-autopair-native -p 'test_*.py'
      - name: Check Fish Done native lifecycle contracts without container actors
        run: python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/fish-done-native -p 'test_*.py'
      - name: Check setup5 native upgrade contracts without container actors
        run: python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/setup5-native -p 'test_*.py'
      - name: Fetch exact updater sources for the complete passive replay suite
        run: >-
          git -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin
          de04c6b102890218da4f0b77e938315d601e824f
          001f0484ab8b599ddc03a84e62fd81af315a2a03
          4b803ba7daa0eacd978a5bf86d62346363c3b6dc
      - name: Checkout exact accepted Setup5 pair for passive updater checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79d8d2f53510e4f3a04f39c1b1e24c999aa32e44
          path: .ci-inputs/setup5-accepted-pair
          persist-credentials: false
      - name: Stage the149 original Setup5 pair data members
        run: |
          set -euo pipefail
          test "$(git -C .ci-inputs/setup5-accepted-pair rev-parse HEAD)" = 79d8d2f53510e4f3a04f39c1b1e24c999aa32e44
          target=artifacts/development/setup5-accepted-pair-inputs-20261016/payload
          test ! -e "$target"
          install -d -m 700 "$target"
          git -C .ci-inputs/setup5-accepted-pair archive --format=tar 79d8d2f53510e4f3a04f39c1b1e24c999aa32e44 | tar -xf - -C "$target"
          printf '%s  %s\n' b1e4208d2f32935f2e5cb1c1e3535cc49f44c7bfe08e7d64692b8ac3781d5a5d "$target/index.json" | sha256sum --check
      - name: Check Apps transactions and management source contracts
        run: |
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/apps -p 'test_*.py'
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/orphans -p 'test_*.py'
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/apps-full574-native -p 'test_*.py'
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/apps-full574-repair-native -p 'test_*.py'
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/orphans-full574-native -p 'test*.py'
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/job-retirement-diagnostics -p test_retirement.py
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/orphans-native-cancellation -p 'test_*.py'
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/expanded600-root-upgrade -p 'test_*.py'
          EXPANDED604_SOURCE="$PWD" python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/expanded604-root-upgrade -p 'test_*.py'
          EXPANDED604_MANAGED_SOURCE="$PWD" python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/expanded604-managed16k -p 'test_*.py'
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/management-tools-generic16k -p 'test_*.py'
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/welcome-management-native -p 'test_*.py'
      - name: Check Apps6 current604 composition, fresh install and upgrade source
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/expanded604-apps6/test_lane.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/expanded604-apps6-public-pairs/test_lane.py
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/expanded604-apps6-installer -p 'test_*.py'
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/expanded604-apps6-updater -p 'test_*.py'
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/current604-apps6-generic16k -p test_lane.py
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/current604-apps6-updater16k -p test_lane.py
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/current604-apps6-updater16k -p test_wiring.py
      - name: Checkout exact separate public-pair native604 source operand
