name: static-validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify packaged setup source and sync boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 packages/settings/cachy-asahi-setup/check-sync.py
          python3 packages/settings/cachy-asahi-setup/test-sync.py -v
          python3 -B packages/tools/cachy-asahi-topmem/test_topmem.py -v
      - name: Validate tooling and safety boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s scripts/setup -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/integration -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/hardware -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/benchmarks -p 'test_*.py' -v
          bash -n scripts/build/container-entry.sh
      - name: Install repository test tools on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnupg libarchive-tools pacman-package-manager makepkg
          for tool in gpg gpgconf repo-add bsdtar vercmp; do command -v "$tool"; done
          dpkg-query -W gnupg libarchive-tools pacman-package-manager makepkg
      - name: Exercise release and client contracts without skipped tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B - <<'PY'
          import unittest
          for directory in ('scripts/release', 'scripts/client'):
              suite = unittest.TestLoader().discover(directory, pattern='test_*.py')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful() or result.skipped or result.testsRun == 0:
                  raise SystemExit(f'{directory}: failures, skips, or empty suite')
          PY
      - name: Inspect recipes without sourcing them
        run: python3 scripts/checks/package_checks.py recipes --require-recipes
      - name: Check recipe syntax without executing it
        run: |
          find packages -name PKGBUILD -type f -print0 | xargs -0 -r -n1 bash -n
