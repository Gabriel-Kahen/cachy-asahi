name: Hyprland03 native source DATA controls
on:
  pull_request:
    paths:
      - 'scripts/ci/hyprland03-native-source-v1/**'
      - '.github/workflows/hyprland03-native-source-data.yml'
      - 'packages/desktop/cachy-asahi-hyprland-settings/**'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/hyprland03-native-source-v1/**'
      - '.github/workflows/hyprland03-native-source-data.yml'
      - 'packages/desktop/cachy-asahi-hyprland-settings/**'
permissions:
  contents: read
jobs:
  finite-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check finite Source and passive evidence DATA without native actors
        run: >-
          python3 -I -B -Werror::ResourceWarning
          scripts/ci/hyprland03-native-source-v1/test_hyprland03_data.py
