name: maintained-native-successor
on:
  workflow_dispatch:
  push:
    branches: ['codex/virtual-integration']
    paths: ['.github/workflows/maintained-native-successor.yml']
permissions:
  contents: read
concurrency:
  group: native-arm-build
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE: scripts/ci/maintained-native
      PACKET_SHA256: '16498f24649b981e99d803682e87e632bbba289e4bb6d3169d7608d7cecdc617'
    steps:
      - name: Record the one absolute deadline before checkout
        id: clock
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYTHON'
          import hashlib, json, math, os, pathlib, re, time
          start = time.monotonic()
          assert os.getuid() == os.geteuid() > 0 and os.getgid() == os.getegid() > 0
          assert os.environ['RUNNER_ARCH'] == 'ARM64' and os.environ['RUNNER_OS'] == 'Linux'
          commit = os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}', commit) and os.environ['GITHUB_WORKFLOW_SHA'] == commit
          assert re.fullmatch('[1-9][0-9]{0,19}', os.environ['GITHUB_RUN_ID'])
          assert re.fullmatch('[1-9][0-9]{0,9}', os.environ['GITHUB_RUN_ATTEMPT'])
          parent = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'maintained-official-prefetch'
          parent.mkdir(mode=0o700)
          end = start + 7200
          data = {'schema_version': 1, 'lane_id': 'maintained-native-official-prefetch-v1',
                  'started_at': start, 'deadline_at': end, 'prefetch_end': min(start+1800, end-120-600),
                  'guard_end': end-120, 'source_commit': commit, 'workflow_commit': commit,
                  'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'uid': os.getuid()}
          raw = (json.dumps(data, sort_keys=True, indent=2, allow_nan=False)+'\n').encode()
          path = parent / 'clock.json'
          fd = os.open(path, os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW, 0o600)
          try:
              with os.fdopen(fd, 'wb') as stream: stream.write(raw); stream.flush(); os.fsync(stream.fileno())
          except BaseException: raise
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('path='+str(path)+'\nsha256='+hashlib.sha256(raw).hexdigest()+'\n')
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Prove the committed source closure
        timeout-minutes: 3
        shell: bash
        env:
          CLOCK_PATH: ${{ steps.clock.outputs.path }}
          CLOCK_SHA256: ${{ steps.clock.outputs.sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'eee4feb256967fc7be90174ab026e08897d2f89aaa0f626653ba1f4cc0b62d20' "$SOURCE/lane.py" 'c84168539130394f9fe51bf440d036f44813ff2b923c1e9d77748f97f755c922' "$SOURCE/contract.py" | sha256sum --check
          python3 -I -B "$SOURCE/lane.py" --phase proof --clock "$CLOCK_PATH" --clock-sha256 "$CLOCK_SHA256" --packet-sha256 "$PACKET_SHA256"
      - name: Fetch only the official pinned 501 inputs into fresh private storage
        timeout-minutes: 30
        shell: bash
        env:
          CLOCK_PATH: ${{ steps.clock.outputs.path }}
          CLOCK_SHA256: ${{ steps.clock.outputs.sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'eee4feb256967fc7be90174ab026e08897d2f89aaa0f626653ba1f4cc0b62d20' "$SOURCE/lane.py" | sha256sum --check
          python3 -I -B "$SOURCE/lane.py" --phase prefetch --execute-prefetch --clock "$CLOCK_PATH" --clock-sha256 "$CLOCK_SHA256" --packet-sha256 "$PACKET_SHA256"
      - name: Run the offline guarded native successor within the original deadline
        timeout-minutes: 118
        shell: bash
        env:
          CLOCK_PATH: ${{ steps.clock.outputs.path }}
          CLOCK_SHA256: ${{ steps.clock.outputs.sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'eee4feb256967fc7be90174ab026e08897d2f89aaa0f626653ba1f4cc0b62d20' "$SOURCE/lane.py" | sha256sum --check
          docker_path=/usr/bin/docker
          docker_pin=94128e4afada0d46de642165e79dd70beb08e6775014648013283ed901b68248
          printf '%s  %s\n' "$docker_pin" "$docker_path" | sha256sum --check
          python3 -I -B "$SOURCE/lane.py" --phase native --execute-native --clock "$CLOCK_PATH" --clock-sha256 "$CLOCK_SHA256" --packet-sha256 "$PACKET_SHA256" --docker-binary "$docker_path" --docker-sha256 "$docker_pin"
      - name: Retain bounded metadata on success or failure
        if: always()
        timeout-minutes: 2
        shell: bash
        env:
          CLOCK_PATH: ${{ steps.clock.outputs.path }}
          CLOCK_SHA256: ${{ steps.clock.outputs.sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'eee4feb256967fc7be90174ab026e08897d2f89aaa0f626653ba1f4cc0b62d20' "$SOURCE/lane.py" | sha256sum --check
          python3 -I -B "$SOURCE/lane.py" --phase retain --clock "$CLOCK_PATH" --clock-sha256 "$CLOCK_SHA256" --packet-sha256 "$PACKET_SHA256"
