name: current607-native-graph-profile
on:
  pull_request:
    paths:
      - 'scripts/ci/current607-native-graph-profile/**'
      - '.github/workflows/current607-native-graph-profile.yml'
  push:
    paths:
      - 'scripts/ci/current607-native-graph-profile/**'
      - '.github/workflows/current607-native-graph-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONWARNINGS: error
    steps:
      - name: Check out the current factory
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Select the explicit Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check out the exact input555 fixture
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ github.repository }}
          ref: 4c8a7046ce3a42deb6630229607f54d0e2b8cf63
          path: fixtures/source555
          persist-credentials: false
      - name: Check out the exact expected563 fixture
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ github.repository }}
          ref: 9c49f8d12e5aea864bcf6bca6ed836874c1f06e5
          path: fixtures/source563
          persist-credentials: false
      - name: Check out the exact optional566 fixture
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ github.repository }}
          ref: 1c5d0fa3ffd55f323225782958f8199eccb80ebc
          path: fixtures/source566
          persist-credentials: false
      - name: Check out the separate correctness568 fixture
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ github.repository }}
          ref: b274ef846322ffdf82665a209c855fe96fced75a
          path: fixtures/source568
          persist-credentials: false
      - name: Check out the explicit layered4200 expected568 source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ github.repository }}
          ref: 12d7e769a8fe32a2714c10a9096f9805f8bb7920
          path: fixtures/layered568
          persist-credentials: false
      - name: Run five real descriptor controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -W error -B scripts/ci/current607-native-graph-profile/test_descriptor.py
      - name: Run four factory controls against both exact fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -W error -B scripts/ci/current607-native-graph-profile/test_profile.py \
            --source "$GITHUB_WORKSPACE/fixtures/source555" \
            --expected "$GITHUB_WORKSPACE/fixtures/source563"
      - name: Run six original public failure retention controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -W error -B scripts/ci/current607-native-graph-profile/test_retention.py
      - name: Run six real optional ancestry controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -W error -B scripts/ci/current607-native-graph-profile/test_ancestry.py
      - name: Run three optional factory controls against exact555 and566
        shell: bash
        run: |
          set -euo pipefail
          python3 -W error -B scripts/ci/current607-native-graph-profile/test_ancestry_profile.py \
            --source "$GITHUB_WORKSPACE/fixtures/source555" \
            --expected "$GITHUB_WORKSPACE/fixtures/source566"
      - name: Check exact optional correctness2400 factory and isolated CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -W error -B scripts/ci/current607-native-graph-profile/test_correctness2400.py \
            --source "$GITHUB_WORKSPACE/fixtures/source555" \
            --expected "$GITHUB_WORKSPACE/fixtures/source568"
      - name: Check explicit layered4200 and all held profiles without actors
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B -Werror scripts/ci/current607-native-graph-profile/test_layered4200.py \
            --source "$GITHUB_WORKSPACE/fixtures/source555" \
            --expected "$GITHUB_WORKSPACE/fixtures/layered568"
