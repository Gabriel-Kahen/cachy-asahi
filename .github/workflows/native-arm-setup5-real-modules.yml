name: native-arm-setup5-real-modules
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source SHA, equal to this workflow revision
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-arm-setup5-real-modules
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 95
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      SLICE: scripts/ci/setup5-native-real-modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Prove the explicit source and workflow revision before secrets
        id: proof
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' '4269f7134c095a7d344b1d28f5436023fd9c1beea2fe0d3c1d22b08afd2a6d40' "$SLICE/job.py" 'cfc433f18c47e74a66e4fd16ab5b80b8ebb8b93312784421773d7cd4cce9447c' "$SLICE/source-manifest.json" | sha256sum --check
          python3 -I -B "$SLICE/job.py" proof --source "$GITHUB_WORKSPACE" --manifest "$SLICE/source-manifest.json" --proof "$RUNNER_TEMP/setup5-real-source-proof.json"
      - name: Seed the six exact retained inputs using existing secrets only
        timeout-minutes: 2
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: >-
          python3 -I -B scripts/ci/maintained_desktop574.py seed
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$RUNNER_TEMP/desktop574"
      - name: Checkout exact retained public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed fourteen exact public ARM input files
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3' 'retained-public-inputs/seed.py' 'a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300' 'retained-public-inputs/index.json' | sha256sum --check
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 TZ=UTC TMPDIR="$RUNNER_TEMP" python3 -I -B "$GITHUB_WORKSPACE/retained-public-inputs/seed.py" --cache "$RUNNER_TEMP/desktop574/context/deps"
      - name: Checkout the exact retained setup4 public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 93bc9bfac7343ee3b443ae3332c0942ed1ba5b55
          path: setup4-public-inputs
          persist-credentials: false
      - name: Unpack only the exact retained public setup4 pair
        timeout-minutes: 2
        run: >-
          python3 -I -B scripts/ci/setup5-native/retained.py
          --source setup4-public-inputs/scripts/ci/full-development-composition/retained/setup4-pair.tar.xz
          --output "$RUNNER_TEMP/setup5-retained4"
      - name: Checkout exact accepted Setup5 pair and legacy lifecycle inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 79d8d2f53510e4f3a04f39c1b1e24c999aa32e44
          path: setup5-accepted-inputs
          persist-credentials: false
      - name: Checkout exact six accepted native script pairs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: de35c384a2e5b14b664d4156897f271b81e467ba
          path: setup5-six-module-inputs
          persist-credentials: false
      - name: Stage only exact indexed public packet files
        timeout-minutes: 2
        run: >-
          python3 -I -B "$SLICE/prepare.py"
          --source "$GITHUB_WORKSPACE"
          --setup5-checkout "$GITHUB_WORKSPACE/setup5-accepted-inputs"
          --modules-checkout "$GITHUB_WORKSPACE/setup5-six-module-inputs"
          --output "$RUNNER_TEMP/setup5-real-inputs"
      - name: Focused source and hosted entry controls
        timeout-minutes: 3
        env:
          SETUP5_REAL_SETUP_INPUTS: ${{ runner.temp }}/setup5-real-inputs/setup5
          SETUP5_REAL_MODULE_INPUTS: ${{ runner.temp }}/setup5-real-inputs/modules
          SETUP5_REAL_OLD_INPUTS: ${{ runner.temp }}/setup5-retained4
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/test_maintained_desktop574.py
          python3 -B -m unittest discover -s "$SLICE" -p test_source.py
      - name: Reconstruct pinned inputs and run offline owned native574 transaction
        timeout-minutes: 40
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: >-
          timeout --signal=TERM --kill-after=10s 2300s
          python3 -I -B scripts/ci/maintained_desktop574.py build
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$RUNNER_TEMP/desktop574" --job-token "$JOB_TOKEN"
      - name: Unchanged legacy eight transitions then installed581 generated-RC behavior
        timeout-minutes: 26
        run: >-
          timeout --signal=TERM --kill-after=30s 1500s
          python3 -B "$SLICE/run.py"
          --source "$GITHUB_WORKSPACE" --base-dir "$RUNNER_TEMP/desktop574"
          --output "$RUNNER_TEMP/setup5-real-runtime"
          --consumer-token "${{ steps.proof.outputs.consumer_token }}"
          --setup4-inputs "$RUNNER_TEMP/setup5-retained4"
          --setup5-inputs "$RUNNER_TEMP/setup5-real-inputs/setup5"
          --modules-inputs "$RUNNER_TEMP/setup5-real-inputs/modules"
      - name: Retire the two owned consumers before the original producer
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 6
        run: >-
          timeout --signal=TERM --kill-after=10s 330s
          python3 -I -B "$SLICE/job.py" cleanup
          --source "$GITHUB_WORKSPACE" --manifest "$SLICE/source-manifest.json"
          --proof "$RUNNER_TEMP/setup5-real-source-proof.json"
          --base "$RUNNER_TEMP/desktop574" --runtime "$RUNNER_TEMP/setup5-real-runtime"
          --output "$RUNNER_TEMP/setup5-real-ordered-cleanup.json"
      - name: Retain the closed legacy and real-module evidence set
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 2
        run: >-
          python3 -I -B "$SLICE/job.py" retain
          --source "$GITHUB_WORKSPACE" --proof "$RUNNER_TEMP/setup5-real-source-proof.json"
          --base "$RUNNER_TEMP/desktop574" --runtime "$RUNNER_TEMP/setup5-real-runtime"
          --cleanup "$RUNNER_TEMP/setup5-real-ordered-cleanup.json"
          --output "$RUNNER_TEMP/setup5-real-public"
      - name: Upload only the bounded public evidence directory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 2
        with:
          name: setup5-real-modules-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/setup5-real-public/
