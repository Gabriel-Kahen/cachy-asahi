name: initializer-mount-query-source-data
on:
  pull_request:
    paths:
      - '.github/workflows/initializer-mount-query-source.yml'
      - 'scripts/ci/initializer_mount_query_controls.py'
      - 'scripts/ci/updater-hash-cost/**'
      - 'scripts/ci/updater-hash-cost-intake/**'
      - 'scripts/update/aux_initialize.py'
      - 'scripts/update/full_root.py'
      - 'scripts/update/aux_checkpoint.py'
      - 'scripts/ci/full-root-upgrade-caller/upgrade_hook.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/initializer-mount-query-source.yml'
      - 'scripts/ci/initializer_mount_query_controls.py'
      - 'scripts/ci/updater-hash-cost/**'
      - 'scripts/ci/updater-hash-cost-intake/**'
      - 'scripts/update/aux_initialize.py'
      - 'scripts/update/full_root.py'
      - 'scripts/update/aux_checkpoint.py'
      - 'scripts/ci/full-root-upgrade-caller/upgrade_hook.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Select explicit Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check composed canonical v2 and prepare strict v1 compatibility DATA view
        timeout-minutes: 2
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          ulimit -t 60 -v 1048576 -f 4096 -n 128
          timeout --signal=TERM --kill-after=5s 60s python3 -I -B -Werror scripts/ci/updater-hash-cost/controls.py --root "$GITHUB_WORKSPACE" --v1-view "$RUNNER_TEMP/updater-strict-v1-compatibility-data"
      - name: Check unchanged39 against strict historical v1 DATA view (not v2 coverage)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          timeout --signal=TERM --kill-after=5s 60s
          python3 -I -B -Werror scripts/ci/initializer_mount_query_controls.py
          --root "$RUNNER_TEMP/updater-strict-v1-compatibility-data"
      - name: Check NEW32 strict normal v2 passive intake DATA controls
        timeout-minutes: 2
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          ulimit -t 60 -v 1048576 -f 4096 -n 128
          timeout --signal=TERM --kill-after=5s 60s python3 -I -B -Werror scripts/ci/updater-hash-cost-intake/test_intake.py
