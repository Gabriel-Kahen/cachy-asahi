name: Security native factory Source controls
on:
  pull_request:
    paths:
      - .github/workflows/security-native-factory-source.yml
      - scripts/ci/security-maintenance-native-source/**
      - docs/workstreams/security-maintenance-native-source.md
  push:
    branches: [main]
    paths:
      - .github/workflows/security-native-factory-source.yml
      - scripts/ci/security-maintenance-native-source/**
      - docs/workstreams/security-maintenance-native-source.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-data:
    name: Security finite Source DATA controls (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout maintained Security factory
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Checkout exact genuine Security200 parent as DATA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: b6a02f11648738ded90084f7dcdcd4ea77c194fa
          path: .ci-security-parent
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Run actor-denied finite factory and upgrade DATA controls
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/security-factory-controls.XXXXXXXX")
          mkdir -m700 "$stage/parent"
          test "$(/usr/bin/git -C .ci-security-parent rev-parse --verify HEAD)" = b6a02f11648738ded90084f7dcdcd4ea77c194fa
          /usr/bin/git -C .ci-security-parent archive --format=tar b6a02f11648738ded90084f7dcdcd4ea77c194fa | tar -xf - -C "$stage/parent"
          python -I -B -Werror::ResourceWarning scripts/ci/security-maintenance-native-source/test_factory.py --parent-source "$stage/parent"
      - name: Checkout exact failed v7 Source200 as FD control DATA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: d7c34e02dec0bfee06d0cb6e165bd781471fffd7
          path: .ci-security-v7
          persist-credentials: false
      - name: New FD diagnostic16 actor-denied DATA controls
        shell: bash
        run: |
          set -euo pipefail
          security_fd_stage=$(mktemp -d "$RUNNER_TEMP/security-fd-data.XXXXXXXX")
          python -I -B -Werror::ResourceWarning scripts/ci/security-maintenance-native-source/test_fd_failure_diagnostic.py \
            --baseline-source "$GITHUB_WORKSPACE/.ci-security-v7" --results "$security_fd_stage/results.json"
          python -I -B -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"]=="PASS_NEW_FD_FAILURE_DIAGNOSTIC_DATA_CONTROLS" and r["controls"]==16 and r["failures"]==r["errors"]==0 and r["denied_events"]==[] and r["Source_actor_imports"]==r["factory_emissions"]==r["observer_FD_payload_reads"]==0' "$security_fd_stage/results.json"
      - name: New HOST parent-layout6 private controls
        shell: bash
        run: |
          set -euo pipefail
          security_layout_stage=$(mktemp -d "$RUNNER_TEMP/security-layout-host.XXXXXXXX")
          python -I -B -Werror::ResourceWarning scripts/ci/security-maintenance-native-source/test_parent_layout.py \
            --execute-once --results "$security_layout_stage/once"
          python -I -B -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"]=="PASS_NEW_HOST_PRIVATE_PROCESS_LAYOUT_CONTROLS" and r["case_count"]==6 and r["failures"]==r["errors"]==0 and all(c["passed"] for c in r["cases"]) and r["python_version"]==sys.argv[2] and r["repository_Source_imports"]==r["Source_constructor_emitter_calls"]==r["FD_payload_reads"]==r["native_C_compiler_probe_runtime_GPG_package_VM_namespace_actors"]==r["old_tests_readers_GET_POST_Git_API_primary_writes"]==0 and r["native_PID1_namespace_test"] is False and r["acceptance"] is False' "$security_layout_stage/once/result.json" '${{ matrix.python }}'
