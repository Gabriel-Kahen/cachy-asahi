name: Native source DATA controls
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    name: Image lifecycle source controls (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check image lifecycle producer and Reader DATA without actors
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/test_pair_data.py -v
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/test_image_lifecycle_data.py -v
          python3 -I -B -Werror::ResourceWarning scripts/ci/native-build-namespace-preflight/test_preflight_data.py -v
          python3 -I -B -Werror::ResourceWarning scripts/ci/native-build-namespace-preflight/test_image_lifecycle_data.py -v
      - name: Check out held namespace parent as data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 6b5b5a8f20ad2698c2d7f14a8f59c9b0ad5da165
          path: .observable-parent-repository
          persist-credentials: false
      - name: Export held namespace parent without executing it
        run: |
          umask 022
          parent="${RUNNER_TEMP}/observable-parent-source"
          test ! -e "$parent"
          mkdir -m 700 "$parent"
          test "$(git -C .observable-parent-repository rev-parse HEAD)" = 6b5b5a8f20ad2698c2d7f14a8f59c9b0ad5da165
          git -C .observable-parent-repository -c tar.umask=0022 archive --format=tar HEAD | tar -xf - -C "$parent"
      - name: Check observable namespace source controls without actors
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/native-build-namespace-observable/test_observable_data.py --parent-source "${RUNNER_TEMP}/observable-parent-source"
