name: Native source DATA controls
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    name: Image lifecycle source controls (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check LLVM23 ARM16K case contracts without actors
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_llvm23_vm/test_case.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_llvm23_vm/test_contracts.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_llvm23_vm/test_protocol.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_llvm23_vm/test_prepare.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_llvm23_vm/test_ops.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_llvm23_vm/test_boot.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_llvm23_vm/test_docker.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_llvm23_vm/test_ownership.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_llvm23_vm/test_probe.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/llvm23-source-reference-native/successor_v5/test_stage_receipts.py
          python3 -I -B -Werror::ResourceWarning scripts/port/llvm23-native-independent-reader/v6/test_v6.py
          python3 -I -B -Werror::ResourceWarning scripts/port/llvm23-native-independent-reader/v7/test_v7.py
          bash -n scripts/integration/arm16k_llvm23_vm/guest/root.sh scripts/integration/arm16k_llvm23_vm/guest/probe.sh scripts/integration/arm16k_llvm23_vm/guest/case.sh
      - name: Install Perl lifecycle xattr tools on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y attr
          command -v getfattr setfattr
      - name: Check Perl ARM16K lifecycle contracts without actors
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_controls.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_probe_readiness.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_probe_diagnostics.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_runtime_lifetimes.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_natural_retirement.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_installed_metadata.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_root_progress.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_etc_mtime.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_git_roundtrip.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_preboot.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_restoration.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_root_ssh.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_root_ssh_descriptor.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_ssh_privacy.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_no_package_control/test_actor.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_no_package_control/test_controller.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_no_package_control/test_integration.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_no_package_control/test_metadata.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_no_package_control/test_metadata_raw_reader.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_no_package_control/test_plan.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_no_package_control/test_prepare.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_no_package_control/test_rules.py
          bash -n scripts/integration/arm16k_no_package_control/guest-metadata.sh scripts/integration/arm16k_perl5423_vm/guest/root-ssh.sh
          python3 -I -B -Werror::ResourceWarning scripts/port/perl5423-arm16k-independent-reader/test_reader.py
          bash scripts/integration/arm16k_perl5423_vm/test_guest_data.sh
          bash -n scripts/integration/arm16k_perl5423_vm/guest/root.sh scripts/integration/arm16k_perl5423_vm/guest/probe.sh scripts/integration/arm16k_perl5423_vm/guest/case.sh scripts/integration/arm16k_perl5423_vm/guest/official-trust.sh scripts/integration/arm16k_perl5423_vm/guest/installed-metadata.sh
      - name: Check image lifecycle producer and Reader DATA without actors
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/test_pair_data.py -v
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/test_image_lifecycle_data.py -v
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v2/test_controls.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v2/test_constructor.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_owner_current_v2.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_owner_delegated_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_local_command_invocation_v1.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_delegated_context_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/test_delegated_context_v4.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_image_current_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/test_image_selected_context_v4.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/test_image_base349_current_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_base_inputs_current_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_inputs_current_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_reader_current_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_retention_current_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_retention_delegated_v4.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/test_owned_executor_current_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/test_hosted_current_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_stage_materials_current_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_stage_materials_current_v3_python_v1.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/test_material_domain_current_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/test_host_prerequisites_current_v3.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/payload/native/test_owned_current_v3_policy.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v2/test_owned_route.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v4/test_route.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v3/test_data.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v4_source/test_data.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/first-login-enrollment-native-source/successor_v4_source/test_seams.py
          python3 -I -B -Werror::ResourceWarning scripts/port/first-login-enrollment-ui-current-reader/test_reader.py
          python3 -I -B -Werror::ResourceWarning scripts/port/first-login-enrollment-ui-current-reader/test_owner_receipts.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_perl5423_vm/test_local_dependency_queries.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/native-build-namespace-preflight/test_preflight_data.py -v
          python3 -I -B -Werror::ResourceWarning scripts/ci/native-build-namespace-preflight/test_image_lifecycle_data.py -v
      - name: Check current Fish source without actors
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/fish-config02-native-source/test_data.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/fish-config02-native-source/successor_v2/test_data.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/fish-config02-native-source/successor_v2/test_host_tools.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/fish-config02-native-source/successor_v2/test_host_prerequisites.py
      - name: Check coupled SessionLock and Settings installed-control custody DATA
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/session-lock-settings-native-source-v2/test_data.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/session-lock-settings-native-source-v2/test_image_lifecycle_data.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/session-lock-settings-native-source-v2/test_runtime_v2.py
      - name: Check bounded native package readers on their Python 3.14 runtime
        if: matrix.python == '3.14'
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/port/perl5423-installed-lifecycle/baseline_review/test_controls.py
          python3 -I -B -Werror::ResourceWarning scripts/port/llvm23-native-independent-reader/test_reader.py
      - name: Check out held namespace parent as data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 6b5b5a8f20ad2698c2d7f14a8f59c9b0ad5da165
          path: .observable-parent-repository
          persist-credentials: false
      - name: Export held namespace parent without executing it
        run: |
          umask 022
          parent="${RUNNER_TEMP}/observable-parent-source"
          test ! -e "$parent"
          mkdir -m 700 "$parent"
          test "$(git -C .observable-parent-repository rev-parse HEAD)" = 6b5b5a8f20ad2698c2d7f14a8f59c9b0ad5da165
          git -C .observable-parent-repository -c tar.umask=0022 archive --format=tar HEAD | tar -xf - -C "$parent"
      - name: Check observable namespace source controls without actors
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/native-build-namespace-observable/test_observable_data.py --parent-source "${RUNNER_TEMP}/observable-parent-source"
      - name: Check out original-alarm context parent as data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 69455e13bc99a2b2b6c2aca11f69d581769ae500
          path: .context-parent-repository
          persist-credentials: false
      - name: Export original-alarm context parent without executing it
        run: |
          umask 022
          parent="${RUNNER_TEMP}/context-parent-source"
          test ! -e "$parent"
          mkdir -m 700 "$parent"
          test "$(git -C .context-parent-repository rev-parse HEAD)" = 69455e13bc99a2b2b6c2aca11f69d581769ae500
          git -C .context-parent-repository -c tar.umask=0022 archive --format=tar HEAD | tar -xf - -C "$parent"
      - name: Check original alarm1001 source controls without actors
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/native-build-namespace-context/test_context_data.py --parent-source "${RUNNER_TEMP}/context-parent-source"
      - name: Check out fixed-account source as data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 3937d8b9f3210f4e9868bf19f01dfa22de64ddfe
          path: .context-source-repository
          persist-credentials: false
      - name: Export fixed-account source without executing it
        run: |
          umask 022
          source="${RUNNER_TEMP}/context-admission-source"
          test ! -e "$source"
          mkdir -m 700 "$source"
          test "$(git -C .context-source-repository rev-parse HEAD)" = 3937d8b9f3210f4e9868bf19f01dfa22de64ddfe
          git -C .context-source-repository -c tar.umask=0022 archive --format=tar HEAD | tar -xf - -C "$source"
      - name: Check original alarm1001 namespace admission DATA without actors
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/native-build-namespace-context-admission/test_admission_data.py --held-admission-root "$GITHUB_WORKSPACE/scripts/ci/native-build-namespace-observable-admission" --source-root "${RUNNER_TEMP}/context-admission-source"
  # Updated UI controls and identical Rust recipe/intake controls already run in static.yml.
  adapter-data:
    name: Native adapter DATA controls (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check opt-in builder namespace DATA without actors
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/build/nested_userns_v1/test_policy.py -v
          python3 -I -B -Werror::ResourceWarning scripts/build/nested_userns_v1/test_probe.py -v
      - name: Check Bankstown Qt3 passive profile and maintained consumer DATA
        run: |
          python3 -I -B -Werror scripts/ci/bankstown-qt3-native-profile-v1/test_passive.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-native-profile-v1/test_inventory.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-native-profile-v1/test_profile.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-native-profile-v1/test_consumers.py
      - name: Check Bankstown Qt3 owned factory and handoff DATA
        run: |
          python3 -I -B -Werror scripts/ci/bankstown-qt3-native-source/test_context.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-native-source/test_controller.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-native-source/test_handoff.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-native-source/test_image.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-native-source/test_inputs.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-native-source/test_materialize.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-native-source/test_owner.py
          python3 -I -B -Werror scripts/ci/bankstown-qt3-native-source/test_prepare.py
      - name: Check out immutable LLVM v1 Source as DATA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 4ceaa1c6958349451197b19acdb084a2a5be216b
          path: .llvm23-v1-data-repository
          persist-credentials: false
      - name: Export exact LLVM parent without executing its payloads
        run: |
          umask 022
          llvm_parent="${RUNNER_TEMP}/llvm23-v1-source-DATA"
          test ! -e "$llvm_parent"
          mkdir -m 700 "$llvm_parent"
          test "$(git -C .llvm23-v1-data-repository rev-parse HEAD)" = 4ceaa1c6958349451197b19acdb084a2a5be216b
          test "$(git -C .llvm23-v1-data-repository rev-parse HEAD^{tree})" = b6d4f3bcbfb7454b1760c3ff9f9910d734d8bece
          git -C .llvm23-v1-data-repository -c tar.umask=0022 archive --format=tar HEAD | tar -xf - -C "$llvm_parent"
      - name: Check Rust adapter DATA in fresh processes for permanent audit fences
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/test_admission.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/test_hosted.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/payload/hosted/test_producer.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/payload/actor/test_entry.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/payload/actor/test_phase.py
      - name: Check Rust whole-source DATA against its immutable exported basis
        run: |
          python3 -I -B -Werror::ResourceWarning - <<'PY'
          import importlib.util, os, unittest
          from pathlib import Path
          path = Path('scripts/ci/rust199-source-reference-native/test_source.py')
          spec = importlib.util.spec_from_file_location('rust199_ci_source_controls', path)
          controls = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(controls)
          # Only the test fixture operand changes; render still checks the whole map/tree.
          controls.FROZEN = Path(os.environ['RUNNER_TEMP']) / 'llvm23-v1-source-DATA'
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(controls))
          raise SystemExit(not (result.wasSuccessful() and result.testsRun == 6 and not result.skipped))
          PY
      - name: Check installed Perl lifecycle and observation DATA in fresh processes
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/perl5423-installed-lifecycle-native/test_prerequisites.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/perl5423-installed-lifecycle-native/test_source.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/perl5423-installed-lifecycle-native/test_image_probe.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/perl5423-installed-lifecycle-native/test_reader_data.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/perl5423-installed-lifecycle-native/baseline_observation/test_source.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/perl5423-installed-lifecycle-native/baseline_observation/test_hosted.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/perl5423-installed-lifecycle-native/baseline_observation/test_observer.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/perl5423-installed-lifecycle-native/baseline_observation/test_reader_data.py
      - name: Check all twelve retained installed-result DATA controls
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/perl5423-installed-lifecycle-native/successor_v3/test_retention.py
          python3 -I -B -Werror::ResourceWarning -m unittest discover -s scripts/ci/perl5423-installed-lifecycle-native/successor_v3 -p test_reader_seam.py -v
      - name: Check Rust LLVM admission and stage0 VM DATA in fresh processes
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v2/test_producer.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v3/test_admission.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v3/test_source.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_rust_stage0_vm/test_budget.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_rust_stage0_vm/test_controls.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_rust_stage0_vm/test_dynamic_inputs.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_rust_stage0_vm/test_guest_link.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_rust_stage0_vm/test_home_guard.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_rust_stage0_vm/test_image.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_rust_stage0_vm/test_lzma_memory.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_rust_stage0_vm/test_memory.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_rust_stage0_vm/test_passive_namespace.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_rust_stage0_vm/test_runtime.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_rust_stage0_vm/test_stage0.py
      - name: Check current capability adapters and GUI frame DATA
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/perl5423-installed-lifecycle-native/successor_v2/test_successor.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/llvm23-source-reference-native/successor_v4/test_volume_guard.py
          python3 -I -B -Werror::ResourceWarning scripts/port/perl5423-xs-consumer/native_adapter/hosted_source_v5/test_model.py
          python3 -I -B -Werror::ResourceWarning scripts/integration/arm16k_first_login_ui_glib290_vm/test_controls.py
      - name: Check Rust native delivery and transfer DATA in fresh processes
        run: |
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v4/test_actor_binding.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v4/test_admission.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v4/test_binding.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v4/test_bootstrap.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v4/test_caps.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v4/test_materials.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v4/test_orchestration.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v4/test_qualification.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v4/test_resources.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v4/test_six.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v4/test_source.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v4/test_transfer.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v5/test_actor_binding.py
          python3 -I -B -Werror::ResourceWarning scripts/ci/rust199-source-reference-native/successor_v5/test_admission.py
