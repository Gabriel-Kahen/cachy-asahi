              --updater-v2-source "$GITHUB_WORKSPACE/composition-updater-v2" --setup4-pair "$RUNNER_TEMP/setup4-retained" \
              --product "$GITHUB_WORKSPACE/composition-product" --updater "$GITHUB_WORKSPACE/composition-updater" \
              --desktop "$GITHUB_WORKSPACE/composition-desktop" \
              --native "$RUNNER_TEMP/native-evidence" --fdk "$RUNNER_TEMP/fdk-evidence" --cache "$RUNNER_TEMP/alarm-cache" \
              --seven-source "$GITHUB_WORKSPACE/expanded604-seven" --eight-source "$GITHUB_WORKSPACE/expanded604-eight" \
              --management-source "$GITHUB_WORKSPACE/expanded604-management-source/payload" \
              --welcome-source "$GITHUB_WORKSPACE/expanded604-welcome-source/payload" \
              --fresh600-decisions "$GITHUB_WORKSPACE/expanded604-fresh600-decisions" \
              --native604-decisions "$GITHUB_WORKSPACE/expanded604-native604-decisions" \
              --audio-inputs "$RUNNER_TEMP/audio-archives" \
              --output "/tmp/cachy-asahi-expanded604-root-upgrade-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain bounded604 copied-root and original producer public receipts
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYPUBLIC'
          import hashlib,json,os,pathlib,stat
          source=pathlib.Path('/tmp')/('cachy-asahi-expanded604-root-upgrade-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'expanded604-root-upgrade-public'
          target.mkdir(mode=0o700)
          names=('result.json','public/result.json','public/adapter.json','public/producer.json','public/producer-cleanup.json','public/transaction-tail.log')
          rows={};total=0
          for name in names:
              path=source/name
              if not path.exists():continue
              assert not path.is_symlink() and stat.S_ISREG(path.lstat().st_mode)
              raw=path.read_bytes();assert len(raw)<=4*1024**2
              total+=len(raw);assert total<=8*1024**2
              destination=target/name;destination.parent.mkdir(parents=True,exist_ok=True);destination.write_bytes(raw)
              rows[name]={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (target/'retention.json').write_text(json.dumps(dict(files=rows,raw_bytes=total,
              scope='generic4K native604 copied-root updater case only; no rollback, boot or Apple acceptance'),sort_keys=True)+'\n')
          PYPUBLIC
          python3 -B scripts/ci/log_evidence.py "$RUNNER_TEMP/expanded604-root-upgrade-public"
