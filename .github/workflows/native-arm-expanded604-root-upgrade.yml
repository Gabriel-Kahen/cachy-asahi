      - name: Unpack only the exact retained public setup4 pair
        if: ${{ !cancelled() && steps.fdk_pair.outcome == 'success' }}
        shell: bash
        run: |
          python3 -B - <<'PYPAIR'
          from pathlib import Path, PurePosixPath
          import hashlib, os, tarfile
          source=Path('composition-preparation/scripts/ci/full-development-composition/retained/setup4-pair.tar.xz')
          assert source.stat().st_size==69776 and hashlib.sha256(source.read_bytes()).hexdigest()=='1637452a84733fdf059d7dbc10c5b6dddd11c589c4f97ebb6a4655aedd12359f'
          target=Path(os.environ['RUNNER_TEMP'])/'setup4-retained'
          target.mkdir(mode=0o700)
          with tarfile.open(source,'r:xz') as archive:
              members=archive.getmembers()
              assert len(members)==64 and sum(item.size for item in members)<4*1024**2
              assert len({item.name for item in members})==64
              for item in members:
                  name=PurePosixPath(item.name)
                  assert item.isfile() and not name.is_absolute() and '..' not in name.parts
                  assert name.parts[0] in ('build-1','build-2')
              archive.extractall(target,filter='data')
          PYPAIR
      - name: Required separate native604 copied-root updater case
        id: composition
        if: ${{ always() && !cancelled() && steps.root_inputs.outcome == 'success' }}
        timeout-minutes: 270
        shell: bash
        env:
          FDK_PAIR_OUTCOME: ${{ steps.fdk_pair.outcome }}
          AUDIO_INPUTS_OUTCOME: ${{ steps.audio_inputs.outcome }}
          IMPLEMENTATION_SOURCE: ${{ inputs.source }}
