name: Offline build-tools package DATA controls
on:
  pull_request:
    paths:
      - 'packages/tools/cachy-asahi-build-tools/**'
      - '.github/workflows/build-tools-package-data.yml'
  push:
    branches: [main]
    paths:
      - 'packages/tools/cachy-asahi-build-tools/**'
      - '.github/workflows/build-tools-package-data.yml'
permissions:
  contents: read
jobs:
  package-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check seven moved-package real-source DATA controls
        run: >-
          python3 -I -B -Werror::ResourceWarning
          packages/tools/cachy-asahi-build-tools/test_package.py
