name: native-arm-orphans-full574-cleanup
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source SHA, equal to this workflow revision
        type: string
        required: true
      trial:
        description: One independent selected-orphan trial; separate runs required
        type: choice
        required: true
        options: [normal, interruption]
      manifest_sha256:
        description: Exact source-manifest SHA256 after Root source and adapter freeze
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-arm-orphans-full574-cleanup-${{ inputs.trial }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      SLICE: scripts/ci/orphans-full574-native
      TRIAL: ${{ inputs.trial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Prove the explicit source and workflow revision before secrets
        id: proof
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$SOURCE_SHA"
          [[ $MANIFEST_SHA256 =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$MANIFEST_SHA256" "$SLICE/source-manifest.json" | sha256sum --check
          python3 -I -B "$SLICE/job.py" proof --trial "$TRIAL" --source "$GITHUB_WORKSPACE" --proof "$RUNNER_TEMP/apps574-source-proof.json"
      - name: Focused source and actual backend guards only
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -B -Werror::ResourceWarning -m unittest discover -s "$SLICE" -p 'test*.py' -v
          python3 -B -Werror::ResourceWarning -m unittest discover -s scripts/apps -p 'test_*.py' -v
          python3 -I -B scripts/orphans/test_selected.py
      - name: Checkout exact Root accepted four native pairs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ steps.proof.outputs.packet_source }}
          path: retained-apps574-inputs
          persist-credentials: false
      - name: Verify closed native packet before secrets
        timeout-minutes: 2
        run: |
          python3 -I -B "$SLICE/job.py" check --trial "$TRIAL" --source "$GITHUB_WORKSPACE" \
            --packet "$GITHUB_WORKSPACE/retained-apps574-inputs/payload"
          python3 -I -B "$SLICE/test_held_payloads.py" \
            --actual-packet "$GITHUB_WORKSPACE/retained-apps574-inputs/payload"
      - name: Seed the six exact retained inputs using existing secrets only
        timeout-minutes: 2
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: >-
          python3 -I -B scripts/ci/maintained_desktop574.py seed
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$RUNNER_TEMP/desktop574"
      - name: Checkout exact retained public input source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed fourteen exact public ARM input files
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3' 'retained-public-inputs/seed.py' 'a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300' 'retained-public-inputs/index.json' | sha256sum --check
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 TZ=UTC TMPDIR="$RUNNER_TEMP" python3 -I -B "$GITHUB_WORKSPACE/retained-public-inputs/seed.py" --cache "$RUNNER_TEMP/desktop574/context/deps"
      - name: Reconstruct pinned inputs and run offline owned native574 transaction
        timeout-minutes: 40
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: >-
          timeout --signal=TERM --kill-after=10s 2300s
          python3 -I -B scripts/ci/maintained_desktop574.py build
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$RUNNER_TEMP/desktop574" --job-token "$JOB_TOKEN"
      - name: Actual native574 Apps copied-root transactions
        id: orphan_trial
        timeout-minutes: 60
        run: >-
          timeout --signal=TERM --kill-after=30s 3550s
          python3 -I -B "$SLICE/supervise.py" run --handoff "$RUNNER_TEMP/orphans-job-handoff.json" --trial "$TRIAL" --source "$GITHUB_WORKSPACE"
          --packet "$GITHUB_WORKSPACE/retained-apps574-inputs/payload"
          --proof "$RUNNER_TEMP/apps574-source-proof.json" --base "$RUNNER_TEMP/desktop574"
          --output "$RUNNER_TEMP/apps574-runtime"
      - name: Retire all actors copies TEST keys and snapshot before producer
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 11
        run: >-
          timeout --signal=TERM --kill-after=10s 650s
          python3 -I -B "$SLICE/supervise.py" cleanup --handoff "$RUNNER_TEMP/orphans-job-handoff.json" --job-outcome '${{ steps.orphan_trial.outcome }}' --trial "$TRIAL" --source "$GITHUB_WORKSPACE"
          --proof "$RUNNER_TEMP/apps574-source-proof.json" --base "$RUNNER_TEMP/desktop574"
          --output "$RUNNER_TEMP/apps574-runtime" --receipt "$RUNNER_TEMP/apps574-cleanup.json"
      - name: Retain bounded closed actual and failure evidence
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 3
        run: >-
          python3 -I -B "$SLICE/job.py" retain --trial "$TRIAL" --source "$GITHUB_WORKSPACE"
          --packet "$GITHUB_WORKSPACE/retained-apps574-inputs/payload"
          --proof "$RUNNER_TEMP/apps574-source-proof.json" --base "$RUNNER_TEMP/desktop574"
          --output "$RUNNER_TEMP/apps574-runtime" --receipt "$RUNNER_TEMP/apps574-cleanup.json"
          --public "$RUNNER_TEMP/apps574-public"
      - name: Upload only the bounded public evidence directory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 2
        with:
          name: orphans-full574-cleanup-${{ inputs.trial }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/apps574-public/
          include-hidden-files: true
