name: Offline endpoint copy source controls
on:
  pull_request:
    paths:
      - scripts/release/endpoint_copy_v1/**
      - scripts/client/endpoint.py
      - scripts/client/client.py
      - scripts/client/test_endpoint.py
      - scripts/release/export_repository.py
      - scripts/release/offline_kit.py
      - scripts/release/release.py
      - scripts/release/source_delivery.py
      - scripts/release/test_export_repository.py
      - scripts/release/test_release.py
      - .github/workflows/endpoint-copy-source.yml
  push:
    branches: [main]
    paths:
      - scripts/release/endpoint_copy_v1/**
      - scripts/client/endpoint.py
      - scripts/client/client.py
      - scripts/client/test_endpoint.py
      - scripts/release/export_repository.py
      - scripts/release/offline_kit.py
      - scripts/release/release.py
      - scripts/release/source_delivery.py
      - scripts/release/test_export_repository.py
      - scripts/release/test_release.py
      - .github/workflows/endpoint-copy-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoint-copy-tests:
    name: endpoint-copy (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: copy
            directory: scripts/release/endpoint_copy_v1
            pattern: test_*.py
            minimum: 23
          - suite: existing-recipient
            directory: scripts/client
            pattern: test_endpoint.py
            minimum: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Provision existing TEST-signature and repository tools on the disposable runner
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install --yes --no-install-recommends gnupg libarchive-tools pacman-package-manager makepkg
          for tool in gpg bsdtar vercmp repo-add; do command -v "$tool"; done
      - name: Run selected real filesystem and TEST-signature controls without skips
        env:
          TEST_DIRECTORY: ${{ matrix.directory }}
          TEST_PATTERN: ${{ matrix.pattern }}
          MINIMUM_TESTS: ${{ matrix.minimum }}
        run: |
          python -B -Werror::ResourceWarning - <<'PYTHON'
          import os, unittest
          suite = unittest.TestLoader().discover(os.environ['TEST_DIRECTORY'], pattern=os.environ['TEST_PATTERN'])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun < int(os.environ['MINIMUM_TESTS']):
              raise SystemExit('failures, skips, or missing controls')
          PYTHON
