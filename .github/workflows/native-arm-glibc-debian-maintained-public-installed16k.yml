name: native-arm-glibc-debian-maintained-public-installed16k
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Root-frozen owner source equal to workflow revision; policy must already bind an accepted actual packet
        type: string
        required: true
      native_lifecycle_decision:
        description: Exact Root-bound immutable {ref,path,bytes,sha256} for CURRENT maintained normal ALPM native lifecycle
        required: true
        type: string
      system16k_decision:
        description: Exact Root-bound immutable {ref,path,bytes,sha256} for CURRENT maintained staged16384 runtime
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-arm-glibc-debian-maintained-public-installed16k
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      CAA3_PUBLIC_NATIVE_SOURCE: ${{ github.workspace }}/public-native-component
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      SLICE: ${{ github.workspace }}/maintained-installed-native-source/scripts/ci/glibc-debian-maintained-public-provider-lifecycle-owner
      NATIVE_BUNDLE: ${{ github.workspace }}/maintained-installed-native-source
      NATIVE_LIFECYCLE_DECISION: ${{ inputs.native_lifecycle_decision }}
      SYSTEM16K_DECISION: ${{ inputs.system16k_decision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Refuse pending normal lifecycle or unpublished native packet before credentials and actors
        id: decisions
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'c1d9d5781433ccb241f7877bdf9c14332d90281782e55e031c9a6cd2ee64e0f0' 'scripts/ci/glibc-debian-maintained-public-installed16k/prepare.py' '41480460a6eada115b9cc6c6347dd638cbdea2f6578e21cb4e0a212b6380551a' 'scripts/ci/glibc-debian-maintained-public-installed16k/policy.json' '36d996b1703b2a5e32f5314a308644d2ee992df22780822ea9d7f183f08c8a75' 'scripts/ci/glibc-debian-maintained-public-installed16k/source-pins.json' | sha256sum --check
          python3 -I -B scripts/ci/glibc-debian-maintained-public-installed16k/prepare.py preflight --workspace "$GITHUB_WORKSPACE"
          printf 'VM_SOURCE=%s/maintained-installed16k-vm-source\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout exact current native normal lifecycle Root decision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: ${{ steps.decisions.outputs.native_lifecycle_ref }}
          path: maintained-native-root-decision
          persist-credentials: false
      - name: Checkout exact current staged16384 Root decision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: ${{ steps.decisions.outputs.system16k_ref }}
          path: maintained-staged-root-decision
          persist-credentials: false
      - name: Checkout the exact independently pinned public native component
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: ${{ steps.decisions.outputs.native_component_ref }}
          path: public-native-component
          persist-credentials: false
      - name: Compose closed public-native VM source with both actual Root decisions
        id: wiring
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/glibc-debian-maintained-public-installed16k/prepare.py assemble --workspace "$GITHUB_WORKSPACE" --component "$GITHUB_WORKSPACE/public-native-component" \
            --native-decision-root "$GITHUB_WORKSPACE/maintained-native-root-decision" \
            --normal-decision-root "$GITHUB_WORKSPACE/maintained-staged-root-decision" \
            --output "$VM_SOURCE" --public "$RUNNER_TEMP/maintained-installed16k-wiring-public"
      - name: Reuse exact maintained native packet and owner source in separate checkout-child root
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/glibc-debian-maintained-public-installed16k/prepare.py native-source --workspace "$GITHUB_WORKSPACE" --component "$GITHUB_WORKSPACE/public-native-component" --output "$NATIVE_BUNDLE"
      - name: Require Root-bound source and immutable packet policy before secrets or native actors
        id: proof
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'f2d024c1209d8e467c9d7a86c342ea636dc22725c7e7de69c9bd36a6f8db91dc' "$SLICE/job.py" | sha256sum --check
          python3 -I -B "$SLICE/job.py" proof --workspace "$NATIVE_BUNDLE" --proof "$RUNNER_TEMP/provider-lifecycle-proof.json"
      - name: Checkout only the exact Root-bound actual input packet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: ${{ steps.proof.outputs.packet_ref }}
          path: lifecycle-packet
          persist-credentials: false
      - name: Verify public compile pair normal clients and held rollback before secrets
        id: packet
        timeout-minutes: 4
        run: |
          set -euo pipefail
          test "$(git -C lifecycle-packet rev-parse HEAD)" = '${{ steps.proof.outputs.packet_ref }}'
          python3 -I -B "$SLICE/job.py" packet --workspace "$NATIVE_BUNDLE" --packet-root "$GITHUB_WORKSPACE/lifecycle-packet"
      - name: Verify exact retained diagnostic helper before secrets
        timeout-minutes: 1
        run: |
          set -euo pipefail
          printf '%s  %s\n' '9bd52ce4453a3a03d8dc8b5edb6b6a4b8ec421e0c3037dfb64dc31da45687555' 'scripts/ci/glibc-gnu-failure-log/summary.py' | sha256sum --check
          cd "$RUNNER_TEMP"
          python3 -I -B "$GITHUB_WORKSPACE/scripts/ci/glibc-gnu-failure-log/summary.py" --help
      - name: Bounded inert owner and installed-lane controls
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/glibc-gnu-provider-lifecycle-owner/test_owner.py
          python3 -I -B scripts/ci/glibc-debian-maintained-installed16k/test_generator.py
          python3 -I -B scripts/ci/glibc-debian-maintained-public-installed16k/test_route.py
          python3 -I -B scripts/ci/glibc-gnu-provider-installed16k/test_snapshot_progress.py
          python3 -I -B scripts/ci/glibc-gnu-provider-installed16k/test_first_observer_progress.py
          python3 -I -B scripts/ci/glibc-gnu-failure-log/test_summary.py
          python3 -I -B scripts/ci/glibc-gnu-provider-lifecycle/test_copy_scope.py
          python3 -I -B scripts/ci/glibc-gnu-provider-lifecycle/test_controls.py
      - name: Seed the six existing private input files using unchanged secrets
        timeout-minutes: 2
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: >-
          python3 -I -B scripts/ci/maintained_desktop574.py seed
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$RUNNER_TEMP/desktop574"
      - name: Checkout exact fourteen public input files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed the exact public inputs without secrets
        timeout-minutes: 3
        run: |
          set -euo pipefail
          test "$(git -C retained-public-inputs rev-parse HEAD)" = 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          printf '%s  %s\n' 'a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3' 'retained-public-inputs/seed.py' 'a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300' 'retained-public-inputs/index.json' | sha256sum --check
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP" LANG=C.UTF-8 TZ=UTC TMPDIR="$RUNNER_TEMP" python3 -I -B "$GITHUB_WORKSPACE/retained-public-inputs/seed.py" --cache "$RUNNER_TEMP/desktop574/context/deps"
      - name: Reuse unchanged owned574 native producer
        timeout-minutes: 40
        env:
          JOB_TOKEN: ${{ steps.proof.outputs.job_token }}
        run: >-
          timeout --signal=TERM --kill-after=10s 2300s
          python3 -I -B scripts/ci/maintained_desktop574.py build
          --inputs scripts/ci/maintained-desktop574-inputs.json
          --output "$RUNNER_TEMP/desktop574" --job-token "$JOB_TOKEN"
      - name: Snapshot never-started original574 bind private source and run actual installed lifecycle
        timeout-minutes: 80
        run: |
          set -euo pipefail
          python3 -I -B "$SLICE/job.py" execute --workspace "$NATIVE_BUNDLE" \
            --packet-root "$GITHUB_WORKSPACE/lifecycle-packet" --proof "$RUNNER_TEMP/provider-lifecycle-proof.json" \
            --base "$RUNNER_TEMP/desktop574" --output "$RUNNER_TEMP/provider-lifecycle-owner"
      - name: Provision accepted kernel and QEMU tools on disposable runner
        timeout-minutes: 8
        run: |
          set -euo pipefail
          docker version >/dev/null
          timeout --kill-after=10s 180s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 update -qq
          timeout --kill-after=10s 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 install -y --no-install-recommends build-essential bc clang lld llvm flex bison libssl-dev libelf-dev python3 qemu-system-arm zstd ca-certificates
      - name: Prepare dedicated archive-only kernel cache directory
        timeout-minutes: 1
        run: install -d -m 700 "$RUNNER_TEMP/kernel-source-cache/874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad"
      - name: Restore only the exact content-addressed kernel archive
        id: kernel_cache_restore
        timeout-minutes: 2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kernel-source-cache/874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad/kernel.tar.gz
          key: asahi-kernel-source-v1-874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad-262965559
          enableCrossOsArchive: false
          fail-on-cache-miss: false
          lookup-only: false
      - name: Seed a true miss from the exact retained public source asset
        id: kernel_seed
        if: steps.kernel_cache_restore.outputs.cache-hit != 'true'
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_CACHE_HIT: ${{ steps.kernel_cache_restore.outputs.cache-hit }}
          KERNEL_CACHE_MATCHED_KEY: ${{ steps.kernel_cache_restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          python3 -I -B - "$VM_SOURCE" "scripts/ci/glibc-debian-maintained-installed16k" <<'PYSEED'
          import os,pathlib,sys
          root=pathlib.Path(sys.argv[1]);sys.path.insert(0,str(root/sys.argv[2]));import support as s
          s.check_source(root)
          acquire=s.load(root,'scripts/ci/tools-generic16k/acquire_kernel.py')
          seed=s.load(root,'scripts/ci/tools-generic16k/retained_kernel.py')
          fetch=s.load(root,'scripts/virtual/generic16k/fetch_inputs.py')
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'kernel-source-cache'/'874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad'/'kernel.tar.gz'
          assert acquire.cache_state(archive,os.environ['KERNEL_CACHE_HIT'],os.environ['KERNEL_CACHE_MATCHED_KEY'])=='MISS'
          result=seed.download(archive,acquire,fetch.deadline_alarm,pathlib.Path(os.environ['RUNNER_TEMP'])/'managed-gui16k-kernel-source-seed.json')
          if result['status']=='RETAINED_ASSET_DOWNLOADED_HASH_VERIFIED':
              with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('retained_archive='+str(archive)+'\n')
          else:assert result['status']=='RETAINED_ASSET_UNAVAILABLE'
          PYSEED
      - name: Acquire exact Asahi archive and stage the separate GUI helper
        id: kernel_acquire
        timeout-minutes: 6
        env:
          KERNEL_CACHE_HIT: ${{ steps.kernel_cache_restore.outputs.cache-hit }}
          KERNEL_CACHE_MATCHED_KEY: ${{ steps.kernel_cache_restore.outputs.cache-matched-key }}
          KERNEL_RETAINED_ARCHIVE: ${{ steps.kernel_seed.outputs.retained_archive }}
        run: |
          set -euo pipefail
          python3 -I -B - "$VM_SOURCE" "scripts/ci/glibc-debian-maintained-installed16k" "$RUNNER_TEMP/managed-gui16k-kernel" <<'PYCODE'
          import json,os,pathlib,shutil,sys,time
          root=pathlib.Path(sys.argv[1]);sys.path.insert(0,str(root/sys.argv[2]));import support as s
          s.check_source(root);work=pathlib.Path(sys.argv[3]);work.mkdir(mode=0o700);(work/'inputs').mkdir(mode=0o700)
          fetch=s.load(root,'scripts/virtual/generic16k/fetch_inputs.py')
          manifest,manifest_sha=fetch.load_manifest(root/'scripts/virtual/generic16k/inputs.json')
          acquire=s.load(root,'scripts/ci/tools-generic16k/acquire_kernel.py')
          cache=pathlib.Path(os.environ['RUNNER_TEMP'])/'kernel-source-cache'/'874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad'/'kernel.tar.gz'
          acquire.acquire(fetch,manifest['inputs'][0],work/'inputs',manifest_sha,pathlib.Path(os.environ['RUNNER_TEMP'])/'managed-gui16k-acquisition.json',
              cache_archive=cache,cache_hit=os.environ['KERNEL_CACHE_HIT'],cache_matched_key=os.environ['KERNEL_CACHE_MATCHED_KEY'],
              retained_archive=os.environ['KERNEL_RETAINED_ARCHIVE'] or None)
          helper=work/'helper';helper.mkdir(mode=0o700)
          for name in ('build_kernel.py','kernel.fragment'):shutil.copyfile(root/'scripts/ci/managed-gui-generic16k'/name,helper/name)
          PYCODE
      - name: Save verified archive immediately before kernel build or cleanup
        if: steps.kernel_acquire.outcome == 'success' && steps.kernel_cache_restore.outputs.cache-hit != 'true'
        timeout-minutes: 2
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kernel-source-cache/874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad/kernel.tar.gz
          key: asahi-kernel-source-v1-874ef68d04ac8c831b90bb01a387cfabb58fceb60842c49a0d0e58bcd6c146ad-262965559
          enableCrossOsArchive: false
      - name: Build only the separately derived managed GUI diagnostic16K kernel
        timeout-minutes: 63
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 3700s python3 -I -B "$RUNNER_TEMP/managed-gui16k-kernel/helper/build_kernel.py" --archive "$RUNNER_TEMP/managed-gui16k-kernel/inputs/kernel.tar.gz" --output "$RUNNER_TEMP/managed-gui16k-kernel/helper/built" --build --boot-diagnostics > "$RUNNER_TEMP/managed-gui16k-kernel/controller.log" 2>&1
      - name: Actual disk-backed complete574 generic16K ALPM provider lifecycle and outer rollback
        id: installed16k
        timeout-minutes: 220
        run: |
          set -euo pipefail
          python3 -I -B "$VM_SOURCE/scripts/ci/glibc-debian-maintained-installed16k/run.py" run \
            --workspace "$VM_SOURCE" --acceptances "$VM_SOURCE/scripts/ci/glibc-debian-maintained-installed16k/prerequisites" \
            --owner "$RUNNER_TEMP/provider-lifecycle-owner" --base "$RUNNER_TEMP/desktop574" \
            --kernel-work "$RUNNER_TEMP/managed-gui16k-kernel" \
            --kernel-receipt "$RUNNER_TEMP/managed-gui16k-kernel/helper/built/build-receipt.json" \
            --output /tmp/caa-debian-maintained-installed16k
      - name: Retire every clone consumer source snapshot and observer before original574 producer
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYBARRIER'
          import json,pathlib
          output=pathlib.Path('/tmp/caa-debian-maintained-installed16k')
          if output.exists():
              value=json.loads((output/'owner.json').read_bytes())
              assert value['consumer_cleanup']=='PASS_ALL_ACTORS_GROUPS_AND_DISKS_REMOVED', 'unknown16K consumer absence: retain original producer'
          PYBARRIER
          python3 -I -B "$SLICE/job.py" cleanup --workspace "$NATIVE_BUNDLE" \
            --proof "$RUNNER_TEMP/provider-lifecycle-proof.json" --base "$RUNNER_TEMP/desktop574" \
            --output "$RUNNER_TEMP/provider-lifecycle-owner" --receipt "$RUNNER_TEMP/provider-lifecycle-cleanup.json"
      - name: Retain only closed bounded actual lifecycle receipts inputs and source snapshot metadata
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          retain_status=0
          python3 -I -B "$SLICE/job.py" retain --workspace "$NATIVE_BUNDLE" \
            --proof "$RUNNER_TEMP/provider-lifecycle-proof.json" --base "$RUNNER_TEMP/desktop574" \
            --output "$RUNNER_TEMP/provider-lifecycle-owner" --receipt "$RUNNER_TEMP/provider-lifecycle-cleanup.json" \
            --packet-root "$GITHUB_WORKSPACE/lifecycle-packet" --public "$RUNNER_TEMP/provider-lifecycle-public" || retain_status=$?
          summary_status=0
          printf '%s  %s\n' '9bd52ce4453a3a03d8dc8b5edb6b6a4b8ec421e0c3037dfb64dc31da45687555' 'scripts/ci/glibc-gnu-failure-log/summary.py' | sha256sum --check || summary_status=$?
          if [ "$summary_status" -eq 0 ]; then
            python3 -I -B scripts/ci/glibc-gnu-failure-log/summary.py emit --lane lifecycle \
              --proof "$RUNNER_TEMP/provider-lifecycle-proof.json" --owner "$RUNNER_TEMP/provider-lifecycle-owner" \
              --cleanup "$RUNNER_TEMP/provider-lifecycle-cleanup.json" --public "$RUNNER_TEMP/provider-lifecycle-public" \
              --retain-exit "$retain_status" || summary_status=$?
          fi
          if [ "$retain_status" -ne 0 ]; then exit "$retain_status"; fi
          exit "$summary_status"
      # Runtime artifact roles: 'native_lifecycle' and 'installed16k'; wiring metadata is separate.
      - name: Upload only the closed provider lifecycle public packet
        if: always() && steps.proof.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 5
        with:
          name: glibc-debian-maintained-public-provider-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-lifecycle-public/
          retention-days: 3
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify complete installed16K public export remains within its fixed bound
        id: installed16k_export
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYEXPORT'
          import json,pathlib,sys
          sys.path.insert(0,str(pathlib.Path(__import__('os').environ['VM_SOURCE'])/'scripts/ci/glibc-debian-maintained-installed16k'));import contract as C
          public=pathlib.Path('/tmp/caa-debian-maintained-installed16k/public');value=C.decode(C.read(public/'retention.json'))
          assert value['status']=='BOUNDED_SOURCE_DERIVED_METADATA_AND_LOGS_ONLY' and len(value['files'])<=320
          assert value['bytes']==sum(r['bytes'] for r in value['files'].values())<=544*1024**2
          actual={p.relative_to(public).as_posix() for p in public.rglob('*') if p.is_file()}
          assert actual==set(value['files'])|{'retention.json'}
          for name,row in value['files'].items():C.ref(public,dict(path=name,**row),64*1024**2)
          PYEXPORT
      - name: Upload complete bounded installed16K receipt and raw snapshots
        if: always() && steps.installed16k_export.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 5
        with:
          name: glibc-debian-maintained-installed16k-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/caa-debian-maintained-installed16k/public/
          retention-days: 3
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: warn
      - name: Verify bounded current decision and effective source metadata
        id: wiring_export
        if: always() && steps.wiring.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -I -B scripts/ci/glibc-debian-maintained-public-installed16k/prepare.py export --workspace "$GITHUB_WORKSPACE" --public "$RUNNER_TEMP/maintained-installed16k-wiring-public"
      - name: Upload seven bounded wiring metadata files only
        if: always() && steps.wiring_export.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 3
        with:
