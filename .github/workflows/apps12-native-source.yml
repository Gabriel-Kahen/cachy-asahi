name: Apps12 native source factory
on:
  pull_request:
    paths:
      - 'scripts/ci/apps12-native-source/**'
      - '.github/workflows/apps12-native-source.yml'
  push:
    paths:
      - 'scripts/ci/apps12-native-source/**'
      - '.github/workflows/apps12-native-source.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: d4e86c4e7799b4138fc1a1a8720b223e78b99fe6
          path: .ci-fixtures/apps11-native
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: c368b555aa3e28026e3252693da33dae0b9e80e2
          path: .ci-fixtures/apps12-recipe
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: b49ef3fae2b241ab381ab19703faf12adce44fec
          path: .ci-fixtures/apps12-native
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Exact115 emission and all18 original lane controls
        env:
          APPS11_NATIVE_SOURCE: ${{ github.workspace }}/.ci-fixtures/apps11-native
          APPS12_RECIPE_SOURCE: ${{ github.workspace }}/.ci-fixtures/apps12-recipe
          APPS12_NATIVE_SOURCE: ${{ github.workspace }}/.ci-fixtures/apps12-native
        run: python3 -I -B -Werror scripts/ci/apps12-native-source/test_prepare.py
