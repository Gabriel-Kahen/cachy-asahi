# Exact copy proposal. Root selects publication/dispatch of these bytes.
name: signer-native-passive-observation
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact Root-selected Source/workflow commit (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signer-native-passive-observation
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.ref == 'refs/heads/codex/signer-native-passive-observation-20261014'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    env:
      ROOT_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - name: Observe and retain Source-pinned read-only ARM toolchain
        id: observer
        timeout-minutes: 2
        env:
          SIGNER_OBSERVER_SOURCE_BUNDLE_B64: ''
        shell: bash
        run: |
          /usr/bin/python3.12 -I -B -S - <<'SIGNER_PASSIVE_PYTHON'
          import time
          entry=time.monotonic()
          import base64, hashlib, json, os, types, zlib
          pins={'passive.py': {'bytes': 40917, 'mode': 420, 'sha256': 'b844e94ae9cf69882550526a93aed3606398e9252175472be0bf6f2888eba1c9'}, 'observation_entry.py': {'bytes': 12522, 'mode': 420, 'sha256': '540db1ab5a877fd2486673e86d2a1216c036dd9d8bec3953f44f467ee4966071'}, 'provenance.py': {'bytes': 21330, 'mode': 420, 'sha256': '880f5a7c3079cdf8bbad2a5b7bfd8b182f2b4156f57a1a6224505c2230c6660d'}, 'retention.py': {'bytes': 33661, 'mode': 420, 'sha256': '95d70a043380da8b894975a2c5341d1ca8b1f6209846a69dd64fa4049564be9e'}, 'adoption_entry.py': {'bytes': 15721, 'mode': 420, 'sha256': '31462fd6c49f155f42410e8ebd4b287a0c9f12987953065f758001fc1c7023d9'}}
          payload=os.environ['SIGNER_OBSERVER_SOURCE_BUNDLE_B64']
          issuer={'GPG_allowed': False, 'argv': ['/usr/bin/python3.12', '-I', '-B', '-S', '-'], 'branch': 'codex/signer-native-passive-observation-20261014', 'compile_allowed': False, 'gcc_directory': 'CURRENT_DEFAULT_GCC', 'job_name': 'observe', 'operation': 'ONE_READ_ONLY_HOSTED_ARM_TOOLCHAIN_OBSERVATION', 'probe_allowed': False, 'purpose': 'SIGNER_NATIVE_PASSIVE_PUBLIC_ISSUER_V1', 'repository': 'Gabriel-Kahen/cachy-asahi', 'runner_label': 'ubuntu-24.04-arm', 'schema_version': 1, 'seconds': 60, 'signing_allowed': False, 'system_mutation_allowed': False, 'workflow': '.github/workflows/native-arm-runner-observation.yml'}
          configuration={'gcc_directory': 'CURRENT_DEFAULT_GCC', 'purpose': 'NATIVE_SIGNER_COMPILE_PASSIVE_OBSERVATION_V1', 'schema_version': 1}
          compressed=base64.b64decode(payload,validate=True)
          if hashlib.sha256(compressed).hexdigest()!='85647591fed7c032dc021e090597c33fec96e162a8a590bc9ed200e0d04d5afd':
              raise SystemExit('REFUSED: compressed Source bundle')
          decoder=zlib.decompressobj()
          bundle=decoder.decompress(compressed,256*1024+1)
          if len(bundle)!=126524 or len(bundle)>256*1024 or not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or hashlib.sha256(bundle).hexdigest()!='d26155e659adfce93901b8988ae6e37afab21258d6a85ccd1d62c6457c4156cd':
              raise SystemExit('REFUSED: bounded raw Source bundle')
          payloads=json.loads(bundle)
          if set(payloads)!=set(pins):
              raise SystemExit('REFUSED: exact Source names')
          verified={}
          for name,text in payloads.items():
              raw=text.encode('utf-8')
              if len(raw)!=pins[name]['bytes'] or hashlib.sha256(raw).hexdigest()!=pins[name]['sha256']:
                  raise SystemExit('REFUSED: exact observer Source byte pin')
              verified[name]=raw
          packet=hashlib.sha256(json.dumps(pins,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          if packet!='37f3c52ba9300f34633be728d16f8f8f95270b8252292648d685d66fa79e6096':
              raise SystemExit('REFUSED: exact Source packet')
          units={}
          for name,raw in verified.items():
              unit=types.ModuleType('signer_passive_'+name[:-3])
              exec(compile(raw,'<Source-pinned:'+name+'>','exec',dont_inherit=True),unit.__dict__)
              units[name]=unit
          emitter=units['observation_entry.py'].StdoutEmitter()
          raise SystemExit(units['adoption_entry.py'].run(units['passive.py'],units['provenance.py'],
              units['retention.py'],entry=entry,configuration=configuration,issuer=issuer,
              source_pins=pins,source_packet_sha256=packet,environment=dict(os.environ),emit=emitter))
          SIGNER_PASSIVE_PYTHON
      - name: Retain exact observation files, including failed partial output
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signer-native-passive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signer-native-passive-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: false
          overwrite: false
