# Future Root-issued execution only; no commit/hash placeholders are authorities.
name: project-private-libraries-cli-v1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-arm-build
  cancel-in-progress: false
  queue: max
jobs:
  maintained:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/project-private-libraries-cli-registered-v1' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ROOT_REGISTERED_PRIVATE_LIBRARY_CLI_PLAN_B64: ${{ vars.PRIVATE_LIBRARY_CLI_ROOT_PLAN_B64 }}
      ROOT_REGISTERED_PRIVATE_LIBRARY_CLI_PLAN_SHA256: ${{ vars.PRIVATE_LIBRARY_CLI_ROOT_PLAN_SHA256 }}
    steps:
      - name: Run the Root-issued fixed private library job
        timeout-minutes: 180
        shell: bash
        env:
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B -S -Werror - <<'PYTHON'
          import time
          EARLIEST_ENTRY = time.monotonic()
          import base64
          import hashlib
          import json
          import math
          import os
          import re
          import signal
          import sys
          import types
          import urllib.request

          def need(value, reason):
              if not value: raise ValueError(reason)

          def pairs(rows):
              value = {}
              for key, item in rows:
                  need(key not in value, 'ROOT_DUPLICATE_KEY')
                  value[key] = item
              return value

          def constant(_):
              raise ValueError('ROOT_NONFINITE_JSON')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError('ROOT_BOOTSTRAP_REDIRECT_REFUSED')

          def execute():
              encoded = os.environ.pop('ROOT_REGISTERED_PRIVATE_LIBRARY_CLI_PLAN_B64', None)
              expected = os.environ.pop('ROOT_REGISTERED_PRIVATE_LIBRARY_CLI_PLAN_SHA256', None)
              need(type(encoded) is str and encoded.isascii() and 0 < len(encoded) <= 174764,
                   'ROOT_PLAN_BASE64_CAP')
              need(type(expected) is str and re.fullmatch('[0-9a-f]{64}', expected) and expected != '0' * 64,
                   'ROOT_PLAN_PIN_REQUIRED')
              raw = base64.b64decode(encoded, validate=True)
              need(0 < len(raw) <= 131072 and base64.b64encode(raw).decode('ascii') == encoded and
                   hashlib.sha256(raw).hexdigest() == expected, 'ROOT_PLAN_BYTES')
              plan = json.loads(raw, object_pairs_hook=pairs, parse_constant=constant)
              need(type(plan) is dict and set(plan) == {'schema_version','purpose','repository','ref',
                   'code_commit','source_commit','data_commit','bootstrap','job','source_rows','peer_receipt','metadata','tools'},
                   'ROOT_CLOSED_PLAN')
              need(type(plan['schema_version']) is int and plan['schema_version'] == 1 and
                   plan['purpose'] == 'project-private-libraries-cli-root-plan' and
                   plan['repository'] == 'Gabriel-Kahen/cachy-asahi' and
                   plan['ref'] == 'refs/heads/codex/project-private-libraries-cli-registered-v1', 'ROOT_PLAN_IDENTITY')
              for key in ('code_commit','source_commit','data_commit'):
                  need(type(plan[key]) is str and re.fullmatch('[0-9a-f]{40}', plan[key]) and
                       plan[key] != '0' * 40, 'ROOT_FULL_COMMIT')
              need(len({plan[key] for key in ('code_commit','source_commit','data_commit')}) == 3,
                   'ROOT_DISTINCT_COMMITS')
              need(os.environ.get('GITHUB_REPOSITORY') == plan['repository'] and
                   os.environ.get('GITHUB_REF') == plan['ref'] and os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and
                   os.environ.get('GITHUB_SHA') == os.environ.get('GITHUB_WORKFLOW_SHA') == plan['source_commit'],
                   'ROOT_SOURCE_WORKFLOW_IDENTITY')
              body = plan['bootstrap']
              need(type(body) is dict and set(body) == {'path','sha256','bytes'} and
                   body['path'] == 'scripts/ci/private-library-cli/bootstrap.py' and
                   type(body['sha256']) is str and re.fullmatch('[0-9a-f]{64}', body['sha256']) and
                   body['sha256'] != '0' * 64 and type(body['bytes']) is int and 0 < body['bytes'] <= 131072,
                   'ROOT_BOOTSTRAP_PIN')
              remaining = min(EARLIEST_ENTRY + 10800 - 120, EARLIEST_ENTRY + 10080) - time.monotonic()
              need(remaining > 0, 'ROOT_ORIGINAL_DEADLINE')
              url = 'https://raw.githubusercontent.com/Gabriel-Kahen/cachy-asahi/' + plan['code_commit'] + '/' + body['path']
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              request = urllib.request.Request(url, method='GET')
              with opener.open(request, timeout=min(30, remaining)) as response:
                  need(response.status == 200 and response.geturl() == url, 'ROOT_BOOTSTRAP_HTTP')
                  source = response.read(body['bytes'] + 1)
              need(len(source) == body['bytes'] and hashlib.sha256(source).hexdigest() == body['sha256'] and
                   time.monotonic() < EARLIEST_ENTRY + 10800, 'ROOT_BOOTSTRAP_BYTES')
              module = types.ModuleType('root_private_libraries_cli_bootstrap')
              module.__file__ = url
              sys.modules[module.__name__] = module
              exec(compile(source, url, 'exec'), module.__dict__)
              return module.main(raw, expected, earliest_entry=EARLIEST_ENTRY)

          def expired(number, frame):
              raise TimeoutError('ROOT_ORIGINAL_DEADLINE')

          need(signal.getitimer(signal.ITIMER_REAL) == (0.0, 0.0), 'ROOT_EXISTING_TIMER')
          previous = signal.getsignal(signal.SIGALRM)
          first = None
          installed = False
          try:
              signal.signal(signal.SIGALRM, expired)
              installed = True
              remaining = EARLIEST_ENTRY + 10800 - time.monotonic()
              need(remaining > 0, 'ROOT_ORIGINAL_DEADLINE')
              signal.setitimer(signal.ITIMER_REAL, remaining)
              code = execute()
              need(type(code) is int and 0 <= code <= 255, 'ROOT_JOB_EXIT_SHAPE')
          except BaseException as error:
              first = error
              # Never print private records, seed values or arbitrary exception text.
              print('Root private-library job failed: ' + type(error).__name__, file=sys.stderr)
              code = 1
          finally:
              if installed:
                  for restore in (lambda: signal.setitimer(signal.ITIMER_REAL, 0),
                                  lambda: signal.signal(signal.SIGALRM, previous)):
                      try:
                          restore()
                      except BaseException as error:
                          if first is not None:
                              first.add_note('ROOT_TIMER_RESTORE_UNCERTAIN:' + type(error).__name__)
                          code = 1
          raise SystemExit(code)
          PYTHON
