# Exact copy proposal. Root selects publication/dispatch of these bytes.
name: signer-native-passive-observation
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact Root-selected Source/workflow commit (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signer-native-passive-observation
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.ref == 'refs/heads/codex/signer-native-passive-observation-20261014'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    env:
      ROOT_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - name: Observe and retain Source-pinned read-only ARM toolchain
        id: observer
        timeout-minutes: 2
        env:
          SIGNER_OBSERVER_SOURCE_BUNDLE_B64: ''
        shell: bash
        run: |
          /usr/bin/python3.12 -I -B -S - <<'SIGNER_PASSIVE_PYTHON'
          import time
          entry=time.monotonic()
          import base64, hashlib, json, os, types, zlib
          pins={'passive.py': {'bytes': 20180, 'mode': 420, 'sha256': '790e7dbf6d0b7d60c4eec82d786bb0291120570c6995c54200301b5bfaf7e210'}, 'observation_entry.py': {'bytes': 12522, 'mode': 420, 'sha256': '540db1ab5a877fd2486673e86d2a1216c036dd9d8bec3953f44f467ee4966071'}, 'provenance.py': {'bytes': 16773, 'mode': 420, 'sha256': 'b92b79c32943a073d529397bc11c373e209412044a5c76cf6a8a5835486df136'}, 'retention.py': {'bytes': 19387, 'mode': 420, 'sha256': '36cbf4598798d0c992235d451237505720ef43baddcfbb4463da21136bcbd6b5'}, 'adoption_entry.py': {'bytes': 12851, 'mode': 420, 'sha256': 'a5f299243cc591bc0aa6cc0a7cd9b53519aea1d8ff83a7b0184b414dd4685303'}}
          payload=os.environ['SIGNER_OBSERVER_SOURCE_BUNDLE_B64']
          issuer={'GPG_allowed': False, 'argv': ['/usr/bin/python3.12', '-I', '-B', '-S', '-'], 'branch': 'codex/signer-native-passive-observation-20261014', 'compile_allowed': False, 'gcc_directory': '/usr/lib/gcc/aarch64-linux-gnu/13', 'job_name': 'observe', 'operation': 'ONE_READ_ONLY_HOSTED_ARM_TOOLCHAIN_OBSERVATION', 'probe_allowed': False, 'purpose': 'SIGNER_NATIVE_PASSIVE_PUBLIC_ISSUER_V1', 'repository': 'Gabriel-Kahen/cachy-asahi', 'runner_label': 'ubuntu-24.04-arm', 'schema_version': 1, 'seconds': 60, 'signing_allowed': False, 'system_mutation_allowed': False, 'workflow': '.github/workflows/native-arm-runner-observation.yml'}
          configuration={'gcc_directory': '/usr/lib/gcc/aarch64-linux-gnu/13', 'purpose': 'NATIVE_SIGNER_COMPILE_PASSIVE_OBSERVATION_V1', 'schema_version': 1}
          compressed=base64.b64decode(payload,validate=True)
          if hashlib.sha256(compressed).hexdigest()!='100016236f56b15688e3cb90291a38946150ab3232374115330096263987f925':
              raise SystemExit('REFUSED: compressed Source bundle')
          decoder=zlib.decompressobj()
          bundle=decoder.decompress(compressed,256*1024+1)
          if len(bundle)!=83373 or len(bundle)>256*1024 or not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or hashlib.sha256(bundle).hexdigest()!='e34805ab889130f14e1c126369f0ad0b4ada9207492d7245055da5286e14aa11':
              raise SystemExit('REFUSED: bounded raw Source bundle')
          payloads=json.loads(bundle)
          if set(payloads)!=set(pins):
              raise SystemExit('REFUSED: exact Source names')
          verified={}
          for name,text in payloads.items():
              raw=text.encode('utf-8')
              if len(raw)!=pins[name]['bytes'] or hashlib.sha256(raw).hexdigest()!=pins[name]['sha256']:
                  raise SystemExit('REFUSED: exact observer Source byte pin')
              verified[name]=raw
          packet=hashlib.sha256(json.dumps(pins,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          if packet!='4de6ff1cbb55e5e4044395fc3950ee7cc78d48e470fb82260bfbf25e60988a0e':
              raise SystemExit('REFUSED: exact Source packet')
          units={}
          for name,raw in verified.items():
              unit=types.ModuleType('signer_passive_'+name[:-3])
              exec(compile(raw,'<Source-pinned:'+name+'>','exec',dont_inherit=True),unit.__dict__)
              units[name]=unit
          emitter=units['observation_entry.py'].StdoutEmitter()
          raise SystemExit(units['adoption_entry.py'].run(units['passive.py'],units['provenance.py'],
              units['retention.py'],entry=entry,configuration=configuration,issuer=issuer,
              source_pins=pins,source_packet_sha256=packet,environment=dict(os.environ),emit=emitter))
          SIGNER_PASSIVE_PYTHON
      - name: Retain exact observation files, including failed partial output
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signer-native-passive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signer-native-passive-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: false
          overwrite: false
