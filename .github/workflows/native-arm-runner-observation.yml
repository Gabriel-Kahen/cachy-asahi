name: signer-native-six-command-compile
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact Root-reviewed workflow and runnable binding commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signer-native-six-command-compile
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.ref == 'refs/heads/codex/signer-native-compile-receiver'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - name: Exact current Root-reviewed binding
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_source_sha }}
          path: binding
          persist-credentials: false
      - name: Published receiver and helpers baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 06557a7f209db3c4513329c9e7eab9f054a565b1
          path: baseline
          persist-credentials: false
      - name: Root checked six-command compile; no output execution
        timeout-minutes: 3
        env:
          ROOT_EXPECTED_BINDING_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          sudo /usr/bin/env -i GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" ROOT_EXPECTED_BINDING_SHA="$ROOT_EXPECTED_BINDING_SHA" PATH=/usr/bin:/bin LANG=C LC_ALL=C /usr/bin/python3.12 -I -B -S - <<'ROOT_NATIVE_PYTHON'
          import time
          entry=time.monotonic()
          import hashlib,json,os,pathlib,re,stat,sys
          CODE_ROWS={'trusted_entry.py': {'bytes': 22773, 'mode': 420, 'sha256': '8ff3fcb369836d188308de6494e225e2d4debd5f95369c68f5d1b9be788746df'}, 'correspondence.py': {'bytes': 13467, 'mode': 420, 'sha256': '77138c0375ad08c7b1e60283a0e2979e478aa7e2eea0af02260db1b2ec0acbdb'}, 'bootstrap.py': {'bytes': 21103, 'mode': 420, 'sha256': 'e0bc58171c802b90e596a4a4bef9373267b0add96e8040ad7e146ae9935564cd'}, 'native_workspace.py': {'bytes': 11033, 'mode': 420, 'sha256': '1f9667ba10006eb1d010c5e69e50b3e950d12f05baaa22600e0f4804a801ea96'}}
          RESOURCE_ROWS={'accepted-candidate.json': {'bytes': 1834114, 'mode': 420, 'sha256': '22ab60121191de19244a832eed139a5ba7a1bfef9d4f959f6159d1450603f4e4'}, 'root-gate-receipt.json': {'bytes': 670, 'mode': 420, 'sha256': '9f46925bf72bcdf86c33d706c7d3110f1de41b59f702754eff6e09b2e1afab90'}, 'receiver-publication.json': {'bytes': 4075, 'mode': 420, 'sha256': 'bf02cee2b5342a1b15452e5e272b2af3d85e2ff026adb821109d89e445360922'}}
          BASELINE='06557a7f209db3c4513329c9e7eab9f054a565b1'
          NEW_PREFIX='scripts/ci/test-signer-runnable-compile'
          OLD_PREFIX='scripts/ci/test-signer-compile-v2'
          BASE='/var/tmp/cachy-asahi-test-signer-compile'
          WORKFLOW='.github/workflows/native-arm-runner-observation.yml'
          work_end=entry+120;cleanup_end=entry+130
          def need(v,c):
              if not v:raise RuntimeError(c)
          def live():need(time.monotonic()<work_end,'launcher-original-work-end')
          def ident(s):return tuple(getattr(s,k) for k in ('st_dev','st_ino','st_mode','st_uid','st_gid','st_nlink','st_size','st_mtime_ns','st_ctime_ns'))
          def checked(path,expected=None):
              live();fd=None;before=None;primary=None;value=None;opening=False
              try:
                  opening=True;fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
                  before=os.fstat(fd);raw=bytearray()
                  need(stat.S_ISREG(before.st_mode) and before.st_nlink==1 and 0<before.st_size<=4*1024**2,'launcher-source-file')
                  while len(raw)<=before.st_size:
                      live();part=os.read(fd,min(65536,before.st_size+1-len(raw)))
                      if not part:break
                      raw.extend(part);need(len(raw)<=before.st_size,'launcher-source-growth')
                  need(ident(before)==ident(os.fstat(fd))==ident(os.stat(path,follow_symlinks=False)) and len(raw)==before.st_size,'launcher-source-drift')
                  value=bytes(raw)
                  if expected:need(len(value)==expected['bytes'] and stat.S_IMODE(before.st_mode)==expected['mode'] and hashlib.sha256(value).hexdigest()==expected['sha256'],'launcher-source-pin')
              except BaseException as error:
                  primary=error
                  if fd is None and opening:error.bootstrap_uncertain=True
              finally:
                  if fd is not None:
                      try:
                          need(time.monotonic()<cleanup_end and before is not None and ident(os.fstat(fd))==ident(before),'launcher-owned-source-close')
                          os.close(fd)
                      except BaseException as error:
                          if primary is None:primary=error
                          primary.bootstrap_uncertain=True
                          primary.bootstrap_cancelled=bool(getattr(primary,'bootstrap_cancelled',False)) or isinstance(error,KeyboardInterrupt)
              if primary is not None:raise primary
              return value
          def retire(fd,before,primary):
              if fd is None:return primary
              try:
                  need(time.monotonic()<cleanup_end and before is not None and ident(os.fstat(fd))[:6]==before[:6],'launcher-owned-anchor')
                  os.close(fd)
              except BaseException as error:
                  if primary is None:primary=error
                  primary.bootstrap_uncertain=True
                  primary.bootstrap_cancelled=bool(getattr(primary,'bootstrap_cancelled',False)) or isinstance(error,KeyboardInterrupt)
              return primary
          def rootdir(path,exclusive=False):
              live();fd=None;before=None;primary=None;opening=False
              try:
                  try:os.mkdir(path,0o755)
                  except FileExistsError:need(not exclusive,'launcher-fresh-directory-required')
                  except BaseException as error:error.bootstrap_uncertain=True;raise
                  opening=True;fd=os.open(path,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW|os.O_NONBLOCK)
                  before=ident(os.fstat(fd));s=os.fstat(fd)
                  need(stat.S_ISDIR(s.st_mode) and (s.st_uid,s.st_gid)==(0,0) and stat.S_IMODE(s.st_mode)==0o755 and ident(s)==ident(os.stat(path,follow_symlinks=False)),'launcher-root-directory')
              except BaseException as error:
                  primary=error
                  if fd is None and opening:error.bootstrap_uncertain=True
              primary=retire(fd,before,primary)
              if primary is not None:raise primary
          def put(path,raw):
              live();fd=None;before=None;primary=None;opening=False
              try:
                  opening=True;fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_NONBLOCK,0o644)
                  before=ident(os.fstat(fd));need(stat.S_ISREG(before[2]) and before[3:5]==(0,0) and before[5]==1 and stat.S_IMODE(before[2])==0o644,'launcher-new-Root-file')
                  count=0
                  while count<len(raw):live();n=os.write(fd,raw[count:count+65536]);need(n>0,'launcher-write');count+=n
                  current=ident(os.fstat(fd));need(current[:6]==before[:6] and current[6]==len(raw) and current==ident(os.stat(path,follow_symlinks=False)),'launcher-staged-owner-mode')
              except BaseException as error:
                  primary=error
                  if fd is None and opening:error.bootstrap_uncertain=True
              primary=retire(fd,before,primary)
              if primary is not None:raise primary
              need(checked(path)==raw,'launcher-staged-bytes')
          need(os.getuid()==os.geteuid()==os.getgid()==os.getegid()==0,'launcher-root-parent')
          os.umask(0o022)
          need(os.environ['GITHUB_REPOSITORY']=='Gabriel-Kahen/cachy-asahi','launcher-repository')
          expected=os.environ['ROOT_EXPECTED_BINDING_SHA'];current=os.environ['GITHUB_SHA']
          need(re.fullmatch('[0-9a-f]{40}',expected) and expected==current,'launcher-Root-expected-commit')
          run=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT']
          need(re.fullmatch('[1-9][0-9]{0,23}',run) and re.fullmatch('[1-9][0-9]{0,5}',attempt),'launcher-context')
          checkout=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          binding=checkout/'binding'/NEW_PREFIX;baseline=checkout/'baseline'/OLD_PREFIX
          publication=json.loads(checked(binding/'resources/receiver-publication.json',RESOURCE_ROWS['receiver-publication.json']))
          need(publication.get('source_commit')==BASELINE and publication.get('status')=='PASS_RECEIVER_SOURCE_ONLY_BINDING_PENDING'
               and publication.get('manifest_canonical_sha256')=='889347eaa5175e3943fe646d144a823fd915674d874d15bd585fc21e092cbf33' and publication.get('source_rows')==13
               and publication.get('changed_source_rows')==2 and publication.get('held_source_rows')==11
               and publication.get('native_acceptance') is False and publication.get('dispatch') is False,'launcher-baseline-publication')
          manifest_raw=checked(baseline/'source-manifest.json');manifest=json.loads(manifest_raw)
          need(hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()=='889347eaa5175e3943fe646d144a823fd915674d874d15bd585fc21e092cbf33','launcher-manifest')
          need(len(manifest['source_rows'])==13,'launcher-exact-source13')
          payloads={'source-manifest.json':manifest_raw}
          for name,expected_row in manifest['source_rows'].items():
              need(pathlib.Path(name).name==name,'launcher-source-name');payloads[name]=checked(baseline/name,expected_row)
          payloads['bootstrap.py']=checked(checkout/'binding'/OLD_PREFIX/'bootstrap.py',CODE_ROWS['bootstrap.py'])
          payloads['native_workspace.py']=checked(baseline/'native_workspace.py',CODE_ROWS['native_workspace.py'])
          for name in ('trusted_entry.py','correspondence.py'):payloads[name]=checked(binding/name,CODE_ROWS[name])
          for name,expected_row in RESOURCE_ROWS.items():payloads[name]=checked(binding/'resources'/name,expected_row)
          payloads['bootstrap-source-pins.json']=checked(checkout/'binding'/OLD_PREFIX/'bootstrap-source-pins.json')
          payloads['compile-workflow.yml']=checked(checkout/'binding'/WORKFLOW)
          rootdir(BASE);source=BASE+'/source-'+run+'-'+attempt;rootdir(source,True)
          for tail in ('scripts','scripts/ci','scripts/ci/test-signer-compile-v2'):rootdir(source+'/'+tail,True)
          prefix=source+'/'+OLD_PREFIX
          for name,raw in payloads.items():put(prefix+'/'+name,raw)
          live();scope={'__name__':'Root_reviewed_trusted_entry','__file__':prefix+'/trusted_entry.py'}
          exec(compile(payloads['trusted_entry.py'],prefix+'/trusted_entry.py','exec',dont_inherit=True),scope)
          scope['ROOT_CODE_ROWS']=CODE_ROWS
          result=None;failure=None
          try:
              result=scope['main'](entry=entry,expected_binding_commit=expected)
          except BaseException as error:
              failure=dict(schema_version=1,status='FAIL_NATIVE_ENTRY',first_cause=type(error).__name__,first_reason=str(error)[:1024],
                           cancelled=isinstance(error,KeyboardInterrupt) or bool(getattr(error,'bootstrap_cancelled',False)),
                           uncertain=bool(getattr(error,'bootstrap_uncertain',False)),entry=entry,work_end=work_end,cleanup_end=cleanup_end,
                           shim_executed=False,ABI_helper_executed=False,GPG_executed=False)
          # Result retention is transport after the original actor frame; it grants none.
          evidence=BASE+'/evidence-'+run+'-'+attempt
          try:os.mkdir(evidence,0o755)
          except FileExistsError:pass
          raw=json.dumps(failure if failure else result,sort_keys=True,separators=(',',':'),allow_nan=False).encode()+b'\n'
          fd=os.open(evidence+'/result.json',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o644)
          try:
              at=0
              while at<len(raw):at+=os.write(fd,raw[at:at+65536])
          finally:os.close(fd)
          print(json.dumps(dict(result_path=evidence+'/result.json',entry=entry,status='FAIL' if failure else 'NATIVE_ENTRY_RETURNED'),sort_keys=True))
          okay=(failure is None and type(result) is dict and result.get('status')=='PASS' and result.get('returncode')==0
                and result.get('result',{}).get('result',{}).get('status')=='PASS_STATIC_COMPILE_AND_METADATA_ONLY')
          raise SystemExit(0 if okay else 1)
          ROOT_NATIVE_PYTHON
      - name: Retain bounded native results after actor retirement
        if: ${{ always() }}
        timeout-minutes: 2
        shell: bash
        run: |
          sudo /usr/bin/env -i GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" RUNNER_TEMP="$RUNNER_TEMP" PATH=/usr/bin:/bin LANG=C LC_ALL=C /usr/bin/python3.12 -I -B -S - <<'ROOT_EXPORT_PYTHON'
          import hashlib,json,os,pathlib,re,stat
          base=pathlib.Path('/var/tmp/cachy-asahi-test-signer-compile')
          run=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT']
          assert re.fullmatch('[1-9][0-9]{0,23}',run) and re.fullmatch('[1-9][0-9]{0,5}',attempt)
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/('signer-native-compile-'+run+'-'+attempt)
          target.mkdir(mode=0o755,exist_ok=False);os.chown(target,1001,1001)
          names={'result.json':(base/('evidence-'+run+'-'+attempt)/'result.json',4*1024**2),
                 'witness-shim':(base/('job-'+run+'-'+attempt)/'outputs/witness-shim',16*1024**2),
                 'abi-layout.o':(base/('job-'+run+'-'+attempt)/'outputs/abi-layout.o',16*1024**2)}
          for cmd in ('compile-shim','compile-abi','readelf-shim','objdump-shim','readelf-abi','objdump-abi'):
              for suffix in ('.out','.err'):names[cmd+suffix]=(base/('job-'+run+'-'+attempt)/'outputs'/(cmd+suffix),4*1024**2)
          index={};total=0
          def identity(s):return tuple(getattr(s,k) for k in ('st_dev','st_ino','st_mode','st_uid','st_gid','st_nlink','st_size','st_mtime_ns','st_ctime_ns'))
          for name,(path,bound) in names.items():
              try:fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              except FileNotFoundError:continue
              before=os.fstat(fd);raw=bytearray()
              try:
                  assert stat.S_ISREG(before.st_mode) and before.st_nlink==1 and 0<=before.st_size<=bound
                  while len(raw)<=bound:
                      part=os.read(fd,min(65536,bound+1-len(raw)))
                      if not part:break
                      raw.extend(part)
                  assert len(raw)==before.st_size and identity(before)==identity(os.fstat(fd))==identity(os.stat(path,follow_symlinks=False))
              finally:os.close(fd)
              total+=len(raw);assert total<=96*1024**2
              out=target/name;ofd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o644)
              try:
                  at=0
                  while at<len(raw):at+=os.write(ofd,raw[at:at+65536])
                  os.fchown(ofd,1001,1001)
              finally:os.close(ofd)
              index[name]=dict(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
          p=target/'transport-index.json';p.write_text(json.dumps(dict(schema_version=1,files=index,transport_only=True,outputs_executed=False),sort_keys=True)+'\n');os.chown(p,1001,1001)
          ROOT_EXPORT_PYTHON
      - name: Upload exact compile artifact transport
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signer-native-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signer-native-compile-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: false
          overwrite: false
