              print(json.dumps({'updater_workflow':'PASS' if passed else 'FAIL','native_stage':result['status'],'recovery':recovery['status'],'publication':'NOT ACCEPTED','hardware':'NOT RUN'}, sort_keys=True))
              sys.exit(0 if passed else 1)
