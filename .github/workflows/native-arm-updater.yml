              if result.get('native_compilation') == 'PASS PRIVATE NATIVE PAIR':
                  need(native is not None and native.get('native_pair') == 'PASS', 'P091')
              if native is not None and native.get('native_pair') == 'PASS': successful_pair(guarded_files, native)
              if result['status'] == 'PASS':
                  need(bundle is not None, 'P092')
                  need(decoded_json(files['native-result.json']).get('native_pair') == 'PASS', 'P093')
