name: native-arm-updater-runtime
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed workflow/runner commit on this retry ref
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-arm-updater-runtime
  cancel-in-progress: false
jobs:
  updater:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1aea667aec50a62ba0ab2dad44be24a4dc3bd098
          path: product
          persist-credentials: false
      - name: Prepare a private disposable trial directory
        env:
          REVIEWED_RUNNER_SOURCE: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$REVIEWED_RUNNER_SOURCE" = "$GITHUB_SHA"
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          trial_root=$(mktemp -d /tmp/cachy-updater-runtime.XXXXXXXX)
          mkdir -m 700 "$trial_root/home"
          echo "UPDATER_RUNTIME_ROOT=$trial_root" >> "$GITHUB_ENV"
      - name: Seed the six frozen objects before build code starts
        shell: bash
        env:
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 75s python3 -B - <<'PYSEED'
          import hashlib
          import importlib.util
          import os
          from pathlib import Path
          seed_path = Path('control/scripts/ci/old_four_seed.py')
          assert hashlib.sha256(seed_path.read_bytes()).hexdigest() == 'a14e0318549d24a9bc91ceeb03ec2c1fa2d12f2b3a4f9b0a4cccfb64be34b2b7'
          spec = importlib.util.spec_from_file_location('trusted_runtime_seed', seed_path)
          seed = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(seed)
          names = {'CACHY_OLD_FOUR_' + f'{tag}_{i:02d}'
                   for _, _, _, tag, count in seed.OLD_FOUR_PRIVATE_ROWS for i in range(1, count + 1)}
          names |= {'CACHY_RETAINED_BUBBLEWRAP_V1_' + f'{tag}_{i:02d}'
                    for _, _, _, tag, sizes in seed.RETAINED_BUBBLEWRAP_PRIVATE_ROWS
                    for i in range(1, len(sizes) + 1)}
          assert len(names) == 22 and all(os.environ.get(name) for name in names)
          cache = Path(os.environ['UPDATER_RUNTIME_ROOT']) / 'cache'
          cache.mkdir(mode=0o700)
          keep = names | {'CACHY_OLD_FOUR_SCHEMA', 'CACHY_OLD_FOUR_SOURCE_EPOCH'}
          for name in tuple(os.environ):
              if name not in keep:
                  os.environ.pop(name)
          seed.seed_current_build_cache(cache, 'beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f')
          PYSEED
      - name: Build exact354, then install complete runtime and exercise the real tray
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 TZ=UTC \
            HOME="$UPDATER_RUNTIME_ROOT/home" TMPDIR="$UPDATER_RUNTIME_ROOT" \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 -B control/scripts/ci/updater-runtime/run-native.py \
            --source "$GITHUB_WORKSPACE/product" --output "$UPDATER_RUNTIME_ROOT"
      - name: Final owned cleanup and bounded public evidence
        if: always()
        timeout-minutes: 4
        shell: bash
        run: |
          set -uo pipefail
          evidence_status=0
          if [ -n "${UPDATER_RUNTIME_ROOT:-}" ] && [ -d "$UPDATER_RUNTIME_ROOT/home" ] && [ -f control/scripts/ci/updater-runtime/run-native.py ]; then
            env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 TZ=UTC \
              HOME="$UPDATER_RUNTIME_ROOT/home" TMPDIR="$UPDATER_RUNTIME_ROOT" \
              PYTHONDONTWRITEBYTECODE=1 \
              python3 -B control/scripts/ci/updater-runtime/run-native.py \
              --source "$GITHUB_WORKSPACE/product" --output "$UPDATER_RUNTIME_ROOT" --cleanup-only || evidence_status=1
            if [ -d "$UPDATER_RUNTIME_ROOT/public" ]; then
              for stage in "$UPDATER_RUNTIME_ROOT/public"/*; do
                if [ -d "$stage" ]; then
                  python3 -B product/scripts/ci/log_evidence.py "$stage" || evidence_status=1
                fi
              done
              if [ -f "$UPDATER_RUNTIME_ROOT/public/runtime/result.json" ]; then
                cat "$UPDATER_RUNTIME_ROOT/public/runtime/result.json"
              fi
            fi
          fi
          exit "$evidence_status"
