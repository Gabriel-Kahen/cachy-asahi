name: native-arm-updater
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed complete commit matching this workflow checkout
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-arm-build
  cancel-in-progress: false
jobs:
  updater:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 116
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REVIEWED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      READY_SHA256: ff879da588419fc0f90ef6a27c8afc528c3f6a557ef2c060544d1b5e99ade4e2
      # Reviewed storage/recovery checkpoint; coordinator Git/controller proof is separate.
      STAGE_SHA256: 3b548467b2ff775e1bb5a6422e2ce1678c0a9e7ef9c6283926bb6395f2b7646a
      SOURCE_SHA256: 259b13b210123d90f824f21bf7662785d50c7586519a78451ab62e97ec577d5f
    steps:
      - name: Start the shared deadline before checkout
        timeout-minutes: 1
        run: |
          control=$(mktemp -d /tmp/cachy-updater-workflow.XXXXXXXX)
          python3 -I -B - "$control" "$GITHUB_ENV" <<'PY'
          import os, sys, time
          from pathlib import Path
          control = Path(sys.argv[1])
          assert os.getuid() == os.geteuid() > 0 and control.stat().st_mode & 0o777 == 0o700
          with Path(sys.argv[2]).open('a') as stream:
              stream.write(f'UPDATER_CONTROL={control}\nUPDATER_DEADLINE={time.monotonic() + 115 * 60}\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate bootstrap and freeze the exact committed source
        timeout-minutes: 5
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$REVIEWED_SOURCE_COMMIT" = "$GITHUB_SHA" ]]
          [[ "$STAGE_SHA256" =~ ^[0-9a-f]{64}$ && "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          stage="$GITHUB_WORKSPACE/scripts/port/updater-native-stage/stage.py"
          [[ "$(sha256sum "$stage" | cut -d' ' -f1)" = "$STAGE_SHA256" ]]
          seconds=$(python3 -I -B -c 'import os,time; n=min(270,int(float(os.environ["UPDATER_DEADLINE"])-time.monotonic())-550); assert n>0; print(n)' 2> "$UPDATER_CONTROL/freeze-clock.stderr")
          timeout --signal=TERM --kill-after=13s "${seconds}s" python3 -I -B "$stage" freeze \
            --root "$GITHUB_WORKSPACE" --source-commit "$REVIEWED_SOURCE_COMMIT" --ready-sha256 "$READY_SHA256" \
            --bootstrap-stage-sha256 "$STAGE_SHA256" --bootstrap-source-sha256 "$SOURCE_SHA256" \
            --output "$UPDATER_CONTROL/controller.json" > "$UPDATER_CONTROL/freeze.stdout" 2> "$UPDATER_CONTROL/freeze.stderr"
          controller_sha=$(sha256sum "$UPDATER_CONTROL/controller.json" | cut -d' ' -f1)
          [[ "$controller_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "UPDATER_CONTROLLER_SHA256=$controller_sha" >> "$GITHUB_ENV"
      - name: Run the finite private native pair
        id: native
        timeout-minutes: 111
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/scripts/port/updater-native-stage/stage.py"
          [[ "$(sha256sum "$stage" | cut -d' ' -f1)" = "$STAGE_SHA256" ]]
          # The 110-minute ceiling includes 190 seconds for deferred TERM cleanup.
          seconds=$(python3 -I -B -c 'import os,time; n=min(6600,int(float(os.environ["UPDATER_DEADLINE"])-time.monotonic())-300)-190; assert n>=60; print(n)' 2> "$UPDATER_CONTROL/run-clock.stderr")
          set +e
          timeout --signal=TERM --kill-after=190s "${seconds}s" python3 -I -B "$stage" run \
            --root "$GITHUB_WORKSPACE" --controller "$UPDATER_CONTROL/controller.json" \
            --controller-sha256 "$UPDATER_CONTROLLER_SHA256" --output "$UPDATER_CONTROL/stage" \
            > "$UPDATER_CONTROL/run.stdout" 2> "$UPDATER_CONTROL/run.stderr"
          code=$?
          echo "UPDATER_RUN_EXIT=$code" >> "$GITHUB_ENV"
          exit "$code"
      - name: Recover owned resources and retain verified public evidence
        if: always()
        timeout-minutes: 5
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/scripts/port/updater-native-stage/stage.py"
          [[ -n "${UPDATER_CONTROL:-}" && -n "${UPDATER_CONTROLLER_SHA256:-}" ]]
          [[ "$STAGE_SHA256" =~ ^[0-9a-f]{64}$ && "$(sha256sum "$stage" | cut -d' ' -f1)" = "$STAGE_SHA256" ]]
          cleanup_status=1
          if [ -f "$UPDATER_CONTROL/stage/ownership.json" ]; then
            if ownership_sha=$(python3 -I -B - "$stage" 2> "$UPDATER_CONTROL/ownership-read.stderr" <<'PY'
          import hashlib, os, sys, types
          from pathlib import Path
          path = Path(sys.argv[1]); raw = path.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == os.environ['STAGE_SHA256']
          module = types.ModuleType('trusted_updater'); module.__file__ = str(path)
          exec(compile(raw, str(path), 'exec'), module.__dict__)
          print(module.digest(module.regular(Path(os.environ['UPDATER_CONTROL']) / 'stage/ownership.json')))
          PY
            ); then
              if seconds=$(python3 -I -B -c 'import os,time; n=min(167,int(float(os.environ["UPDATER_DEADLINE"])-time.monotonic())-133); assert n>0; print(n)' 2> "$UPDATER_CONTROL/recovery-clock.stderr"); then
                timeout --signal=TERM --kill-after=13s "${seconds}s" python3 -I -B "$stage" cleanup \
              --root "$GITHUB_WORKSPACE" --controller "$UPDATER_CONTROL/controller.json" \
              --controller-sha256 "$UPDATER_CONTROLLER_SHA256" --ownership-sha256 "$ownership_sha" \
              --output "$UPDATER_CONTROL/stage" > "$UPDATER_CONTROL/cleanup.stdout" 2> "$UPDATER_CONTROL/cleanup.stderr" \
                  && cleanup_status=0
              fi
            fi
          fi
          export UPDATER_CLEANUP_EXIT="$cleanup_status"
          seconds=$(python3 -I -B -c 'import os,time; n=min(107,int(float(os.environ["UPDATER_DEADLINE"])-time.monotonic())-13); assert n>0; print(n)' 2> "$UPDATER_CONTROL/public-clock.stderr")
          timeout --signal=TERM --kill-after=13s "${seconds}s" python3 -I -B - <<'PY'
          import base64, gzip, hashlib, io, json, math, os, re, sys, tarfile, tempfile, types
          from pathlib import Path
          def need(value):
              if not value: raise ValueError('updater-public-evidence-refused')
          def checksum(data): return hashlib.sha256(data).hexdigest()
          def decoded_json(data):
              def invalid(_): raise ValueError('nonfinite-public-json')
              def finite(number):
                  value = float(number); need(math.isfinite(value)); return value
              return json.loads(data, object_pairs_hook=stage.unique, parse_constant=invalid, parse_float=finite)
          def emit(name, data):
              print(f'CACHY_ASAHI_EVIDENCE_BEGIN {name} sha256={checksum(data)} bytes={len(data)}')
              print(base64.encodebytes(data).decode(), end='')
              print(f'CACHY_ASAHI_EVIDENCE_END {name}')
          phase = 'source-authentication'
          try:
              root = Path(os.environ['GITHUB_WORKSPACE']); control = Path(os.environ['UPDATER_CONTROL'])
              path = root / 'scripts/port/updater-native-stage/stage.py'; raw = path.read_bytes()
              need(checksum(raw) == os.environ['STAGE_SHA256'])
              stage = types.ModuleType('trusted_updater'); stage.__file__ = str(path)
              exec(compile(raw, str(path), 'exec'), stage.__dict__)
              contract, _ = stage.authenticate(root, control / 'controller.json', os.environ['UPDATER_CONTROLLER_SHA256'])
              rows = contract['source']['files']
              def helper(name): return stage.module(root / name, rows[name]['sha256'])
              worker = helper('scripts/port/updater-native-stage/public_worker.py')
              projector = helper('packages/tools/cachy-asahi-update/public-evidence.py')
              guard = helper('scripts/ci/integration_export.py'); bundler = helper('scripts/ci/log_evidence.py')
              output = control / 'stage'
              sanitizers = {row[1]: row[2] for row in projector.selectors()}
              allowed = set(sanitizers) | {'materializer.json', 'projection.json'}
              def error_list(value):
                  return [''] * projector.integer(4096)(value)
              def cargo_source(identity):
                  need(type(identity) is str)
                  prefix = 'path+file:///tmp/project#' if identity == 'arch-update-tray@4.4.2' else 'registry+https://github.com/rust-lang/crates.io-index#'
                  raw = prefix + identity; need(projector.cargo_identity(raw) == identity); return raw
              def inverse_counts(value):
                  if 'error_count' in value: value['errors'] = error_list(value.pop('error_count'))
                  return value
              def projected_receipt(name, data):
                  value = decoded_json(data); projector.load(data)
                  if name == 'materializer.json':
                      need(projector.materializer(value) == value); return
                  handler = sanitizers[name]
                  raw = json.loads(json.dumps(value))
                  if handler is projector.inventory:
                      need(set(value) == {'schema_version','inventory_sha256','packages'})
                      projector.sequence(lambda row: row, 1024)(value['packages'])
                      raw = ''.join(row['name'] + ' ' + row['version'] + '\n' for row in value['packages']).encode('ascii')
                  elif handler is projector.comparison:
                      raw = inverse_counts(raw)
                  elif handler is projector.acquisition and 'inputs' in raw:
                      projector.sequence(lambda row: row, 1024)(raw['inputs']); raw['inputs'] = {str(i): row for i,row in enumerate(raw['inputs'])}
                  elif handler is projector.tool_pins and 'tools' in raw:
                      need(type(raw['tools']) is dict and len(raw['tools']) <= len(projector.TOOLS))
                      raw['tools'] = {'/usr/bin/' + name: {'sha256': pin} for name,pin in raw['tools'].items()}
                  elif handler is projector.units:
                      for key in ('compiler_artifacts','build_script_runs'):
                          for row in projector.sequence(lambda row: row, 2048 if key == 'compiler_artifacts' else 256)(raw.get(key, [])):
                              if 'package_id' in row: row['package_id'] = cargo_source(row['package_id'])
                  elif handler is projector.closure:
                      for row in projector.sequence(lambda row: row, 168)(raw.get('selected_nodes', [])):
                          if 'id' in row: row['id'] = cargo_source(row['id'])
                      if 'source_grants' in raw: raw['supplemental_notices'] = projector.sequence(lambda row: row, 512)(raw.pop('source_grants'))
                  elif handler is projector.package_validation:
                      inverse_counts(raw)
                      for row in projector.sequence(lambda row: row, 2)(raw.get('artifacts', [])):
                          inverse_counts(row)
                          if 'package' in row: row['metadata'] = {'.PKGINFO': row.pop('package')}
                          if 'elf' in row:
                              need(type(row['elf']) is list and len(row['elf']) <= 16)
                              elfs = {}
                              for item in row['elf']:
                                  member = item.pop('member'); need(member not in elfs)
                                  elfs[member] = inverse_counts(item)
                              row['elf'] = elfs
                  need(json.dumps(handler(raw), sort_keys=True) == json.dumps(value, sort_keys=True))
              def projection_metadata(files):
                  need('projection.json' in files)
                  value = decoded_json(files['projection.json']); projector.load(files['projection.json'])
                  need(set(value) == {'schema_version','projection','publication','hardware','accepted','rejected','missing','retention_policy','limits'})
                  need(type(value['schema_version']) is int and value['schema_version'] == 1 and value['projection'] == 'PASS' and value['publication'] == 'NOT ACCEPTED' and value['hardware'] == 'NOT RUN' and value['rejected'] == [])
                  need(type(value.get('retention_policy', {}).get('max_seconds')) is int and all(type(number) is int for number in value.get('limits', {}).values()))
                  need(value['retention_policy'] == {'raw_outputs':'ephemeral only','max_seconds':projector.RETENTION_SECONDS,'cleanup_execution':'NOT ATTESTED'})
                  need(value['limits'] == {'input_bytes':projector.TOTAL_INPUT_LIMIT,'output_bytes':projector.TOTAL_OUTPUT_LIMIT,'file_bytes':projector.FILE_LIMIT})
                  names = set(files) - {'projection.json','export-manifest.json'}
                  projector.sequence(lambda row: row, len(allowed))(value['accepted']); projector.sequence(lambda row: row, len(allowed))(value['missing'])
                  seen = set()
                  for row in value['accepted']:
                      need(type(row) is dict and set(row) == {'receipt','sha256','bytes'} and row['receipt'] in names and row['receipt'] not in seen)
                      data = files[row['receipt']]
                      need(type(row['bytes']) is int and len(data) == row['bytes'] and checksum(data) == row['sha256'])
                      seen.add(row['receipt'])
                  missing = value['missing']
                  need(seen == names and all(type(name) is str and name in allowed - {'projection.json'} for name in missing) and len(set(missing)) == len(missing) and not seen & set(missing))
                  order = list(sanitizers) + (['materializer.json'] if 'materializer.json' in seen | set(missing) else [])
                  need([row['receipt'] for row in value['accepted']] == [name for name in order if name in seen] and missing == [name for name in order if name not in seen])
                  need(sum(len(files[name]) for name in names) <= projector.TOTAL_OUTPUT_LIMIT - 65536)
                  for name in names: projected_receipt(name, files[name])
              def checked(directory, names):
                  worker.public_tree(directory, output)
                  manifest = stage.load(directory / 'export-manifest.json')
                  need(set(manifest) == {'schema_version','evidence_export','accepted','rejected','accepted_bytes','limits','inventory_limit_exceeded','inventory_scope'})
                  need(type(manifest['schema_version']) is int and manifest['schema_version'] == 1 and manifest['evidence_export'] == 'PASS' and manifest['rejected'] == [] and manifest['inventory_limit_exceeded'] is False)
                  need(manifest['limits'] == {'per_file_bytes':guard.FILE_LIMIT,'total_bytes_including_manifest':guard.TOTAL_LIMIT,'entries':guard.ENTRY_LIMIT,'depth':guard.DEPTH_LIMIT})
                  need(manifest['inventory_scope'] == 'sensitive subtrees are rejected without enumeration')
                  files = {'export-manifest.json': stage.regular(directory / 'export-manifest.json')}
                  for row in manifest['accepted']:
                      need(set(row) == {'path','bytes','sha256'} and row['path'] in names and row['path'] not in files)
                      data = stage.regular(directory / row['path'])
                      need(type(row['bytes']) is int and len(data) == row['bytes'] and checksum(data) == row['sha256'])
                      need(type(decoded_json(data)) is dict)
                      files[row['path']] = data
                  need(set(files) == {p.name for p in directory.iterdir()} and manifest['accepted_bytes'] == sum(len(data) for name,data in files.items() if name != 'export-manifest.json'))
                  return files
              def terminal(name, recovery=False):
                  files = checked(output / name, {'terminal.json'}); need(set(files) == {'terminal.json','export-manifest.json'})
                  value = decoded_json(files['terminal.json']); need(stage.public_summary(value) == value)
                  diagnostic_fields = {'failed_phase','runtime_reason','runtime_returncode','tick_operation','tick_reason'}
                  need(stage.diagnostic_projection(value) == {key: value[key] for key in diagnostic_fields if key in value})
                  need(type(value.get('schema_version')) is int and value['schema_version'] == 1 and value.get('phase') == 'finalized' and value.get('status') in {'PASS','FAIL','CANCELLED'})
                  need(value.get('source_commit') == os.environ['REVIEWED_SOURCE_COMMIT'] == os.environ['GITHUB_SHA'] and value.get('controller_sha256') == os.environ['UPDATER_CONTROLLER_SHA256'] and value.get('ready_sha256') == os.environ['READY_SHA256'])
                  need(value.get('publication') == 'NOT ACCEPTED' and value.get('hardware') == 'NOT RUN')
                  need(value.get('native_compilation') in {'NOT RUN','PASS PRIVATE NATIVE PAIR','NOT ATTESTED BY RECOVERY'} and value.get('cleanup_status') in {'PASS','FAIL','NOT RUN'})
                  need(all(type(value.get(k)) is bool for k in ('private_data_removed','cancelled')))
                  if 'raw_retention_within_budget' in value: need(type(value['raw_retention_within_budget']) is bool)
                  for key in ('candidate_sha256','public_bundle_sha256'):
                      if key in value: need(type(value[key]) is str and re.fullmatch('[0-9a-f]{64}', value[key]))
                  if 'elapsed_seconds' in value: need(type(value['elapsed_seconds']) is int and 0 <= value['elapsed_seconds'] <= 86400)
                  if 'failure_class' in value: need(value['failure_class'] in projector.ERROR_TYPES | {'RuntimeFailure','RuntimeCancelled','SourceCancelled','BrokerError'})
                  if value['status'] == 'PASS':
                      need(value.get('cleanup_status') == 'PASS' and value.get('private_data_removed') is True and value.get('raw_retention_within_budget') is True and value.get('cancelled') is False)
                      need(value.get('native_compilation') == ('NOT ATTESTED BY RECOVERY' if recovery else 'PASS PRIVATE NATIVE PAIR'))
                  return files, value
              phase = 'terminal-verification'
              payloads = []; result = {'status':'NOT ATTESTED'}; recovery = {'status':'NOT RUN'}
              original_present = all((output / 'terminal-public' / name).exists() for name in ('terminal.json','export-manifest.json'))
              if original_present:
                  stage_files, result = terminal('terminal-public')
                  payloads.append(('terminal-public', stage_files))
              if all((output / 'recovery-terminal-public' / name).exists() for name in ('terminal.json','export-manifest.json')):
                  recovery_files, recovery = terminal('recovery-terminal-public', True)
                  payloads.append(('recovery-terminal-public', recovery_files))
              need(payloads)
              bundle = None
              phase = 'guarded-verification'
              if original_present and (output / 'guarded').exists():
                  files = checked(output / 'guarded', allowed); projection_metadata(files); payloads.insert(0, ('guarded', files))
                  if (output / 'public-evidence.tar.gz').exists():
                      phase = 'bundle-verification'
                      bundle = stage.regular(output / 'public-evidence.tar.gz', 8 * 1024**2)
                      need(checksum(bundle) == result.get('public_bundle_sha256'))
                      with gzip.GzipFile(fileobj=io.BytesIO(bundle)) as stream: decoded = stream.read(20 * 1024**2 + 1)
                      need(len(decoded) <= 20 * 1024**2); observed = {}
                      with tarfile.open(fileobj=io.BytesIO(decoded), mode='r:') as archive:
                          need(not archive.pax_headers)
                          for member in archive:
                              need(member.isfile() and member.name.startswith('guarded/') and member.name[8:] in files and member.name not in observed and member.size == len(files[member.name[8:]]))
                              need(set(member.pax_headers) <= {'mtime'} and all(re.fullmatch('[0-9]{1,20}(?:\\.[0-9]{1,9})?', value) for value in member.pax_headers.values()))
                              data = archive.extractfile(member).read(guard.FILE_LIMIT + 1)
                              need(data == files[member.name[8:]]); observed[member.name] = data
                      need(set(observed) == {'guarded/' + name for name in files})
              if result['status'] == 'PASS':
                  need(bundle is not None)
                  native = decoded_json(files['native-result.json']); compare = decoded_json(files['comparison.json'])
                  need(native.get('native_pair') == 'PASS' and all(compare.get(k) is True for k in ('installed_contents_equal','pkginfo_equal','bytes_equal')) and type(compare.get('error_count')) is int and compare['error_count'] == 0)
              # Reuse the authenticated generic credential guard for captured JSON.
              phase = 'credential-verification'
              for name, files in payloads:
                  with tempfile.TemporaryDirectory(prefix='updater-public-', dir=control) as temporary:
                      source = Path(temporary) / 'selected'; source.mkdir(mode=0o700)
                      for filename, data in files.items():
                          if filename != 'export-manifest.json': (source / filename).write_bytes(data)
                      target = Path(temporary) / name
                      need(guard.export_evidence(source, target)['evidence_export'] == 'PASS')
                      emit(name, bundler.bundle(target))
              passed = result['status'] == recovery['status'] == 'PASS' and os.environ.get('UPDATER_RUN_EXIT') == os.environ.get('UPDATER_CLEANUP_EXIT') == '0' and os.environ['NATIVE_OUTCOME'] == 'success'
              print(json.dumps({'updater_workflow':'PASS' if passed else 'FAIL','native_stage':result['status'],'recovery':recovery['status'],'publication':'NOT ACCEPTED','hardware':'NOT RUN'}, sort_keys=True))
              sys.exit(0 if passed else 1)
          except Exception:
              print(json.dumps({'updater_workflow':'FAIL','reason':'public-evidence-refused','phase':phase}, sort_keys=True))
              sys.exit(1)
          PY
