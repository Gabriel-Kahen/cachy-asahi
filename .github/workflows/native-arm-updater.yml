                  need(stage.diagnostic_projection(value) == {key: value[key] for key in diagnostic_fields if key in value}, 'P071')
                  need(type(value.get('schema_version')) is int and value['schema_version'] == 1 and value.get('phase') == 'finalized' and value.get('status') in {'PASS','FAIL','CANCELLED'}, 'P072')
                  need(value.get('source_commit') == os.environ['REVIEWED_SOURCE_COMMIT'] == os.environ['GITHUB_SHA'] and value.get('controller_sha256') == os.environ['UPDATER_CONTROLLER_SHA256'] and value.get('ready_sha256') == os.environ['READY_SHA256'], 'P073')
                  need(value.get('publication') == 'NOT ACCEPTED' and value.get('hardware') == 'NOT RUN', 'P074')
