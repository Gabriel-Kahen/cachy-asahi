name: native-arm-updater
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed complete commit matching this workflow checkout
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-arm-build
  cancel-in-progress: false
  queue: max
jobs:
  updater:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 116
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REVIEWED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      READY_SHA256: a2b4872bec579306e2d22ebe14061ed479ae56f7c52756ee961ea70db1dbda00
      # Reviewed storage/recovery checkpoint; coordinator Git/controller proof is separate.
      STAGE_SHA256: cdf5b260c999a94762178d90266ce7898495b19ab904c6eb5241416396c883af
      SOURCE_SHA256: 4d3e3fd9848aaed94154f786b04a5ae07c7816dcef82857b671b51555895eacb
    steps:
      - name: Start the shared deadline before checkout
        timeout-minutes: 1
        run: |
          control=$(mktemp -d /tmp/cachy-updater-workflow.XXXXXXXX)
          python3 -I -B - "$control" "$GITHUB_ENV" <<'PY'
          import os, sys, time
          from pathlib import Path
          control = Path(sys.argv[1])
          assert os.getuid() == os.geteuid() > 0 and control.stat().st_mode & 0o777 == 0o700
          with Path(sys.argv[2]).open('a') as stream:
              stream.write(f'UPDATER_CONTROL={control}\nUPDATER_DEADLINE={time.monotonic() + 115 * 60}\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate bootstrap and freeze the exact committed source
        timeout-minutes: 5
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$REVIEWED_SOURCE_COMMIT" = "$GITHUB_SHA" ]]
          [[ "$STAGE_SHA256" =~ ^[0-9a-f]{64}$ && "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          stage="$GITHUB_WORKSPACE/scripts/port/updater-native-stage/stage.py"
          [[ "$(sha256sum "$stage" | cut -d' ' -f1)" = "$STAGE_SHA256" ]]
          seconds=$(python3 -I -B -c 'import os,time; n=min(270,int(float(os.environ["UPDATER_DEADLINE"])-time.monotonic())-550); assert n>0; print(n)' 2> "$UPDATER_CONTROL/freeze-clock.stderr")
          timeout --signal=TERM --kill-after=13s "${seconds}s" python3 -I -B "$stage" freeze \
            --root "$GITHUB_WORKSPACE" --source-commit "$REVIEWED_SOURCE_COMMIT" --ready-sha256 "$READY_SHA256" \
            --bootstrap-stage-sha256 "$STAGE_SHA256" --bootstrap-source-sha256 "$SOURCE_SHA256" \
            --output "$UPDATER_CONTROL/controller.json" > "$UPDATER_CONTROL/freeze.stdout" 2> "$UPDATER_CONTROL/freeze.stderr"
          controller_sha=$(sha256sum "$UPDATER_CONTROL/controller.json" | cut -d' ' -f1)
          [[ "$controller_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "UPDATER_CONTROLLER_SHA256=$controller_sha" >> "$GITHUB_ENV"
      - name: Run the finite private native pair
        id: native
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        shell: bash
        timeout-minutes: 111
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/scripts/port/updater-native-stage/stage.py"
          [[ "$(sha256sum "$stage" | cut -d' ' -f1)" = "$STAGE_SHA256" ]]
          # The 110-minute ceiling includes 190 seconds for deferred TERM cleanup.
          seconds=$(python3 -I -B -c 'import os,time; n=min(6600,int(float(os.environ["UPDATER_DEADLINE"])-time.monotonic())-300)-190; assert n>=60; print(n)' 2> "$UPDATER_CONTROL/run-clock.stderr")
          set +e
          timeout --signal=TERM --kill-after=190s "${seconds}s" python3 -I -B "$stage" run \
            --root "$GITHUB_WORKSPACE" --controller "$UPDATER_CONTROL/controller.json" \
            --controller-sha256 "$UPDATER_CONTROLLER_SHA256" --output "$UPDATER_CONTROL/stage" \
            > "$UPDATER_CONTROL/run.stdout" 2> "$UPDATER_CONTROL/run.stderr"
          code=$?
          echo "UPDATER_RUN_EXIT=$code" >> "$GITHUB_ENV"
          exit "$code"
      - name: Recover owned resources and retain verified public evidence
        if: always()
        timeout-minutes: 5
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/scripts/port/updater-native-stage/stage.py"
          [[ -n "${UPDATER_CONTROL:-}" && -n "${UPDATER_CONTROLLER_SHA256:-}" ]]
          [[ "$STAGE_SHA256" =~ ^[0-9a-f]{64}$ && "$(sha256sum "$stage" | cut -d' ' -f1)" = "$STAGE_SHA256" ]]
          cleanup_status=1
          if [ -f "$UPDATER_CONTROL/stage/ownership.json" ]; then
            if ownership_sha=$(python3 -I -B - "$stage" 2> "$UPDATER_CONTROL/ownership-read.stderr" <<'PY'
          import hashlib, os, sys, types
          from pathlib import Path
          path = Path(sys.argv[1]); raw = path.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == os.environ['STAGE_SHA256']
          module = types.ModuleType('trusted_updater'); module.__file__ = str(path)
          exec(compile(raw, str(path), 'exec'), module.__dict__)
          print(module.digest(module.regular(Path(os.environ['UPDATER_CONTROL']) / 'stage/ownership.json')))
          PY
            ); then
              if seconds=$(python3 -I -B -c 'import os,time; n=min(167,int(float(os.environ["UPDATER_DEADLINE"])-time.monotonic())-133); assert n>0; print(n)' 2> "$UPDATER_CONTROL/recovery-clock.stderr"); then
                timeout --signal=TERM --kill-after=13s "${seconds}s" python3 -I -B "$stage" cleanup \
              --root "$GITHUB_WORKSPACE" --controller "$UPDATER_CONTROL/controller.json" \
              --controller-sha256 "$UPDATER_CONTROLLER_SHA256" --ownership-sha256 "$ownership_sha" \
              --output "$UPDATER_CONTROL/stage" > "$UPDATER_CONTROL/cleanup.stdout" 2> "$UPDATER_CONTROL/cleanup.stderr" \
                  && cleanup_status=0
              fi
            fi
          fi
          export UPDATER_CLEANUP_EXIT="$cleanup_status"
          seconds=$(python3 -I -B -c 'import os,time; n=min(107,int(float(os.environ["UPDATER_DEADLINE"])-time.monotonic())-13); assert n>0; print(n)' 2> "$UPDATER_CONTROL/public-clock.stderr")
          timeout --signal=TERM --kill-after=13s "${seconds}s" python3 -I -B - <<'PY'
          import base64, gzip, hashlib, io, json, math, os, re, sys, tarfile, tempfile, types
          from pathlib import Path
          EXPORT_BOUNDARIES = frozenset(('source-authentication', 'helper-authentication', 'terminal-verification', 'guarded-verification', 'bundle-verification', 'credential-verification', 'terminal-record', 'public-tree-manifest', 'projection-metadata', 'receipt-roundtrip', 'worker-diagnostic', 'successful-pair'))
          EXPORT_PREDICATES = frozenset('P%03d' % i for i in range(1, 95))
          export_boundary = 'source-authentication'
          export_failed_boundary = None
          source_authentication_completed = False
          class ExportRefusal(ValueError):
              def __init__(self, predicate):
                  super().__init__('updater-public-evidence-refused')
                  self.predicate = predicate
          def at_export_boundary(label):
              if type(label) is not str or label not in EXPORT_BOUNDARIES:
                  raise ValueError('invalid-export-boundary')
              def decorate(function):
                  def observed(*args, **kwargs):
                      global export_boundary, export_failed_boundary
                      previous = export_boundary; export_boundary = label
                      try:
                          return function(*args, **kwargs)
                      except Exception:
                          if export_failed_boundary is None: export_failed_boundary = label
                          raise
                      finally:
                          export_boundary = previous
                  return observed
              return decorate
          def export_refusal_diagnostic(error):
              boundary = export_failed_boundary or export_boundary
              if type(boundary) is not str or boundary not in EXPORT_BOUNDARIES: boundary = 'UNKNOWN'
              predicate = getattr(error, 'predicate', None) if type(error) is ExportRefusal else None
              if type(predicate) is not str or predicate not in EXPORT_PREDICATES: predicate = 'UNKNOWN'
              return {'updater_export_diagnostic': {'schema_version': 1, 'status': 'REFUSED',
                  'boundary': boundary, 'source_predicate': predicate,
                  'source_authentication_completed': source_authentication_completed is True}}
          def need(value, predicate):
              if not value: raise ExportRefusal(predicate)
          def checksum(data): return hashlib.sha256(data).hexdigest()
          def decoded_json(data):
              def invalid(_): raise ValueError('nonfinite-public-json')
              def finite(number):
                  value = float(number); need(math.isfinite(value), 'P001'); return value
              return json.loads(data, object_pairs_hook=stage.unique, parse_constant=invalid, parse_float=finite)
          def emit(name, data):
              print(f'CACHY_ASAHI_EVIDENCE_BEGIN {name} sha256={checksum(data)} bytes={len(data)}')
              print(base64.encodebytes(data).decode(), end='')
              print(f'CACHY_ASAHI_EVIDENCE_END {name}')
          phase = 'source-authentication'
          export_boundary = phase
          try:
              root = Path(os.environ['GITHUB_WORKSPACE']); control = Path(os.environ['UPDATER_CONTROL'])
              path = root / 'scripts/port/updater-native-stage/stage.py'; raw = path.read_bytes()
              need(checksum(raw) == os.environ['STAGE_SHA256'], 'P002')
              stage = types.ModuleType('trusted_updater'); stage.__file__ = str(path)
              exec(compile(raw, str(path), 'exec'), stage.__dict__)
              contract, _ = stage.authenticate(root, control / 'controller.json', os.environ['UPDATER_CONTROLLER_SHA256'])
              rows = contract['source']['files']
              def helper(name): return stage.module(root / name, rows[name]['sha256'])
              export_boundary = 'helper-authentication'
              worker = helper('scripts/port/updater-native-stage/public_worker.py')
              projector = helper('packages/tools/cachy-asahi-update/public-evidence.py')
              guard = helper('scripts/ci/integration_export.py'); bundler = helper('scripts/ci/log_evidence.py')
              source_authentication_completed = True
              output = control / 'stage'
              sanitizers = {row[1]: row[2] for row in projector.selectors()}
              allowed = set(sanitizers) | {'materializer.json', 'projection.json'}
              diagnostic_names = frozenset(('build-1-diagnostic.json', 'build-2-diagnostic.json'))
              def error_list(value):
                  return [''] * projector.integer(4096)(value)
              def cargo_source(identity):
                  need(type(identity) is str, 'P003')
                  prefix = 'path+file:///tmp/project#' if identity == 'arch-update-tray@4.4.2' else 'registry+https://github.com/rust-lang/crates.io-index#'
                  raw = prefix + identity; need(projector.cargo_identity(raw) == identity, 'P004'); return raw
              def inverse_counts(value):
                  if 'error_count' in value: value['errors'] = error_list(value.pop('error_count'))
                  return value
              @at_export_boundary('receipt-roundtrip')
              def projected_receipt(name, data):
                  value = decoded_json(data); projector.load(data)
                  if name == 'materializer.json':
                      need(projector.materializer(value) == value, 'P005'); return
                  handler = sanitizers[name]
                  if name in diagnostic_names:
                      need(len(data) <= 4096 and handler is projector.diagnostic, 'P006')
                  raw = json.loads(json.dumps(value))
                  if handler is projector.inventory:
                      need(set(value) == {'schema_version','inventory_sha256','packages'}, 'P007')
                      projector.sequence(lambda row: row, 1024)(value['packages'])
                      raw = ''.join(row['name'] + ' ' + row['version'] + '\n' for row in value['packages']).encode('ascii')
                  elif handler is projector.comparison:
                      raw = inverse_counts(raw)
                  elif handler is projector.acquisition and 'inputs' in raw:
                      projector.sequence(lambda row: row, 1024)(raw['inputs']); raw['inputs'] = {str(i): row for i,row in enumerate(raw['inputs'])}
                  elif handler is projector.tool_pins and 'tools' in raw:
                      need(type(raw['tools']) is dict and len(raw['tools']) <= len(projector.TOOLS), 'P008')
                      raw['tools'] = {'/usr/bin/' + name: {'sha256': pin} for name,pin in raw['tools'].items()}
                  elif handler is projector.units:
                      for key in ('compiler_artifacts','build_script_runs'):
                          for row in projector.sequence(lambda row: row, 2048 if key == 'compiler_artifacts' else 256)(raw.get(key, [])):
                              if 'package_id' in row: row['package_id'] = cargo_source(row['package_id'])
                  elif handler is projector.closure:
                      for row in projector.sequence(lambda row: row, 168)(raw.get('selected_nodes', [])):
                          if 'id' in row: row['id'] = cargo_source(row['id'])
                      if 'source_grants' in raw: raw['supplemental_notices'] = projector.sequence(lambda row: row, 512)(raw.pop('source_grants'))
                  elif handler is projector.package_validation:
                      inverse_counts(raw)
                      for row in projector.sequence(lambda row: row, 2)(raw.get('artifacts', [])):
                          inverse_counts(row)
                          if 'package' in row: row['metadata'] = {'.PKGINFO': row.pop('package')}
                          if 'elf' in row:
                              need(type(row['elf']) is list and len(row['elf']) <= 16, 'P009')
                              elfs = {}
                              for item in row['elf']:
                                  member = item.pop('member'); need(member not in elfs, 'P010')
                                  elfs[member] = inverse_counts(item)
                              row['elf'] = elfs
                  need(json.dumps(handler(raw), sort_keys=True) == json.dumps(value, sort_keys=True), 'P011')
              @at_export_boundary('worker-diagnostic')
              def required_worker_diagnostic(prefix, row, files):
                  # Modern success requires the group; the pure projector retains historical compatibility.
                  need(projector.WORKER_DIAGNOSTIC_FIELDS <= set(row), 'P012')
                  group = projector.worker_diagnostic_observation(row)
                  need(group['worker_diagnostic_status'] == 'BOUND' and group['worker_diagnostic_reason'] == 'bound', 'P013')
                  projector.HASH(group['worker_diagnostic_sha256'])
                  name = prefix + '-diagnostic.json'
                  need(name in diagnostic_names and name in files and sanitizers.get(name) is projector.diagnostic, 'P014')
                  need((prefix + '/artifacts/worker-diagnostic.json', name, projector.diagnostic) in projector.selectors(), 'P015')
                  data = files[name]; need(type(data) is bytes and len(data) <= 4096, 'P016')
                  record = projector.bound_worker_diagnostic(decoded_json(data),
                      controller_sha256=row['controller_sha256'], image_id=row['image_id'],
                      entry_script_sha256=row['entry_script_sha256'], observed_state=row['worker_container_state'])
                  need(record == group['worker_diagnostic'] and projector.accepted_worker_diagnostic(record), 'P017')
                  # The parent's hash is of its once-captured raw record; selector formatting may differ.
              @at_export_boundary('successful-pair')
              def successful_pair(files, native):
                  need('comparison.json' in files, 'P018')
                  compare = decoded_json(files['comparison.json'])
                  need(all(compare.get(key) is True for key in ('installed_contents_equal', 'pkginfo_equal', 'bytes_equal')) and
                       type(compare.get('error_count')) is int and compare['error_count'] == 0, 'P019')
                  need(native.get('cancelled') is not True and native.get('failed_stage') is None and
                       'error_type' not in native and 'cancel_signal' not in native and not native.get('worker_cleanup_errors'), 'P020')
                  if 'stage' in native: need(native['stage'] == 'finalized', 'P021')
                  if 'container_cleanup' in native: need(native['container_cleanup'] == 'PASS', 'P022')
                  if 'native_compilation' in native:
                      need(native['native_compilation'] in {'PASS', 'PASS-private-native-package-static-checks'}, 'P023')
                  names = ('build-1-status.json', 'build-2-status.json')
                  need(all(sanitizers[name] is projector.provenance for name in names), 'P024')
                  records = {name: decoded_json(files[name]) for name in names if name in files}
                  need(set(records) == set(names), 'P025')
                  observed = ('packages/tools/cachy-asahi-update/updater-native.py' in rows or 'image_id' in native or
                              any(projector.WORKER_FIELDS & set(row) for row in records.values()))
                  if observed:
                      need(set(records) == set(names), 'P026')
                      projector.IMAGE(native.get('image_id'))
                      need(all(projector.WORKER_FIELDS <= set(row) and row['worker_container_state'] is not None for row in records.values()), 'P027')
                      for key in ('container_id', 'name_sha256', 'nonce_sha256', 'controller_sha256'):
                          need(len({row['worker_container_state'][key] for row in records.values()}) == 2, 'P028')
                  hashes = []; images = [native['image_id']] if 'image_id' in native else []
                  if 'bootstrap.json' in files:
                      bootstrap = decoded_json(files['bootstrap.json'])
                      if 'image_id' in bootstrap: images.append(bootstrap['image_id'])
                  for name in names:
                      row = records.get(name, {})
                      if 'image_id' in row: images.append(row['image_id'])
                      if name in records:
                          need(row.get('native_compilation') in {'PASS', 'PASS-private-native-package-static-checks'} and
                               row.get('cancelled') is not True and row.get('worker_launch_attempted') is not False and row.get('failed_stage') is None and
                               not {'error_type', 'cancel_signal', 'container_cleanup_error_type', 'container_absence_error_type'} & set(row), 'P029')
                          if 'stage' in row: need(row['stage'] == 'finalized', 'P030')
                          if 'container_cleanup' in row: need(row['container_cleanup'] == 'PASS', 'P031')
                      cleanup = ('container_cleanup_attempted', 'container_removal_succeeded',
                                 'container_absence_verified', 'container_cleanup_complete')
                      need(all(row.get(key) is not False for key in cleanup), 'P032')
                      if observed:
                          need(projector.WORKER_FIELDS <= set(row) and row['worker_check'] == 'complete' and
                               row['worker_failure_code'] is None and row['worker_run_returncode'] == 0 and
                               row['worker_launch_attempted'] is True and all(row.get(key) is True for key in cleanup), 'P033')
                          state = row['worker_container_state']
                          need(state is not None and projector.accepted_container_state(state) and
                               state['image_id'] == row['image_id'] == native['image_id'] and
                               state['controller_sha256'] == row['controller_sha256'], 'P034')
                      elif 'image_id' in row and 'image_id' in native:
                          need(row['image_id'] == native['image_id'], 'P035')
                      prefix = name.removesuffix('-status.json')
                      required_worker_diagnostic(prefix, row, files)
                      package_name = prefix + '-package.json'
                      if package_name in files:
                          need(sanitizers[package_name] is projector.package_validation, 'P036')
                          package = decoded_json(files[package_name]); artifacts = package['artifacts']
                          need(package.get('error_count', 0) == 0 and len(artifacts) == 1 and
                               artifacts[0].get('status') == 'artifact-static-pass' and artifacts[0].get('error_count', 0) == 0 and
                               all(item.get('error_count', 0) == 0 for item in artifacts[0].get('elf', [])), 'P037')
                          if 'package_sha256' in row: need(artifacts[0].get('sha256') == row['package_sha256'], 'P038')
                          if 'sha256' in artifacts[0]: hashes.append(artifacts[0]['sha256'])
                      elif 'package_sha256' in row:
                          hashes.append(row['package_sha256'])
                      for suffix in ('-inputs.json', '-entry.json', '-compile-result.json', '-worker.json'):
                          if prefix + suffix not in files: continue
                          child = decoded_json(files[prefix + suffix])
                          if 'image_id' in child: images.append(child['image_id'])
                          need(child.get('cancelled') is not True and child.get('failed_stage') is None and
                               not {'error_type', 'cancel_signal'} & set(child), 'P039')
                          if 'stage' in child: need(child['stage'] in {'complete', 'finalized'}, 'P040')
                          if 'container_cleanup' in child: need(child['container_cleanup'] == 'PASS', 'P041')
                          if 'native_compilation' in child:
                              statuses = {'PASS', 'PASS-private-native-package-static-checks'}
                              if suffix == '-worker.json': statuses.add('NOT RUN')
                              need(child['native_compilation'] in statuses, 'P042')
                          if observed and suffix == '-worker.json' and child.get('native_compilation') == 'NOT RUN':
                              compile_name = prefix + '-compile-result.json'
                              need(compile_name in files and sanitizers[compile_name] is projector.compile_receipt, 'P043')
                              compiled = decoded_json(files[compile_name])
                              need(compiled.get('native_compilation') == 'PASS' and
                                   compiled.get('image_id') == child.get('image_id') == row['image_id'] and
                                   child.get('controller_sha256') == row['controller_sha256'], 'P044')
                              inputs = compiled.get('input_sha256')
                              need(type(inputs) is dict and set(inputs) == {'manifest', 'lock', 'audit', 'metadata', 'cfg'} and inputs == child.get('sha256'), 'P045')
                              for key in ('binary_sha256', 'compiler_output_sha256', 'compiler_diagnostic_sha256',
                                          'elf_inspection_sha256', 'compilation_units_sha256'):
                                  projector.HASH(compiled.get(key))
                              need(compiled.get('elf_16k_segments') == 'PASS-static; loader NOT RUN', 'P046')
                          for key in ('image_id', 'controller_sha256', 'entry_script_sha256'):
                              if observed and key in child: need(key in row, 'P047')
                              if key in child and key in row: need(child[key] == row[key], 'P048')
                  need(len(set(hashes)) <= 1 and len(set(images)) <= 1, 'P049')
              @at_export_boundary('projection-metadata')
              def projection_metadata(files):
                  need('projection.json' in files, 'P050')
                  value = decoded_json(files['projection.json']); projector.load(files['projection.json'])
                  need(set(value) == {'schema_version','projection','publication','hardware','accepted','rejected','missing','retention_policy','limits'}, 'P051')
