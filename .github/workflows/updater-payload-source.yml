# SPDX-License-Identifier: MIT
name: Prior payload source controls
on:
  pull_request:
    paths:
      - '.github/workflows/updater-payload-source.yml'
      - 'scripts/update/prior_aux_lifecycle/README.md'
      - 'scripts/update/prior_payload_aux_runtime.py'
      - 'scripts/update/prior_payload_aux_runtime/README.md'
      - 'scripts/update/test_prior_aux_lifecycle.py'
      - 'scripts/update/test_prior_aux_lifecycle_cleanup.py'
      - 'scripts/update/test_prior_payload_aux_runtime.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/updater-payload-source.yml'
      - 'scripts/update/prior_aux_lifecycle/README.md'
      - 'scripts/update/prior_payload_aux_runtime.py'
      - 'scripts/update/prior_payload_aux_runtime/README.md'
      - 'scripts/update/test_prior_aux_lifecycle.py'
      - 'scripts/update/test_prior_aux_lifecycle_cleanup.py'
      - 'scripts/update/test_prior_payload_aux_runtime.py'
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed 40-character commit to inspect (source controls only)
        required: true
        type: string
permissions:
  contents: read
jobs:
  payload-source:
    name: Prior payload binding and cleanup (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Select an exact source revision
        id: source
        shell: bash
        env:
          PAYLOAD_SOURCE_EVENT: ${{ github.event_name }}
          PAYLOAD_MANUAL_COMMIT: ${{ inputs.source_commit }}
          PAYLOAD_PR_COMMIT: ${{ github.event.pull_request.head.sha }}
          PAYLOAD_PUSH_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$PAYLOAD_SOURCE_EVENT" in
            workflow_dispatch) payload_source_commit="$PAYLOAD_MANUAL_COMMIT" ;;
            pull_request) payload_source_commit="$PAYLOAD_PR_COMMIT" ;;
            push) payload_source_commit="$PAYLOAD_PUSH_COMMIT" ;;
            *) exit 1 ;;
          esac
          [[ "$payload_source_commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$payload_source_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check source-only binding and modeled cleanup with actors denied
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python -I -B -Werror::ResourceWarning - <<'PY'
          import ast, ctypes, importlib.util, sys, unittest
          from pathlib import Path
          base = Path('scripts/update').resolve()
          for name in ('prior_payload_aux_runtime.py', 'test_prior_payload_aux_runtime.py',
                       'test_prior_aux_lifecycle.py', 'test_prior_aux_lifecycle_cleanup.py'):
              ast.parse((base / name).read_bytes(), filename=str(base / name))
          attempts = []
          def deny_actors(event, args):
              if event in ('subprocess.Popen', 'os.system', 'os.fork', 'os.forkpty',
                           'os.posix_spawn', 'os.exec', 'socket.__new__',
                           'ctypes.dlopen', 'ctypes.dlsym', 'ctypes.dlsym/handle'):
                  attempts.append(event)
                  raise RuntimeError('source-only workflow denied actor: ' + event)
          sys.addaudithook(deny_actors)
          suite = unittest.TestSuite()
          for name, selected in (('test_prior_payload_aux_runtime', 'SourceBinding'),
                                 ('test_prior_aux_lifecycle_cleanup', 'Controls')):
              spec = importlib.util.spec_from_file_location(name, base / (name + '.py'))
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              suite.addTests(unittest.defaultTestLoader.loadTestsFromTestCase(getattr(module, selected)))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun == 13 and not result.skipped
          assert attempts == [], attempts
          print('PASS: 4 source binding/delegation + 9 modeled cleanup controls; actors denied.')
          print('Payload Focused, real ALPM transactions, helper execution, native ARM/M2: NOT RUN by this workflow.')
          PY
