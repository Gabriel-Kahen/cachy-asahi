name: retained-rust-stage0-provider
on:
  workflow_dispatch:
    inputs:
      profileSHA:
        description: Root-reviewed whole fixed stage0 profile SHA256
        required: true
        type: string
permissions:
  contents: read
jobs:
  stage0:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.ref == 'refs/heads/main' && github.workflow_ref == 'Gabriel-Kahen/cachy-asahi/.github/workflows/retained-rust-stage0-provider.yml@refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trusted Main provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci/retained-rust-stage0-provider
      - name: Fetch exactly three pinned opaque stage0 archives
        id: collect
        env:
          PROFILE_SHA: ${{ inputs.profileSHA }}
        run: |
          timeout --signal=TERM --kill-after=5s 305s python3 -I -B scripts/ci/retained-rust-stage0-provider/collect.py \
            --profile-sha256 "$PROFILE_SHA"
      - name: Retain three flat stage0 archive members
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust198-stage0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect.outputs.archive_directory }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: false
