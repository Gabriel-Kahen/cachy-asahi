name: repair-inspect1200-source
on:
  push:
    paths:
      - scripts/ci/repair-inspect1200-source/**
      - .github/workflows/repair-inspect1200-source.yml
  pull_request:
    paths:
      - scripts/ci/repair-inspect1200-source/**
      - .github/workflows/repair-inspect1200-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONWARNINGS: error
    steps:
      - name: Check out the dedicated maintained factory
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check out exact public239 input
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: cd89f189f373dd5cc86450a7f07d0a1369238993
          path: .ci-fixtures/inspect239
          persist-credentials: false
      - name: Check out exact public242 expected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: a9b8df2297e8aa7db96c48e27002f4a37fbde123
          path: .ci-fixtures/inspect242
          persist-credentials: false
      - name: Check out exact carrier94 for genuine archive controls
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 950b0699a6e3f7a56758d4d17a5d30dabc7b6e11
          path: .ci-fixtures/inspect-carrier94
          persist-credentials: false
      - name: Select the explicit Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Export ordinary fixtures and run source-only controls
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/repair-inspect1200.XXXXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          mkdir -m700 "$stage/input" "$stage/expected" "$stage/carrier"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/inspect239" archive --format=tar cd89f189f373dd5cc86450a7f07d0a1369238993 | tar -x -C "$stage/input"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/inspect242" archive --format=tar a9b8df2297e8aa7db96c48e27002f4a37fbde123 | tar -x -C "$stage/expected"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/inspect-carrier94" archive --format=tar 950b0699a6e3f7a56758d4d17a5d30dabc7b6e11 | tar -x -C "$stage/carrier"
          export REPAIR_INSPECT_INPUT="$stage/input"
          export REPAIR_INSPECT_EXPECTED="$stage/expected"
          export REPAIR_INSPECT_CARRIER="$stage/carrier"
          export REPAIR_INSPECT_WORK="$stage"
          python3 -I -B -Werror scripts/ci/repair-inspect1200-source/test_source.py
          python3 -I -B -Werror scripts/ci/repair-inspect1200-source/prepare.py --help
