name: Updater copy-cost source factory
on:
  pull_request:
    paths:
      - 'scripts/ci/updater-copy-cost-source/**'
      - '.github/workflows/updater-copy-cost-source.yml'
  push:
    paths:
      - 'scripts/ci/updater-copy-cost-source/**'
      - '.github/workflows/updater-copy-cost-source.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 5c7e4c9a1b807cfb24542b024bf34af9bb15dba1
          path: .ci-updater-copy-parent
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 108eea03755d605e2fec0e5226f8ed38aa56c5bb
          path: .ci-updater-copy-expected
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Reproduce fixed489 source and run bounded source-only controls
        env:
          UPDATER_COPY_PARENT: ${{ github.workspace }}/.ci-updater-copy-parent
          UPDATER_COPY_EXPECTED: ${{ github.workspace }}/.ci-updater-copy-expected
        run: python -I -B -Werror scripts/ci/updater-copy-cost-source/test_factory.py
