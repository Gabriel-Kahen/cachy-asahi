name: native-arm-audio-graph-processing
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed full source SHA containing the reviewed four-graph synthetic processing helpers
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: native-arm-audio-graph-processing
  cancel-in-progress: false
  queue: max
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Check out reviewed offline Asahi graph source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit }}
          path: audio-graph-source
          persist-credentials: false
      - name: Check out unchanged package APIs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: db1010de321cc056a01672f006e6cc25d3c8a8b7
          path: product-api
          persist-credentials: false
      - name: Check out pinned574 preparation only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8d8e2f5d5a94ab3ebee2d8b1cc20aecf98e435e2
          path: desktop-base
          persist-credentials: false
      - name: Run inert processing oracle controls before native actors
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B -m unittest discover \
            -s "$GITHUB_WORKSPACE/audio-graph-source/scripts/ci/asahi-audio-graph-processing" -p 'test_*.py'
          cc -std=c11 -Wall -Wextra -Werror -O2 -UNDEBUG \
            "$GITHUB_WORKSPACE/audio-graph-source/scripts/ci/asahi-audio-graph-processing/test_processing.c" \
            -o "$RUNNER_TEMP/graph-processing-oracles"
          "$RUNNER_TEMP/graph-processing-oracles" "$RUNNER_TEMP/graph-processing-oracle-samples.f32"
          rm -f -- "$RUNNER_TEMP/graph-processing-oracles"
      - name: Bind source and private job ownership
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP" LANG=C.UTF-8 TZ=UTC \
            python3 -I -B "$GITHUB_WORKSPACE/audio-graph-source/scripts/ci/asahi-audio-graph-processing/job.py" init \
            --source-commit "$SOURCE_COMMIT" --source "$GITHUB_WORKSPACE/audio-graph-source" \
            --product "$GITHUB_WORKSPACE/product-api" --desktop "$GITHUB_WORKSPACE/desktop-base" \
            --root "$RUNNER_TEMP/audio-graph-job" >"$RUNNER_TEMP/audio-graph-init-controller.log" 2>&1
      - name: Seed only the six exact retained inputs
        timeout-minutes: 2
        shell: bash
        env:
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: |
          set -euo pipefail
          python3 -I -B "$GITHUB_WORKSPACE/audio-graph-source/scripts/ci/asahi-audio-graph-processing/job.py" seed \
            --source-commit "$SOURCE_COMMIT" --source "$GITHUB_WORKSPACE/audio-graph-source" \
            --product "$GITHUB_WORKSPACE/product-api" --desktop "$GITHUB_WORKSPACE/desktop-base" \
            --root "$RUNNER_TEMP/audio-graph-job" >"$RUNNER_TEMP/audio-graph-job/seed-controller.log" 2>&1
      - name: Check out fourteen pinned public builder inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 04a4a74e16e1e1bc939ea74791bf1f1bf7b46bbd
          path: retained-public-inputs
          persist-credentials: false
      - name: Seed fourteen fixed public inputs without credentials
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYSEED'
          import hashlib, os
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'retained-public-inputs'
          pins={'seed.py':'a7857658af224984065e575f6ffed8308ea85027d46eace8bda146d9033e93b3',
                'index.json':'a388c8c8ba8e06cb92fd2be598b86e433c4e403b6e71a0f15b1eaec381bb7300'}
          for name,digest in pins.items():
              path=root/name
              if not path.is_file() or path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest()!=digest:
                  raise SystemExit('public-seed-pin-differs')
          PYSEED
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP" LANG=C.UTF-8 TZ=UTC \
            python3 -I -B "$GITHUB_WORKSPACE/retained-public-inputs/seed.py" \
            --cache "$RUNNER_TEMP/audio-graph-job/base/context/deps"
      - name: Prepare only the unchanged signed574 builder
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP" LANG=C.UTF-8 TZ=UTC \
            python3 -I -B "$GITHUB_WORKSPACE/audio-graph-source/scripts/ci/asahi-audio-graph-processing/job.py" build \
            --source-commit "$SOURCE_COMMIT" --source "$GITHUB_WORKSPACE/audio-graph-source" \
            --product "$GITHUB_WORKSPACE/product-api" --desktop "$GITHUB_WORKSPACE/desktop-base" \
            --root "$RUNNER_TEMP/audio-graph-job" >"$RUNNER_TEMP/audio-graph-job/base-controller.log" 2>&1
      - name: Retrieve only the fixed accepted audio inputs privately
        timeout-minutes: 11
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP" LANG=C.UTF-8 TZ=UTC \
            GH_TOKEN="$GH_TOKEN" python3 -I -B "$GITHUB_WORKSPACE/audio-graph-source/scripts/ci/asahi-audio-graph-processing/job.py" retrieve \
            --source-commit "$SOURCE_COMMIT" --source "$GITHUB_WORKSPACE/audio-graph-source" \
            --product "$GITHUB_WORKSPACE/product-api" --desktop "$GITHUB_WORKSPACE/desktop-base" \
            --root "$RUNNER_TEMP/audio-graph-job" >"$RUNNER_TEMP/audio-graph-job/retrieval-controller.log" 2>&1
      - name: Run sixteen fresh synthetic streams and eight controls with candidate adapter
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP" LANG=C.UTF-8 TZ=UTC \
            python3 -I -B "$GITHUB_WORKSPACE/audio-graph-source/scripts/ci/asahi-audio-graph-processing/job.py" trial \
            --source-commit "$SOURCE_COMMIT" --source "$GITHUB_WORKSPACE/audio-graph-source" \
            --product "$GITHUB_WORKSPACE/product-api" --desktop "$GITHUB_WORKSPACE/desktop-base" \
            --root "$RUNNER_TEMP/audio-graph-job" >"$RUNNER_TEMP/audio-graph-job/trial-controller.log" 2>&1
      - name: Retire only owned trial resources and the owned574 image
        id: cleanup
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cleanup_status=0
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP" LANG=C.UTF-8 TZ=UTC \
            python3 -I -B "$GITHUB_WORKSPACE/audio-graph-source/scripts/ci/asahi-audio-graph-processing/job.py" cleanup \
            --source-commit "$SOURCE_COMMIT" --source "$GITHUB_WORKSPACE/audio-graph-source" \
            --product "$GITHUB_WORKSPACE/product-api" --desktop "$GITHUB_WORKSPACE/desktop-base" \
            --root "$RUNNER_TEMP/audio-graph-job" >"$RUNNER_TEMP/audio-graph-cleanup-controller.log" 2>&1 || cleanup_status=$?
          rm -f -- "$RUNNER_TEMP/audio-graph-init-controller.log" "$RUNNER_TEMP/audio-graph-cleanup-controller.log"
          exit "$cleanup_status"
      - name: Retain only the closed public JSON observations
        if: always()
        timeout-minutes: 2
        shell: bash
        env:
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'audio-graph-job/public'
          root.mkdir(parents=True, exist_ok=True, mode=0o700)
          path = root / 'result.json'
          allowed = {'result.json', 'runtime.json'}
          valid = all(p.is_file() and not p.is_symlink() and p.name in allowed for p in root.iterdir())
          if not valid:
              raise SystemExit('public-output-set-refused')
          if os.environ['CLEANUP_OUTCOME'] != 'success' or not path.is_file():
              try:
                  result = json.loads(path.read_text()) if path.is_file() else {}
              except (OSError, ValueError):
                  result = {}
              result.update(status='FAIL', cleanup_step=os.environ['CLEANUP_OUTCOME'],
                            target_audio='NOT RUN', hardware='NOT RUN', native_rebuilds=0, selected_for_release=False)
              path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          if sum(p.stat().st_size for p in root.iterdir()) > 16 * 1024 * 1024:
              raise SystemExit('public-output-size-refused')
          PY
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP" LANG=C.UTF-8 TZ=UTC \
            python3 -I -B "$GITHUB_WORKSPACE/product-api/scripts/ci/log_evidence.py" \
            "$RUNNER_TEMP/audio-graph-job/public"
          rm -f -- "$RUNNER_TEMP/audio-graph-init-controller.log" "$RUNNER_TEMP/audio-graph-job/seed-controller.log" \
            "$RUNNER_TEMP/audio-graph-job/base-controller.log" "$RUNNER_TEMP/audio-graph-job/trial-controller.log" \
            "$RUNNER_TEMP/audio-graph-job/retrieval-controller.log" \
            "$RUNNER_TEMP/audio-graph-cleanup-controller.log"
