# INERT PROPOSAL. Root registers the isolated branch and workflow; no checkout.
name: topmem-arm-toolchain-observer
on:
  push:
    branches: ['codex/topmem-arm-toolchain-observer-20261013']
    paths: ['.github/workflows/topmem-arm-toolchain-observer.yml']
permissions:
  contents: read
concurrency:
  group: topmem-arm-toolchain-observer
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Observe exact TEST toolchain bytes and linkage within one early 60 seconds
        timeout-minutes: 2
        shell: bash
        run: |
          /usr/bin/python3.12 -I -B -S - <<'PYTHON'
          import time
          ENTRY_START=time.monotonic()
          ENTRY_END=ENTRY_START+60
          import base64,hashlib
          raw=base64.b64decode('',validate=True)
          assert hashlib.sha256(raw).hexdigest()=='98ee7bb0c1788e465a5d8e709aef766768466d968b7fe68b888bbb9a1b8181a2'
          scope={'__name__':'__main__','ENTRY_START':ENTRY_START,'ENTRY_END':ENTRY_END,'OBSERVER_SHA256':'98ee7bb0c1788e465a5d8e709aef766768466d968b7fe68b888bbb9a1b8181a2'}
          exec(compile(raw,'<pinned-topmem-arm-toolchain-observer>','exec'),scope)
          PYTHON
