name: native-topmem-fish-current-registered-v1
on:
  push:
    branches: [codex/native-topmem-fish-current-registered-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-arm-build
  cancel-in-progress: false
  queue: max
jobs:
  pairs:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.ref == 'refs/heads/codex/native-topmem-fish-current-registered-v1' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 125
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ROOT_REGISTERED_PAIR_PLAN_B64: ${{ vars.NATIVE_PAIR_ROOT_PLAN_B64 }}
      ROOT_REGISTERED_PAIR_PLAN_SHA256: ${{ vars.NATIVE_PAIR_ROOT_PLAN_SHA256 }}
    steps:
      - name: Invoke registered standalone original501 pair lane
        id: invoke
        timeout-minutes: 122
        shell: bash
        env:
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PYTHON'
          import time
          ORIGINAL_ENTRY = time.monotonic()
          """Pinned workflow bootstrap; same original start covers all Source delivery."""
          import base64
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          import time
          from types import ModuleType
          import urllib.request
          import uuid
          
          REPOSITORY = 'Gabriel-Kahen/cachy-asahi'
          REF = 'refs/heads/codex/native-topmem-fish-current-registered-v1'
          BASE = '0744f413f47c82e4a5de16e4a16dba0962747483'
          DATA = 'ea1db6b5277d755630568a7fd19f484b0bccacbe'
          MANIFEST = 'scripts/ci/native-pair-lane/source.lock.json'
          RETAINED = []
          
          
          def need(ok, code):
              if not ok: raise ValueError(code)
          
          
          def decode(raw):
              def pairs(items):
                  result = {}
                  for key, value in items:
                      need(key not in result, 'bootstrap-duplicate-json'); result[key] = value
                  return result
              return json.loads(raw, object_pairs_hook=pairs, parse_constant=lambda _: need(False, 'bootstrap-nonfinite-json'))
          
          
          class Delivery:
              def __init__(self, start):
                  self.start, self.E, self.J, self.last, self.first = start, start + 6840, start + 7200, None, None
                  self.requested = 0; self.resources = []
              def check(self):
                  if self.first is not None: raise self.first
                  try:
                      now = time.monotonic()
                      need(type(now) in (int, float) and math.isfinite(now) and self.start <= now < self.E
                           and (self.last is None or now >= self.last), 'bootstrap-original-cutoff')
                      self.last = now
                  except BaseException as error: self.first = error; raise
              def call(self, action, *args, **kwargs):
                  self.check()
                  try: value = action(*args, **kwargs)
                  except BaseException as error: self.first = error; raise
                  self.check(); return value
              def publication_check(self):
                  now = time.monotonic()
                  need(type(now) in (int, float) and math.isfinite(now) and self.start <= now < self.J
                       and (self.last is None or now >= self.last), 'bootstrap-original-publication-cutoff')
                  self.last = now
              def publication_call(self, action, *args, **kwargs):
                  self.publication_check()
                  value = action(*args, **kwargs)
                  self.publication_check(); return value
              def stream(self, path, mode):
                  slot = {'stream': None, 'path': str(path)}; self.resources.append(slot)
                  self.check(); slot['stream'] = open(path, mode, encoding='utf-8'); self.check()
                  return slot
              def download(self, commit, name, cap):
                  need(re.fullmatch('[0-9a-f]{40}', commit) and not name.startswith('/') and
                       all(p not in ('', '.', '..') for p in name.split('/')), 'bootstrap-Source-URL')
                  url = 'https://raw.githubusercontent.com/' + REPOSITORY + '/' + commit + '/' + name
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self, *args, **kwargs): raise ValueError('bootstrap-redirect-refused')
                  opener = self.call(urllib.request.build_opener, urllib.request.ProxyHandler({}), NoRedirect())
                  slot = {'response': None}; self.resources.append(slot)
                  self.check(); slot['response'] = opener.open(url, timeout=30); self.check()
                  need(slot['response'].geturl() == url, 'bootstrap-response-origin')
                  data = bytearray()
                  while True:
                      block = self.call(slot['response'].read, min(65536, cap + 1 - len(data)))
                      if not block: break
                      data.extend(block); self.requested += len(block)
                      need(len(data) <= cap and self.requested <= 16 * 1024**2, 'bootstrap-delivery-cap')
                  self.call(slot['response'].close); self.resources.remove(slot); return bytes(data)
          
          
          def registered_plan(environment):
              raw_b64 = environment.get('ROOT_REGISTERED_PAIR_PLAN_B64', '')
              pin = environment.get('ROOT_REGISTERED_PAIR_PLAN_SHA256', '')
              need(type(raw_b64) is str and len(raw_b64) <= 10924 and re.fullmatch('[0-9a-f]{64}', pin), 'bootstrap-Root-registration')
              raw = base64.b64decode(raw_b64, validate=True)
              need(0 < len(raw) <= 8192 and base64.b64encode(raw).decode() == raw_b64 and hashlib.sha256(raw).hexdigest() == pin,
                   'bootstrap-Root-plan-pin')
              plan = decode(raw)
              need(type(plan) is dict and set(plan) == {'schema', 'lane', 'source_commit', 'data_commit',
                   'base_source_commit', 'ref', 'manifest_sha256', 'peer_receipt_sha256'} and type(plan['schema']) is int and plan['schema'] == 1
                   and plan['lane'] == 'native-topmem-fish-current-registered-v1' and plan['ref'] == REF
                   and plan['base_source_commit'] == BASE and plan['data_commit'] == DATA, 'bootstrap-Root-plan-shape')
              need(re.fullmatch('[0-9a-f]{40}', plan['source_commit']) and
                   all(re.fullmatch('[0-9a-f]{64}', plan[k]) and plan[k] != '0' * 64
                       for k in ('manifest_sha256', 'peer_receipt_sha256')), 'bootstrap-Root-plan-fields')
              need(environment.get('GITHUB_REPOSITORY') == REPOSITORY and environment.get('GITHUB_REF') == REF and
                   environment.get('GITHUB_EVENT_NAME') in ('push', 'workflow_dispatch') and
                   environment.get('GITHUB_SHA') == environment.get('GITHUB_WORKFLOW_SHA') == plan['source_commit'], 'bootstrap-job-binding')
              for name, pattern in (('GITHUB_RUN_ID', '[1-9][0-9]{0,19}'), ('GITHUB_RUN_ATTEMPT', '[1-9][0-9]{0,9}')):
                  need(re.fullmatch(pattern, environment.get(name, '')), 'bootstrap-run-field')
              return plan
          
          
          def execute(original_entry):
              delivery = Delivery(original_entry); RETAINED.append(delivery)
              plan = delivery.call(registered_plan, os.environ)
              nonce = delivery.call(lambda: uuid.uuid4().hex)
              manifest_raw = delivery.download(plan['source_commit'], MANIFEST, 256 * 1024)
              need(hashlib.sha256(manifest_raw).hexdigest() == plan['manifest_sha256'], 'bootstrap-registered-Source-manifest')
              manifest = delivery.call(decode, manifest_raw)
              need(type(manifest) is dict and set(manifest) == {'schema', 'scope', 'files'} and manifest['schema'] == 1 and
                   manifest['scope'] == 'standalone-original501-topmem-fish-pairs' and
                   type(manifest['files']) is dict and 0 < len(manifest['files']) <= 128, 'bootstrap-Source-manifest-shape')
              temporary = Path(os.environ['RUNNER_TEMP'])
              uid = delivery.call(os.getuid); before = delivery.call(os.lstat, temporary)
              need(stat.S_ISDIR(before.st_mode) and before.st_uid == uid and not before.st_mode & 0o022, 'bootstrap-owned-temporary-parent')
              scratch = temporary / ('registered-pair-' + nonce); root = scratch / 'source'
              delivery.call(os.mkdir, scratch, 0o700); delivery.call(os.mkdir, root, 0o700)
              rows, payloads = {}, {}
              for name, row in sorted(manifest['files'].items()):
                  need(type(row) is dict and set(row) == {'bytes', 'mode', 'sha256', 'origin', 'remote_path'} and
                       type(row['bytes']) is int and 0 <= row['bytes'] <= 8 * 1024**2 and row['mode'] in (0o644, 0o755) and
                       re.fullmatch('[0-9a-f]{64}', row['sha256']) and row['origin'] in ('source', 'data'), 'bootstrap-Source-row')
                  need(not name.startswith('/') and all(p not in ('', '.', '..') for p in name.split('/')), 'bootstrap-Source-destination')
                  raw = delivery.download(plan['source_commit'] if row['origin'] == 'source' else DATA, row['remote_path'], row['bytes'])
                  need(len(raw) == row['bytes'] and hashlib.sha256(raw).hexdigest() == row['sha256'], 'bootstrap-Source-byte-pin')
                  path = root / name
                  delivery.call(path.parent.mkdir, parents=True, exist_ok=True, mode=0o700)
                  slot = {'fd': None, 'path': str(path)}; delivery.resources.append(slot)
                  delivery.check(); slot['fd'] = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, row['mode']); delivery.check()
                  position = 0
                  while position < len(raw):
                      count = delivery.call(os.write, slot['fd'], raw[position:position + 65536]); need(count > 0, 'bootstrap-short-write'); position += count
                  delivery.call(os.fchmod, slot['fd'], row['mode'])
                  delivery.call(os.fsync, slot['fd']); delivery.call(os.close, slot['fd']); delivery.resources.remove(slot)
                  rows[name] = {k: row[k] for k in ('bytes', 'mode', 'sha256')}
                  payloads[name] = raw
              # Only these already pinned Sources are initialized by the trusted workflow
              # bootstrap. Subsequent module delivery uses concrete held Source custody.
              modules = {}
              for filename in ('lane_clock.py', 'source_custody.py', 'lane.py'):
                  name = 'scripts/ci/native-pair-lane/' + filename; module = delivery.call(ModuleType, '_pair_boot_' + nonce + '_' + filename[:-3])
                  module.__file__ = str(root / name); sys.modules[module.__name__] = module
                  raw = payloads[name]
                  need(hashlib.sha256(raw).hexdigest() == rows[name]['sha256'], 'bootstrap-entry-pin')
                  code = delivery.call(compile, raw, module.__file__, 'exec', dont_inherit=True)
                  delivery.call(exec, code, module.__dict__); modules[filename] = module
              result_path = scratch / 'pair-result.json'
              exported_slot = delivery.stream(os.environ['GITHUB_OUTPUT'], 'a')
              exported = exported_slot['stream']
              delivery.call(exported.write, 'evidence_root=' + str(scratch) + '\nacquisition_path=/home/runner/cpe-' + nonce + '/acquisition.json\n')
              delivery.call(exported.flush); delivery.call(exported.close); delivery.resources.remove(exported_slot)
              old_stdout = sys.stdout
              output_slot = delivery.stream(result_path, 'x'); output = output_slot['stream']
              sys.stdout = output; primary = None
              try:
                  modules['lane.py'].run(str(root), rows, plan, original_entry, nonce, str(scratch),
                      clock_type=modules['lane_clock.py'].OriginalClock, source_type=modules['source_custody.py'].Sources)
              except BaseException as error:
                  primary = error
                  # No secret values, cache bytes or speculative PASS is retained here.
                  try:
                      delivery.publication_check()
                      failure = {'status': 'PAIR_FAIL', 'scope': manifest['scope'], 'source_commit': plan['source_commit'],
                                 'first_failure_type': type(error).__name__, 'original_start': original_entry, 'original_J': delivery.J}
                      delivery.publication_call((scratch / 'failure.json').write_text, json.dumps(failure, sort_keys=True) + '\n')
                  except BaseException:
                      pass  # The primary failure survives; uncertain resources stay retained.
                  raise
              finally:
                  sys.stdout = old_stdout
                  try:
                      delivery.publication_call(output.close); delivery.resources.remove(output_slot)
                  except BaseException:
                      if primary is not None: raise primary
                      raise
              delivery.publication_check()
              RETAINED.remove(delivery)
              return 0
          
          raise SystemExit(execute(ORIGINAL_ENTRY))
          PYTHON
      - name: Retain pair-only metadata
        if: always() && steps.invoke.outputs.evidence_root != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original501-topmem-fish-pair-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.invoke.outputs.evidence_root }}/pair-result.json
            ${{ steps.invoke.outputs.evidence_root }}/failure.json
            ${{ steps.invoke.outputs.acquisition_path }}
          if-no-files-found: error
          retention-days: 30
