name: fresh607-dependency-cache-source
on:
  push:
    paths:
      - scripts/ci/fresh607-dependency-cache-source/**
      - .github/workflows/fresh607-dependency-cache-source.yml
  pull_request:
    paths:
      - scripts/ci/fresh607-dependency-cache-source/**
      - .github/workflows/fresh607-dependency-cache-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONWARNINGS: error
    steps:
      - name: Check out maintained source-only factory
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check out exact public1203 parent
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 15eed0d72b793117e0a44e670567acea63c2819c
          path: .ci-fixtures/cache-before1203
          persist-credentials: false
      - name: Check out exact public1203 expected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: ddfc78e30552356baa94fa123f17fd33efc2aedc
          path: .ci-fixtures/cache-after1203
          persist-credentials: false
      - name: Select explicit Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Reproduce exact source and run portable cache factory controls
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/dependency-cache-source.XXXXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          mkdir -m700 "$stage/input" "$stage/expected"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/cache-before1203" archive --format=tar 15eed0d72b793117e0a44e670567acea63c2819c | tar -x -C "$stage/input"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/cache-after1203" archive --format=tar ddfc78e30552356baa94fa123f17fd33efc2aedc | tar -x -C "$stage/expected"
          export FRESH_CACHE_INPUT="$stage/input"
          export FRESH_CACHE_EXPECTED="$stage/expected"
          umask 077
          python3 -I -B -Werror scripts/ci/fresh607-dependency-cache-source/prepare.py --source "$stage/input" --output "$stage/emitted" --context known
          python3 -I -B -Werror scripts/ci/fresh607-dependency-cache-source/test_factory.py
