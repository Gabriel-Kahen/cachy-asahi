name: Native ARM KSM development job

on:
  workflow_dispatch:
    inputs:
      packet_sha256:
        description: Reviewed SHA-256 of the committed separate KSM job packet
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-arm-build
  cancel-in-progress: false

jobs:
  native-ksm:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Accept sources and execute the finite disposable VM job
        id: native
        env:
          PACKET_SHA256: ${{ inputs.packet_sha256 }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import hashlib, json, os, pathlib, platform, re, stat, subprocess, time, types

          source_started = time.monotonic()
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          prefix = 'scripts/port/ksm-native-job/'
          pin = os.environ['PACKET_SHA256']
          if not re.fullmatch(r'[0-9a-f]{64}', pin):
              raise SystemExit('FAIL: reviewed packet digest required')

          def capture(path):
              if not path.is_absolute() or '..' in path.parts:
                  raise ValueError('unsafe source path')
              fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY)
              leaf = None
              try:
                  for part in path.parts[1:-1]:
                      next_fd = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                      os.close(fd)
                      fd = next_fd
                  leaf = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=fd)
                  before = os.fstat(leaf)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or not 0 <= before.st_size <= 2*1024**2:
                      raise ValueError('unsafe source file')
                  data = bytearray()
                  while block := os.read(leaf, min(65536, before.st_size-len(data)+1)):
                      data.extend(block)
                      if len(data) > before.st_size:
                          raise ValueError('source read bound')
                  after = os.fstat(leaf)
                  fields = ('st_dev','st_ino','st_mode','st_uid','st_gid','st_nlink','st_size','st_mtime_ns','st_ctime_ns')
                  if len(data) != before.st_size or any(getattr(before,k) != getattr(after,k) for k in fields):
                      raise ValueError('source capture drift')
                  return bytes(data), f'{stat.S_IMODE(before.st_mode):04o}'
              finally:
                  if leaf is not None:
                      os.close(leaf)
                  os.close(fd)

          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise ValueError('duplicate packet field')
                  result[key] = value
              return result

          try:
              packet_path = root / prefix / 'packet.lock.json'
              packet_bytes, mode = capture(packet_path)
              if mode != '0644' or hashlib.sha256(packet_bytes).hexdigest() != pin:
                  raise ValueError('packet digest or mode mismatch')
              packet = json.loads(packet_bytes, object_pairs_hook=pairs)
              def initial_module(name):
                  path = prefix + name + '.py'
                  data, mode = capture(root / path)
                  row = packet['files'][path]
                  if set(row) != {'sha256','size_bytes','mode'} or row['mode'] != mode or mode != '0644' or row['size_bytes'] != len(data) or row['sha256'] != hashlib.sha256(data).hexdigest():
                      raise ValueError('bootstrap source mismatch')
                  module = types.ModuleType('ksm_frozen_' + name)
                  module.__file__ = str(root / path)
                  exec(compile(data, module.__file__, 'exec'), module.__dict__)
                  return module
              acceptance = initial_module('acceptance')
              required = initial_module('required_paths')
              snapshot = acceptance.capture(root, packet_path, pin, required.EXPECTED_PATHS,
                                            required.WORKFLOW, os.environ['GITHUB_SHA'])
              # Fresh authenticated startup tree contains no cached bytecode.
              bootstrap = pathlib.Path(os.environ['RUNNER_TEMP']) / (
                  'ksm-bootstrap-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
              bootstrap.mkdir(mode=0o700)
              for name, data in snapshot.files.items():
                  path = bootstrap / name
                  path.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                  with path.open('xb') as stream:
                      stream.write(data)
                  path.chmod(int(snapshot.provenance['files'][name]['mode'], 8))
                  observed, mode = capture(path)
                  if observed != data or mode != snapshot.provenance['files'][name]['mode']:
                      raise ValueError('bootstrap copy drift')
              output = pathlib.Path(os.environ['RUNNER_TEMP']) / (
                  'ksm-native-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
              command = ['/usr/bin/python3','-I','-B','-S', str(bootstrap / prefix / 'executor.py'),
                         '--execute-native','--source-root',str(root),'--output',str(output),
                         '--source-commit',os.environ['GITHUB_SHA'],'--packet-sha256',pin,
                         '--started-at',str(source_started)]
              # Replace this bootstrap, preserving the step's actual exit result.
              os.execve('/usr/bin/python3', command, dict(os.environ))
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit('FAIL: committed KSM source/ownership preflight refused')
          PY
      - name: Upload only the accepted two GPL packages and curated evidence
        if: steps.native.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ksm-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ksm-native-${{ github.run_id }}-${{ github.run_attempt }}/public/build-1/cachy-asahi-ksmctl-0.1.0-1-any.pkg.tar.xz
            ${{ runner.temp }}/ksm-native-${{ github.run_id }}-${{ github.run_attempt }}/public/build-2/cachy-asahi-ksmctl-0.1.0-1-any.pkg.tar.xz
            ${{ runner.temp }}/ksm-native-${{ github.run_id }}-${{ github.run_attempt }}/public/build-1/cachy-asahi-ksmctl-0.1.0-1-any.pkg.tar.gz
            ${{ runner.temp }}/ksm-native-${{ github.run_id }}-${{ github.run_attempt }}/public/build-2/cachy-asahi-ksmctl-0.1.0-1-any.pkg.tar.gz
            ${{ runner.temp }}/ksm-native-${{ github.run_id }}-${{ github.run_attempt }}/public/evidence.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 1
          compression-level: 0
