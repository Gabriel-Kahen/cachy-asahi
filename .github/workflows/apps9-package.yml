name: Apps9 source and disposable package checks
on:
  pull_request:
    paths:
      - 'packages/tools/cachy-asahi-apps9/**'
      - 'packages/tools/cachy-asahi-apps7/**'
      - 'packages/tools/cachy-asahi-repository-runtime/**'
      - 'packages/tools/cachy-asahi-repository-client-v2/**'
      - 'scripts/client/client.py'
      - 'scripts/release/**'
      - 'scripts/checks/package_checks.py'
      - 'scripts/ci/apps9-package/**'
      - '.github/actions/apps-package-source/action.yml'
      - '.github/workflows/apps9-package.yml'
      - 'LICENSE'
  push:
    branches: [main, codex/virtual-integration]
    tags: ['**']
    paths:
      - 'packages/tools/cachy-asahi-apps9/**'
      - 'packages/tools/cachy-asahi-apps7/**'
      - 'packages/tools/cachy-asahi-repository-runtime/**'
      - 'packages/tools/cachy-asahi-repository-client-v2/**'
      - 'scripts/client/client.py'
      - 'scripts/release/**'
      - 'scripts/checks/package_checks.py'
      - 'scripts/ci/apps9-package/**'
      - '.github/actions/apps-package-source/action.yml'
      - '.github/workflows/apps9-package.yml'
      - 'LICENSE'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check out the exact public Apps9 recipe41
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 9f9eae97843531a41b201655100f13984d9ac01e
          path: .ci-fixtures/apps9-recipe
          persist-credentials: false
      - uses: ./.github/actions/apps-package-source
        id: apps-source
        with:
          revision: '9'
          install-tools: 'true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Exact sources, canonical helpers, makepkg links and complete53 tests
        env:
          APPS_PACKAGE_SOURCE: ${{ steps.apps-source.outputs.path }}
        run: |
          python3 -I -B scripts/ci/apps9-package/check.py --help
          python3 -I -B -Werror::ResourceWarning scripts/ci/apps9-package/check.py --repository-source "$APPS_PACKAGE_SOURCE" --expected-source "$GITHUB_WORKSPACE/.ci-fixtures/apps9-recipe" --output "$RUNNER_TEMP/apps9-package-check"
