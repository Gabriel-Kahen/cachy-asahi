{
  "name": "Initialized Perl lifecycle actor-free controls",
  "on": {
    "pull_request": {
      "paths": [
        ".github/workflows/perl-initialized-lifecycle-source.yml",
        "scripts/integration/arm16k_perl_initialized_lifecycle_vm/**",
        ".github/scripts/perl_initialized_lifecycle_ci.py",
        ".github/fixtures/perl-initialized-lifecycle/**"
      ]
    },
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/perl-initialized-lifecycle-source.yml",
        "scripts/integration/arm16k_perl_initialized_lifecycle_vm/**",
        ".github/scripts/perl_initialized_lifecycle_ci.py",
        ".github/fixtures/perl-initialized-lifecycle/**"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "lifecycle-source-model": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 8,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "python": [
            "3.12",
            "3.14"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Select explicit Python",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "${{ matrix.python }}"
          }
        },
        {
          "name": "Install ordinary temporary-tree xattr tools",
          "run": "sudo apt-get update\nsudo apt-get install --no-install-recommends -y attr\n"
        },
        {
          "name": "Check 24 actor-free genuine Source, shell and public closure controls",
          "timeout-minutes": 3,
          "env": {
            "PYTHONDONTWRITEBYTECODE": "1"
          },
          "run": "set -euo pipefail\nulimit -t 120 -v 1048576 -f 8192 -n 128\ntimeout --signal=TERM --kill-after=5s 120s python3 -I -B -Werror::ResourceWarning .github/scripts/perl_initialized_lifecycle_ci.py\n"
        }
      ]
    }
  }
}
