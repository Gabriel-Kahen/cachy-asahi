{
  "name": "latest607-gui-build-inventory-source",
  "on": {
    "push": {
      "paths": [
        "scripts/ci/latest607-gui-build-inventory-source/**",
        ".github/workflows/latest607-gui-build-inventory-source.yml"
      ]
    },
    "pull_request": {
      "paths": [
        "scripts/ci/latest607-gui-build-inventory-source/**",
        ".github/workflows/latest607-gui-build-inventory-source.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "source-controls": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 6,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "python": [
            "3.12",
            "3.14"
          ]
        }
      },
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONWARNINGS": "error"
      },
      "steps": [
        {
          "name": "Check out maintained factory",
          "uses": "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Check out pinned public parent687",
          "uses": "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0",
          "with": {
            "repository": "Gabriel-Kahen/cachy-asahi",
            "ref": "7e38a1cdd122af0a514f267bb30c91a29d400a17",
            "path": ".ci-fixtures/parent687",
            "persist-credentials": false
          }
        },
        {
          "name": "Check out pinned public expected692",
          "uses": "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0",
          "with": {
            "repository": "Gabriel-Kahen/cachy-asahi",
            "ref": "0e7211b326679319b4454bfe2a1c1e8e9b0aac29",
            "path": ".ci-fixtures/expected692",
            "persist-credentials": false
          }
        },
        {
          "name": "Select Python",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "${{ matrix.python }}"
          }
        },
        {
          "name": "Exact factory, finite inverse, refusal and private607 role/alias controls",
          "shell": "bash",
          "run": "set -euo pipefail\nstage=$(mktemp -d \"$RUNNER_TEMP/gui692-source.XXXXXXXX\")\nexport TMPDIR=\"$stage\"\nmkdir \"$stage/parent687\" \"$stage/expected692\"\ngit -C \"$GITHUB_WORKSPACE/.ci-fixtures/parent687\" archive --format=tar 7e38a1cdd122af0a514f267bb30c91a29d400a17 | tar -xf - -C \"$stage/parent687\"\ngit -C \"$GITHUB_WORKSPACE/.ci-fixtures/expected692\" archive --format=tar 0e7211b326679319b4454bfe2a1c1e8e9b0aac29 | tar -xf - -C \"$stage/expected692\"\nGUI_BUILD_INPUT=\"$stage/parent687\" GUI_BUILD_EXPECTED=\"$stage/expected692\" python3 -I -B -Werror \"$GITHUB_WORKSPACE/scripts/ci/latest607-gui-build-inventory-source/test_factory.py\"\npython3 -I -B -Werror \"$GITHUB_WORKSPACE/scripts/ci/latest607-gui-build-inventory-source/prepare.py\" --source \"$stage/parent687\" --output \"$stage/emitted692\" --context known\n"
        }
      ]
    }
  }
}
