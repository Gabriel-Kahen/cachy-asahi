# Credential-free delivery of the immutable native248 package/signature carrier.
# The separately registered Source and Data still select the maintained execution.
name: maintained-composed-virtual-desktop-v2-retained
on:
  push:
    branches: [codex/maintained-desktop-v2-retained-inputs-20261125]
permissions:
  contents: read
concurrency:
  group: native-arm-build
  cancel-in-progress: false
  queue: max
jobs:
  maintained:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event_name == 'push' && github.ref == 'refs/heads/codex/maintained-desktop-v2-retained-inputs-20261125' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 200
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ROOT_REGISTERED_MAINTAINED_DESKTOP_V2_RETAINED_PLAN_B64: ${{ vars.MAINTAINED_DESKTOP_V2_RETAINED_ROOT_PLAN_B64 }}
      ROOT_REGISTERED_MAINTAINED_DESKTOP_V2_RETAINED_PLAN_SHA256: ${{ vars.MAINTAINED_DESKTOP_V2_RETAINED_ROOT_PLAN_SHA256 }}
    steps:
      - name: Stage retained native248 inputs and invoke the maintained desktop composition
        timeout-minutes: 195
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYTHON'
          """Root workflow entry; external registration is required before invocation."""
          import time
          PREPARATION_ENTRY = time.monotonic()  # Before trusted delivery or imports.
          import base64
          import hashlib
          import json
          import math
          import os
          import re
          import signal
          import sys
          import types
          import urllib.request
          from contextlib import contextmanager

          REPOSITORY = 'Gabriel-Kahen/cachy-asahi'
          CODE_COMMIT = 'bcb05d712aec1ccad39d1f576403c4eaf4814fef'
          LAUNCHER_PATH = '.github/bootstrap/development-launcher.py'
          LAUNCHER_SHA = '98b2a151ee170887b0bb5d00629789230f7ec327208291edefbf8d8b1d5eba87'
          LAUNCHER_BYTES = 26685
          BOOTSTRAP_SHA = 'f30859c22620da2287517ad258f8d3d67f263bb5c0cdbaf90ddf3e314d5316d0'
          ISSUER_SHA = '9e3271b8cb21e7be1940c2aa9f17f84357d0a438ed45a19ad34ae226ec9d4581'
          EXECUTION_REF = 'refs/heads/codex/maintained-desktop-v2-retained-inputs-20261125'
          COMPOSITION = 'repository-svg-maintained-v1'
          PACKET_SHA = 'd0011b7d7d66bf8abce13bff8db05b42ca74c5f3fb2912249089cd116ba7b2c0'
          PACKET_PATH = 'scripts/ci/development/packet.lock.json'
          PACKET_BYTES = 94736
          INPUTS_PATH = 'scripts/ci/inputs.lock.json'
          INPUTS_PIN = (328101, 'beca39e04e125a0fa72dedab2dd772e048655d80c36c216a031df0a0c3852e8f')
          HELPER_PATH = 'scripts/ci/development/retained_native248.py'
          HELPER_PIN = (21665, '588d3be4353ca930d106fda1e95fea4dd0c74c6f2abee7eeb8725e74b886f542')
          WORKFLOW_PATH = '.github/workflows/maintained-composed-virtual-desktop-v2-retained.yml'
          PLAN_ENV = 'ROOT_REGISTERED_MAINTAINED_DESKTOP_V2_RETAINED_PLAN_B64'
          PIN_ENV = 'ROOT_REGISTERED_MAINTAINED_DESKTOP_V2_RETAINED_PLAN_SHA256'


          def need(value, code):
              if not value: raise ValueError(code)


          def full_pin(value, width):
              need(type(value) is str and re.fullmatch('[0-9a-f]{'+str(width)+'}', value), 'Root-registration-pin')
              return value


          def live(end):
              need(type(end) is float and math.isfinite(end) and time.monotonic() < end, 'Root-preparation-deadline')


          def registered_plan(environment):
              # These two environment fields come only from Root-managed repository vars
              # in the reviewed workflow. The execution ref and registered plan select the Source.
              encoded = environment.get(PLAN_ENV); expected = full_pin(environment.get(PIN_ENV), 64)
              need(type(encoded) is str and 0 < len(encoded) <= 10924 and encoded.isascii(), 'Root-plan-bytes')
              raw = base64.b64decode(encoded, validate=True)
              need(0 < len(raw) <= 8192 and base64.b64encode(raw).decode('ascii') == encoded, 'Root-plan-base64')
              need(hashlib.sha256(raw).hexdigest() == expected, 'Root-plan-pin')
              def pairs(rows):
                  result = {}
                  for key, value in rows:
                      need(key not in result, 'Root-plan-duplicate'); result[key] = value
                  return result
              def constant(value): raise ValueError('Root-plan-nonfinite')
              plan = json.loads(raw, object_pairs_hook=pairs, parse_constant=constant)
              need(type(plan) is dict and set(plan) == {'root_pins','code_commit','data_commit','composition',
                  'git_sha256','development_sha256'}, 'Root-plan-fields')
              pins = plan['root_pins']
              need(type(pins) is dict and set(pins) == {'selection_sha256','peer_receipt_sha256',
                  'source_rows_sha256','source_commit','cli_sha256'}, 'Root-plan-root-pins')
              for key in ('selection_sha256','peer_receipt_sha256','source_rows_sha256','cli_sha256'): full_pin(pins[key],64)
              source = full_pin(pins['source_commit'],40)
              full_pin(plan['data_commit'],40); full_pin(plan['git_sha256'],64); full_pin(plan['development_sha256'],64)
              need(full_pin(CODE_COMMIT,40) == full_pin(plan['code_commit'],40) and
                  len({CODE_COMMIT,source,plan['data_commit']}) == 3, 'Root-Code-Source-Data-binding')
              need(environment.get('GITHUB_EVENT_NAME') == 'push' and
                   environment.get('GITHUB_REF') == EXECUTION_REF and
                   environment.get('GITHUB_WORKFLOW_REF') ==
                       REPOSITORY+'/'+WORKFLOW_PATH+'@'+EXECUTION_REF, 'Root-execution-trigger')
              need(environment.get('GITHUB_REPOSITORY') == REPOSITORY and
                  environment.get('GITHUB_SHA') == environment.get('GITHUB_WORKFLOW_SHA') == source, 'Root-workflow-SourceCommit')
              need(plan['composition'] == COMPOSITION and plan['development_sha256'] == PACKET_SHA, 'Root-mode-packet-binding')
              return plan


          @contextmanager
          def preparation(end):
              # Only initial trusted-body delivery/imports. Source3 owns all later signals,
              # workspace descriptors, J, E, process cleanup and bounded publication.
              need(signal.getitimer(signal.ITIMER_REAL) == (0.0,0.0), 'Root-existing-timer')
              previous = signal.getsignal(signal.SIGALRM)
              def expired(number, frame): raise TimeoutError('Root-preparation-deadline')
              installed = False
              try:
                  live(end); signal.signal(signal.SIGALRM,expired); installed = True
                  remaining = end-time.monotonic(); need(remaining > 0, 'Root-preparation-deadline')
                  signal.setitimer(signal.ITIMER_REAL,remaining); yield
              finally:
                  cause = sys.exc_info()[1]; first = None
                  if installed:
                      try: signal.setitimer(signal.ITIMER_REAL,0)
                      except BaseException as error: first = error
                      try: signal.signal(signal.SIGALRM,previous)
                      except BaseException as error:
                          if first is None: first = error
                  if cause is None and first is not None: raise first


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise ValueError('Root-launcher-redirect')


          def fetch_launcher(commit,end,check):
              check(); live(end); full_pin(commit,40)
              url = 'https://raw.githubusercontent.com/'+REPOSITORY+'/'+commit+'/'+LAUNCHER_PATH
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
              request = urllib.request.Request(url,headers={'Accept-Encoding':'identity'})
              with opener.open(request,timeout=max(0.001,min(10,end-time.monotonic()))) as reply:
                  need(reply.status == 200 and reply.geturl() == url and
                      reply.headers.get('Content-Encoding') in (None,'identity'), 'Root-launcher-origin')
                  raw = bytearray()
                  while True:
                      check(); live(end); part = reply.read1(min(65536,LAUNCHER_BYTES+1-len(raw)))
                      if not part: break
                      raw.extend(part); need(len(raw) <= LAUNCHER_BYTES,'Root-launcher-size')
              check(); live(end)
              need(len(raw) == LAUNCHER_BYTES and hashlib.sha256(raw).hexdigest() == LAUNCHER_SHA,'Root-launcher-pin')
              return bytes(raw)


          def load_launcher(raw):
              need(type(raw) is bytes and len(raw) == LAUNCHER_BYTES and
                  hashlib.sha256(raw).hexdigest() == LAUNCHER_SHA,'Root-launcher-pin')
              launcher = types.ModuleType('Root_pinned_maintained_launcher')
              exec(compile(raw,'<Root-pinned-maintained-launcher>','exec'),launcher.__dict__)
              need(launcher.BOOTSTRAP_SHA == BOOTSTRAP_SHA and launcher.ISSUER_SHA == ISSUER_SHA,
                  'Root-Source3-body-pins')
              return launcher


          def invoke(environment,*,entry,check):
              need(type(entry) is float and math.isfinite(entry) and 0 < entry <= time.monotonic(),'Root-preparation-entry')
              end = entry + 60.0
              with preparation(end):
                  plan = registered_plan(environment); live(end)
                  launcher = load_launcher(fetch_launcher(plan['code_commit'],end,check)); live(end)
              check()

              def checked_delivery(*args):
                  # A signal latched just before Code took custody must still refuse.
                  check()
                  return launcher.fetch(*args)

              # No renewed entry or clock. Source3 checks this same original entry+60.
              result = launcher.launch_composed(plan,environment,preparation_entry=entry,delivery=checked_delivery)
              check()
              need(type(result) is dict and type(result.get('controller_exit_code')) is int and
                  0 <= result['controller_exit_code'] <= 255,'Root-controller-exit')
              return result


          def fetch_material(commit,path,size,pin,end):
              live(end); full_pin(commit,40); full_pin(pin,64)
              url = 'https://raw.githubusercontent.com/'+REPOSITORY+'/'+commit+'/'+path
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
              request = urllib.request.Request(url,headers={'Accept-Encoding':'identity'})
              with opener.open(request,timeout=min(10,end-time.monotonic())) as reply:
                  need(reply.status == 200 and reply.geturl() == url and
                      reply.headers.get('Content-Encoding') in (None,'identity'), 'Retained-source-origin')
                  raw = bytearray()
                  while True:
                      live(end); part = reply.read1(min(65536,size+1-len(raw)))
                      if not part: break
                      raw.extend(part); need(len(raw) <= size,'Retained-source-size')
              live(end)
              need(len(raw) == size and hashlib.sha256(raw).hexdigest() == pin,'Retained-source-pin')
              return bytes(raw)


          def authenticate_retained(environment,end,fetch=fetch_material):
              plan = registered_plan(environment)
              source = plan['root_pins']['source_commit']
              raw = fetch(source,PACKET_PATH,PACKET_BYTES,PACKET_SHA,end)
              packet = json.loads(raw)
              need(packet['composition'] == COMPOSITION and
                   packet['metadata_pins'][INPUTS_PATH] == INPUTS_PIN[1], 'Retained-packet-binding')
              rows = (json.dumps(packet['source_files'],sort_keys=True,indent=2,allow_nan=False)+'\n').encode()
              need(hashlib.sha256(rows).hexdigest() == plan['root_pins']['source_rows_sha256'],
                   'Retained-packet-rows')
              lock = fetch(source,INPUTS_PATH,*INPUTS_PIN,end)
              helper = fetch(source,HELPER_PATH,*HELPER_PIN,end)
              need((len(helper),hashlib.sha256(helper).hexdigest()) == HELPER_PIN,'Retained-helper-pin')
              return plan, lock, helper


          def main():
              environment = dict(os.environ)
              need('CACHY_NATIVE349_INPUTS_SSH_PRIVATE_KEY' not in environment and
                   not any(name.startswith(('CACHY_RETAINED_BUBBLEWRAP_V1_', 'CACHY_OLD_FOUR_'))
                           for name in environment), 'Retained-credential-environment')
              retained_end = PREPARATION_ENTRY + 550.0
              plan, lock, raw = authenticate_retained(environment,retained_end)
              helper = types.ModuleType('Root_pinned_native248_receiver')
              exec(compile(raw,'<Root-pinned-native248-receiver>','exec'),helper.__dict__)
              staging = {}
              try:
                  with helper.stage(environment,plan['git_sha256'],lock,fetch_material,retained_end,
                                    cleanup_deadline=PREPARATION_ENTRY+194*60,receipt=staging) as stage_controls:
                      print('MAINTAINED_NATIVE248_RETAINED='+json.dumps({
                          'status':'STAGED_DATA_ONLY','objects':496,'carrier_commit':helper.CARRIER,
                          'carrier_ref':helper.REF,'carrier_tree':helper.TREE,
                      },sort_keys=True),flush=True)
                      selected = dict(environment,CACHY_MAINTAINED_NATIVE248_REQUIRED='1')
                      # Keep Source3's original 60-second allowance, starting at launcher entry.
                      result = invoke(selected,entry=time.monotonic(),check=stage_controls.check)
              finally:
                  if 'cleanup' in staging:
                      print('MAINTAINED_NATIVE248_STAGING_CLEANUP='+staging['cleanup'],flush=True)
                  if staging.get('status') == 'HOLD':
                      print('MAINTAINED_NATIVE248_STAGING_STATUS=HOLD',flush=True)
                  if 'signal' in staging:
                      print('MAINTAINED_NATIVE248_STAGING_SIGNAL='+staging['signal'],flush=True)
              # Controller streaming already carries its bounded status/publication evidence.
              # This summary is process outcome, not whole-port or hardware admission.
              keys = ('controller_exit_code','retained_cutoff','workflow_end','code_commit','source_commit',
                      'data_commit','composition','baseline_id','lineage')
              print('MAINTAINED_COMPOSED_LAUNCH_RESULT='+json.dumps({k:result[k] for k in keys},sort_keys=True,allow_nan=False),flush=True)
              return result['controller_exit_code']


          if __name__ == '__main__': raise SystemExit(main())
          PYTHON
