name: native-arm-python3148-native-full-profile
on:
  workflow_dispatch:
    inputs:
      thin_map_sha256:
        description: Independently reviewed thin Python source map SHA-256
        type: string
        required: true
      source_map_sha256:
        description: Root-reviewed complete projected runtime map SHA-256
        type: string
        required: true
      admission_sha256:
        description: Whole exact Root admission JSON SHA-256
        type: string
        required: true
      admission_json:
        description: Separately Root-issued admission; template is not authority
        type: string
        required: true
      runtime_sha256:
        description: Whole exact external Root runtime/resource review SHA-256
        type: string
        required: true
      runtime_json:
        description: Separately Root-issued runtime/custody policy
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-arm-fish-config02-source-v2
  cancel-in-progress: false
jobs:
  pair:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 84
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: python3148-source
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 19dea1cca35659ad7ab307dfea09c30a77362640
          path: python3148-held-fish-r12
          persist-credentials: false
      - name: Verify both Source roles and compose bounded offline runtime
        timeout-minutes: 2
        env:
          THIN_MAP_SHA256: ${{ inputs.thin_map_sha256 }}
          SOURCE_MAP_SHA256: ${{ inputs.source_map_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          test "$(git -C "$GITHUB_WORKSPACE/python3148-source" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/python3148-held-fish-r12" rev-parse HEAD)" = 19dea1cca35659ad7ab307dfea09c30a77362640
          python3 -I -B "$GITHUB_WORKSPACE/python3148-source/scripts/ci/python3148-native-full-profile/overlay.py" compose \
            --parent "$GITHUB_WORKSPACE/python3148-held-fish-r12" --thin "$GITHUB_WORKSPACE/python3148-source" \
            --thin-map-sha256 "$THIN_MAP_SHA256" --expected-runtime-sha256 "$SOURCE_MAP_SHA256" \
            --runtime "$RUNNER_TEMP/python3148-runtime"
      - name: Fetch the exact public Python operands into ordinary-user scratch
        timeout-minutes: 3
        env:
          SOURCE_MAP_SHA256: ${{ inputs.source_map_sha256 }}
          ADMISSION_SHA256: ${{ inputs.admission_sha256 }}
          RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
          ROOT_FISH02_ADMISSION_JSON: ${{ inputs.admission_json }}
          ROOT_FISH02_RUNTIME_JSON: ${{ inputs.runtime_json }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B "$RUNNER_TEMP/python3148-runtime"/scripts/ci/python3148-native-full-profile/overlay.py fetch \
            --runtime "$RUNNER_TEMP/python3148-runtime" --expected-runtime-sha256 "$SOURCE_MAP_SHA256" \
            --output "$RUNNER_TEMP/python3148-raw-inputs"
      - name: Root-admitted exact private native349 public-input carrier
        timeout-minutes: 4
        env:
          SOURCE_MAP_SHA256: ${{ inputs.source_map_sha256 }}
          ADMISSION_SHA256: ${{ inputs.admission_sha256 }}
          RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
          ROOT_FISH02_ADMISSION_JSON: ${{ inputs.admission_json }}
          ROOT_FISH02_RUNTIME_JSON: ${{ inputs.runtime_json }}
          CACHY_NATIVE349_INPUTS_SSH_PRIVATE_KEY: ${{ secrets.CACHY_NATIVE349_INPUTS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B "$RUNNER_TEMP/python3148-runtime"/scripts/ci/fish-config02-native-source/successor_v2/native349_carrier_case.py \
            --root "$RUNNER_TEMP/python3148-runtime" \
            --output "$RUNNER_TEMP/native349-carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Existing native host tools then one owned full-profile Python build
        timeout-minutes: 62
        env:
          SOURCE_MAP_SHA256: ${{ inputs.source_map_sha256 }}
          ADMISSION_SHA256: ${{ inputs.admission_sha256 }}
          RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
          ROOT_FISH02_ADMISSION_JSON: ${{ inputs.admission_json }}
          ROOT_FISH02_RUNTIME_JSON: ${{ inputs.runtime_json }}
          CACHY_OLD_FOUR_SCHEMA: '1'
          CACHY_OLD_FOUR_SOURCE_EPOCH: '1791748800'
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02 }}
          CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01: ${{ secrets.CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 }}
          CACHY_OLD_FOUR_JBIGKIT_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_01 }}
          CACHY_OLD_FOUR_JBIGKIT_02: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_02 }}
          CACHY_OLD_FOUR_JBIGKIT_SIG_01: ${{ secrets.CACHY_OLD_FOUR_JBIGKIT_SIG_01 }}
          CACHY_OLD_FOUR_LIBTIFF_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_01 }}
          CACHY_OLD_FOUR_LIBTIFF_02: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_02 }}
          CACHY_OLD_FOUR_LIBTIFF_03: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_03 }}
          CACHY_OLD_FOUR_LIBTIFF_04: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_04 }}
          CACHY_OLD_FOUR_LIBTIFF_05: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_05 }}
          CACHY_OLD_FOUR_LIBTIFF_06: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_06 }}
          CACHY_OLD_FOUR_LIBTIFF_07: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_07 }}
          CACHY_OLD_FOUR_LIBTIFF_08: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_08 }}
          CACHY_OLD_FOUR_LIBTIFF_09: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_09 }}
          CACHY_OLD_FOUR_LIBTIFF_10: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_10 }}
          CACHY_OLD_FOUR_LIBTIFF_11: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_11 }}
          CACHY_OLD_FOUR_LIBTIFF_12: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_12 }}
          CACHY_OLD_FOUR_LIBTIFF_13: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_13 }}
          CACHY_OLD_FOUR_LIBTIFF_14: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_14 }}
          CACHY_OLD_FOUR_LIBTIFF_15: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_15 }}
          CACHY_OLD_FOUR_LIBTIFF_SIG_01: ${{ secrets.CACHY_OLD_FOUR_LIBTIFF_SIG_01 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          startup="$RUNNER_TEMP/python3148-runtime/scripts/ci/python3148-native-full-profile/startup.py"
          monitor="$RUNNER_TEMP/python3148-startup"
          scope="cachy-python3148-controller-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$monitor"
          env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B "$startup" watch --run "$GITHUB_RUN_ID" --output "$monitor" &
          monitor_pid=$!
          trap ': > "$monitor/done"; wait "$monitor_pid" || true' EXIT
          for (( poll=0; poll<40; poll++ )); do
            if [[ -f "$monitor/armed.json" ]]; then break; fi
            sleep 0.05
          done
          test -f "$monitor/armed.json"
          status=0
          sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_SHA,GITHUB_REF,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_RUN_ATTEMPT,GITHUB_RUN_ID,GITHUB_JOB,ImageOS,ImageVersion,RUNNER_OS,RUNNER_ARCH,ROOT_FISH02_ADMISSION_JSON,ROOT_FISH02_RUNTIME_JSON,CACHY_OLD_FOUR_SCHEMA,CACHY_OLD_FOUR_SOURCE_EPOCH,CACHY_OLD_FOUR_JBIGKIT_01,CACHY_OLD_FOUR_JBIGKIT_02,CACHY_OLD_FOUR_JBIGKIT_SIG_01,CACHY_OLD_FOUR_LIBTIFF_01,CACHY_OLD_FOUR_LIBTIFF_02,CACHY_OLD_FOUR_LIBTIFF_03,CACHY_OLD_FOUR_LIBTIFF_04,CACHY_OLD_FOUR_LIBTIFF_05,CACHY_OLD_FOUR_LIBTIFF_06,CACHY_OLD_FOUR_LIBTIFF_07,CACHY_OLD_FOUR_LIBTIFF_08,CACHY_OLD_FOUR_LIBTIFF_09,CACHY_OLD_FOUR_LIBTIFF_10,CACHY_OLD_FOUR_LIBTIFF_11,CACHY_OLD_FOUR_LIBTIFF_12,CACHY_OLD_FOUR_LIBTIFF_13,CACHY_OLD_FOUR_LIBTIFF_14,CACHY_OLD_FOUR_LIBTIFF_15,CACHY_OLD_FOUR_LIBTIFF_SIG_01,CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_01,CACHY_RETAINED_BUBBLEWRAP_V1_PACKAGE_02,CACHY_RETAINED_BUBBLEWRAP_V1_SIGNATURE_01 \
            /usr/bin/systemd-run --scope --quiet --unit="$scope" \
            --property=MemoryMax=1073741824 --property=MemorySwapMax=0 --property=CPUQuota=100% \
            --property=CPUQuotaPeriodSec=100ms --property=TasksMax=64 --property=RuntimeMaxSec=3540s \
            -- /usr/bin/python3 -I -B "$RUNNER_TEMP/python3148-runtime"/scripts/ci/fish-config02-native-source/successor_v2/hosted_owner.py \
            --root "$RUNNER_TEMP/python3148-runtime" --output "$RUNNER_TEMP/python3148-owner" \
            --carrier-root "$RUNNER_TEMP/native349-carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/public" \
            --python-inputs "$RUNNER_TEMP/python3148-raw-inputs" --runner-uid "$(id -u)" --runner-gid "$(id -g)" \
            --source-map-sha256 "$SOURCE_MAP_SHA256" \
            --admission-sha256 "$ADMISSION_SHA256" --runtime-sha256 "$RUNTIME_SHA256" || status=$?
          : > "$monitor/done"
          wait "$monitor_pid" || echo "PYTHON3148_CONTROLLER_WATCH_UNAVAILABLE"
          trap - EXIT
          result=$(timeout --kill-after=1s 3s /usr/bin/systemctl show --no-pager --property=Result --value "$scope.scope" 2>/dev/null || true)
          case "$result" in
            oom-kill|signal|timeout|exit-code|resources|success) ;;
            *) result=unavailable ;;
          esac
          printf 'PYTHON3148_CONTROLLER_EXIT=%s SYSTEMD_RESULT=%s\n' "$status" "$result"
          if ! env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B "$startup" diagnose --run "$GITHUB_RUN_ID" \
            --output "$monitor" --owner "$RUNNER_TEMP/python3148-owner" --status "$status" --result "$result"; then
            echo "PYTHON3148_CONTROLLER_DIAGNOSTIC_UNAVAILABLE"
            if (( status == 0 )); then status=1; fi
          fi
          exit "$status"
      - name: Snapshot exact public owner evidence after retirement
        id: snapshot
        if: always()
        timeout-minutes: 2
        env:
          SOURCE_MAP_SHA256: ${{ inputs.source_map_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if test -f "$RUNNER_TEMP/python3148-startup/startup.json"; then
            python3 -I -B "$RUNNER_TEMP/python3148-runtime"/scripts/ci/python3148-native-full-profile/artifact.py \
              --root "$RUNNER_TEMP/python3148-runtime" --owner-output "$RUNNER_TEMP/python3148-owner" \
              --startup "$RUNNER_TEMP/python3148-startup/startup.json" \
              --target "$RUNNER_TEMP/python3148-public-artifact" --runtime-sha256 "$SOURCE_MAP_SHA256"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain the immutable owner snapshot
        if: always() && steps.snapshot.outputs.ready == 'true'
        timeout-minutes: 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python3148-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python3148-public-artifact
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
