name: Build-tools v2 native factory DATA controls
on:
  pull_request:
    paths:
      - 'scripts/ci/build-tools-v2-native-source/**'
      - '.github/workflows/build-tools-v2-native-source-data.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/build-tools-v2-native-source/**'
      - '.github/workflows/build-tools-v2-native-source-data.yml'
permissions:
  contents: read
jobs:
  factory-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check twelve new factory DATA boundaries without Source or Native actors
        run: >-
          python3 -I -B -Werror::ResourceWarning
          scripts/ci/build-tools-v2-native-source/test_factory_data.py
