name: Native workflow descriptor DATA controls
on:
  pull_request:
    paths: ['scripts/ci/native_admission/**', 'docs/native-workflow-descriptor.md', '.github/workflows/native-workflow-descriptor-data.yml']
  push:
    branches: [main]
    paths: ['scripts/ci/native_admission/**', 'docs/native-workflow-descriptor.md', '.github/workflows/native-workflow-descriptor-data.yml']
permissions:
  contents: read
jobs:
  descriptor-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Run 23 workflow descriptor DATA controls
        run: >-
          python -I -B -Werror::ResourceWarning
          scripts/ci/native_admission/test_workflow_descriptor.py
