name: native-arm-fish-done-real-manager
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact closed source revision, equal to workflow revision
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-arm-fish-done-real-manager
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'Gabriel-Kahen/cachy-asahi'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 95
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      SLICE: scripts/ci/fish-done-real-manager-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Exact source, context and workflow proof
        id: proof
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf '%s  %s\n' '4237d80598eccdae2f1b42dabded9785bad1b97a61549724b08016dd043764ae' "$SLICE/source-manifest.json" 'fcbb0ecd76b35602213dc558e91e5def2ab3b6a1c751abd97b09fcfec7aced6b' "$SLICE/job.py" | sha256sum --check
          python3 -I -B "$SLICE/job.py" proof --source "$GITHUB_WORKSPACE" --proof "$RUNNER_TEMP/done-proof.json"
      - name: Complete exact1148 retained package inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ddc6ca5f3478f9c607f8fae52661c451ae0bf3ad
          path: retained574
          persist-credentials: false
      - name: Unchanged original owned574 producer with retained package DATA
        timeout-minutes: 40
        run: >-
          timeout --signal=TERM --kill-after=10s 2300s
          python3 -I -B "$SLICE/producer.py"
          --source "$GITHUB_WORKSPACE" --carrier "$GITHUB_WORKSPACE/retained574"
          --proof "$RUNNER_TEMP/done-proof.json" --output "$RUNNER_TEMP/done-base"
      - name: Offline native dependency build then separate installed real-manager trial
        timeout-minutes: 35
        run: >-
          timeout --signal=TERM --kill-after=30s 2000s
          python3 -I -B "$SLICE/run.py" --source "$GITHUB_WORKSPACE"
          --base "$RUNNER_TEMP/done-base" --proof "$RUNNER_TEMP/done-proof.json"
          --output "$RUNNER_TEMP/done-runtime"
      - name: Retire trial, build and original574 producer in order
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 6
        run: >-
          timeout --signal=TERM --kill-after=10s 330s
          python3 -I -B "$SLICE/job.py" cleanup --source "$GITHUB_WORKSPACE"
          --base "$RUNNER_TEMP/done-base" --runtime "$RUNNER_TEMP/done-runtime"
          --proof "$RUNNER_TEMP/done-proof.json" --output "$RUNNER_TEMP/done-cleanup.json"
      - name: Closed original source and native evidence with Root replay
        if: always() && steps.proof.outcome == 'success'
        timeout-minutes: 3
        run: >-
          python3 -I -B "$SLICE/job.py" retain --source "$GITHUB_WORKSPACE"
          --base "$RUNNER_TEMP/done-base" --runtime "$RUNNER_TEMP/done-runtime"
          --proof "$RUNNER_TEMP/done-proof.json" --cleanup "$RUNNER_TEMP/done-cleanup.json"
          --output "$RUNNER_TEMP/done-public"
      - name: Bounded unselected development evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 2
        with:
          name: fish-done-real-manager-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/done-public/
