name: fresh607-engine-failure-diagnostic-source
on:
  push:
    paths:
      - scripts/ci/fresh607-engine-failure-diagnostic-source/**
      - .github/workflows/fresh607-engine-failure-diagnostic-source.yml
  pull_request:
    paths:
      - scripts/ci/fresh607-engine-failure-diagnostic-source/**
      - .github/workflows/fresh607-engine-failure-diagnostic-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONWARNINGS: error
    steps:
      - name: Check out maintained source-only factory
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check out exact public1203 parent
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 7bbdfc679712301f19da3f175ebc0275b2922138
          path: .ci-fixtures/cache-before1203
          persist-credentials: false
      - name: Check out exact public1206 expected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 1e777ec5a0612af37305f93f87f2c7b2f7a36de8
          path: .ci-fixtures/cache-after1206
          persist-credentials: false
      - name: Select explicit Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Reproduce exact source and run portable storage/numeric/authentication/selected-clock controls
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/engine-diagnostic-source.XXXXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          mkdir -m700 "$stage/input" "$stage/expected"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/cache-before1203" archive --format=tar 7bbdfc679712301f19da3f175ebc0275b2922138 | tar -x -C "$stage/input"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/cache-after1206" archive --format=tar 1e777ec5a0612af37305f93f87f2c7b2f7a36de8 | tar -x -C "$stage/expected"
          export FRESH_CACHE_INPUT="$stage/input"
          export FRESH_CACHE_EXPECTED="$stage/expected"
          umask 077
          python3 -I -B -Werror scripts/ci/fresh607-engine-failure-diagnostic-source/prepare.py --source "$stage/input" --output "$stage/emitted" --context known
          python3 -I -B -Werror scripts/ci/fresh607-engine-failure-diagnostic-source/test_factory.py
