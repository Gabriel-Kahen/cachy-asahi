name: Qt612 source controls v2

on:
  pull_request:
    paths:
      - 'scripts/ci/qt612-source-controls-v2/**'
      - '.github/workflows/qt612-source-controls-v2.yml'
      - 'scripts/ci/qt612-source-controls/**'
      - '.github/workflows/qt612-source-controls.yml'
      - 'packages/port/qt612-source-reference/**'
      - 'packages/port/qt612-gui-source-reference/**'
      - 'scripts/ci/qt612-reference-artifact-transport/**'
      - 'scripts/port/qt612-gui-native-v1/**'
      - 'scripts/ci/qt612-reference-native-source/**'
      - 'scripts/build/**'
      - 'packages/tools/cachy-asahi-security-maintenance/build_v2.py'
      - 'scripts/ci/inputs.lock.json'
      - 'scripts/ci/hyprland03-native-source-v1/fixtures/expected349.lock'
      - '.gitattributes'
      - 'README.md'
      - 'scripts/ci/management-tools-generic16k/signature_observer.py'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/qt612-source-controls-v2/**'
      - '.github/workflows/qt612-source-controls-v2.yml'
      - 'scripts/ci/qt612-source-controls/**'
      - '.github/workflows/qt612-source-controls.yml'
      - 'packages/port/qt612-source-reference/**'
      - 'packages/port/qt612-gui-source-reference/**'
      - 'scripts/ci/qt612-reference-artifact-transport/**'
      - 'scripts/port/qt612-gui-native-v1/**'
      - 'scripts/ci/qt612-reference-native-source/**'
      - 'scripts/build/**'
      - 'packages/tools/cachy-asahi-security-maintenance/build_v2.py'
      - 'scripts/ci/inputs.lock.json'
      - 'scripts/ci/hyprland03-native-source-v1/fixtures/expected349.lock'
      - '.gitattributes'
      - 'README.md'
      - 'scripts/ci/management-tools-generic16k/signature_observer.py'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  TZ: UTC

jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.13', '3.14.6']
    steps:
      - name: Check out successor and frozen source families
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Run bounded successor source controls
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          ulimit -c 0
          ulimit -v 524288
          timeout --signal=TERM --kill-after=5s 180s \
            python -I -B -Werror::ResourceWarning scripts/ci/qt612-source-controls-v2/ci.py \
              --workspace "$GITHUB_WORKSPACE" \
              --report "$RUNNER_TEMP/qt612-source-controls-v2.json"
# Source-suite summary goes to stdout. The report stays local to the runner.
# This workflow performs no artifact upload, material readback or native operation.
