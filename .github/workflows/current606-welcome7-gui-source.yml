name: current606-welcome7-gui-source
on:
  push:
    paths:
      - scripts/ci/current606-welcome7-gui-source/**
      - .github/workflows/current606-welcome7-gui-source.yml
  pull_request:
    paths:
      - scripts/ci/current606-welcome7-gui-source/**
      - .github/workflows/current606-welcome7-gui-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONWARNINGS: error
    steps:
      - name: Check out the maintained factory
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check out exact public media536 predecessor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: 3ed3da9c3393cbc56522db7311005049413204f3
          path: .ci-fixtures/gui-media536
          persist-credentials: false
      - name: Check out exact public expected540 source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Gabriel-Kahen/cachy-asahi
          ref: bb72a0fc5e84af5621f0b783056137efdd780282
          path: .ci-fixtures/gui540
          persist-credentials: false
      - name: Select the explicit Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Check seven portable controls and exact540 equality
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/current606-gui-source.XXXXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          mkdir -m700 "$stage/parent" "$stage/expected"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/gui-media536" archive --format=tar 3ed3da9c3393cbc56522db7311005049413204f3 | tar -x -C "$stage/parent"
          git -C "$GITHUB_WORKSPACE/.ci-fixtures/gui540" archive --format=tar bb72a0fc5e84af5621f0b783056137efdd780282 | tar -x -C "$stage/expected"
          python3 -B -W error scripts/ci/current606-welcome7-gui-source/test_prepare.py --predecessor-root "$stage/parent"
          python3 -I -B -W error scripts/ci/current606-welcome7-gui-source/prepare.py --predecessor-root "$stage/parent" --output "$stage/generated"
          python3 -I -B - "$stage/generated" "$stage/expected" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          def files(root):
              rows={}
              for p in root.rglob('*'):
                  assert not p.is_symlink(), 'source alias'
                  if p.is_file():
                      raw=p.read_bytes();rows[p.relative_to(root).as_posix()]={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
              return rows
          generated,expected=map(Path,sys.argv[1:]);actual=files(generated);wanted=files(expected)
          assert len(actual)==len(wanted)==540 and actual==wanted, 'whole exact public540 source differs'
          print(json.dumps({'status':'PASS_WHOLE_PUBLIC540_SOURCE_ONLY','files':540,'native':'NOT_RUN','GUI':'NOT_RUN','M2':'NOT_RUN'},sort_keys=True))
          PY
