name: Offline source-plan preflight DATA controls
on:
  pull_request:
    paths:
      - 'scripts/build/offline-source-preflight-v1/**'
      - 'scripts/build/source_materials.py'
      - 'scripts/maintenance/source_cache.py'
      - 'scripts/release/source_delivery.py'
      - 'scripts/checks/package_checks.py'
      - 'packages/experiments/cachy-asahi-zlib-baseline/**'
      - 'packages/experiments/cachy-asahi-zlib-lto/**'
      - 'tests/fixtures/offline-build-v2-c01/**'
      - '.github/workflows/offline-source-preflight-data.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build/offline-source-preflight-v1/**'
      - 'scripts/build/source_materials.py'
      - 'scripts/maintenance/source_cache.py'
      - 'scripts/release/source_delivery.py'
      - 'scripts/checks/package_checks.py'
      - 'packages/experiments/cachy-asahi-zlib-baseline/**'
      - 'packages/experiments/cachy-asahi-zlib-lto/**'
      - 'tests/fixtures/offline-build-v2-c01/**'
      - '.github/workflows/offline-source-preflight-data.yml'
permissions:
  contents: read
jobs:
  source-preflight-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Run eight offline source-binding DATA controls
        run: >-
          python3 -I -B -Werror::ResourceWarning
          scripts/build/offline-source-preflight-v1/test_preflight.py
