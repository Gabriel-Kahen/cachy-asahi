name: Prepare pinned Apps package inputs
description: Stage live Apps inputs with the release files pinned by the package checks
inputs:
  revision:
    description: Apps package revision to validate
    required: true
outputs:
  path:
    description: Disposable repository source for the Apps package checks
    value: ${{ steps.stage.outputs.path }}
runs:
  using: composite
  steps:
    - name: Check out the release sources held by the Apps packages
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        repository: Gabriel-Kahen/cachy-asahi
        ref: 565e10bfe7ef00b0528881dfba08e0f0fe50721c
        path: .ci-inputs/apps-package-release
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /scripts/release/release.py
          /scripts/release/test_release.py
    - name: Stage the package check inputs
      id: stage
      shell: bash
      env:
        APPS_REVISION: ${{ inputs.revision }}
      run: |
        source=$(mktemp -d "$RUNNER_TEMP/apps-package-source.XXXXXX")
        cd "$GITHUB_WORKSPACE"
        cp -a --parents -- LICENSE \
          "packages/tools/cachy-asahi-apps$APPS_REVISION" \
          packages/tools/cachy-asahi-repository-{client-v2,runtime} \
          scripts/checks/package_checks.py scripts/client/client.py \
          scripts/release/source_delivery.py "$source"
        if [[ "$APPS_REVISION" == 8 ]]; then
          cp -a --parents -- packages/tools/cachy-asahi-apps7 "$source"
        fi
        # The package checks still verify the hashes of the staged files.
        cd .ci-inputs/apps-package-release
        cp -a --parents -- scripts/release/{release,test_release}.py "$source"
        printf 'path=%s\n' "$source" >> "$GITHUB_OUTPUT"
